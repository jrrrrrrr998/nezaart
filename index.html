崇尚自然之道，追求个体精神的绝对自由，具有鲜明的超功利倾向；主张“出世”，认为理想人格应与天地并生、与万物为一、与造化同流。\n《庄子·知北游》：“天地有大美而不言……圣人者，原天地之美而达万物之理。”\n例：李白更多受道家美学影响，被“赐金放还”，《庐山谣》《宣州谢朓楼饯别校书叔云》《蜀道难》皆见其寻仙游山、豪放不羁。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-49","list":12,"num":49,"word":"禅宗美学：遁世与王维的禅意","phonetic":"一、中国美学与中国艺术","meanings":[{"pos":"","def":"禅宗佛学是宗教哲学，但其论述的许多基本问题与审美、艺术相通：主张“心”是世界的本原，认为“一切法皆从心生”，高扬“心”的地位和作用；更彻底地主张“遁世”，禅的最高精神境界与审美境界是相通的。\n例：王维受禅宗美学影响，山水田园诗充满禅意——《鹿柴》“空山不见人，但闻人语响”、《鸟鸣涧》“人闲桂花落，夜静春山空”、《酬张少府》“晚年惟好静，万事不关心”。苏轼赞其“诗中有画”“画中有诗”。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-50","list":12,"num":50,"word":"道气心舞悟和：艺术精神六字","phonetic":"二、中国传统艺术精神","meanings":[{"pos":"","def":"中国传统艺术精神十分丰富，可提炼为“道”“气”“心”“舞”“悟”“和”六个字，分别对应：精神性、生命性、主体性、乐舞精神、直觉思维、辩证思维。\n整体结构：道的精神—气的生命—舞的形态。\n记忆口诀：道气心舞悟和，精神生命主体，乐舞直觉辩证。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-51","list":12,"num":51,"word":"道：中国传统艺术的精神性","phonetic":"二、中国传统艺术精神","meanings":[{"pos":"","def":"张岱年先生认为“中国古代哲学的最高范畴是道”。道有天道、人道之分：天道学说关于宇宙根本问题，人道学说即人生哲学。老庄道家侧重“天道”或“自然之道”，孔孟儒家侧重“人道”或“伦理之道”；禅宗不讲道，但其“佛性”（即心即佛）相似于儒道两家的道。\n天、人统一于“道”，即“天人合一”之道，它决定了中国古代哲学追求人与人、人与自然的和谐统一。老子：“道生一，一生二，二生三，三生万物。”"}],"related":[],"section":"第12章","marked":false},{"id":"C12-52","list":12,"num":52,"word":"气：中国传统艺术的生命性","phonetic":"二、中国传统艺术精神","meanings":[{"pos":"","def":"物质的气被精神化、生命化，是中国“气论”的本质特征。中国传统美学用“气”说明美的本原，提倡表现宇宙万物生生不息、元气流动的韵律与和谐；“气”也是对艺术家生理心理因素与创造能力的总概括；主观之“气”与客观宇宙之“气”结合，使“气”成为作品内在精神与艺术生命的标志。\n“气韵”指审美对象内在生命力显现出的具韵律美的形态：孕育于汉代，成熟于魏晋南北朝；南齐谢赫《古画品录》六法首标“气韵生动”，已成中国画创作总原则。气为生命之动力，韵为生命之风采。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-53","list":12,"num":53,"word":"心：中国传统艺术的主体性","phonetic":"二、中国传统艺术精神","meanings":[{"pos":"","def":"中国传统美学一开始就重视人的主体性，认为艺为心之表、心为物之君，主张心乐一元、心物一元，强调审美主客体相融合一：情与景、心与物、人与自然的交融合一。\n例：李白“相看两不厌，只有敬亭山”“举杯邀明月，对影成三人”；苏轼“明月几时有，把酒问青天”“与谁同坐，明月清风我”；辛弃疾“我见青山多妩媚，料青山见我应如是”。\n情理浑然：既“以理节情”（孔子“乐而不淫，哀而不伤”、《毛诗序》“发乎情，止乎礼义”），又“以情融理”（钱锺书“理之于诗，如盐溶于水，有味无痕”）。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-54","list":12,"num":54,"word":"舞：中国传统艺术的乐舞精神","phonetic":"二、中国传统艺术精神","meanings":[{"pos":"","def":"中国古代艺术中诗、乐、舞最初是三位一体的。“乐舞”精神渗透与融会到中国各个艺术门类，体现出飞舞生动的形态和风貌，“舞”是中国一切艺术境界的典型。\n“舞”把中国传统艺术内在精神生命化推向彻底形式化：道的精神—气的生命—舞的形态，即中国传统艺术精神的整体结构；从以乐喻道，到以飞通神，再到动静合一，始终保持虚实互动、时空合一。\n乐舞精神的抽象化的最终形态是线，故中国传统艺术又可称为“线的艺术”。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-55","list":12,"num":55,"word":"悟：中国传统艺术的直觉思维","phonetic":"二、中国传统艺术精神","meanings":[{"pos":"","def":"重直觉是中国传统思维方式的重要特点，形成以“悟”为核心的感性直觉的审美思维方式，并衍生出“顿悟”“妙悟”等范畴。\n佛教“顿悟说”强调通过非理性的直觉体验和跳跃式思维，达到只可意会、不可言传的瞬间顿悟；艺术活动中的“顿悟”，是感觉、知觉、联想、想象、情感、理解等审美心理因素交融合汇而成的艺术直觉。\n达到“妙悟”不能一蹴而就，须艰苦探索与辛勤实践，并解放心灵，达到凝神遐想、妙悟自然、身与物化、物我两忘。真正的艺术家必具悟性：以道驭技，而非有技无道。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-56","list":12,"num":56,"word":"和：中国传统艺术的辩证思维","phonetic":"二、中国传统艺术精神","meanings":[{"pos":"","def":"中国传统美学主张“中和为美”，强调适中精神：美刺讽喻要适中，艺术表现形式要适中，情感表现也要适中。\n“和”指多样统一或对立统一：一是多样统一，追求“违而不犯，和而不同”，如齐白石“作画妙在似与不似之间，太似为媚俗，不似为欺世”；二是对立统一，形成富于民族特色的辩证和谐观。\n“中”即不走极端，辩证处理问题，求得真善美的和谐统一；“以中为节”，情与理统一，并需“权衡”，在不平衡中求得平衡。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-57","list":12,"num":57,"word":"中国戏曲“以一总万”的形式美","phonetic":"二、中国传统艺术精神","meanings":[{"pos":"","def":"中国戏曲正是“以一总万”，“一”的概念成为中国戏曲形式美的一个支柱：角色行当“一行多用”（生旦净丑），表演动作“一式多用”（表演程式），声腔与音乐“一曲多用”，舞台布景“一景多用”（如一桌两椅），服饰脸谱“一服（一谱）多用”，鲜明显示出中国戏曲形式美的基本特征。\n另：中国戏曲是线性结构，西方戏剧是板块结构；中国古典小说也主要是线性结构，如《三国演义》《水浒传》《西游记》。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-58","list":12,"num":58,"word":"内容与形式的划分与不可分割","phonetic":"一、艺术作品的内容","meanings":[{"pos":"","def":"艺术作品是内容与形式的统一，在具体作品中二者不可分割：没有只有内容而无形式的作品，也没有只有形式而无内容的作品。\n划分：主题与题材划归内容的范畴；结构、艺术语言、体裁划归形式的范畴。\n答题顺序：先答不可分割，再答内容要素（题材、主题、情节、细节），最后答形式要素（结构、艺术语言、体裁）。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-59","list":12,"num":59,"word":"作品内容的含义与题材两义","phonetic":"一、艺术作品的内容","meanings":[{"pos":"","def":"艺术作品的内容是它的形式的含义，是作品中表现出来的具体的、生动的生活和情感内涵，由题材和主题两种要素构成。\n题材：广义指作品所表现、描绘的生活、情感的范围，也称取材范围，宽泛而带归类性质，体现与其他作品的共性；狭义指构成已被规定了作品内容的基本材料，即作品中具体的生活形态和情感形态。\n记忆：广义＝范围，狭义＝材料。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-60","list":12,"num":60,"word":"题材无差别论与题材决定论","phonetic":"一、艺术作品的内容","meanings":[{"pos":"","def":"针对题材的作用和价值，有两种著名观点，都有失偏颇：\n“题材无差别论”认为题材之间不存在意义上的差异，题材只是借以表达艺术家感受的媒介，选材无关紧要——漠视了题材的价值和作用。\n“题材决定论”认为题材有差异、意义有大小之分，作品价值由题材意义大小决定——以题材价值代替作品价值，把题材地位强调到越界的程度。\n正确态度：承认题材的价值，提倡题材差异性与多样性的统一。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-61","list":12,"num":61,"word":"主题的定义与两个产生条件","phonetic":"一、艺术作品的内容","meanings":[{"pos":"","def":"“主题”一词始创于德国，本是音乐术语，指乐曲中最富特征性的核心乐段；20世纪20年代经日本翻译引进我国。古文论中相似概念有“意”“义”“旨”“主脑”“主旨”。\n主题产生有两个基本条件：一是作品的题材，二是作者的思想感情。主题是透过题材暗示出来的思想内涵，是作者主观情思与题材客观意义“契合”中生发出的社会意义的思想。\n主题被称为作品的灵魂，是构成艺术作品的主导因素。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-62","list":12,"num":62,"word":"主题的多样化与不确定性","phonetic":"一、艺术作品的内容","meanings":[{"pos":"","def":"主题的特点有二：\n多样化——与题材的差异性、艺术家主观情感思想审美理想的不同及开掘角度有关；不同门类体现方式不同：文学、戏剧、电影等叙述性作品的主题较明确系统，音乐、绘画、舞蹈较含蓄，书法和某些工艺作品更淡弱，有的作品无主题。\n不确定性——题材是显现的，属于艺术形式层次上的外部内容；主题是一种蕴含，较隐蔽，需在了解题材后回味、琢磨、认识，才能悟出弦外之音与感情倾向。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-63","list":12,"num":63,"word":"形式的两个因素与各门类结构","phonetic":"二、艺术作品的形式","meanings":[{"pos":"","def":"艺术作品的形式由内在的结构和外显的艺术语言两种因素构成：结构为内部形式，艺术语言为外部形式，二者紧密相关、相互渗透、不可分离。\n结构是作品中各个局部之间、题材各因素之间的内在关联与组织样式，目的在于把各部分组织成和谐统一又多样变化的有机整体，围绕主题组织材料是其重要特性。\n各门类形态：美术称“布局”“构图”“经营位置”；小说重故事编织、线索穿插、开头结尾与叙述顺序；电影综合画面构图、故事与音画节奏；音乐的结构即音乐形式的构成方式；戏剧结构的基本任务是选择不同人物的动作并组织得完整统一，高度凝练集中是大原则。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-64","list":12,"num":64,"word":"艺术语言的特征与功能","phonetic":"二、艺术作品的形式","meanings":[{"pos":"","def":"艺术语言是比喻说法，指它在作品中起类似语言的表情达意作用，即作品的物质表现手段和外部形式。\n特征：一是感性的、表象性的、情感化的，对世界的观照是情感化的、带象征意味；二是独特性与具体性，各类艺术由不同媒介构成独特语言，只有从属于特定创作意图、成为具体形象的体现者时，才现实地构成外部形式。\n形态：文学是提炼的口语与书面文字；美术是颜料、木石、金属、色彩、线条、笔墨；音乐是旋律、节奏、和声、复调、配器、曲式；舞蹈是规范化、有韵律节奏的人体动作；戏剧主要是动作，电影是画面与蒙太奇。\n功能：塑造形象传达内容，以及审美功能。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-65","list":12,"num":65,"word":"内容与形式：主导、反作用与统一","phonetic":"三、艺术作品的内容与形式的关系","meanings":[{"pos":"","def":"内容与形式是对立统一、互相包容、互相转化的关系，两者都以对方的存在而存在。\n（1）内容常起主导作用，影响和决定形式，形式为内容服务，其选择以是否适应内容需要为原则；（2）形式积极能动地反作用于内容：适合则深刻充分感人地表现内容，不适合则损害内容表现，甚至反过来制约内容；（3）形式有相对独立性，具有相对独立的审美价值，并影响内容审美价值的实现。\n创作中二者在矛盾统一中互相寻找最佳契机、磨合推进；从接受角度看，形式具有先行性和决定作用。结论：优秀作品必是进步的思想内容与完美的艺术形式的有机统一。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-66","list":12,"num":66,"word":"格调：美学品格与思想情操","phonetic":"格调","meanings":[{"pos":"","def":"格调是在作品中表现出来的美学品格和思想情操，是艺术家艺术造诣、文化修养、审美理想和思想品格的总汇体现。\n格调有高下雅俗之分，首先体现在思想内容和创作立意上：进步的世界观、积极的人生观、健康的审美理想以及创作上的社会责任感，是高格调作品的基础和前提。\n雅俗是衡量格调高低的重要标准：只迎合世俗喜好、以奇巧炫人耳目、仅满足官能刺激的作品被斥为庸俗浅薄；内容健康、思想深刻、有益身心、能使感情净化思想提高的，被誉为格调高雅纯正。\n注意：格调高低与作品种类无关：油画有低格调，漫画有高格调；长篇有低俗之作，短诗多有高雅名篇。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-67","list":12,"num":67,"word":"艺术接受的体验性特征","phonetic":"艺术接受的特征","meanings":[{"pos":"","def":"艺术接受的体验性，指艺术接受是一种审美体验活动，而艺术体验是一种情感活动。体验即亲身经历、实地领会，指人们通过感官对人或事物进行直接感受、了解和把握的图景化思维活动，具有在场性和情境性，既能回味，又有所预感。\n审美体验是能够导向美的领悟的体验活动，情感性占特殊位置，体验的世界就是情感的世界。\n审美体验是艺术鉴赏过程的中心环节，鉴赏者始终处于主动积极的再创造状态，最终达到马斯洛所说的“高峰体验”，产生审美共鸣，获得极致体验。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-68","list":12,"num":68,"word":"艺术接受的过程性与三阶段","phonetic":"艺术接受的特征","meanings":[{"pos":"","def":"艺术接受的过程性，指艺术接受活动是一个循序渐进的过程：从艺术鉴赏到艺术批评、艺术研究是逐渐深化的过程；仅就鉴赏而言也并非一蹴而就，而是经历由浅入深、由外而内、由低级到高级的层层推进，最终生发出意义，达到对作品的理解。\n艺术鉴赏过程的整体性：“审美直觉—审美体验—审美升华”三阶段彼此联系、相互渗透，之间并没有不可逾越的界限。\n记忆：三段一体，层层深入。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-69","list":12,"num":69,"word":"艺术接受的共同性与差异性","phonetic":"艺术接受的特征","meanings":[{"pos":"","def":"艺术接受的异同性指其共同性和差异性。\n共同性：所有艺术接受都遵循共同规律，分享共同特点——体验性、过程性、再创造性。\n差异性表现为四种：（1）相异个体的接受差异，来源于接受者期待视野的差异；（2）相异群体的接受差异，包括时代、民族、社会、阶级和阶层差异，又分群体选择性与面对同一作品时的差异，最终需通过个体差异体现；（3）同一主体对同一作品因时间、地点和前理解结构变化而产生的差异；（4）同一主体面对不同种类、不同风格作品的接受差异。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-70","list":12,"num":70,"word":"艺术接受再创造性的两个原因","phonetic":"艺术接受的特征","meanings":[{"pos":"","def":"再创造指接受者在作品所提供信息的基础上，结合自身艺术修养、审美经验、生活阅历，发挥想象，丰富或提炼艺术形象、生成艺术意义的创造性活动。它是二度创作：一方面是对作品本身价值的超越，另一方面又受作品的限定。\n原因有二：客体上是艺术作品的多义性，由艺术语言特性决定——表达的模糊性、表达的有限性、艺术家为求含蓄而有意简化省略；主体上是接受主体的差异性，与审美趣味、接受经验、艺术素养、文化修养等前理解结构密切相关。"}],"related":[],"section":"第12章","marked":false},{"id":"C13-01","list":13,"num":1,"word":"艺术鉴赏是审美的再创造活动","phonetic":"第13章 艺术鉴赏","meanings":[{"pos":"","def":"艺术鉴赏不同于一般意义上的欣赏。\n它指读者、观众、听众凭借艺术作品而展开的积极的、主动的审美再创造活动。\n因此，鉴赏本身就是一种审美的再创造。\n【名词解释】答题要点落在“凭借艺术作品”“积极主动”“审美再创造”三处。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-02","list":13,"num":2,"word":"接受美学由姚斯与伊瑟尔创立","phonetic":"一、艺术鉴赏的重要意义","meanings":[{"pos":"","def":"接受美学是20世纪60年代末和70年代初在联邦德国出现的。\n代表人物主要是姚斯和伊瑟尔，他们的共同主张是：研究文学与文学史，必须侧重研究读者的接受过程。\n记忆：接受美学重读者，姚斯、伊瑟尔双代表，兴起于联邦德国。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-03","list":13,"num":3,"word":"接受美学确立读者中心地位","phonetic":"一、艺术鉴赏的重要意义","meanings":[{"pos":"","def":"第一，确立读者的中心地位：一部作品的意义实际包含两个方面，一是作品本身，一是读者的赋予。\n第二，强调审美经验的中心地位。\n因此作为鉴赏主体的读者、观众和听众并不是消极、被动地接受，而是积极、主动地进行着审美创造活动。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-04","list":13,"num":4,"word":"姚斯“期待视野”与适度审美距离","phonetic":"一、艺术鉴赏的重要意义","meanings":[{"pos":"","def":"期待视野由姚斯提出，指读者原先的经验、素养、审美趣味等综合形成的对作品的欣赏水平和欣赏要求，表现为一种潜在的审美期待。\n其一，期待视野与新作品之间应有适度的审美距离：作品要出乎意料、超出原有期待使人振奋，又不能过分超前使人寡然无味、难以接受，极端先锋派作品曲高和寡即因此。\n其二，读者千差万别，期待视野不同，对同一作品的理解和赋予的意义也不同。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-05","list":13,"num":5,"word":"伊瑟尔的“空白”与“不确定性”","phonetic":"一、艺术鉴赏的重要意义","meanings":[{"pos":"","def":"伊瑟尔用“空白”和“不确定性”说明文本与读者接受的关系。\n所谓“空白”，指文本中未写出来的部分，只是文本向读者暗示或提示的东西，需要读者运用想象去填补。\n当读者把自己独特的体验和想象置入文本、把空白填充起来，作品才真正成为读者的作品，审美价值才得以实现。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-06","list":13,"num":6,"word":"接受美学的三个分支及记忆口诀","phonetic":"一、艺术鉴赏的重要意义","meanings":[{"pos":"","def":"德国：以瑙曼为代表，从马克思主义艺术生产理论出发，认为在艺术生产—艺术作品—艺术消费中，接受美学主要研究艺术消费。\n苏联：以梅拉赫的文章《构思、电影、接受——作为动态过程的创作过程》为代表，首次提出“艺术接受”概念。\n美国：以费希为代表，形成“读者反应批评”学派。\n口诀：接受“拉煤”到黑夜的现实（梅拉赫、瑙曼、费希）。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-07","list":13,"num":7,"word":"审美再创造活动的三点体现","phonetic":"一、艺术鉴赏的重要意义","meanings":[{"pos":"","def":"第一，艺术家创作的艺术品必须通过鉴赏主体的审美再创造，才能真正发挥社会意义和美学价值；作品功能不能由作者或作品单独实现。\n第二，鉴赏主体不是被动、消极地接受，而是积极主动再创造，因为作品总有“不确定性”与“空白”，需想象、联想去丰富补充。\n第三，艺术鉴赏同艺术创作一样，也是人类自身主体力量在审美活动中的自我肯定与自我实现，鉴赏者同样可享受创造的愉悦。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-08","list":13,"num":8,"word":"多看优秀作品与掌握艺术知识","phonetic":"二、艺术鉴赏力的培养与提高","meanings":[{"pos":"","def":"艺术鉴赏对鉴赏主体提出相应条件，需要一定的艺术修养和鉴赏力；人的审美能力不是天生的，而是长期实践的结果。\n第一，离不开大量鉴赏优秀作品的实践，人的艺术修养只有在具体欣赏活动中才能不断提高。\n第二，离不开熟悉和掌握艺术的基本知识和规律，包括艺术理论、艺术史的初步了解，以及各门类、体裁的艺术特征、美学特性和艺术语言。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-09","list":13,"num":9,"word":"历史文化知识滋养艺术鉴赏力","phonetic":"二、艺术鉴赏力的培养与提高","meanings":[{"pos":"","def":"第三，艺术鉴赏力的培养与提高，离不开一定的历史、文化知识。\n文化知识水平对艺术鉴赏影响很大，广泛的历史、文化知识十分重要。\n艺术修养既是个人文化修养的重要组成部分，又直接受益于文化修养的广博精深；从一定意义上讲，文化修养较高的人，艺术鉴赏力也会有相当水平。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-10","list":13,"num":10,"word":"生活阅历与“五十方能读杜诗”","phonetic":"二、艺术鉴赏力的培养与提高","meanings":[{"pos":"","def":"第四，离不开相应的生活经验与生活阅历。\n艺术创作离不开社会生活，艺术鉴赏同样离不开社会生活；鉴赏主体总是在自己生活经验基础上去感受、体验、理解作品，生活经验越丰富深刻，越有助于审美欣赏。\n对生活作高度概括的作品，读者必须有较丰富的生活体验才能深刻体会。\n名言：“少年莫漫轻吟味，五十方能读杜诗。”"}],"related":[],"section":"第13章","marked":false},{"id":"C13-11","list":13,"num":11,"word":"美育与艺术教育提升鉴赏力","phonetic":"二、艺术鉴赏力的培养与提高","meanings":[{"pos":"","def":"第五，美育与艺术教育在培养和提高艺术鉴赏力方面具有特别重要的地位与作用。\n它通过培养提高人们敏锐的感知力、丰富的想象力和审美的理解力，使人们形成健全的审美心理结构。\n不但重视培养个体鉴赏能力，而且重视提高全社会群体的艺术鉴赏水平。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-12","list":13,"num":12,"word":"艺术鉴赏的多样性与一致性","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"多样性：鉴赏需要和审美趣味多种多样，原因在于鉴赏本质上是审美再创造活动；同一个人随年龄增长、环境改变、阅历变化，鉴赏趣味和要求也会改变。\n一致性：同一时代、同一民族的鉴赏者常表现出共同的审美倾向，即时代性与民族性；一致性正寓于多样性之中。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-13","list":13,"num":13,"word":"魏晋清瘦与唐代丰腴的塑像","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"我国魏晋崇尚清瘦的人体美，北魏的麦积山塑像大多是“秀骨清相”。\n唐代崇尚丰腴的人体美，唐代龙门石窟塑像大都肥硕和悦。\n二者说明鉴赏的一致性受时代风尚制约。\n中国传统章回小说、戏曲、话本往往有头有尾、结构严密、前后呼应，则体现鉴赏的民族性。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-14","list":13,"num":14,"word":"保守性与变异性：定向与创新期待","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"保守性即鉴赏主体审美经验中的定向期待视野，指鉴赏趣味习惯按某种传统趋向进行，表现为种种偏好与选择、欣赏方式与习惯的定势，常带时代与民族的共同特色。\n变异性即创新期待视野，指随时代前进、社会生活变化、国际文化交流和大众审美水平提高，欣赏习惯与审美趣味随之改变。\n二者客观存在，是定向期待与创新期待的对立统一；要求艺术家既探索创新，又尊重群众的欣赏习惯和接受水平。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-15","list":13,"num":15,"word":"审美心理的六个基本要素","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"艺术鉴赏作为高级、复杂的审美再创造活动，蕴藏着奥妙的心理现象和心理规律。\n审美心理包含注意、感知、联想、想象、情感、理解等基本要素。\n这些要素不是孤立存在的，而是相互影响、相互作用、相互渗透，共同形成艺术鉴赏中的审美心理结构。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-16","list":13,"num":16,"word":"注意的指向性与集中性特点","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"注意是心理活动对一定对象的指向和集中，是审美心理中最重要的因素之一。\n指向性即选择性，把需要感知和认识的事物从众多事物中挑选出来；集中性即把主体的全部心理要素集中到所选事物之上。\n生理基础是大脑皮层优势兴奋中心的形成和稳定；产生有客观原因（刺激物的特点）和主观原因（心境、兴趣、经验、态度）。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-17","list":13,"num":17,"word":"布洛的“距离说”与审美态度","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"20世纪初英国心理学家布洛提出著名的“距离说”，认为审美感受形成的原因在于主体对客体保持了适度的“心理距离”。\n这种距离使主体与对象保持“不即不离”：太近会对对象采取实用功利态度，太远则漠然无视，两者都无法产生审美快感。\n鉴赏最初阶段需进入审美注意或审美期待状态，即适当的“心理距离”，由实用功利态度转为审美态度。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-18","list":13,"num":18,"word":"梅兰芳与川剧《秋江》的有意注意","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"心理学把注意分为有意注意和无意注意两种，艺术鉴赏活动中多采用有意注意。\n梅兰芳曾请一位亲戚老太太看川剧《秋江》：此剧写尼姑陈妙常搭乘老艄公的船顺江而下，舞台无船无水，全靠演员表演表现大江中一叶扁舟；老太太完全沉浸在剧情中，仿佛自己也坐在船上，不知不觉头晕如晕船。\n可见有意注意在艺术鉴赏中的重要作用。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-19","list":13,"num":19,"word":"感知由感觉与知觉构成","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"感觉是客观事物直接作用于人的感觉器官，在人脑中所产生的对事物个别属性的反映，是一切认识活动的基础，也是审美感受的心理基础。\n知觉是在感觉基础上对事物的综合的、整体性的把握，具有整体性、选择性、理解性和恒常性，是更加积极主动的心理活动。\n感觉是知觉的基础，知觉是感觉的深入，二者合称感知，在艺术欣赏中交织发挥作用。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-20","list":13,"num":20,"word":"视、听是主要的审美感官","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"欣赏艺术作品必须以直接的感知方式，去感知对象的色彩、线条、形状、声音等。\n人的感官作为审美的感官，在艺术鉴赏中主要运用视觉和听觉这两种高级感官。\n马克思讲“感受音乐的耳朵”和“感受形式美的眼睛”；艺术因媒介和艺术语言不同，分为视觉艺术（绘画）、听觉艺术（音乐）和视听艺术（电影）。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-21","list":13,"num":21,"word":"鉴赏从感知艺术作品开始","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"艺术作品首先以特殊的感性形象作用于人们的感觉器官。\n艺术鉴赏活动的真正开始，应当是从感知艺术作品算起。\n格式塔心理学认为，任何事物的形状一旦被人所感知，都是被知觉进行了积极的组织或建构的结果。\n例证：文同《墨竹图》。\n提升感知的办法是大量鉴赏古今中外优秀作品，反复感知、体验和品味。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-22","list":13,"num":22,"word":"联想的定义、分类与艾宾浩斯","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"联想是由一事物想到另一事物的心理过程，包括由当前感知的事物想起另一有关的事物。\n联想可分为接近联想、相似联想、对比联想、因果联想、自由联想和控制联想等。\n德国心理学家艾宾浩斯最先运用实验方法研究人的高级心理活动，研究联想形成的过程及其作用，创立了现代联想主义心理学。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-23","list":13,"num":23,"word":"柏辽兹与德彪西音乐中的联想","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"音乐鉴赏中联想大量存在，鉴赏描绘性音乐多通过音响感知和情感体验引起对生活形象和意境的联想。\n法国浪漫派作曲家柏辽兹《幻想交响曲》第三乐章“田野景色”，用英国管和双簧管的对答模拟乡间牧笛互相呼唤，引起对山乡牧羊人在田园风光中吹奏牧笛的联想。\n法国印象派音乐家德彪西的交响素描《大海》由三个乐章组成，以丰富和声与绚丽配器使人联想到地中海变幻无穷的景象、阳光下的大海和暴风雨中的大海。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-24","list":13,"num":24,"word":"古诗比兴手法以联想为基础","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"文学欣赏中大量存在联想，中国古代诗歌常用的比、兴手法，就是以联想为心理基础的。\n相似联想如韩愈《送桂州严大夫》“江作青罗带，山如碧玉簪”。\n对比联想如孟浩然《春晓》“春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少”。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-25","list":13,"num":25,"word":"蒙太奇的心理基础是联想","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"蒙太奇是电影最重要的美学特性之一，也是最重要的艺术语言和表现手法，其心理基础就是联想。\n“平行蒙太奇”的心理根据是相似联想，如普多夫金影片《母亲》把工人示威游行的镜头与春天河水解冻的镜头组接，使观众产生相似联想。\n“对比蒙太奇”的心理根据是对比联想，如《一江春水向东流》把张忠良花天酒地与素芬苦苦挣扎两组镜头对比。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-26","list":13,"num":26,"word":"联想受客观与主观因素制约","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"客观因素：联想必须以艺术作品和艺术形象为依据，不能离开作品的内容和情绪，应在作品启发下针对艺术形象进行。\n主观因素：联想受鉴赏主体的生活经验、认识能力和情感情绪影响；生活经验越丰富、认识越深刻、情感越炽烈，联想力越强。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-27","list":13,"num":27,"word":"想象是对表象加工改造创造新形象","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"想象是指人脑对已有表象进行加工改造而创造新形象的过程。\n想象的基本材料是表象，它是对记忆表象加工改造、重新创造出来的形象，甚至可以是世界上尚不存在或根本不可能存在的事物的形象。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-28","list":13,"num":28,"word":"想象在艺术鉴赏中的重要地位","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"艺术创作绝对不能离开想象，艺术鉴赏离开想象也同样无法进行。\n鉴赏是审美再创造活动，主体并非消极被动接受，而是运用想象和其他心理功能对艺术形象积极主动再创造。\n想象的活跃程度常与鉴赏的深刻程度成正比：生活经验愈丰富、艺术素养愈好、文化层次愈高，想象愈丰满，审美享受愈强烈。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-29","list":13,"num":29,"word":"黑格尔与别林斯基论想象","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"想象的突出作用在于创造，没有想象就没有艺术鉴赏。\n“想象是人的创造活动的一个必要因素。”\n黑格尔认为最杰出的艺术本领就是想象；别林斯基把想象看作形象思维的中心。\n鉴赏的想象与创作的想象既有联系又有区别：二者都是飞跃的，不受时间和空间限制；但鉴赏者的想象必须以艺术家的想象为前提。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-30","list":13,"num":30,"word":"再造想象为主并含创造想象","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"心理学将想象分为再造想象和创造想象两种。\n再造想象是根据语言的描述或图形、音响的示意，在头脑中再造出相应新形象的过程。\n创造想象是不依据现成的描述而独立创造新形象的过程。\n艺术鉴赏活动以再造想象为主，同时也包含有一定的创造想象。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-31","list":13,"num":31,"word":"造型艺术与戏曲的欣赏想象","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"不同类型的艺术形象，常需运用不同类型的欣赏想象。\n绘画、雕塑等造型艺术，常需观众运用化静为动的想象力，使静止的视觉形象转化为活动的视觉形象。\n戏剧艺术则需观众调动虚拟想象：黄梅戏《夫妻观灯》舞台别无长物，观众却觉得花灯乱眼；京剧《三岔口》舞台灯火通明，观众却觉得漆黑如墨。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-32","list":13,"num":32,"word":"舒曼《童年情景》引导想象","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"音乐欣赏更需要想象，音乐中的标题正是给听众提供乐曲基本内容和想象的基本方向。\n德国音乐家舒曼的钢琴套曲《童年情景》共有13首小曲，深入刻画儿童的各种心理活动，形象幽默；如《离奇的故事》写孩子聆听稀奇古怪的传说，《捉迷藏》写孩子快乐游戏。\n标题给听众的想象以必要的引导。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-33","list":13,"num":33,"word":"叶圣陶论“驱遣着想象来看”","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"文学艺术尤其需要想象。\n叶圣陶认为阅读文学作品必须“驱遣着想象来看”，如王维诗句“大漠孤烟直，长河落日圆”。\n此外，苏联导演罗姆的影片《十三人》写红军战士穆拉托夫奉命穿越沙漠去找援军，可见影视欣赏也离不开想象。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-34","list":13,"num":34,"word":"情感是人对现实的特殊反应","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"情感是人对客观现实的一种特殊的反应形式，是对客观事物是否符合人的需要的一种复杂心理反应，是主体对待客体的一种态度。\n心理学家把人所特有的复杂的社会性情感称为高级情感，划分为道德感、美感、理智感三种。\n强烈的情感体验，正是审美活动区别于科学活动与道德意识活动的一个显著特点。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-35","list":13,"num":35,"word":"情感以感知为基础并与想象相联","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"审美心理是注意、感知、联想、想象、情感、理解等通过情感作中介形成的有机统一。\n情感以注意和感知为基础：对艺术形象的感知和接受受情感影响，特定情感下的感知又作用于情感，引起更深的情感活动。\n情感与联想、想象密不可分：联想想象受情感影响，又进一步强化深化情感，故鉴赏中的联想与想象总以情感为中介。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-36","list":13,"num":36,"word":"《梁山伯与祝英台》的情感体验","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"小提琴协奏曲《梁山伯与祝英台》取材于梁祝爱情故事。\n“草桥结拜”一节小提琴与大提琴相互对答，使听众联想起梁祝在草桥亭畔义结金兰的情景；哀伤的慢板仿佛让人看见“十八相送”难舍难分，听众沉浸在依依惜别的感情气氛中。\n末节“坟前化蝶”悲剧气氛节节高涨，把情感推向高潮。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-37","list":13,"num":37,"word":"情感与理解相互促进深化","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"情感与理解有着极其密切的关系。\n只有当鉴赏主体更深刻地理解了作品的内容和寓意，才会对作品所传达的感情有更深的体会，从而在鉴赏中达到情感高峰体验的程度。\n例：获法国恺撒最佳影片奖的《苔丝》根据英国小说家托马斯·哈代的小说改编，写维多利亚女王时代英格兰乡村一位美丽少女的悲惨遭遇。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-38","list":13,"num":38,"word":"理解的含义与直接间接之分","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"理解是逐步认识事物的联系、关系，直至认识其本质、规律的一种思维活动，包括直接理解和间接理解。\n直接理解指没有中介思维参与、个体通过目前的亲身经验实现的理解；间接理解指借用前人经验和个体以往经验，通过分析综合、抽象概括等中介思维实现的理解。\n艺术鉴赏中的理解多以直接理解为主，同时一定程度上也有间接理解参与。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-39","list":13,"num":39,"word":"理解艺术作品的三层含义","phonetic":"三、艺术鉴赏中的心理现象","meanings":[{"pos":"","def":"第一，对作品内容的鉴赏离不开理解：需了解背景、典故、象征意义，有时还要了解作者的经历思想与创作背景。\n第二，对作品形式的鉴赏离不开理解：只有理解并掌握各门类的表现手法和艺术语言，才能把握内容并领会形式本身的审美价值。\n第三，对内在意蕴和深刻哲理的认识更不能脱离理解，艺术意蕴是作品最深的层次。\n例：京剧《空城计》中诸葛亮与司马懿的交锋。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-40","list":13,"num":40,"word":"审美直觉是鉴赏活动的开始","phonetic":"一、艺术鉴赏中的审美直觉","meanings":[{"pos":"","def":"审美直觉指人们在审美活动或艺术鉴赏活动中，对审美对象或艺术形象具有一种不假思索而即刻把握与领悟的能力。\n它使人刹那间忘却一切，聚精会神地观赏，全部身心沉浸在审美愉悦之中。\n审美直觉是审美与艺术活动最重要的一个特征，是整个艺术鉴赏活动的开始。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-41","list":13,"num":41,"word":"鲍姆嘉通与“美学”学科的诞生","phonetic":"一、艺术鉴赏中的审美直觉","meanings":[{"pos":"","def":"被称为“美学之父”的18世纪德国哲学家、美学家鲍姆嘉通，在1750年第一次使用“美学”这个术语，标志着美学作为一门独立学科的诞生。\n选择题常考三个信息：美学之父、德国、1750年。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-42","list":13,"num":42,"word":"直觉、知觉与概念三种认识","phonetic":"一、艺术鉴赏中的审美直觉","meanings":[{"pos":"","def":"心理学上有时把人的认识分为直觉、知觉和概念三种方式。\n直觉只注意事物的形象，而不注意事物的意义。\n知觉在注意事物形象的同时，也关注事物的意义。\n概念则超越形象，以抽象思维把握事物的内在本质；直觉的对象是具体形象，概念的对象是抽象意义。\n理论上直觉先于知觉、知觉先于概念，实际经验中常不易分开。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-43","list":13,"num":43,"word":"审美直觉的直观性与直接性","phonetic":"一、艺术鉴赏中的审美直觉","meanings":[{"pos":"","def":"审美直觉的特点就是直观性和直接性。\n直观性：欣赏艺术作品必须亲身去感受，才能得到艺术享受和审美愉悦；它不能通过间接经验获得，必须主体亲身参与、直接感受，这是艺术与科学等其他实践活动的重要区别。\n直接性：常表现为不假思索地直接把握或领悟，常在一瞬间完成，无需逻辑判断或理性思维。\n例：席里柯《梅杜萨之筏》、李商隐《锦瑟》。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-44","list":13,"num":44,"word":"克罗齐“直觉说”的极端偏误","phonetic":"一、艺术鉴赏中的审美直觉","meanings":[{"pos":"","def":"有的美学家过分夸大直觉性的作用。意大利近代美学家克罗齐宣扬“直觉说”，认为直觉就是表现，就是艺术，就是一切，根本否定了理智、想象等在美感中的作用，把直觉的作用夸大到极端。\n事实上，美感虽具有非概念的直觉性，但并不是纯感性的东西，必须包含理性因素，在感性直观中积淀着理性内容。\n鉴赏正是在直觉形式中达到对作品整体的认识。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-45","list":13,"num":45,"word":"通感：各种感觉相互渗透","phonetic":"一、艺术鉴赏中的审美直觉","meanings":[{"pos":"","def":"通感指在艺术创作与鉴赏活动中，各种感觉相互渗透或挪移，从而大大丰富和扩展了审美感受。\n例一：苏东坡评王维“诗中有画”“画中有诗”。\n例二：《礼记·乐记》记载悦耳的歌声好像一串又圆满又光润的珠子。\n例三：清人方薰观石谷《清济贯河图》，看到画中汹涌江水，好像听到了波涛翻滚的怒吼声。\n2023年真题“听觉引起触感或其他感觉”即选通感。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-46","list":13,"num":46,"word":"审美直觉的后天培养与艺术初感","phonetic":"一、艺术鉴赏中的审美直觉","meanings":[{"pos":"","def":"人的审美直觉能力并不是天生具有的，而是后天教育训练和艺术实践的结果。\n接受美学以“期待视野”解释：分定向期待与创新期待，定向期待是由读者的文化素养、审美趣味、鉴赏能力等构成的惯性心理力量。\n一瞬间完成、不假思索的直觉，实为长期艺术实践与生活经验积累的结果：无意识中渗透意识，感性中积淀理性。\n直觉所把握的只是“艺术初感”，还需反复玩味、结合整体感受思考。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-47","list":13,"num":47,"word":"审美体验与马斯洛高峰体验","phonetic":"二、艺术鉴赏中的审美体验","meanings":[{"pos":"","def":"审美体验是整个审美活动过程的中心环节，指鉴赏主体在审美直觉的基础上，达到艺术审美活动的高潮阶段，调动再创造的想象力和联想力，激起丰富情感，设身处地地生活到作品之中，获得心灵的审美愉悦，把外在作品中的艺术形象转化为鉴赏者自身的生命活动。\n美国人本主义心理学家马斯洛认为“高峰体验”是人在自我实现的创造过程中产生的最激荡人心的时刻，使人如痴如醉；它几乎存在于人类活动一切领域，但最易发生在艺术和审美领域。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-48","list":13,"num":48,"word":"直觉阶段与体验阶段的主客关系","phonetic":"二、艺术鉴赏中的审美体验","meanings":[{"pos":"","def":"审美直觉阶段主要是艺术作品作用于鉴赏主体，整个心理活动相对处于被动状态，体现为一种感性直观的审美感受。\n审美体验阶段则主要是鉴赏主体反作用于艺术作品，整个心理活动处于主动状态，体现为一种积极的审美再创造活动。\n一被动、一主动，是二者的根本区别。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-49","list":13,"num":49,"word":"审美体验中想象联想最活跃","phonetic":"二、艺术鉴赏中的审美体验","meanings":[{"pos":"","def":"审美体验必须以注意和感知为基础，在审美直觉的基础上方能进行。\n作品中的形象只是提供了鉴赏条件，要把它变为鉴赏者内心的艺术形象，就必须通过审美联想和想象进行新的再创造。\n由于更侧重鉴赏者的再创造，想象、联想和情感在审美体验中更加活跃，其中想象和联想最为活跃。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-50","list":13,"num":50,"word":"康德论想象力的创造本领","phonetic":"二、艺术鉴赏中的审美体验","meanings":[{"pos":"","def":"艺术作品中的形象还只是一堆材料，需要鉴赏者展开想象的翅膀，才能组成生动的艺术形象显现在头脑里。\n康德认为想象力“有本领，能从真正的自然界所呈供的素材里创造出另一个想象的自然界”。\n例：《西游记》孙悟空、猪八戒、唐三藏栩栩如生，《水浒传》林冲、鲁智深、李逵、武松性格鲜明，都因作品为读者的想象插上了翅膀。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-51","list":13,"num":51,"word":"想象与联想填补作品的空白","phonetic":"二、艺术鉴赏中的审美体验","meanings":[{"pos":"","def":"联想和想象的作用更表现在它们填补了艺术作品的空白。\n接受美学认为任何作品都必然存在“空白”或“不确定性”，召唤鉴赏者运用想象力和联想去再创造。\n中国戏曲舞台一般不设逼真布景；建筑讲究借景、分景、隔景；书法讲究布白、“计白当黑”；南宋画家马远画山水常留大片空白，人称“马一角”。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-52","list":13,"num":52,"word":"审美体验中情感更加强烈","phonetic":"二、艺术鉴赏中的审美体验","meanings":[{"pos":"","def":"体验的世界也就是情感的世界。鉴赏全过程都带浓郁感情色彩，而审美体验阶段情感色彩更加强烈。\n鉴赏主体的审美想象越丰富、审美理解越透彻，审美情感就越强烈、越深刻。\n从一定意义上讲，审美体验就是在感知基础上通过想象和联想达到的深刻情感体验。\n例：契诃夫剧本《万尼亚舅舅》。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-53","list":13,"num":53,"word":"审美升华的定义与艺术意蕴","phonetic":"三、艺术鉴赏中的审美升华","meanings":[{"pos":"","def":"审美升华是艺术鉴赏活动的最高境界，指鉴赏主体在审美直觉和审美体验的基础上达到一种精神的自由境界，通过审美再创造活动，在艺术作品和艺术形象中直观自身，实现本质力量的对象化。\n审美感受总是由简单到复杂、由表层向深层、由感性到理性、由外观到内蕴逐渐深化。\n直觉与体验阶段常集中于艺术语言和艺术形象，到升华阶段才更集中于内在的艺术意蕴。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-54","list":13,"num":54,"word":"三阶段对应三种审美愉快","phonetic":"三、艺术鉴赏中的审美升华","meanings":[{"pos":"","def":"审美直觉阶段：客体（艺术品）作用于主体，感性直观，获得“悦耳悦目”的感官层次愉快。\n审美体验阶段：主体反作用于客体，积极再创造，获得“悦心悦意”的情感层次愉快。\n审美升华阶段：主客浑然合一，发生共鸣与顿悟，心灵净化、精神升华，获得“悦志悦神”的精神人格层次愉快，完成审美过程的超越。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-55","list":13,"num":55,"word":"莎士比亚四大悲剧的哲理感悟","phonetic":"三、艺术鉴赏中的审美升华","meanings":[{"pos":"","def":"莎士比亚“四大悲剧”为《哈姆雷特》《奥赛罗》《李尔王》《麦克白》。\n透过生动丰富的戏剧情节和有血有肉的人物形象，不但可以感受到资本主义兴起时期错综复杂的社会矛盾，而且可以从主人公的悲剧性命运中感悟到许多人生哲理。\n鲁迅说：“悲剧将人生的有价值的东西毁灭给人看。”"}],"related":[],"section":"第13章","marked":false},{"id":"C13-56","list":13,"num":56,"word":"贝多芬《第九交响曲》的哲理性","phonetic":"三、艺术鉴赏中的审美升华","meanings":[{"pos":"","def":"贝多芬《d小调第九交响曲》（《合唱交响曲》）是他全部创作的高峰和总结。\n作品构思广阔、形象丰富，扩大了当时交响曲的规模和范围，变成由交响乐队、合唱、独唱、重唱表演的宏伟颂歌。\n欣赏时不仅被排山倒海的气势和悲壮激昂的主题感染，更能感受到震撼心灵的哲理性和英雄性。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-57","list":13,"num":57,"word":"审美升华中的理解与顿悟","phonetic":"三、艺术鉴赏中的审美升华","meanings":[{"pos":"","def":"审美升华阶段同样有多种心理因素活动，其中理解因素最为活跃。\n这里的理解已不同于前两阶段，更多表现为一种哲理的顿悟和理性的直觉。\n艺术意蕴多将无穷之意蕴含在有尽之言中，具有多义性和模糊性；要把握“言外之意”“弦外之音”“象外之旨”，就必须通过哲理的顿悟，从体验世界上升到超验世界。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-58","list":13,"num":58,"word":"香菱读诗与《马拉之死》的顿悟","phonetic":"三、艺术鉴赏中的审美升华","meanings":[{"pos":"","def":"《红楼梦》第四十八回香菱对黛玉谈读王维诗的体会，即通过达到理性认识的高级直觉，领会感悟诗中意蕴，在顿悟中把握诗意。\n法国古典主义画家路易·大卫《马拉之死》记录法国大革命时期“人民之友”马拉被刺死的情景：画面情节单纯、场面简单，马拉斜靠浴缸边，头颅和手无力下垂，鲜血从胸膛缓缓流出，庄重深沉的色彩令人震惊，观众在理性直觉中升华出崇高的悲剧氛围。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-59","list":13,"num":59,"word":"共鸣是物我同一、物我两忘","phonetic":"三、艺术鉴赏中的审美升华","meanings":[{"pos":"","def":"共鸣指鉴赏主体在审美直觉和审美体验的基础上，深深被艺术作品所感动、所吸引，达到忘我境界，由此达到主体与艺术形象契合一致、物我同一、物我两忘。\n共鸣是鉴赏过程中情感、想象等多种心理功能达到最强烈程度的表现，也离不开对作品意蕴的深入感受和理解。\n共鸣是艺术鉴赏活动的高峰和极致。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-60","list":13,"num":60,"word":"艺术鉴赏共鸣的四个例证","phonetic":"三、艺术鉴赏中的审美升华","meanings":[{"pos":"","def":"白居易《琵琶行》写沦落天涯的琵琶女，“座中泣下谁最多，江州司马青衫湿”，发出“同是天涯沦落人，相逢何必曾相识”的感慨。\n宋代欧阳修读梅尧臣诗，感到“陶畅酣达，不知手足之将鼓舞也”。\n秦始皇读韩非文章，感叹如能与此人同游则“死不恨矣”。\n汉武帝读司马相如《子虚赋》，惋惜“朕独不得与此人同时”。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-61","list":13,"num":61,"word":"共鸣实质是读者与作者的共鸣","phonetic":"三、艺术鉴赏中的审美升华","meanings":[{"pos":"","def":"表面上看，共鸣表现为鉴赏主体与鉴赏对象（艺术作品、艺术形象）的共鸣；实际上，它是鉴赏主体（读者、观众、听众）与创作主体（艺术家）之间“同声相应，同气相求”的共鸣。\n鲁迅说：“是弹琴人么，别人心上也须有弦索，才会出声。”\n现代格式塔心理学派用“异质同构”或“同形同构”理论解释审美经验；“心有灵犀一点通”即指共鸣。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-62","list":13,"num":62,"word":"艺术批评的由来与桥梁作用","phonetic":"一、艺术批评的作用","meanings":[{"pos":"","def":"艺术批评离不开艺术鉴赏，只能在鉴赏的基础上进行；作为艺术接受的高级阶段，它又不停留于鉴赏，而需进一步深化发展。\n艺术批评是艺术创作与艺术鉴赏之间的一座桥梁，对二者都具有直接的指导作用。\n随着艺术生产的发展，人们为探究作品成败得失、总结创作经验教训、提高鉴赏能力和水平，便形成和发展了艺术批评。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-63","list":13,"num":63,"word":"我国早期的艺术批评成果","phonetic":"一、艺术批评的作用","meanings":[{"pos":"","def":"我国魏晋南北朝时期，曹丕的《典论·论文》对“建安七子”的作品进行了分析评价；钟嵘著有《诗品》。\n20世纪被称为“艺术批评的自觉时代”。\n20世纪下半叶以来，西方文艺批评方法和流派层出不穷，出现研究批评本身的“批评的批评”即文艺批评学，如艾布拉姆斯“批评四要素”范式理论、克里格《批评理论》。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-64","list":13,"num":64,"word":"艺术批评帮助人们鉴赏作品","phonetic":"一、艺术批评的作用","meanings":[{"pos":"","def":"第一，帮助人们更好地鉴赏艺术作品，提高鉴赏能力和鉴赏水平。\n作品深刻的思想内涵和真正的艺术魅力常不能一下子领悟把握，需要批评来发现和评价优秀作品，指导帮助广大群众鉴赏。\n批评家具有高度鉴赏力和判断力，在鉴赏基础上对作品作科学的、认真的、全面的分析研究，能从人们未曾注意的地方发现审美价值。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-65","list":13,"num":65,"word":"艺术批评的创作反馈与脂砚斋评点","phonetic":"一、艺术批评的作用","meanings":[{"pos":"","def":"第二，通过对艺术作品的评价，形成对艺术创作的反馈。\n艺术创作是复杂的精神生产，艺术家需要读者、观众、听众和批评家的帮助，才能深刻认识自己、不断提高；优秀批评能集中反映时代需要和人民群众的审美需求，发挥信息反馈和调节作用。\n例：曹雪芹写《红楼梦》边听意见边修改，“披阅十载，增删五次”，脂砚斋评点更增色；据“脂评”透露，秦可卿之死一段即按其意见修改，故抄本名《脂砚斋重评石头记》。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-66","list":13,"num":66,"word":"艺术批评丰富发展艺术理论","phonetic":"一、艺术批评的作用","meanings":[{"pos":"","def":"第三，丰富和发展艺术理论，推动艺术科学的繁荣发展。\n艺术学主要包括艺术理论、艺术批评和艺术史三方面。\n艺术批评的主要任务是对作品的分析和评价，也包括对各种艺术现象（思潮、流派）的考察探讨；它以艺术理论为指导、利用艺术史成果，又通过分析新作品、评论新作家、发现新问题、总结新经验，不断丰富发展艺术理论和艺术史。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-67","list":13,"num":67,"word":"艺术批评二重性：科学与艺术统一","phonetic":"二、艺术批评的特征","meanings":[{"pos":"","def":"艺术批评具有二重性的特点，即科学性与艺术性的统一。\n科学性：批评家需在鉴赏基础上，运用一定的哲学、美学和艺术学理论，对作品和艺术现象进行分析研究并作出判断评价，提供具有理论性和系统性的知识；这使它必然从社会科学和自然科学各学科吸取观点、理论和方法，呈现多元化和综合化趋势。\n与鉴赏的区别：鉴赏偏重感性、多带个人主观性；批评偏重理性、需符合客观规律性；鉴赏可不含批评意味，批评却必然经历过鉴赏阶段。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-68","list":13,"num":68,"word":"艺术批评的艺术性与《文赋》","phonetic":"二、艺术批评的特征","meanings":[{"pos":"","def":"艺术批评作为特殊科学，既需要冷静的头脑，也需要强烈的感情，既离不开理性分析，更离不开艺术感受。\n批评必须以鉴赏中的具体感受为出发点，优秀批评家应具有敏锐的感知力、丰富的想象力和强烈的情感体验；批评文章也应有艺术感染力，才能打动、说服读者。\n优秀批评文章不仅逻辑清晰、论证严谨，还应文字优美、生动感人。西晋陆机《文赋》即以赋体写成，“观古今于须臾，抚四海于一瞬”流传千古。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-69","list":13,"num":69,"word":"艺术批评标准：思想性与艺术性统一","phonetic":"三、艺术批评的标准","meanings":[{"pos":"","def":"艺术批评的二重性决定了它既带强烈的个人色彩，又具有客观的共同标准，批评标准应是思想性和艺术性的完美统一。\n思想性指作品所具有的思想意义和所达到的思想水平，是作品内在的灵魂。\n艺术性指作品在艺术构思、艺术语言、艺术表现手法等方面所达到的水平，特别是从整体上达到完美的艺术境界，具有独创的艺术风格。"}],"related":[],"section":"第13章","marked":false},{"id":"C13-70","list":13,"num":70,"word":"习近平论文艺批评的历史人民艺术美学观点","phonetic":"三、艺术批评的标准","meanings":[{"pos":"","def":"2024年论述题：10月15日文艺工作座谈会上，习近平总书记指出，要高度重视和切实加强文艺评论工作，运用历史的、人民的、艺术的、美学的观点评判和鉴赏作品，倡导说真话、讲道理，营造开展文艺批评的良好氛围。\n可结合艺术批评的三大作用（帮助鉴赏、反馈创作、丰富理论）与二重性（科学性、艺术性）展开。"}],"related":[],"section":"第13章","marked":false}]};
'use strict';

/* ---------- helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (value) => String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[ch]));
const pad2 = (n) => String(n).padStart(2, '0');
const nowISO = () => new Date().toISOString();

const WORD_MAP = new Map(DATA.words.map((w) => [w.id, w]));
const GROUP_MAP = new Map(DATA.groups.map((g) => [g.id, g]));
const TOTAL = DATA.words.length;

const SECTIONS = (DATA.meta.sections || []).map((s) => s.name);
const SECTION_SHORT = {};
SECTIONS.forEach((n) => { SECTION_SHORT[n] = n.replace(/篇$/, ''); });
const STORAGE_KEY = DATA.meta.storageKey || 'cet4_review_v2';
const GROUP_TITLE = (g) => g.title || `List ${pad2(g.list)}`;

/* ---------- dates ---------- */
function dateKey(d = new Date()) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function todayKey() { return dateKey(new Date()); }
function headerDateText() {
  const d = new Date();
  return `${d.getMonth() + 1}月${d.getDate()}日 · 周${'日一二三四五六'[d.getDay()]}`;
}
function formatJoinDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}
function greeting() {
  const h = new Date().getHours();
  if (h < 6) return '夜深了';

  if (h < 14) return '中午好';
  if (h < 18) return '下午好';
  return '晚上好';
}

/* ---------- storage ---------- */
function defaultState() {
  return {
    version: 1,
    createdAt: nowISO(),
    answers: {},
    wordbook: {},
    completedGroups: {},
    lastCompletedDate: null,
    lastCompletedGroup: null,
    history: {},
    settings: { autoSpeak: false }
  };
}
function normalizeState(input) {
  const base = defaultState();
  if (!input || typeof input !== 'object') return base;
  const s = Object.assign(base, input);
  s.answers = (input.answers && typeof input.answers === 'object') ? input.answers : {};
  s.wordbook = (input.wordbook && typeof input.wordbook === 'object') ? input.wordbook : {};
  s.completedGroups = (input.completedGroups && typeof input.completedGroups === 'object') ? input.completedGroups : {};
  s.history = (input.history && typeof input.history === 'object') ? input.history : {};
  s.settings = Object.assign({ autoSpeak: false }, input.settings || {});
  if (!s.createdAt) s.createdAt = nowISO();
  return s;
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    return normalizeState(JSON.parse(raw));
  } catch (err) {
    return defaultState();
  }
}
let state = loadState();
let storageAvailable = true;
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    if (storageAvailable) {
      storageAvailable = false;
      toast('浏览器没有允许保存记录，本次进度可能丢失。');
    }
  }
}

/* ---------- derived ---------- */
function groupWords(group) {
  if (!group) return [];
  return group.wordIds.map((id) => WORD_MAP.get(id)).filter(Boolean);
}
function groupRemaining(group) {
  return groupWords(group).filter((w) => !state.answers[w.id]);
}
function groupAnswered(group) {
  return groupWords(group).filter((w) => !!state.answers[w.id]);
}
function firstIncompleteGroupIndex() {
  for (let i = 0; i < DATA.groups.length; i++) {
    if (!state.completedGroups[DATA.groups[i].id]) return i;
  }
  return -1;
}
function getTodayGroup() {
  if (state.lastCompletedDate === todayKey() && state.lastCompletedGroup) {
    const g = GROUP_MAP.get(state.lastCompletedGroup);
    if (g && groupRemaining(g).length === 0) return g;
  }
  const i = firstIncompleteGroupIndex();
  return i >= 0 ? DATA.groups[i] : null;
}
function isTodayDone() {
  const g = getTodayGroup();
  return !!g && state.lastCompletedDate === todayKey() && state.lastCompletedGroup === g.id && groupRemaining(g).length === 0;
}
function allDone() { return firstIncompleteGroupIndex() === -1; }
function nextGroupAfter(groupId) {
  const i = DATA.groups.findIndex((g) => g.id === groupId);
  for (let j = i + 1; j < DATA.groups.length; j++) {
    if (!state.completedGroups[DATA.groups[j].id]) return DATA.groups[j];
  }
  return null;
}
function masteredCount() {
  let n = 0;
  for (const w of DATA.words) {
    if (w.marked || (state.answers[w.id] && state.answers[w.id].status === 'known')) n++;
  }
  return n;
}
function wordbookWords() {
  return Object.keys(state.wordbook)
    .map((id) => WORD_MAP.get(id))
    .filter(Boolean)
    .sort((a, b) => String((state.wordbook[b.id] || {}).addedAt || '').localeCompare(String((state.wordbook[a.id] || {}).addedAt || '')));
}
function wordbookCount() {
  return Object.keys(state.wordbook).filter((id) => !!WORD_MAP.get(id)).length;
}
function todayHistory() {
  return state.history[todayKey()] || { known: 0, unknown: 0, total: 0 };
}
function sectionStats(section) {
  let total = 0, done = 0;
  for (const w of DATA.words) {
    if (w.section !== section) continue;
    total++;
    if (w.marked || (state.answers[w.id] && state.answers[w.id].status === 'known')) done++;
  }
  return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
}
function streakCount() {
  let count = 0;
  const d = new Date();
  for (let i = 0; i < 370; i++) {
    const key = dateKey(d);
    const has = state.history[key] && state.history[key].total > 0;
    if (has) count++;
    else if (i > 0) break;
    d.setDate(d.getDate() - 1);
  }
  return count;
}
function bumpHistory(kind) {
  const key = todayKey();
  const h = state.history[key] || { known: 0, unknown: 0, total: 0 };
  h[kind] = (h[kind] || 0) + 1;
  h.total = (h.total || 0) + 1;
  state.history[key] = h;
}
function icon(name, cls = 'icon') {
  return `<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;

function renderPreview(group, done) {
  const words = groupWords(group);

  const rows = words.map((w) => {

    const label = group.list === 0 ? `L${pad2(w.list)}` : pad2(w.num);
    return `
      <div class="word-row ${cls}" data-mark="${mark}">
        <span class="word-num">${label}</span>
        <span class="word-main">
          <span class="word-name">${esc(w.word)}</span>

        </span>
      </div>`;
  }).join('');
  return `
    <div class="sheet-card">
      <div class="sheet-head">

/* ---------- wordbook ---------- */
let wbFilter = 'all';
let wbSearch = '';
function getWbFiltered() {
  const map = { all: () => true };
  SECTIONS.forEach((s, i) => { map[`s${i}`] = (w) => w.section === s; });
  const predicate = map[wbFilter] || map.all;
  const q = wbSearch.trim().toLowerCase();
  return wordbookWords().filter((w) => {
    if (!predicate(w)) return false;
    if (!q) return true;
    const haystack = [w.word, w.phonetic, w.section, ...w.meanings.map((m) => `${m.pos} ${m.def}`), ...w.related.map((r) => r.word)].join(' ').toLowerCase();
    return haystack.includes(q);
  });
}
function renderWordbook() {
  const all = wordbookWords();
  const total = all.length;
  const chips = [['all', '全部', total]].concat(
    SECTIONS.map((s, i) => [`s${i}`, SECTION_SHORT[s], all.filter((w) => w.section === s).length])
  );
  $('#wbCount').textContent = total;
  $('#wbChips').innerHTML = chips.map(([key, label, n]) => `<button class="chip ${wbFilter === key ? 'active' : ''}" type="button" data-action="filter" data-filter="${key}">${label} ${n}</button>`).join('');
  if (!chips.some((c) => c[0] === wbFilter)) wbFilter = 'all';

  const filtered = getWbFiltered();
  $('#wbSummary').innerHTML = total
    ? `<span>共 <b>${total}</b> ${UNIT}</span><span>${wbFilter === 'all' ? '按加入时间排序' : `当前筛选 ${filtered.length} ${UNIT}`}</span><button class="btn small primary" type="button" data-action="review-wordbook">${icon('refresh')} 复习</button>`
    : '';

  renderWordbookList(filtered);
  updateTabBadge();
}
function renderWordbookList(filtered) {
  const list = filtered || getWbFiltered();
  const total = wordbookWords().length;
  if (!total) {
    $('#wbList').innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-mark">${icon('book')}</div>
        <h2>复习本还是空的。</h2>
        <p>背知识点时选“不认识”的词，会自动收进这里。之后可以随时回来复习。</p>
        <button class="btn primary" type="button" data-action="go-home">去今日背知识点 ${icon('arrow')}</button>
      </div>`;
    return;
  }
  if (!list.length) {
    $('#wbList').innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-mark">${icon('search')}</div>
        <h2>没有找到匹配的词。</h2>
        <p>换一个关键词，或者把筛选切回“全部”。</p>
      </div>`;
    return;
  }
  $('#wbList').innerHTML = list.map((w) => {
    const related = w.related.slice(0, 2).map((r) => `<div class="wb-related">↳ <b>${esc(r.word)}</b> ${esc(r.phonetic)} · ${esc(r.meanings.map((m) => m.def).join('；'))}</div>`).join('');
    const meaning = w.meanings.map((m) => `<span class="pos">${esc(m.pos)}</span>${esc(m.def)}`).join('<br>');
    return `
      <article class="wb-card">
        <div class="wb-top">
          <div>
            <h3 class="wb-word ${String(w.word || '').length > 12 ? 'is-long' : ''}">${esc(w.word)}</h3>
            <p class="wb-phonetic">${esc(w.phonetic)}</p>
          </div>
          ${w.section ? `<span class="wb-tag">${esc(SECTION_SHORT[w.section] || w.section)}</span>` : ''}
        </div>
        <p class="wb-meaning">${meaning}</p>
        ${related}
        <div class="wb-foot">
          <span class="wb-date">加入于 ${formatJoinDate((state.wordbook[w.id] || {}).addedAt)}</span>
          <div class="wb-actions">
            <button class="icon-btn" type="button" data-action="speak" data-word="${esc(w.word)}" aria-label="朗读 ${esc(w.word)}" title="朗读">${icon('volume')}</button>
            <button class="icon-btn" type="button" data-action="wb-master" data-id="${w.id}" aria-label="标记 ${esc(w.word)} 为已掌握" title="标记为已掌握">${icon('check')}</button>
          </div>
        </div>
      </article>`;
  }).join('');
}

function renderProgress() {

  const completed = DATA.groups.filter((g) => !!state.completedGroups[g.id]).length;
  $('#progressPct').textContent = pct;
  const intro = $('#progressIntro');
  if (intro) intro.textContent = `${DATA.groups.length} ${GU}，按每天一${GU}的节奏，慢慢走完。`;

  const overview = `
    <div class="overview">
      <div class="ring" style="--p:${pct}">

        </div>
      </div>
    </div>`;

  const sectionRows = SECTIONS.map((section) => {
    const s = sectionStats(section);
    return `
      <div class="bar-row">
        <div class="bar-label">${section}<small>${s.done}/${s.total}</small></div>
        <div class="bar-track"><i style="width:${s.pct}%"></i></div>
        <div class="bar-value">${s.pct}%</div>
      </div>`;
  }).join('');
  const sectionBlock = SECTIONS.length > 1 ? `
    <div class="section-block">
      <div class="section-block-head"><h2>分篇进度</h2><span>${SECTIONS.map((s) => SECTION_SHORT[s]).join(' · ')}</span></div>
      ${sectionRows}
    </div>` : '';

  const groups = DATA.groups.map((g) => {
    const isDone = !!state.completedGroups[g.id];
    const currentGroup = getTodayGroup();
    const isCurrent = !isDone && currentGroup && currentGroup.id === g.id && !isTodayDone();
    const remaining = groupRemaining(g).length;
    const status = isDone ? 'done' : (isCurrent ? 'current' : 'upcoming');
    const sub = isDone ? '完成' : (isCurrent ? '进行中' : `${remaining} 词`);
    const label = g.short || `${SECTION_SHORT[g.section][0]}${pad2(g.list)}`;
    return `<button class="group-cell ${status}" type="button" data-action="group" data-id="${g.id}" aria-label="${esc(g.label)} ${sub}">
      <span class="group-label">${label}</span>
      <span class="group-sub">${sub}</span>
    </button>`;
  }).join('');
  const groupBlock = `
    <div class="section-block">
      <div class="section-block-head"><h2>每日分组</h2><span>${completed} / ${DATA.groups.length} 组完成</span></div>
      <div class="group-grid">${groups}</div>
    </div>`;

  const weekBlock = `
    <div class="section-block">
      <div class="section-block-head"><h2>最近 7 天</h2><span>认识 / 加入复习本</span></div>
      ${renderWeekChart()}
      <div class="week-legend"><span><i class="legend-dot"></i>认识</span><span><i class="legend-dot unknown"></i>生词</span></div>
    </div>`;

  const actionBlock = `
    <div class="section-block">
      <div class="section-block-head">
        <h2>词库</h2>
        <span>共 ${TOTAL} 词 · ${DATA.groups.length} 页</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" type="button" data-action="review-wordbook">${icon('refresh')} 复习${wb ? `（${wb}）` : ''}</button>
      </div>
    </div>`;

  $('#progressBody').innerHTML = overview + sectionBlock + groupBlock + weekBlock + actionBlock;
}
function renderWeekChart() {
  const days = [];
  const now = new Date();
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    days.push({ d, key: dateKey(d), isToday: i === 0 });
  }
  const totals = days.map(({ key }) => (state.history[key] && state.history[key].total) || 0);
  const max = Math.max(1, ...totals);
  const bars = days.map(({ d, key, isToday }) => {
    const h = state.history[key] || { known: 0, unknown: 0, total: 0 };
    const kh = h.known ? Math.max(4, Math.round(h.known / max * 100)) : 0;
    const uh = h.unknown ? Math.max(4, Math.round(h.unknown / max * 100)) : 0;
    const label = isToday ? '今' : `周${'日一二三四五六'[d.getDay()]}`;
    return `<div class="week-day" title="${h.known} 认识 · ${h.unknown} 生词">
      <div class="week-stack">
        <i style="height:${kh}%"></i>
        <i class="unknown" style="height:${uh}%"></i>
      </div>
      <span class="week-labels">${label}</span>
    </div>`;
  }).join('');
  return `<div class="week-chart">${bars}</div>`;
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(message) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ---------- speech ---------- */
let voicesCache = [];
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  voicesCache = window.speechSynthesis.getVoices() || [];
}
if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text) {
  if (!('speechSynthesis' in window)) {
    toast('当前浏览器不支持语音朗读。');
    return;
  }
  if (!text) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.82;
    u.pitch = 1;
    const en = voicesCache.filter((v) => /^en(-|_)/i.test(v.lang));
    const pick = en.find((v) => /Samantha|Daniel|Google US English|Microsoft (Aria|Jenny|Guy|Zira|David)/i.test(v.name)) || en[0];
    if (pick) u.voice = pick;
    window.speechSynthesis.speak(u);
  } catch (err) {
    toast('语音朗读没有启动，请再点一次。');
  }
}

/* ---------- session ---------- */
let session = null;

function startDaily() {
  const group = getTodayGroup();
  if (!group) { toast('全部词单都完成了。'); return; }
  if (isTodayDone()) { toast('今天这一页已经完成了，明天再继续。'); return; }
  startDailyGroup(group);
}
function startDailyGroup(group) {
  if (!group) return;
  const queue = group.wordIds.map((id) => WORD_MAP.get(id)).filter((w) => w && !state.answers[w.id]);
  const total = group.wordIds.length;
  session = {
    mode: 'daily',
    group,
    queue,
    idx: 0,
    total,
    answeredBase: total - queue.length,
    atEnd: false,
    lastAction: null,
    nextTimer: null,
    locked: false,
    advancing: false
  };
  openSession();
}
function startReview() {
  const queue = wordbookWords();
  if (!queue.length) { toast('复习本还是空的，先去背几个词吧。'); return; }
  session = {
    mode: 'review',
    group: null,
    queue,
    idx: 0,
    total: queue.length,
    answeredBase: 0,
    atEnd: false,
    lastAction: null,
    nextTimer: null,
    locked: false,
    advancing: false
  };
  openSession();
}
function openSession() {
  if (!session) return;
  $('#sessionScreen').classList.add('open');
  $('#sessionScreen').setAttribute('aria-hidden', 'false');
  document.body.classList.add('locked');
  $('#sessionCard').classList.remove('hidden');
  $('#sessionFinish').classList.add('hidden');
  $('#sessionFinish').innerHTML = '';
  $('#sessionUndo').disabled = !session.lastAction;
  renderSessionWord();
}
function closeSession() {
  if (!session) return;
  if (session.nextTimer) clearTimeout(session.nextTimer);
  const wasDaily = session.mode === 'daily' && !session.atEnd;
  session = null;
  $('#sessionScreen').classList.remove('open');
  $('#sessionScreen').setAttribute('aria-hidden', 'true');
  if (!$('#sheetWrap').classList.contains('open')) document.body.classList.remove('locked');
  renderAll();
  if (wasDaily) toast('进度已保存，下次接着来。');
}
function setSessionLabels() {
  if (!session) return;
  if (session.mode === 'review') {
    $('#sessionLabel').textContent = '复习本 · 复习';
    $('#sessionTag').textContent = 'Wordbook · Review';
    $('#unknownTitle').textContent = '还不熟';
    $('#unknownSub').textContent = '留在复习本';
    $('#knownTitle').textContent = '记住了';
    $('#knownSub').textContent = '移出复习本';
    $('#askBlock .ask-question').innerHTML = '还记得这个词吗？<b> 先别急着看释义。</b>';
    $('#sessionHint').innerHTML = '按 <kbd>1</kbd> 还不熟 · <kbd>2</kbd> 记住了 · <kbd>空格</kbd> 看释义';
  } else {
    $('#sessionLabel').textContent = `今日 · ${session.group.label}`;
    $('#sessionTag').textContent = [GROUP_TITLE(session.group), GROUP_SUB(session.group)].filter(Boolean).join(' · ');
    $('#unknownTitle').textContent = '不认识';
    $('#unknownSub').textContent = '加入复习本';
    $('#knownTitle').textContent = '认识';
    $('#knownSub').textContent = '不再出现';
    $('#askBlock .ask-question').innerHTML = `认识这个${ITEM}吗？<b> 先凭印象判断。</b>`;
    $('#sessionHint').innerHTML = '按 <kbd>1</kbd> 不认识 · <kbd>2</kbd> 认识 · <kbd>空格</kbd> 看释义';
  }
}
function renderSessionWord() {
  if (!session) return;
  if (session.idx >= session.queue.length) { renderSessionFinish(); return; }
  const w = session.queue[session.idx];
  const currentNo = session.answeredBase + session.idx + 1;
  $('#sessionCard').classList.remove('hidden');
  $('#sessionFinish').classList.add('hidden');
  $('#sessionFinish').innerHTML = '';
  setSessionLabels();
  $('#sessionWord').textContent = w.word;
  const wordEl = $('#sessionWord');
  const len = String(w.word || '').length;
  wordEl.classList.toggle('is-long', len > 8 && len <= 18);
  wordEl.classList.toggle('is-xlong', len > 18);
  $('#sessionPhonetic').textContent = w.phonetic;
  $('#sessionMeaning').innerHTML = meaningHTML(w);
  $('#sessionMeaning').classList.remove('revealed');
  $('#revealBtn').classList.remove('hidden');
  $('#revealBtn').textContent = '显示释义';
  $('#revealBtn').setAttribute('aria-expanded', 'false');
  $('#feedback').classList.remove('show');
  $('#feedbackText').innerHTML = '';
  $('#nextBtn').classList.remove('show');
  $('#nextBtn').textContent = '下一个 →';
  $('#btnUnknown').disabled = false;
  $('#btnKnown').disabled = false;
  session.locked = false;
  session.answerLocked = false;
  session.advancing = false;
  $('#sessionCard').classList.remove('swapping');
  $('#sessionIndex').textContent = `${pad2(Math.min(currentNo, session.total))} / ${pad2(session.total)}`;
  $('#sessionCounter').textContent = `${Math.min(currentNo, session.total)} / ${session.total}`;
  $('#sessionUndo').disabled = !session.lastAction;
  updateSessionBar((session.answeredBase + session.idx) / session.total);
  if (state.settings.autoSpeak) {
    setTimeout(() => {
      if (session && session.queue[session.idx] === w && !session.atEnd) speak(w.word);
    }, 260);
  }
}
function updateSessionBar(fraction) {
  const pct = Math.max(0, Math.min(100, Math.round(fraction * 100)));
  $('#sessionBar').style.width = `${pct}%`;
}
function meaningHTML(w) {
  const lines = w.meanings.map((m) => `<p class="meaning-line">${m.pos ? `<span class="pos-tag">${esc(m.pos)}</span>` : ''}<span>${esc(m.def)}</span></p>`).join('');
  const related = w.related.length ? `
    <div class="related-box">
      <p class="related-title">同页派生 / 相关词</p>
      ${w.related.map((r) => `<p class="related-row"><b>${esc(r.word)}</b><span class="related-phon">${esc(r.phonetic)}</span><span>${esc(r.meanings.map((m) => `${m.pos} ${m.def}`.trim()).join('；'))}</span></p>`).join('')}
    </div>` : '';
  return lines + related;
}
function toggleReveal() {
  const m = $('#sessionMeaning');
  const btn = $('#revealBtn');
  if (!m || !btn) return;
  const open = m.classList.toggle('revealed');
  btn.textContent = open ? '收起释义' : '显示释义';
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}
function answerCurrent(status) {
  if (!session || session.locked || session.answerLocked) return;
  if (session.idx >= session.queue.length) return;
  const w = session.queue[session.idx];
  if (!w) return;
  session.answerLocked = true;
  session.locked = true;
  const now = nowISO();
  const today = todayKey();
  const before = {
    answer: state.answers[w.id] ? Object.assign({}, state.answers[w.id]) : null,
    wordbook: state.wordbook[w.id] ? Object.assign({}, state.wordbook[w.id]) : null,
    history: state.history[today] ? Object.assign({}, state.history[today]) : null
  };
  const answeredIndex = session.idx;

  if (session.mode === 'daily') {
    if (status === 'known') {
      state.answers[w.id] = { status: 'known', at: now, group: session.group.id };
      if (state.wordbook[w.id]) delete state.wordbook[w.id];
      bumpHistory('known');
    } else {
      state.answers[w.id] = { status: 'unknown', at: now, group: session.group.id };
      if (!state.wordbook[w.id]) state.wordbook[w.id] = { addedAt: now, source: 'daily', reviews: 0, lastReview: null };
      bumpHistory('unknown');
    }
  } else {
    if (status === 'known') {
      state.answers[w.id] = { status: 'known', at: now, group: 'wordbook' };
      if (state.wordbook[w.id]) delete state.wordbook[w.id];
    } else {
      const entry = state.wordbook[w.id] || { addedAt: now, source: 'review', reviews: 0, lastReview: null };
      entry.reviews = (entry.reviews || 0) + 1;
      entry.lastReview = now;
      state.wordbook[w.id] = entry;
    }
  }

  session.lastAction = { wordId: w.id, answeredIndex, before, mode: session.mode };
  save();

  const msg = session.mode === 'daily'
    ? (status === 'known' ? '已掌握，之后不会再出现。' : '已加入复习本。记住它，再继续下一页。')
    : (status === 'known' ? '已掌握，已从复习本移出。' : '已记录，这个词会继续留在复习本。');
  $('#sessionMeaning').classList.add('revealed');
  $('#revealBtn').classList.add('hidden');
  $('#btnUnknown').disabled = true;
  $('#btnKnown').disabled = true;
  $('#feedbackText').innerHTML = `<b>${status === 'known' ? '✓' : '＋'}</b> ${msg}`;
  $('#feedback').classList.add('show');
  $('#nextBtn').classList.add('show');
  $('#sessionUndo').disabled = false;
  $('#sessionCounter').textContent = `${Math.min(session.answeredBase + session.idx + 1, session.total)} / ${session.total}`;
  updateSessionBar((session.answeredBase + session.idx + 1) / session.total);

  if (status === 'known') {
    session.nextTimer = setTimeout(() => {
      if (session && session.locked) nextWord();
    }, 950);
  }
}
function nextWord() {
  if (!session || session.atEnd || session.advancing) return;
  session.advancing = true;
  if (session.nextTimer) { clearTimeout(session.nextTimer); session.nextTimer = null; }
  const card = $('#sessionCard');
  card.classList.add('swapping');
  setTimeout(() => {
    if (!session) return;
    session.idx += 1;
    session.locked = false;
    session.answerLocked = false;
    session.advancing = false;
    renderSessionWord();
  }, 150);
}
function undoLast() {
  if (!session || !session.lastAction) return;
  if (session.nextTimer) { clearTimeout(session.nextTimer); session.nextTimer = null; }
  const a = session.lastAction;
  if (a.before.answer) state.answers[a.wordId] = a.before.answer;
  else delete state.answers[a.wordId];
  if (a.before.wordbook) state.wordbook[a.wordId] = a.before.wordbook;
  else delete state.wordbook[a.wordId];
  const today = todayKey();
  if (a.before.history) state.history[today] = a.before.history;
  else delete state.history[today];

  if (session.atEnd) {
    if (session.group && state.lastCompletedGroup === session.group.id && state.lastCompletedDate === today) {
      delete state.completedGroups[session.group.id];
      state.lastCompletedDate = null;
      state.lastCompletedGroup = null;
    }
    session.atEnd = false;
  }
  session.idx = a.answeredIndex;
  session.locked = false;
  session.answerLocked = false;
  session.advancing = false;
  session.lastAction = null;
  $('#sessionFinish').classList.add('hidden');
  $('#sessionCard').classList.remove('hidden');
  renderSessionWord();
  save();
  toast('已撤回上一步。');
}
function completeGroup(group) {
  if (!group) return;
  if (group.wordIds.every((id) => !!state.answers[id])) {
    state.completedGroups[group.id] = nowISO();
    state.lastCompletedDate = todayKey();
    state.lastCompletedGroup = group.id;
  }
}
function renderSessionFinish() {
  if (!session) return;
  session.atEnd = true;
  session.locked = true;
  const isDaily = session.mode === 'daily';
  if (isDaily) completeGroup(session.group);
  save();

  let known = 0, unknown = 0, title = '这页完成了。', sub = '';
  if (isDaily) {
    const words = groupWords(session.group);
    known = words.filter((w) => (state.answers[w.id] || {}).status === 'known').length;
    unknown = words.filter((w) => (state.answers[w.id] || {}).status === 'unknown').length;
    sub = `${session.group.label} · ${words.length} 词 · 已保存`;
  } else {
    known = session.queue.filter((w) => (state.answers[w.id] || {}).status === 'known').length;
    unknown = session.queue.length - known;
    title = '复习完成。';
    sub = `共复习 ${session.queue.length} ${UNIT} · 复习本还剩 ${wordbookCount()} 词`;
  }
  $('#sessionCard').classList.add('hidden');
  $('#sessionFinish').classList.remove('hidden');
  $('#sessionFinish').innerHTML = `
    <div class="finish-mark">${icon('check')}</div>
    <h2>${title}</h2>
    <p>${sub}</p>
    <div class="finish-stats">
      <div class="finish-stat"><b>${known}</b><span>${isDaily ? '认识' : '记住了'}</span></div>
      <div class="finish-stat"><b>${unknown}</b><span>${isDaily ? '加入复习本' : '还不熟'}</span></div>
    </div>
    <div class="finish-actions">
      <button class="btn primary" type="button" data-action="finish-home">回到今日</button>
      <button class="btn" type="button" data-action="finish-wordbook">去复习本复习</button>
    </div>`;
  $('#sessionCounter').textContent = `${session.total} / ${session.total}`;
  updateSessionBar(1);
  $('#sessionUndo').disabled = !session.lastAction;
  $('#sessionHint').innerHTML = isDaily ? '这一页完成了，明天继续下一页。' : '复习记录已保存。';
}

/* ---------- wordbook actions ---------- */
function markMastered(id) {
  const w = WORD_MAP.get(id);
  if (!w) return;
  state.answers[id] = { status: 'known', at: nowISO(), group: (state.answers[id] || {}).group || 'wordbook' };
  delete state.wordbook[id];
  save();
  renderAll();
  toast(`“${w.word}”已标记为掌握。`);
}

/* ---------- skipped words ---------- */
function openSkipped() {
  const words = DATA.words.filter((w) => w.marked).sort((a, b) => a.list - b.list || a.num - b.num);
  const added = wordbookCount();
  $('#sheetTitle').textContent = 'PDF 已背词';
  $('#sheetSub').textContent = `共 ${words.length} 个带笔迹的词已跳过。想重新学，可单独加入复习本。${added ? ` 复习本现有 ${added} 词。` : ''}`;
  $('#sheetBody').innerHTML = `
    <div class="search-box sheet-search">
      ${icon('search')}
      <input id="skippedSearch" type="search" placeholder="搜索已跳过的词…" autocomplete="off" aria-label="搜索 PDF 已背词">
    </div>
    <div id="skippedList"></div>`;
  renderSkippedList('');
  $('#sheetWrap').classList.add('open');
  $('#sheetWrap').setAttribute('aria-hidden', 'false');
  document.body.classList.add('locked');
  setTimeout(() => { const input = $('#skippedSearch'); if (input) input.focus(); }, 120);
}
function renderSkippedList(query) {
  const q = String(query || '').trim().toLowerCase();
  const words = DATA.words.filter((w) => w.marked).sort((a, b) => a.list - b.list || a.num - b.num);
  const filtered = q ? words.filter((w) => {
    const hay = [w.word, w.phonetic, ...w.meanings.map((m) => m.def)].join(' ').toLowerCase();
    return hay.includes(q);
  }) : words;
  if (!filtered.length) {
    $('#skippedList').innerHTML = `<div class="empty-state"><div class="empty-mark">${icon('search')}</div><h2>没有匹配的词。</h2><p>换一个关键词试试。</p></div>`;
    return;
  }
  $('#skippedList').innerHTML = filtered.map((w) => {
    const inWb = !!state.wordbook[w.id];
    const known = (state.answers[w.id] || {}).status === 'known';
    const label = known ? '已掌握' : (inWb ? '已在复习本' : '加入复习本');
    return `<div class="sheet-word">
      <div class="sheet-word-main">
        <p class="sheet-word-name">${esc(w.word)} <span>List ${pad2(w.list)} · ${pad2(w.num)}</span></p>
        <p class="sheet-word-phon">${esc(w.phonetic)}</p>
        <p class="sheet-word-def">${esc(w.meanings.map((m) => `${m.pos} ${m.def}`.trim()).join('；'))}</p>
      </div>
      <button class="btn small" type="button" data-action="add-skipped" data-id="${w.id}" ${(inWb || known) ? 'disabled' : ''}>${label}</button>
    </div>`;
  }).join('');
}
function addSkipped(id) {
  const w = WORD_MAP.get(id);
  if (!w) return;
  if ((state.answers[id] || {}).status === 'known') { toast('这个词已经掌握。'); return; }
  if (state.wordbook[id]) { toast('已经在复习本里了。'); return; }
  state.wordbook[id] = { addedAt: nowISO(), source: 'pdf', reviews: 0, lastReview: null };
  save();
  renderAll();
  const btn = document.querySelector(`[data-action="add-skipped"][data-id="${id}"]`);
  if (btn) { btn.textContent = '已在复习本'; btn.disabled = true; }
  toast(`“${w.word}”已加入复习本。`);
}
function closeSheet() {
  $('#sheetWrap').classList.remove('open');
  $('#sheetWrap').setAttribute('aria-hidden', 'true');
  if (!session) document.body.classList.remove('locked');
}

/* ---------- import / export / reset ---------- */
function exportData() {
  try {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${DATA.meta.title}-学习记录-${todayKey()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1200);
    toast('学习记录已导出。');
  } catch (err) {
    toast('导出失败，请换一个浏览器试试。');
  }
}
function importData(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result || ''));
      if (!parsed || typeof parsed !== 'object' || !parsed.answers || !parsed.wordbook) throw new Error('bad file');
      if (!window.confirm('导入会覆盖当前学习记录，确定继续吗？')) return;
      state = normalizeState(parsed);
      save();
      renderAll();
      switchView('home');
      toast('学习记录已导入。');
    } catch (err) {
      toast('这个文件不是有效的学习记录。');
    }
  };
  reader.readAsText(file);
}
function resetAll() {
  if (!window.confirm('确定要清空所有学习记录吗？复习本、已掌握、进度都会重置。')) return;
  if (!window.confirm('再确认一次：这个操作不能撤销。')) return;
  state = defaultState();
  save();
  closeSheet();
  if (session) closeSession();
  renderAll();
  switchView('home');
  toast('学习记录已重置。');
}

/* ---------- group actions ---------- */
function handleGroup(id) {
  const g = GROUP_MAP.get(id);
  if (!g) return;
  if (state.completedGroups[g.id]) { toast(`${g.label} 已经完成。`); return; }
  const today = getTodayGroup();
  if (today && today.id === g.id && !isTodayDone()) startDailyGroup(g);
  else toast('按每天一章的节奏，之后再来。');
}
function startNextGroup() {
  if (!isTodayDone() && !allDone()) { toast('先把今天这一页完成吧。'); return; }
  state.lastCompletedDate = null;
  state.lastCompletedGroup = null;
  save();
  const i = firstIncompleteGroupIndex();
  if (i < 0) { toast('全部词单都完成了。'); return; }
  startDailyGroup(DATA.groups[i]);
}

/* ---------- events ---------- */
document.addEventListener('click', (event) => {
  const tab = event.target.closest('[data-tab]');
  if (tab) { switchView(tab.dataset.tab); return; }
  const el = event.target.closest('[data-action]');
  if (!el) return;
  switch (el.dataset.action) {
    case 'start-daily': startDaily(); break;
    case 'start-next': startNextGroup(); break;
    case 'go-home': switchView('home'); break;
    case 'go-wordbook': switchView('wordbook'); break;
    case 'go-progress': switchView('progress'); break;
    case 'review-wordbook': startReview(); break;
    case 'open-skipped': openSkipped(); break;
    case 'close-sheet': closeSheet(); break;
    case 'speak': speak(el.dataset.word); break;
    case 'wb-master': markMastered(el.dataset.id); break;
    case 'add-skipped': addSkipped(el.dataset.id); break;
    case 'filter': wbFilter = el.dataset.filter || 'all'; renderWordbook(); break;
    case 'group': handleGroup(el.dataset.id); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'reset': resetAll(); break;
    case 'session-close': closeSession(); break;
    case 'session-undo': undoLast(); break;
    case 'speak-session': if (session && session.queue[session.idx]) speak(session.queue[session.idx].word); break;
    case 'reveal': toggleReveal(); break;
    case 'answer-unknown': answerCurrent('unknown'); break;
    case 'answer-known': answerCurrent('known'); break;
    case 'next': nextWord(); break;
    case 'finish-home': closeSession(); switchView('home'); break;
    case 'finish-wordbook': closeSession(); switchView('wordbook'); break;
    default: break;
  }
});
document.addEventListener('input', (event) => {
  if (event.target.id === 'wbSearch') {
    wbSearch = event.target.value;
    renderWordbookList();
  } else if (event.target.id === 'skippedSearch') {
    renderSkippedList(event.target.value);
  }
});
document.addEventListener('change', (event) => {
  if (event.target.id === 'autoSpeak') {
    state.settings.autoSpeak = !!event.target.checked;
    save();
    toast(state.settings.autoSpeak ? '已开启自动朗读。' : '已关闭自动朗读。');
  } else if (event.target.id === 'importFile') {
    importData(event.target.files && event.target.files[0]);
    event.target.value = '';
  }
});
document.addEventListener('keydown', (event) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((event.target && event.target.tagName) || '');
  if (event.key === 'Escape') {
    if ($('#sheetWrap').classList.contains('open')) { closeSheet(); return; }
    if (session) { closeSession(); return; }
  }
  if (typing) return;
  if (!session || session.atEnd) return;
  if (event.key === '1') {
    event.preventDefault();
    answerCurrent('unknown');
  } else if (event.key === '2') {
    event.preventDefault();
    answerCurrent('known');
  } else if (event.key === ' ') {
    event.preventDefault();
    if (!session.locked && !$('#sessionMeaning').classList.contains('revealed')) toggleReveal();
    else if ($('#nextBtn').classList.contains('show')) nextWord();
  }
});

/* ---------- init ---------- */
renderAll();
switchView('home');

  </script>
</body>
