<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="description" content="《艺术基础》13 章知识点复习卡：一天一章，认识就过，不熟进复习本。">
  <meta name="application-name" content="艺术基础 · 全章">
  <meta name="apple-mobile-web-app-title" content="艺术基础 · 全章">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>艺术基础 · 全章</title>
  <style>* { box-sizing: border-box; }
:root {
  --paper: #f5f1e8;
  --paper-deep: #ece5d8;
  --card: #fffdf7;
  --card-soft: #faf7ef;
  --ink: #18324a;
  --ink-2: #3f5668;
  --muted: #87908e;
  --teal: #2d7d72;
  --teal-dark: #1e5e56;
  --teal-soft: #e3eeea;
  --coral: #cf6b4f;
  --coral-soft: #f7e7e1;
  --gold: #bd9250;
  --line: #e4dccd;
  --line-strong: #d1c6b4;
  --shadow: 0 20px 55px rgba(24, 50, 74, .08);
  --shadow-soft: 0 8px 24px rgba(24, 50, 74, .055);
  --serif: "Songti SC", "STSong", "Noto Serif SC", "Times New Roman", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    radial-gradient(rgba(24, 50, 74, .035) .65px, transparent .65px),
    linear-gradient(120deg, rgba(255,255,255,.3), transparent 35%);
  background-size: 17px 17px, 100% 100%;
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body.locked { overflow: hidden; }
button, input { font: inherit; }
button { color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--teal);
  outline-offset: 3px;
}
::selection { background: var(--teal-soft); color: var(--ink); }
.icon { width: 20px; height: 20px; display: block; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.hidden { display: none !important; }

/* ---------- shell ---------- */
.app-shell {
  width: min(1080px, calc(100% - 40px));
  margin: 0 auto;
  padding: 22px 0 132px;
}
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 2px 0 24px;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark {
  width: 42px; height: 42px; flex: 0 0 auto;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--teal);
  color: #fbf9f1;
  font-family: var(--serif);
  font-size: 15px;
  letter-spacing: -.04em;
  box-shadow: 0 7px 18px rgba(45, 125, 114, .24);
}
.brand-title {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .01em;
  line-height: 1.2;
}
.brand-sub { margin-top: 3px; color: var(--muted); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; }
.header-date { text-align: right; color: var(--muted); font-size: 11px; line-height: 1.7; letter-spacing: .08em; }
.header-date strong { display: block; color: var(--ink-2); font-family: var(--serif); font-size: 14px; font-weight: 600; letter-spacing: .02em; }

.view { display: none; }
.view.active { display: block; animation: viewIn .36s ease both; }
@keyframes viewIn { from { transform: translateY(7px); } to { transform: none; } }

/* ---------- home ---------- */
.home-intro { margin: 4px 0 22px; }
.eyebrow {
  display: flex; align-items: center; gap: 9px;
  margin: 0 0 10px;
  color: var(--teal);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
}
.eyebrow::before { content: ""; width: 24px; height: 1px; background: var(--teal); opacity: .55; }
.home-intro h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(32px, 5vw, 48px);
  line-height: 1.12;
  letter-spacing: -.045em;
  font-weight: 700;
}
.home-intro p { margin: 10px 0 0; color: var(--ink-2); font-size: 13px; line-height: 1.8; }
.home-intro p b { color: var(--teal); font-weight: 700; }

.hero {
  position: relative;
  overflow: hidden;
  min-height: 260px;
  padding: 28px 30px;
  border-radius: 30px;
  color: #fbf8ef;
  background:
    radial-gradient(circle at 88% 8%, rgba(255,255,255,.18), transparent 29%),
    radial-gradient(circle at 8% 100%, rgba(0,0,0,.12), transparent 38%),
    linear-gradient(140deg, #245f58 0%, #2d7d72 52%, #3c8b7e 100%);
  box-shadow: 0 24px 60px rgba(35, 94, 85, .2);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .2;
  background-image: radial-gradient(rgba(255,255,255,.8) .6px, transparent .6px);
  background-size: 13px 13px;
  mask-image: linear-gradient(115deg, transparent 20%, #000 100%);
}
.hero.done {
  color: var(--ink);
  background:
    radial-gradient(circle at 90% 0%, rgba(45,125,114,.14), transparent 34%),
    linear-gradient(145deg, #fffdf7, #f5efe2);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.hero-top { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.hero-pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 12px;
  border: 1px solid rgba(255,255,255,.26);
  border-radius: 999px;
  background: rgba(255,255,255,.1);
  color: rgba(255,255,255,.9);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .08em;
}
.hero.done .hero-pill { border-color: var(--line-strong); background: var(--teal-soft); color: var(--teal-dark); }
.hero-day { font-family: var(--serif); font-size: 12px; letter-spacing: .08em; color: rgba(255,255,255,.72); }
.hero.done .hero-day { color: var(--muted); }
.hero h2 {
  position: relative; z-index: 1;
  max-width: 620px;
  margin: 30px 0 8px;
  font-family: var(--serif);
  font-size: clamp(29px, 4vw, 42px);
  line-height: 1.18;
  letter-spacing: -.035em;
}
.hero-sub { position: relative; z-index: 1; margin: 0; color: rgba(255,255,255,.72); font-size: 12.5px; line-height: 1.8; }
.hero.done .hero-sub { color: var(--ink-2); }
.hero-bottom { position: relative; z-index: 1; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-top: 28px; }
.hero-progress { flex: 1; max-width: 390px; }
.hero-progress-line { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; color: rgba(255,255,255,.68); font-size: 10.5px; letter-spacing: .05em; }
.hero.done .hero-progress-line { color: var(--muted); }
.progress-track { height: 5px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.18); }
.hero.done .progress-track { background: var(--paper-deep); }
.progress-track > i { display: block; height: 100%; border-radius: inherit; background: #f4d59b; transition: width .6s cubic-bezier(.2,.7,.2,1); }
.hero.done .progress-track > i { background: var(--teal); }
.hero-cta {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 18px 14px 22px;
  border: 0;
  border-radius: 16px;
  background: #fffdf6;
  color: var(--teal-dark);
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  box-shadow: 0 10px 24px rgba(0,0,0,.13);
  transition: transform .2s ease, box-shadow .2s ease;
}
.hero-cta:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(0,0,0,.17); }
.hero-cta .icon { width: 17px; height: 17px; }
.hero-cta.subtle { background: var(--ink); color: #fff; }
.hero.done .hero-cta { background: var(--teal); color: #fff; box-shadow: 0 10px 24px rgba(45,125,114,.22); }

.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0; }
.stat {
  position: relative;
  overflow: hidden;
  padding: 16px 17px;
  border: 1px solid var(--line);
  border-radius: 19px;
  background: rgba(255,253,247,.8);
  box-shadow: var(--shadow-soft);
}
.stat::after { content: ""; position: absolute; right: -18px; top: -22px; width: 64px; height: 64px; border-radius: 50%; background: var(--teal-soft); opacity: .55; }
.stat:nth-child(2)::after { background: var(--coral-soft); }
.stat:nth-child(3)::after { background: #f0e6cf; }
.stat-label { position: relative; z-index: 1; color: var(--muted); font-size: 10.5px; letter-spacing: .1em; }
.stat-value { position: relative; z-index: 1; margin-top: 6px; font-family: var(--serif); font-size: 27px; line-height: 1; letter-spacing: -.04em; }
.stat-value small { margin-left: 2px; color: var(--muted); font-family: var(--sans); font-size: 10px; letter-spacing: 0; }

.home-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(270px, .78fr); gap: 16px; align-items: start; }
.sheet-card {
  border: 1px solid var(--line);
  border-radius: 24px;
  background: var(--card);
  box-shadow: var(--shadow-soft);
  overflow: hidden;
}
.sheet-head {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 14px;
  padding: 20px 22px 17px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(250,247,239,.3));
}
.sheet-kicker { margin: 0 0 5px; color: var(--muted); font-size: 9.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.sheet-title { margin: 0; font-family: var(--serif); font-size: 20px; letter-spacing: -.02em; }
.sheet-meta { color: var(--muted); font-size: 10.5px; white-space: nowrap; }
.word-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 26px; padding: 7px 22px 10px; }
.word-row {
  display: grid; grid-template-columns: 26px minmax(0, 1fr);
  gap: 2px 7px;
  align-items: baseline;
  padding: 9px 0 8px;
  border-bottom: 1px solid rgba(228,220,205,.78);
  min-width: 0;
}
.word-row:nth-last-child(-n+2) { border-bottom: 0; }
.word-num { color: #a8aaa3; font-family: var(--serif); font-size: 10.5px; letter-spacing: .02em; }
.word-main { min-width: 0; }
.word-name { display: block; font-family: var(--serif); font-size: 15px; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; overflow-wrap: anywhere; }
.word-phonetic { display: block; margin-top: 2px; color: var(--muted); font-family: var(--serif); font-size: 10.5px; line-height: 1.35; overflow-wrap: anywhere; }
.word-row.answered { opacity: .48; }
.word-row.answered .word-name { text-decoration: line-through; text-decoration-thickness: 1px; }
.word-row .row-check { color: var(--teal); font-size: 11px; }

.side-card { padding: 21px 21px 18px; }
.side-card + .side-card { margin-top: 14px; }
.side-title { margin: 0 0 12px; font-family: var(--serif); font-size: 17px; }
.side-text { margin: 0; color: var(--ink-2); font-size: 12px; line-height: 1.9; }
.side-list { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 11px; }
.side-list li { display: flex; gap: 9px; color: var(--ink-2); font-size: 11.5px; line-height: 1.7; }
.side-list .dot { width: 5px; height: 5px; flex: 0 0 auto; margin-top: 8px; border-radius: 50%; background: var(--teal); }
.side-rule { height: 1px; background: var(--line); margin: 16px 0; }
.side-note { padding: 13px 14px; border-radius: 13px; background: var(--card-soft); color: var(--muted); font-size: 10.5px; line-height: 1.75; }
.quote { margin: 0; font-family: var(--serif); font-size: 18px; line-height: 1.65; letter-spacing: -.02em; }
.quote span { color: var(--teal); }
.quote-by { margin-top: 10px; color: var(--muted); font-size: 10px; letter-spacing: .1em; }

/* ---------- buttons / chips ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 43px;
  padding: 10px 17px;
  border: 1px solid var(--line-strong);
  border-radius: 13px;
  background: var(--card);
  color: var(--ink);
  font-size: 12px;
  font-weight: 600;
  transition: transform .18s ease, background .18s ease, border-color .18s ease;
}
.btn:hover { background: var(--card-soft); }
.btn:active { transform: scale(.985); }
.btn.primary { border-color: var(--teal); background: var(--teal); color: #fff; }
.btn.primary:hover { background: var(--teal-dark); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: rgba(24,50,74,.05); }
.btn.danger { border-color: #e2b6a7; background: var(--coral-soft); color: #9d432c; }
.btn.small { min-height: 34px; padding: 7px 11px; border-radius: 10px; font-size: 11px; }
.btn .icon { width: 16px; height: 16px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  padding: 7px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 600;
  transition: .18s ease;
}
.chip:hover { border-color: var(--line-strong); color: var(--ink-2); }
.chip.active { border-color: var(--teal); background: var(--teal); color: #fff; }

/* ---------- page headings ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 2px 0 18px; }
.page-head h1 { margin: 0; font-family: var(--serif); font-size: clamp(30px, 4vw, 42px); letter-spacing: -.045em; line-height: 1.1; }
.page-head p { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
.page-head .head-count { padding-bottom: 6px; color: var(--muted); font-size: 11px; white-space: nowrap; }
.page-head .head-count b { color: var(--teal); font-family: var(--serif); font-size: 20px; }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; z-index: 60;
  left: 50%; bottom: 18px;
  transform: translateX(-50%);
  display: flex; align-items: center; justify-content: space-around;
  width: min(500px, calc(100% - 28px));
  padding: 7px;
  border: 1px solid rgba(209,198,180,.7);
  border-radius: 23px;
  background: rgba(255,253,247,.88);
  box-shadow: 0 16px 44px rgba(24,50,74,.13);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.tab {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  flex: 1;
  min-width: 0;
  padding: 8px 4px 7px;
  border: 0;
  border-radius: 16px;
  background: transparent;
  color: #929995;
  transition: color .18s ease, background .18s ease;
}
.tab .icon { width: 19px; height: 19px; }
.tab-label { font-size: 9.5px; font-weight: 600; letter-spacing: .02em; }
.tab:hover { color: var(--ink-2); }
.tab.active { background: var(--teal-soft); color: var(--teal-dark); }
.tab.active::after { content: ""; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--teal); }
.tab .badge { position: absolute; top: 5px; right: calc(50% - 20px); min-width: 15px; height: 15px; padding: 0 4px; border-radius: 99px; background: var(--coral); color: #fff; font-size: 8px; line-height: 15px; text-align: center; }

/* ---------- wordbook ---------- */
.wb-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
.search-box {
  position: relative;
  flex: 1 1 210px;
  max-width: 320px;
}
.search-box .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }
.search-box input {
  width: 100%; height: 39px;
  padding: 0 12px 0 35px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255,253,247,.75);
  color: var(--ink);
  font-size: 12px;
}
.search-box input::placeholder { color: #aaa9a1; }
.wb-summary { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; color: var(--muted); font-size: 11px; }
.wb-summary b { color: var(--ink); font-family: var(--serif); font-size: 20px; }
.wb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
.wb-card {
  position: relative;
  padding: 17px 17px 14px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--card);
  box-shadow: var(--shadow-soft);
  transition: transform .2s ease, box-shadow .2s ease;
}
.wb-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.wb-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.wb-word { margin: 0; font-family: var(--serif); font-size: 22px; line-height: 1.15; letter-spacing: -.025em; overflow-wrap: anywhere; }
.wb-phonetic { margin: 4px 0 0; color: var(--muted); font-family: var(--serif); font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; }
.wb-tag { flex: 0 0 auto; padding: 4px 7px; border-radius: 6px; background: var(--teal-soft); color: var(--teal-dark); font-size: 8.5px; font-weight: 700; letter-spacing: .04em; }
.wb-meaning { margin: 11px 0 0; color: var(--ink-2); font-size: 12px; line-height: 1.75; }
.wb-meaning .pos { color: var(--teal); font-size: 10px; font-weight: 700; margin-right: 4px; }
.wb-related { margin: 9px 0 0; padding-top: 8px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 10.5px; line-height: 1.7; }
.wb-related b { color: var(--ink-2); font-family: var(--serif); font-size: 11.5px; font-weight: 600; }
.wb-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(228,220,205,.75); }
.wb-date { color: #a4a49b; font-size: 9.5px; }
.wb-actions { display: flex; gap: 5px; }
.icon-btn { display: grid; place-items: center; width: 31px; height: 31px; padding: 0; border: 1px solid var(--line); border-radius: 9px; background: transparent; color: var(--ink-2); }
.icon-btn:hover { background: var(--card-soft); color: var(--teal); }
.icon-btn .icon { width: 14px; height: 14px; }
.icon-btn.coral:hover { background: var(--coral-soft); color: var(--coral); }
.empty-state {
  padding: 56px 24px;
  border: 1px dashed var(--line-strong);
  border-radius: 22px;
  background: rgba(255,253,247,.45);
  text-align: center;
}
.empty-mark { display: grid; place-items: center; width: 62px; height: 62px; margin: 0 auto 16px; border-radius: 50%; background: var(--teal-soft); color: var(--teal); }
.empty-mark .icon { width: 27px; height: 27px; }
.empty-state h2 { margin: 0; font-family: var(--serif); font-size: 22px; }
.empty-state p { max-width: 350px; margin: 8px auto 18px; color: var(--muted); font-size: 11.5px; line-height: 1.8; }

/* ---------- progress ---------- */
.overview {
  display: grid; grid-template-columns: 150px 1fr; gap: 26px; align-items: center;
  padding: 25px;
  border: 1px solid var(--line);
  border-radius: 25px;
  background: var(--card);
  box-shadow: var(--shadow-soft);
}
.ring { --p: 0; width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--teal) calc(var(--p) * 1%), var(--paper-deep) 0); position: relative; }
.ring::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--card); }
.ring-inner { position: relative; z-index: 1; text-align: center; }
.ring-value { display: block; font-family: var(--serif); font-size: 30px; line-height: 1; letter-spacing: -.05em; }
.ring-label { display: block; margin-top: 4px; color: var(--muted); font-size: 9.5px; letter-spacing: .1em; }
.overview-copy h2 { margin: 0 0 7px; font-family: var(--serif); font-size: 25px; letter-spacing: -.03em; }
.overview-copy p { margin: 0; color: var(--ink-2); font-size: 11.5px; line-height: 1.8; }
.overview-copy b { color: var(--teal); }
.overview-mini { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 14px; color: var(--muted); font-size: 10.5px; }
.overview-mini b { color: var(--ink); font-family: var(--serif); font-size: 14px; }
.section-block { margin-top: 15px; padding: 22px; border: 1px solid var(--line); border-radius: 22px; background: var(--card); box-shadow: var(--shadow-soft); }
.section-block-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
.section-block h2 { margin: 0; font-family: var(--serif); font-size: 19px; }
.section-block-head span { color: var(--muted); font-size: 10px; }

.group-cell.current .group-sub { color: var(--coral); }
.week-chart { display: flex; align-items: flex-end; gap: 9px; height: 112px; padding-top: 8px; }

/* ---------- settings ---------- */

.switch { position: relative; width: 42px; height: 24px; flex: 0 0 auto; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--paper-deep); border: 1px solid var(--line-strong); transition: .2s ease; }

/* ---------- session ---------- */

.session-top {

  padding: 18px 22px 4px;
  display: flex; align-items: center; gap: 15px;
}
.session-close, .session-undo {
  display: grid; place-items: center; width: 38px; height: 38px; flex: 0 0 auto;

.session-card {

}
.session-card.swapping { transform: translateY(8px); opacity: .35; }
.session-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 19px; border-bottom: 1px solid var(--line); }
.session-tag { display: inline-flex; align-items: center; gap: 7px; color: var(--teal); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.session-tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--coral); }
.session-index { color: var(--muted); font-size: 10px; letter-spacing: .08em; }
.session-word-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-top: 28px; }
.session-word { margin: 0; font-family: var(--serif); font-size: clamp(42px, 8.5vw, 72px); line-height: 1.03; letter-spacing: -.045em; font-weight: 700; overflow-wrap: anywhere; }
.speak-btn { display: grid; place-items: center; width: 43px; height: 43px; flex: 0 0 auto; margin-top: 9px; border: 1px solid var(--line); border-radius: 50%; background: var(--card-soft); color: var(--teal); }
.speak-btn:hover { background: var(--teal-soft); }
.speak-btn .icon { width: 19px; height: 19px; }
.session-phonetic { margin: 7px 0 0; color: var(--muted); font-family: var(--serif); font-size: 17px; line-height: 1.5; overflow-wrap: anywhere; }
.session-meaning { display: none; margin-top: 23px; padding-top: 19px; border-top: 1px solid var(--line); animation: reveal .32s ease both; }
.session-meaning.revealed { display: block; }
@keyframes reveal { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.meaning-line { display: flex; align-items: baseline; gap: 9px; margin: 0 0 8px; color: var(--ink); font-size: 16px; line-height: 1.7; }
.meaning-line:last-child { margin-bottom: 0; }
.pos-tag { display: inline-block; flex: 0 0 auto; min-width: 34px; padding: 2px 6px; border-radius: 5px; background: var(--teal-soft); color: var(--teal-dark); font-family: var(--sans); font-size: 9px; font-weight: 700; text-align: center; letter-spacing: .02em; }
.related-box { margin-top: 15px; padding: 12px 13px; border-radius: 12px; background: var(--card-soft); }
.related-title { margin: 0 0 8px; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
.related-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 7px; margin: 0 0 7px; color: var(--ink-2); font-size: 11.5px; line-height: 1.6; }
.related-row:last-child { margin-bottom: 0; }
.related-row b { color: var(--ink); font-family: var(--serif); font-size: 13px; }
.related-row .related-phon { color: var(--muted); font-family: var(--serif); font-size: 10px; }
.reveal-btn { display: inline-flex; align-items: center; gap: 7px; margin-top: 22px; padding: 0; border: 0; background: transparent; color: var(--teal); font-size: 11.5px; font-weight: 600; }
.reveal-btn::after { content: "↓"; font-size: 13px; transition: transform .2s ease; }
.reveal-btn:hover::after { transform: translateY(2px); }
.ask-block { margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--line); }
.ask-question { margin: 0 0 13px; color: var(--ink-2); font-size: 11px; letter-spacing: .02em; }
.ask-question b { color: var(--ink); }
.answer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
.answer {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px 17px;
  border: 1px solid var(--line-strong);
  border-radius: 16px;
  background: var(--card-soft);
  text-align: left;
  transition: transform .18s ease, border-color .18s ease, background .18s ease;
}
.answer:hover { transform: translateY(-2px); }
.answer strong { display: block; font-size: 14px; font-weight: 600; }
.answer small { display: block; margin-top: 3px; color: var(--muted); font-size: 9.5px; }
.answer .answer-icon { display: grid; place-items: center; width: 26px; height: 26px; flex: 0 0 auto; border-radius: 50%; }
.answer .answer-icon .icon { width: 13px; height: 13px; }
.answer.unknown { border-color: #e5c1b3; background: var(--coral-soft); }
.answer.unknown:hover { border-color: var(--coral); }
.answer.unknown .answer-icon { background: rgba(207,107,79,.14); color: var(--coral); }
.answer.known { border-color: #b9d4cc; background: var(--teal-soft); }

.answer.known .answer-icon { background: rgba(45,125,114,.13); color: var(--teal); }
.answer[disabled] { opacity: .45; pointer-events: none; }
.feedback { display: none; margin-top: 16px; padding: 13px 14px; border-radius: 12px; background: var(--card-soft); animation: reveal .25s ease both; }
.feedback.show { display: block; }
.feedback-text { margin: 0; color: var(--ink-2); font-size: 11.5px; line-height: 1.7; }
.feedback-text b { color: var(--teal); }
.next-btn { display: none; width: 100%; margin-top: 14px; min-height: 46px; border: 0; border-radius: 14px; background: var(--teal); color: #fff; font-size: 12px; font-weight: 700; }
.next-btn.show { display: block; }
.session-hint { margin: 14px 0 0; color: #a8aaa3; font-size: 9.5px; text-align: center; }
.session-hint kbd { padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--card-soft); font-family: var(--sans); font-size: 8.5px; }
.finish-card { width: min(610px, 100%); padding: 44px 36px 34px; border: 1px solid var(--line); border-radius: 30px; background: var(--card); box-shadow: var(--shadow); text-align: center; animation: reveal .4s ease both; }
.finish-mark { display: grid; place-items: center; width: 72px; height: 72px; margin: 0 auto 19px; border-radius: 50%; background: var(--teal-soft); color: var(--teal); }
.finish-mark .icon { width: 32px; height: 32px; }
.finish-card h2 { margin: 0; font-family: var(--serif); font-size: 30px; letter-spacing: -.04em; }
.finish-card p { margin: 10px 0 0; color: var(--muted); font-size: 11.5px; line-height: 1.8; }
.finish-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 24px 0; }
.finish-stat { padding: 14px; border-radius: 14px; background: var(--card-soft); }
.finish-stat b { display: block; font-family: var(--serif); font-size: 27px; line-height: 1; }
.finish-stat span { display: block; margin-top: 5px; color: var(--muted); font-size: 9.5px; }
.finish-actions { display: grid; gap: 8px; }
.finish-actions .btn { width: 100%; }

/* ---------- sheet / toast ---------- */
.sheet-wrap { position: fixed; z-index: 120; inset: 0; display: none; }
.sheet-wrap.open { display: block; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(24,50,74,.35); backdrop-filter: blur(3px); animation: fade .2s ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  position: absolute; left: 50%; bottom: 0;
  transform: translateX(-50%);
  width: min(720px, 100%);
  max-height: 84vh;
  display: flex; flex-direction: column;
  border-radius: 25px 25px 0 0;
  background: var(--card);
  box-shadow: 0 -20px 60px rgba(24,50,74,.18);
  animation: sheetUp .3s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes sheetUp { from { transform: translate(-50%, 40px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.sheet-grip { width: 38px; height: 4px; margin: 9px auto 0; border-radius: 99px; background: var(--line-strong); }
.sheet-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 15px 22px 13px; border-bottom: 1px solid var(--line); }
.sheet-top h2 { margin: 0; font-family: var(--serif); font-size: 22px; }
.sheet-top p { margin: 4px 0 0; color: var(--muted); font-size: 10.5px; }
.sheet-close { display: grid; place-items: center; width: 33px; height: 33px; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink-2); }
.sheet-body { overflow-y: auto; padding: 16px 22px 28px; }
.sheet-search { margin-bottom: 13px; }
.sheet-word { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 11px 0; border-bottom: 1px solid rgba(228,220,205,.75); }
.sheet-word:last-child { border-bottom: 0; }
.sheet-word-main { min-width: 0; }
.sheet-word-name { margin: 0; font-family: var(--serif); font-size: 16px; font-weight: 700; }
.sheet-word-name span { margin-left: 6px; color: var(--muted); font-family: var(--sans); font-size: 8.5px; font-weight: 500; }
.sheet-word-phon { margin: 2px 0 0; color: var(--muted); font-family: var(--serif); font-size: 10.5px; }
.sheet-word-def { margin: 4px 0 0; color: var(--ink-2); font-size: 10.5px; line-height: 1.65; }
.sheet-word .btn { flex: 0 0 auto; }
.toast {
  position: fixed; z-index: 200; left: 50%; top: 20px;
  transform: translate(-50%, -10px);
  max-width: min(420px, calc(100% - 32px));
  padding: 10px 15px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--ink);
  color: #fff;
  font-size: 11px;
  line-height: 1.5;
  box-shadow: 0 12px 30px rgba(24,50,74,.22);
  opacity: 0; pointer-events: none;
  transition: opacity .22s ease, transform .22s ease;
}

@media (prefers-reduced-motion: reduce) {

}

.hero-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.side-list b { color: var(--ink); font-family: var(--serif); font-size: 13px; font-weight: 600; }
.week-stack { height: 78px; flex: 0 0 78px; }

.wb-summary .btn { margin-left: auto; }
.word-phonetic { color: #73827f; }

@media (max-width: 620px) {
  .page-head .head-count { display: none; }
}

/* 知识点卡片：长标题与多行解析 */
.session-word.is-long { font-size: clamp(26px, 5.4vw, 42px); line-height: 1.2; letter-spacing: -.02em; }

.wb-word.is-long { font-size: 18px; line-height: 1.35; }</style>

ction":"第1章","marked":false},{"id":"C01-06","list":1,"num":6,"word":"黑格尔：美是理念的感性显现","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"黑格尔美学思想的核心是“美就是理念的感性显现”，同样把艺术的本质归结于“理念”或“绝对精神”。\n“理念”是内容，“感性显现”是表现形式，二者是统一的；艺术离不开内容也离不开形式，离不开理性也离不开感性。\n在艺术作品中，人们总是可以从有限的感性形象认识到无限的普遍真理。\n【客观题】德国古典美学的集大成者：黑格尔。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-07","list":1,"num":7,"word":"刘勰：文以载道","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"南北朝时期，刘勰在《文心雕龙》中认为文是道的表现，道是文的本源。\n“道”是自然之道与圣人之道的统一。\n【记忆】有个叫文心的人，雕龙的时候划到了手，流血了。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-08","list":1,"num":8,"word":"朱熹：文以载道","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"在朱熹看来，“文”只不过是载“道”的简单工具，即“犹车之载物”罢了。\n“道”不仅是文艺的本质，而且是文艺的内容，这种“文以载道说”同样把艺术的本质归结为某种客观精神。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-09","list":1,"num":9,"word":"主观精神说","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"认为艺术是“自我意识的表现”，是“生命本体的冲动”。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-10","list":1,"num":10,"word":"康德：艺术是天才的创造物","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"德国古典美学的开山鼻祖康德，把美学体系建立在主观唯心主义基础之上。\n他认为艺术纯粹是作家、艺术家们的天才创造物，这种“自由的艺术”丝毫不夹杂任何利害关系，不涉及任何目的。\n康德把自由看作艺术的精髓，强调艺术创作中天才的想象力与独创性，可以使艺术达到美的境界。\n【客观题】德国古典美学的开山鼻祖：康德。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-11","list":1,"num":11,"word":"对康德美学思想的评价","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"康德看到并强调了创作主体的重要性，并且把自由活动看作艺术与审美活动的精髓。\n但是，康德关于美与艺术的论述中充满了一系列矛盾。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-12","list":1,"num":12,"word":"尼采：日神与酒神","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"哲学家尼采认为，人的主观意志是世上万事万物的主宰，也是推动历史发展的根本动因。\n他在第一部著作《悲剧的诞生》中，把日神冲动和酒神冲动看作艺术的两种根源，把“梦”和“醉”看作审美的两种基本状态。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-13","list":1,"num":13,"word":"中国的主观精神说","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"在我国古代文艺理论批评史上，南北朝是文学日益繁荣的时期，文学艺术抒情言志的特点得到重视。\n南北朝时期有的文艺评论家把“情志”归结为作家、艺术家个人的心灵和欲念的表现，根本否认文艺与社会现实的联系。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-14","list":1,"num":14,"word":"严羽“妙悟说”与袁宏道“性灵说”","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"主观精神说的代表学说：宋代严羽的“妙悟说”和明代袁宏道的“性灵说”。\n【记忆】谐音：袁宏道——“圆红到”（一轮圆圆的红日升起）；严羽——言语，妙悟——喵呜；性灵——“兴铃”（兴致来时摇响的铃铛）。\n联想：宋代爱猫，流行的语言是喵呜；明天当一轮圆圆的红日升起（圆红到），有位叫袁宏道的文人，兴致大发，拿起身边的铃铛摇响（兴铃）。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-15","list":1,"num":15,"word":"模仿说 / 再现说","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"这种观点认为艺术是对现实的“模仿”，发展到后来，更认为艺术是“社会生活的再现”。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-16","list":1,"num":16,"word":"亚里士多德：模仿说","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"他认为艺术是对现实的“模仿”。首先肯定了现实世界的真实性，从而肯定了“模仿”现实的艺术的真实性。\n亚里士多德进一步认为，艺术的“模仿”功能，使得艺术甚至比它所“模仿”的现实世界更加真实。\n艺术所“模仿”的不只是现实世界的外形或现象，而且是现实世界内在的本质和规律。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-17","list":1,"num":17,"word":"亚里士多德的历史地位","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"古希腊的亚里士多德在人类思想史上第一个以独立体系来阐明美学概念。\n他的“模仿说”对艺术实践产生了很大影响，从中世纪、文艺复兴直到十七八世纪，一直为欧洲许多美学家、艺术家所信奉。\n朱光潜先生曾讲到，亚里士多德的模仿论曾经在西方“雄霸了两千余年”。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-18","list":1,"num":18,"word":"车尔尼雪夫斯基：美是生活","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"他从“美是生活”的论断出发，认为艺术是对生活的“再现”，是对客观现实的“再现”。\n基本论点是艺术反映现实，但他所理解的现实生活，不仅包括客观存在的自然界，而且包括人们的社会生活，从而更加具有深刻的社会内容。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-19","list":1,"num":19,"word":"对车尔尼雪夫斯基的评价","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"进一步肯定了美离不开人的理想，肯定了现实生活是艺术的源泉；艺术家在说明生活和对生活作判断时，又必须发挥自己的主观能动性。\n机械唯物论的缺陷，使他在美学和艺术思想中充满了矛盾，尤其是过分抬高现实美、贬低艺术美。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-20","list":1,"num":20,"word":"艺术生产理论","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"马克思明确提出了“艺术生产”的概念，将“艺术”与“生产”联系起来考虑，从生产实践活动出发来考察艺术问题，把艺术看作是一种特殊的精神生产。\n这在美学史和艺术史上是一个前所未有的创举。\n【大题 ★★★，也可问：“艺术生产理论”的启示】"}],"related":[],"section":"第1章","marked":false},{"id":"C01-21","list":1,"num":21,"word":"物质生产与精神生产","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"人类社会生活从总体上可以划分为物质生活与精神生活两大组成部分。\n为了满足这两种生活所分别进行的生产活动，就叫作物质生产与精神生产。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-22","list":1,"num":22,"word":"艺术生产","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"艺术生产作为一种特殊的精神生产，是为了满足人们的审美需要，它的成果构成了人类光辉灿烂的艺术文化宝库。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-23","list":1,"num":23,"word":"艺术生产理论的意义（总）","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"“艺术生产”理论，对于揭示艺术的起源和艺术的发展，揭示艺术的性质和艺术的特点，以及揭示艺术创作、艺术作品、艺术鉴赏这样一个完整的艺术系统的奥秘，都提供了科学的理论依据。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-24","list":1,"num":24,"word":"第一，揭示艺术的起源、性质和特点","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"从起源看，艺术离不开人类的社会实践活动。\n从性质和特点看，一方面艺术是对客观社会生活的反映，另一方面艺术又凝聚着艺术家主观的审美理想和情感愿望。\n因而，艺术的审美价值必然是主客体的有机统一。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-25","list":1,"num":25,"word":"艺术生产的突出特点","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"把创作主体（艺术家）强烈的主观因素渗透到整个艺术创作过程，并融会到艺术作品之中。\n艺术生产固然离不开客观现实，社会现实生活是艺术创作的源泉和基础，但艺术生产同样不能离开主观创造。\n艺术必然是心与物的结合、主观与客观的结合、再现与表现的结合。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-26","list":1,"num":26,"word":"艺术的本质","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"艺术是实践基础上审美主客体的统一。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-27","list":1,"num":27,"word":"第二，两种生产的“不平衡关系”","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"艺术生产作为一种特殊的精神生产，又具有相对的独立性。\n在社会发展历史的某些阶段上，艺术的繁荣与社会物质生产的发展呈现出某种不平衡现象。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-28","list":1,"num":28,"word":"不平衡与“受制约”并不矛盾","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"这种生产不平衡的现象，与艺术生产最终必然受物质生产制约并不矛盾。\n前者是个别、特殊的现象，后者是一般、普遍的规律。从最根本的原因上讲，两种生产不平衡现象也有其深刻的经济和政治根源。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-29","list":1,"num":29,"word":"19 世纪俄国艺术代表","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"文学：普希金、陀思妥耶夫斯基、列夫·托尔斯泰，以及别林斯基、车尔尼雪夫斯基、杜勃罗留波夫等文艺评论家。\n戏剧：果戈理、契诃夫。\n音乐：柴可夫斯基、穆索尔斯基、里姆斯基-科萨柯夫为代表的“强力集团”。\n美术：列宾、苏里科夫、列维坦为代表的“巡回展览画派”。\n舞蹈：《天鹅湖》《睡美人》等古典芭蕾舞剧。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-30","list":1,"num":30,"word":"第三，揭示艺术系统的奥秘","phonetic":"第一节 · 艺术的本质","meanings":[{"pos":"","def":"艺术生产理论把艺术创作——艺术作品——艺术鉴赏（艺术活动的全部过程）这三个相互联系的环节，作为一个完整的系统来研究。\n揭示出艺术作为一种特殊的社会意识形态和特殊的精神生产所具有的本质特征。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-31","list":1,"num":31,"word":"艺术的特征（总）","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"艺术必然具有形象性、主体性、审美性等基本特征。\n艺术的本质与艺术的特征二者密不可分：本质是特征的内在规律，特征是本质的外在表现。\n【大题 ★★★★★】"}],"related":[],"section":"第1章","marked":false},{"id":"C01-32","list":1,"num":32,"word":"形象性","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"艺术形象是艺术反映生活的特殊形式。\n哲学、社会科学总是以抽象的、概念的形式来反映客观世界，艺术则是以具体的、生动感人的艺术形象来反映社会生活和表现艺术家的思想情感。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-33","list":1,"num":33,"word":"形象性之一：客观与主观的统一","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"任何艺术作品的形象都是具体的、感性的，也都体现着一定的思想感情，都是客观因素与主观因素的有机统一。\n对于不同的艺术门类来说，这种统一具有各自不同的特点。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-34","list":1,"num":34,"word":"《蒙娜·丽莎》","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"文艺复兴期画家达·芬奇的作品。画中人是佛罗伦萨一个皮货商的妻子，当时她刚刚丧子，心情很不愉快。\n达·芬奇作画时特地邀请乐师在旁边弹奏优美的乐曲，使她保持愉悦的心情，以便从容捕捉表现在面部的内在感情。\n画中含而不露的笑容显得深不可测，被称为“神秘的微笑”。传说画家整整用了四年才完成这幅肖像画。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-35","list":1,"num":35,"word":"《韩熙载夜宴图》","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"五代南唐画家顾闳中的作品。韩熙载为逃避政治上的不测，故意以放荡颓废的生活掩盖自己。\n南唐后主李煜想任他为宰相，便派顾闳中潜入韩家窥探，用“心识默记”的方法画下这幅画。\n长卷以“听乐”“赏舞”“休息”“清吹”“散宴”五个连续画面描绘家宴；排场豪华、气氛热烈，韩熙载却始终沉思压抑、忧郁寡欢。\n【记忆】韩熙载在晚宴上打麻将，左顾右盼找红中（顾闳中）。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-36","list":1,"num":36,"word":"《图画展览会》","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"俄国作曲家穆索尔斯基参观好友加尔特曼的遗作展览会后，触景生情，于 1874 年写下这部钢琴套曲。\n套曲由十首小曲组成，每首小曲以一幅图画为依据，并运用“漫步”主题将它们连接在一起。\n【记忆】闭上眼睛（目锁——穆索）用耳朵开车的司机（尔斯基），必定听力很好，所以是作曲家。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-37","list":1,"num":37,"word":"形象性之二：内容与形式的统一","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"任何艺术形象都离不开内容，也离不开形式，二者是有机统一的。\n艺术欣赏中，直接作用于欣赏者感官的是艺术形式，但艺术形式之所以能感动人、影响人，是由于这种形式生动鲜明地体现出深刻的思想内容。\n优秀的作品必然具有深刻的思想内涵和完美的艺术形式。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-38","list":1,"num":38,"word":"《巴尔扎克像》","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"罗丹受法国文学会委托为巴尔扎克创作雕像。他选择巴尔扎克习惯在深夜写作时穿着睡袍漫步构思来作为外形轮廓。\n雕像摒弃一切细枝末节，手和脚都被掩盖在长袍之中，使观众注意力集中到头部，尤其是那双炯炯有神的眼睛。\n成功之处在于内容和形式的完美统一，真正在形似的基础上达到了神似。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-39","list":1,"num":39,"word":"以形写神 · 气韵生动","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"东晋时期顾恺之就提出绘画要“以形写神”。\n南齐谢赫论绘画六法时，其中第一条就是“气韵生动”。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-40","list":1,"num":40,"word":"形象性之三：个性与共性的统一","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"凡是成功的艺术形象，无不具有鲜明而独特的个性，同时又具有丰富而广泛的社会概括性。\n共性存在于个性之中，个性总是共性的不同方式的表现。\n这种统一最集中地体现为艺术典型。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-41","list":1,"num":41,"word":"艺术典型","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"艺术家运用典型化的方法，创造出来的具有栩栩如生的鲜明个性并体现出普遍意义的典型形象。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-42","list":1,"num":42,"word":"金圣叹评《水浒》","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"清代金圣叹赞叹《水浒传》中的人物形象：“《水浒》所叙，一百八人，人有其性情，人有其气质，人有其形状，人有其声口。”"}],"related":[],"section":"第1章","marked":false},{"id":"C01-43","list":1,"num":43,"word":"阿Q","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"鲁迅先生塑造的阿Q，不仅具有活生生的个性、极为深刻的性格内涵，而且从一个侧面反映了那个特定时代，并概括出全民族的国民性弱点。\n阿Q是旧中国农村一个贫苦落后而又不觉悟的农民的艺术典型：既有质朴憨厚的一面，又有落后、麻木的一面。\n最突出的性格特征就是“精神胜利法”——明明遭遇屈辱和不幸，却习惯于自我欺骗、自我麻醉。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-44","list":1,"num":44,"word":"主体性","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"艺术绝不是单纯的“模仿”或“再现”，而是在艺术生产活动的全过程融入了创作主体乃至欣赏主体的思想情感，体现出十分鲜明的创造性和创新性。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-45","list":1,"num":45,"word":"创作的主体性","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"社会生活是艺术创作的源泉，艺术家往往从生活实践中获得创作动机和灵感；但艺术创作又是一种创造性的劳动，艺术家作为创作主体对艺术创作起着决定性的作用。\n艺术创作的主体性，集中表现为艺术家的创作活动具有能动性和独创性。\n每件优秀作品都凝聚着艺术家独特的审美体验和审美情感，带有个人主观色彩与艺术追求，体现出鲜明的创作风格和艺术个性。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-46","list":1,"num":46,"word":"韩幹画马","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"唐玄宗曾命韩幹跟随宫中另一位画马名家学习，韩幹没有应允，回答：“臣自有师，陛下内厩之马，皆臣之师也。”\n韩幹画的马匹匹肥大，以至于诗人杜甫批评他画马是“画肉不画骨”。\n另有元代赵孟頫《秋郊饮马图》可作对照。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-47","list":1,"num":47,"word":"作品的主体性","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"艺术作品作为艺术家创造性劳动的产物，必然打上艺术家作为创作主体的鲜明烙印。\n任何优秀的艺术作品，都应当是独一无二、不可重复的，具有艺术的独创性。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-48","list":1,"num":48,"word":"朱自清与俞平伯《桨声灯影里的秦淮河》","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"两位散文家 20 世纪 20 年代同游秦淮河，之后各自写了一篇同名散文。\n两篇取材范围相同、时间地点相同、命题也完全相同，但艺术特色各异：朱自清朴实淳厚、清新委婉；俞平伯细腻感人、情景交融。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-49","list":1,"num":49,"word":"欣赏的主体性","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"由于欣赏者的生活经验与性格气质不同、审美能力和艺术素养不同，在审美感受上形成鲜明的个性差异，使艺术欣赏打上欣赏主体的烙印。\n这种主体性甚至可以使欣赏者实际获得的感受与艺术家原来的创作意图之间产生相当大的差距。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-50","list":1,"num":50,"word":"“一千个读者，一千个哈姆雷特”","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"鲁迅先生讲过，同一部《红楼梦》，“经学家看见《易》，道学家看见淫，才子看见缠绵，革命家看见排满，流言家看见宫闱秘事”。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-51","list":1,"num":51,"word":"音乐欣赏的差异","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"柴可夫斯基《f 小调第四交响曲》。\n贝多芬《c 小调第五交响曲》（《命运交响曲》），贝多芬自释主题为“命运在敲门”；法国浪漫派音乐大师柏辽兹却理解为“这简直就像奥赛罗的愤怒……是受了折磨之后暴怒之下的奥赛罗的形象”。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-52","list":1,"num":52,"word":"主体性贯穿全过程","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"主体性贯穿于艺术生产活动的全过程，包括艺术创作、艺术作品和艺术欣赏，意味着创造性与创新性。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-53","list":1,"num":53,"word":"审美性：艺术品的两个条件","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"从艺术生产的角度来看，任何艺术作品都必须具有以下两个条件：\n其一，它必须是人类艺术生产的产品；\n其二，它必须具有审美价值，即审美性。\n正是这两点，使艺术品和其他一切非艺术品区分开来。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-54","list":1,"num":54,"word":"审美性与美的形态","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"作为一种特殊的精神生产，艺术生产的目的是为了满足人类的审美需要。\n美的形态分为自然美与艺术美，二者的区别在于艺术美直接凝聚着人类劳动和智慧的结晶。\n并不是人类一切劳动和智慧的创造物都可以称为艺术品，只有能给人以精神愉悦、具有审美价值的人类创造物才能称为艺术品。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-55","list":1,"num":55,"word":"审美性是审美意识的集中体现","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"艺术美作为现实的反映形态，是艺术家创造性劳动的产物，比现实生活中的美更加集中、更加典型，能够更充分地满足人的审美需要。\n艺术又是人类审美意识物质形态化的表现：任何艺术都有自己特殊的物质材料和艺术语言，这些材料和语言“物化”为可供他人欣赏的作品，艺术因此成为传达和交流审美意识的手段。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-56","list":1,"num":56,"word":"审美性是真、善、美的结晶","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"艺术美之所以高于现实美，是由于艺术家通过创造性劳动，把现实生活中的真、善、美凝聚到了艺术作品中。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-57","list":1,"num":57,"word":"艺术中的“真”与“善”","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"“真”并不等于生活真实，而是要通过艺术家的提炼和加工，使生活真实升华为艺术真实，也就是化“真”为“美”。\n“善”并不是道德说教，同样要通过精心创作，使艺术家的人生态度和道德评价渗透到作品之中，也就是化“善”为“美”，体现为生动感人的艺术形象。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-58","list":1,"num":58,"word":"生活中的“丑”变为艺术美","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"生活中的“丑”经过艺术家的能动创造变成了艺术美。\n事物本身“丑”的性质并没有变，但是作为艺术形象它已经有了审美意义。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-59","list":1,"num":59,"word":"丑转化为艺术美的例证","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"北宋张择端《清明上河图》。\n莫里哀《吝啬鬼》中的阿巴贡、《伪君子》中的达尔丢夫。\n莎士比亚《威尼斯商人》中贪得无厌的夏洛克、《麦克白》中的麦克白夫人。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-60","list":1,"num":60,"word":"审美性是内容美与形式美的统一","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"艺术美注重形式，但并不脱离内容，它是二者的有机统一。\n每个艺术门类在运用形式美的规则方面，都有着特殊的经验和规律。\n形式美的法则并非凝固不变，艺术家不断探索、寻找美的形式。\n艺术的形式美不能脱离内容美，因为形式美在于它生动鲜明地体现出内容。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-61","list":1,"num":61,"word":"谢赫“绘画六法”","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"南齐画家谢赫在《古画品录》中提出“绘画六法”，“气韵生动”是对绘画作品总的要求，是对我国古代绘画实践的系统总结。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-62","list":1,"num":62,"word":"黄金分割与帕提农神庙","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"自古希腊罗马时代开始，人们就将毕达哥拉斯学派的“黄金分割”理论奉为建筑艺术形式美的法则，强调建筑物各部分间的比例。\n2400 年前的古希腊帕提农神庙造型端庄、比例匀称，被视为古希腊神庙的典范；它既是为保护神雅典娜建造的，也是平民百姓欢庆节日的庙宇，是雅典奴隶主民主制度下的产物。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-63","list":1,"num":63,"word":"悉尼歌剧院","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"1973 年建成于澳大利亚悉尼市的海湾上。设计师是丹麦建筑家约翰·伍重，他强调现代建筑应当从属于自然环境，崇尚“有机建筑”理论。\n作为环境艺术或有机建筑的典型作品，它与周围的海水融为一体，标志着现代工业社会中建筑技术和建筑材料已经达到了很高的水平。"}],"related":[],"section":"第1章","marked":false},{"id":"C01-64","list":1,"num":64,"word":"顾恺之与王维","phonetic":"第二节 · 艺术的特征","meanings":[{"pos":"","def":"顾恺之的“以形写神”，要求画家抓住人物的典型特征，表现人物的内在精神。\n王维更进一步认为“凡画山水，意在笔先”，强调画山水草木同画人物一样，也必须显示出对象的内在精神来。"}],"related":[],"section":"第1章","marked":false},{"id":"C02-01","list":2,"num":1,"word":"艺术起源五种观点：模仿游戏表现巫术劳动","phonetic":"第一节 中外艺术史上关于艺术起源的五种观点","meanings":[{"pos":"","def":"【大题】★★★★★ 中外艺术史上关于艺术起源的五种观点：模仿说、游戏说、表现说、巫术说、劳动说。\n第二节另补第六种看法——多元决定论。\n记忆口诀：模、游、表、巫、劳，最后多元来收尾。\n答题套路：定义→代表人物及主张→合理之处→不足之处。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-02","list":2,"num":2,"word":"模仿说：艺术起源于对自然和现实的模仿","phonetic":"一、模仿说","meanings":[{"pos":"","def":"定义：该学说认为艺术起源于对自然界和社会现实的模仿。\n地位：这是艺术起源问题的理论中最古老的一种说法。\n关键词辨析：模仿说讲“向外学”，表现说讲“向内抒”，不要混。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-03","list":2,"num":3,"word":"德谟克利特：从蜘蛛学织布、从燕子学造房","phonetic":"一、模仿说","meanings":[{"pos":"","def":"代表人物德谟克利特认为，艺术是对自然的“模仿”。\n他以动物为师举例：“从蜘蛛我们学会了织布和缝补，从燕子学会了造房子……”\n记忆联想：蜘蛛结网—织布缝补；燕子衔泥—造房子。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-04","list":2,"num":4,"word":"亚里士多德：模仿是本能，艺术仅有三点差别","phonetic":"一、模仿说","meanings":[{"pos":"","def":"亚里士多德认为模仿是人的本能，所有艺术都起源于对自然界和社会现实的模仿。\n三点差别：模仿所用的媒介不同、所取的对象不同、所用的方式不同。\n朱光潜曾指出：亚里士多德的“模仿论”在欧洲“雄霸了两千余年”。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-05","list":2,"num":5,"word":"模仿说的合理之处与两点不足","phonetic":"一、模仿说","meanings":[{"pos":"","def":"合理之处：原始艺术中“模仿”占有相当大的比例；该说法肯定了艺术来源于客观的自然界和社会现实，包含朴素唯物主义观点，具有进步的和合理的内容。\n不足一：只触及事物表面，未揭示事物本质；对原始艺术来说，“模仿”更多是手段而不是目的。\n不足二：把“模仿”归结于人的本性，没有找到模仿背后的创作意图，未能说明艺术产生的根本原因。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-06","list":2,"num":6,"word":"西班牙阿尔塔米拉洞穴牛画距今两万年","phonetic":"一、模仿说","meanings":[{"pos":"","def":"【客观题】西班牙阿尔塔米拉洞穴的牛画，距今2万年。\n它是模仿说最常举的史前艺术例证：洞壁上的动物形象逼真，正是对自然对象的模仿。\n记忆对应：阿尔塔米拉—牛画—2万年。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-07","list":2,"num":7,"word":"《管子》用宫商角徵羽五声模仿动物之声","phonetic":"一、模仿说","meanings":[{"pos":"","def":"【客观题】《管子》中讲道：音乐是模仿动物的声音而来的。\n“宫商角徵羽”五声中：“凡听羽，如鸟在树；凡听宫，如牛鸣卵中；凡听商，如离群羊。”\n记忆：五声各配一种动物之声，是模仿说在中国古代文献中的证据。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-08","list":2,"num":8,"word":"游戏说又称席勒—斯宾塞理论","phonetic":"二、游戏说","meanings":[{"pos":"","def":"定义：认为艺术和审美活动起源于人类所具有的游戏本能。\n两个表现方面：一是人类具有过剩的精力；二是人将这种过剩精力运用到没有实际效用、没有功利目的的活动中，体现为一种自由的“游戏”。\n别称：席勒—斯宾塞理论。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-09","list":2,"num":9,"word":"席勒《美育书简》：感性理性靠游戏冲动协调","phonetic":"二、游戏说","meanings":[{"pos":"","def":"席勒在《美育书简》中指出：人的“感性冲动”和“理性冲动”，必须通过“游戏冲动”才能有机地协调起来。\n他进一步认为，这种“游戏”本能或冲动就是艺术创作的动机：在这种无功利、无目的的自由活动中，人的过剩精力得到发泄，从而获得快乐，亦即美的愉快的享受。\n记忆链：感性＋理性→游戏冲动→艺术创作动机。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-10","list":2,"num":10,"word":"斯宾塞：艺术和游戏是过剩精力的发泄","phonetic":"二、游戏说","meanings":[{"pos":"","def":"斯宾塞进一步发挥和补充了席勒的说法，认为艺术和游戏就是人的过剩精力的发泄。\n“游戏”的主要特征是没有实际的功利目的：它不是维持生活所必需的活动过程，而是为了消耗机体中积聚的过剩精力，并在自由地发泄这种过剩精力时获得快感和美感。\n分工记忆：席勒讲冲动，斯宾塞讲发泄。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-11","list":2,"num":11,"word":"谷鲁斯“内模仿说”：游戏是为将来生活做准备","phonetic":"二、游戏说","meanings":[{"pos":"","def":"谷鲁斯提出“内模仿说”。\n他认为“游戏”并不是完全没有实际的功利目的，而是在轻松愉快的游戏活动中，不知不觉地在为将来的实际生活做准备或做练习。\n这一说法修正了游戏说“完全无功利”的偏向。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-12","list":2,"num":12,"word":"游戏说的合理之处与两点不足","phonetic":"二、游戏说","meanings":[{"pos":"","def":"合理一：肯定了人们只有在满足衣、食、住、行等基本物质生活需要的条件下，才可能有过剩的精力来从事“游戏”，即艺术活动和审美活动。\n合理二：将艺术和“游戏”联系在一起，某种程度上揭示了艺术的部分特殊性——二者主要都是为了满足人们的精神需要，都是超功利的。\n不足一：仅仅从生物学或心理学角度出发，仍未揭示艺术产生的最终原因。\n不足二：脱离了人类的社会实践，仍不能揭开艺术诞生的真正奥秘。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-13","list":2,"num":13,"word":"表现说：强调艺术应当“表现自我”","phonetic":"三、表现说","meanings":[{"pos":"","def":"定义：该学说强调艺术应当“表现自我”。\n历史：这种说法在东、西方都有着悠久的历史；19世纪后期以来在西方文艺界具有较大影响，甚至可说是西方现代主义文艺思潮的主要理论基础。\n关键词：表现自我、情感。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-14","list":2,"num":14,"word":"克罗齐：直觉即表现，一切艺术皆情感表现","phonetic":"三、表现说","meanings":[{"pos":"","def":"意大利美学家克罗齐系统地以理论方式提出表现说。\n其美学思想的核心是“直觉即表现”。\n在他看来，一切艺术无非都是情感的表现而已。\n记忆：克罗齐—直觉即表现。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-15","list":2,"num":15,"word":"科林伍德《艺术原理》：真正的艺术表现情感","phonetic":"三、表现说","meanings":[{"pos":"","def":"科林伍德在《艺术原理》中认为：只有表现情感的艺术才是所谓“真正的艺术”。\n艺术就是艺术家的主观想象和情感的表现。\n记忆：书名《艺术原理》—科林伍德—表现情感。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-16","list":2,"num":16,"word":"列夫·托尔斯泰：艺术起源于传达感情的需要","phonetic":"三、表现说","meanings":[{"pos":"","def":"俄国著名作家列夫·托尔斯泰认为，艺术起源于传达感情的需要。\n注意“传达”二字：情感不仅要表现，还要传达给别人，这是托尔斯泰与克罗齐的细微差别。\n记忆：托尔斯泰—传达感情。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-17","list":2,"num":17,"word":"苏珊·朗格：艺术是人类情感的符号形式","phonetic":"三、表现说","meanings":[{"pos":"","def":"美国当代美学家苏珊·朗格从符号论美学出发，认为艺术是人类情感的符号形式的创造。\n艺术活动的实质，就在于创造表现人类情感的符号形式。\n记忆：符号论美学＋情感符号＝苏珊·朗格。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-18","list":2,"num":18,"word":"《毛诗序》：情动于中而形于言","phonetic":"三、表现说","meanings":[{"pos":"","def":"汉代《毛诗序》中讲到：“情动于中而形于言，言之不足故嗟叹之，嗟叹之不足故永歌之，永歌之不足，不知手之舞之，足之蹈之也。”\n这段话说明诗、歌、舞同出于情感表现的需要，是表现说在中国古代文论中的依据。\n记忆链：情—言—嗟叹—永歌—手舞足蹈。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-19","list":2,"num":19,"word":"表现说的合理之处与根本缺陷","phonetic":"三、表现说","meanings":[{"pos":"","def":"合理之处：艺术确实要表现情感，艺术家确实是通过自己的作品向他人、向社会表现自己的思想和情感。\n不足之处：把艺术的起源归结为“表现”，脱离开人类的社会实践，脱离原始社会生产力低下的实际情况，仍然是把现象当作本质、把结果当作原因，同样不能科学地阐明艺术的起源问题。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-20","list":2,"num":20,"word":"巫术说：20世纪西方影响最大的起源理论","phonetic":"四、巫术说","meanings":[{"pos":"","def":"定义：该学说认为艺术起源于“巫术”。\n地位：20世纪以来，“巫术说”在西方学术界越来越受到欢迎，至今仍然占据优势，成为西方在艺术起源问题上影响最大的一种理论。\n关键词：万物有灵、交感巫术。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-21","list":2,"num":21,"word":"爱德华·泰勒《原始文化》最早提出巫术说","phonetic":"四、巫术说","meanings":[{"pos":"","def":"英国著名人类学家爱德华·泰勒在《原始文化》一书中，最早提出艺术起源于“巫术”的理论主张。\n他认为原始人思维最主要的特点是“万物有灵”。\n记忆：泰勒—《原始文化》—万物有灵。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-22","list":2,"num":22,"word":"弗雷泽《金枝》：一切风俗源于交感巫术","phonetic":"四、巫术说","meanings":[{"pos":"","def":"弗雷泽在名著《金枝》一书中，更认为原始部落的一切风俗、仪式和信仰，都起源于交感巫术。\n对照记忆：泰勒讲“万物有灵”，弗雷泽讲“交感巫术”，两人是巫术说的代表。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-23","list":2,"num":23,"word":"巫术说的合理之处与不够准确之处","phonetic":"四、巫术说","meanings":[{"pos":"","def":"合理之处：艺术的产生最初确实是与巫术有密切联系的，这些原始的艺术活动具有明显的巫术动机或巫术目的。\n不足之处：艺术起源于“巫术”的理论又并不十分准确，因为原始时代的巫术活动是直接和当时原始人类的生产劳动密切联系在一起的；这些原始艺术活动归根结底还是离不开人类的实践活动。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-24","list":2,"num":24,"word":"我国现存最早的岩画：将军崖岩画","phonetic":"四、巫术说","meanings":[{"pos":"","def":"【客观题】我国现存最早的岩画，是江苏省连云港市郊锦屏山的将军崖岩画。\n年代：属于新石器时期，距今已有三四千年历史。\n内容：人面、兽面、农作物以及各种符号；近十个人面像中，基本上都有一条线向下通到禾苗、谷穗等农作物图案上，中间杂以许多似为计数的圆点符号。\n意义：反映出我国古代先民对土地的崇拜和依赖。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-25","list":2,"num":25,"word":"劳动说：艺术起源于生产劳动","phonetic":"五、劳动说","meanings":[{"pos":"","def":"定义：该学说认为艺术起源于生产劳动。\n地位：该学说在我国文艺理论界占据主导地位；自19世纪末叶以来，在欧洲大陆广为流传。\n记忆：五种观点中，劳动说是我国教材立场上最受重视的一种。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-26","list":2,"num":26,"word":"普列汉诺夫《没有地址的信》论艺术源于劳动","phonetic":"五、劳动说","meanings":[{"pos":"","def":"俄国普列汉诺夫在专著《没有地址的信》中，系统地论述了艺术起源及其发展问题，并且得出了艺术发生于“劳动”的观点。\n记忆：普列汉诺夫—《没有地址的信》—艺术发生于劳动。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-27","list":2,"num":27,"word":"恩格斯：劳动创造了人本身，也创造艺术前提","phonetic":"五、劳动说","meanings":[{"pos":"","def":"恩格斯认为：正是由于劳动，才使人从自然界分离出来，形成了与动物不同的生存方式；物质生产劳动是人类最基本的实践活动，劳动创造了人本身。\n劳动创造了人，也为艺术的产生提供了前提。劳动中工具的制造有特殊意义：它的出现标志着从猿到人过渡阶段的结束，也标志着人类文化的起源。\n在生产劳动实践中，人类各种感觉感官与感觉能力不断发达，逐渐形成包括审美心理结构在内的文化心理结构。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-28","list":2,"num":28,"word":"劳动说的根本原因与“多因”警示","phonetic":"五、劳动说","meanings":[{"pos":"","def":"合理之处：从艺术发生学的观点来看，生产劳动显然是艺术起源的根本原因。\n不足一：艺术的产生不能简单地完全归结为劳动；从劳动到艺术的诞生，是一个相当漫长的历史阶段，最后才诞生了纯粹审美意义上的艺术。\n不足二：艺术起源是一个十分复杂的问题，它很可能是多因的而并非单因的，是多元的而不是单一的。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-29","list":2,"num":29,"word":"山东大汶口出土的新石器时代晚期玉斧","phonetic":"五、劳动说","meanings":[{"pos":"","def":"【客观题】新石器时代晚期遗物：山东大汶口出土的玉斧。\n考法：多作客观题中的器物与时代对应题，注意“大汶口—玉斧—新石器时代晚期”三者的对应关系，不要与其他遗址器物串位。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-30","list":2,"num":30,"word":"多元决定论：艺术由多种因素共同促成","phonetic":"六、多元决定论","meanings":[{"pos":"","def":"定义：在艺术诞生的最初阶段，艺术可能本来就是由多种多样的因素促成的。\n因此在追溯它得以产生的原因时，不能不带有一种多元论的倾向。\n这一说法即艺术起源的第六种看法。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-31","list":2,"num":31,"word":"结构主义学者阿尔都塞提出“多元决定论”","phonetic":"六、多元决定论","meanings":[{"pos":"","def":"法国著名结构主义学者阿尔都塞提出了“多元决定论”。\n他认为：任何文化现象的产生，都有多种多样的复杂原因，而不是由一个简单原因造成的。\n记忆：阿尔都塞—结构主义—多元决定。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-32","list":2,"num":32,"word":"希尔恩《艺术的起源》主张多学科综合研究","phonetic":"六、多元决定论","meanings":[{"pos":"","def":"艺术史学家希尔恩在《艺术的起源》一书中，详细阐述了关于艺术起源多元化的看法。\n他认为艺术本身是一种综合性现象，因此研究艺术的起源必须结合社会学、人类学、心理学等多学科的相关知识，采取综合研究方法，才能真正揭示艺术起源的奥秘。\n记忆：希尔恩—《艺术的起源》—综合研究。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-33","list":2,"num":33,"word":"六种说法如何共同促成艺术的诞生","phonetic":"六、多元决定论","meanings":[{"pos":"","def":"艺术的起源应当是一个相当漫长的历史过程。\n在这个过程中，原始人类模仿自然的本能（模仿说）、表现情感的需要（表现说）、游戏的需要（游戏说）渗透其中。\n尤其是对于原始人类来讲更为重要的原始巫术（巫术说）与原始生产劳动（劳动说），更是在其中发挥了决定性的作用。\n正是在这个漫长的历史过程中，人们现在所理解的纯粹意义上的艺术才逐渐开始独立出来。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-34","list":2,"num":34,"word":"艺术起源的最终结论：多元决定论","phonetic":"六、多元决定论","meanings":[{"pos":"","def":"结论：艺术起源的第六种说法即“多元决定论”才是正确的结论。\n艺术的产生经历了一个由实用到审美、以巫术为中介、以劳动为前提的漫长历史发展过程，其中也渗透着人类模仿的需要、表现的冲动和游戏的本能。\n艺术的产生虽然是多元决定的，但是“巫术说”与“劳动说”更为重要；从根本上讲，艺术的起源最终应归结为人类的实践活动。\n记忆口诀：实用到审美，巫术作中介，劳动是前提。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-35","list":2,"num":35,"word":"青海大通孙家寨出土的舞蹈纹彩陶盆","phonetic":"六、多元决定论","meanings":[{"pos":"","def":"【客观题】青海大通县孙家寨出土的“舞蹈纹彩陶盆”，可说是对原始歌舞最生动的记录。\n这个新石器时代彩陶盆的口沿一周，画着三组（每组五人）舞蹈人平列手拉手在跳舞的形象，情绪热烈、动作优美，描绘也十分逼真。\n记忆：三组、每组五人。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-36","list":2,"num":36,"word":"法国“三兄弟”洞穴壁画上的史前舞蹈者","phonetic":"六、多元决定论","meanings":[{"pos":"","def":"【客观题】法国著名的“三兄弟”史前洞穴中，发现洞穴壁画上有一个男性舞蹈者形象。\n这个形象身上披着兽皮，头上戴着鹿角，腰上缠着长须和马尾，作舞蹈状。\n考法：题干给“披兽皮、戴鹿角、缠马尾”，要能对应到法国“三兄弟”洞穴。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-37","list":2,"num":37,"word":"河南贾湖骨笛：我国迄今发现最早的乐器","phonetic":"六、多元决定论","meanings":[{"pos":"","def":"【客观题】我国迄今发现的最早的乐器，是河南贾湖遗址出土的骨笛，距今7800—9000年。\n用鹤类尺骨管制成，磨制精细，多为7孔。\n这些骨笛不仅能演奏传统的五声或七声调式乐曲，而且能演奏富含变化音的少数民族或外国乐曲。\n记忆：贾湖—骨笛—7孔—7800至9000年。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-38","list":2,"num":38,"word":"浙江余姚河姆渡骨哨距今约七千年","phonetic":"六、多元决定论","meanings":[{"pos":"","def":"【客观题】浙江余姚河姆渡遗址发现的骨哨，距今约7000年。\n它也是用禽兽肢骨制成：骨哨中心是空的，面上有一至两个圆孔。\n对照记忆：贾湖骨笛距今7800—9000年，河姆渡骨哨距今约7000年，前者更早。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-39","list":2,"num":39,"word":"乌克兰长毛象骨骼乐器：世界最早乐器","phonetic":"六、多元决定论","meanings":[{"pos":"","def":"【客观题】世界上迄今为止发现的最早的乐器，被认为是在乌克兰境内发现的6支由长毛象骨骼制成的不同乐器，每支都能发出不同的声音。\n注意区分范围：“我国最早”是贾湖骨笛，“世界最早”是乌克兰长毛象骨骼乐器。"}],"related":[],"section":"第2章","marked":false},{"id":"C02-40","list":2,"num":40,"word":"神话常被当作文学最早的源头","phonetic":"六、多元决定论","meanings":[{"pos":"","def":"【客观题】神话常被当作是文学最早的源头。\n这一说法把文学的起点追溯到神话，与艺术起源问题相互关联。\n记忆：文学最早的源头—神话。"}],"related":[],"section":"第2章","marked":false},{"id":"C03-01","list":3,"num":1,"word":"艺术三大社会功能及审美价值基础","phonetic":"第一节 艺术的社会功能","meanings":[{"pos":"","def":"艺术的社会功能以审美价值为基础，主要包括三个方面：\n①审美认知作用——认识自然、社会、历史、人生；\n②审美教育作用——真、善、美的熏陶与启迪；\n③审美娱乐作用——精神享受与身心休息。\n审美性是艺术最本质的特征，审美价值是艺术最主要、最基本的特性；各种社会功能只有在审美价值的基础上才能实现，三者是有机整体。\n易错：审美认知≠科学认知，审美教育≠道德教育，审美娱乐≠其他娱乐活动。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-02","list":3,"num":2,"word":"审美认知作用的含义与两方面对象","phonetic":"第一节 艺术的社会功能 一、审美认知作用","meanings":[{"pos":"","def":"艺术的审美认知作用，主要是指人们通过艺术鉴赏活动，一方面可以更加深刻地认识自然，另一方面也可以认识社会、认识历史、认识人生。\n关键词：通过“艺术鉴赏活动”而非科学实验或逻辑推理获得认识。\n记忆框架：一个途径（鉴赏）+两类对象（自然、社会历史人生）。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-03","list":3,"num":3,"word":"艺术揭示社会历史人生的真谛","phonetic":"第一节 艺术的社会功能 一、审美认知作用","meanings":[{"pos":"","def":"由于艺术活动具有反映与创造统一、再现与表现统一、主体和客体统一等特点，往往能够更加深刻地揭示社会、历史、人生的真谛和内涵。\n并且常常是通过生动感人的艺术形象，给人们带来难以忘却的社会生活知识，大大拓宽了人们的视野。\n记忆：“三个统一”是艺术认知之所以深刻的原因。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-04","list":3,"num":4,"word":"艺术对自然现象的审美认知作用","phonetic":"第一节 艺术的社会功能 一、审美认知作用","meanings":[{"pos":"","def":"艺术对于大至天体、小至细胞的自然现象，也同样具有审美认知作用。\n范围：从宏观天体到微观细胞，自然万物都可成为艺术认知的对象。\n它与“对社会、历史、人生的认知”并列，构成艺术的两个基本审美认知作用。\n口诀：“社会人生+自然万物”，一大一小皆可入画。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-05","list":3,"num":5,"word":"审美认知不可替代的优越之处","phonetic":"第一节 艺术的社会功能 一、审美认知作用","meanings":[{"pos":"","def":"①艺术具有自己独特的审美认知功能，能够发挥其他社会科学、自然科学所不能代替的作用。\n②艺术的认知作用之所以特殊，是因为它以艺术的审美价值为基础。\n③艺术作品将生活真实升华为艺术真实，使审美认知功能具有深刻的内涵。\n记忆：两大优越性——“不可替代”与“以审美价值为基础”。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-06","list":3,"num":6,"word":"生活真实升华为艺术真实的四个通过","phonetic":"第一节 艺术的社会功能 一、审美认知作用","meanings":[{"pos":"","def":"艺术作品将生活真实升华为艺术真实，具体表现为四个“通过”：\n通过现象揭示本质、通过偶然揭示必然、通过个别显示一般、通过客观显示主观。\n作用：使艺术的审美认知功能具有深刻的内涵。\n口诀：“现象—偶然—个别—客观”四把钥匙，开“本质—必然—一般—主观”四把锁。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-07","list":3,"num":7,"word":"审美认知功能的局限不可估价过高","phonetic":"第一节 艺术的社会功能 一、审美认知作用","meanings":[{"pos":"","def":"对艺术的认知功能不能估价过高。\n它在认知方面无法取代自然科学，也无法取代社会学、历史学等学科。\n理解：艺术长于以形象感染人，短于系统、精确的知识传授，故应与科学、史学互补而非替代。\n记忆：与“不可替代”相对——审美认知独特但有限，评价要适度。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-08","list":3,"num":8,"word":"孔子论《诗》的兴观群怨与多识","phonetic":"第一节 艺术的社会功能 一、审美认知作用","meanings":[{"pos":"","def":"孔子：“《诗》，可以兴，可以观，可以群，可以怨；迩之事父，远之事君，多识于鸟兽草木之名。”\n用于说明艺术的审美认知作用：兴（感发志意）、观（观察社会）、群（沟通群体）、怨（讽谏不平），还可多识自然名物。\n记忆顺序：兴—观—群—怨—事父—事君—多识，由内而外层层推展。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-09","list":3,"num":9,"word":"恩格斯评巴尔扎克《人间喜剧》","phonetic":"第一节 艺术的社会功能 一、审美认知作用","meanings":[{"pos":"","def":"恩格斯在谈到巴尔扎克的社会小说《人间喜剧》时，认为从这里所学到的东西，“比从当时所有职业的历史学家、经济学家和统计学家那里学到的全部东西还要多”。\n考点：说明艺术具有审美认知作用，能提供比专业学科更丰富的社会知识。\n记忆链：恩格斯—巴尔扎克—《人间喜剧》—超过历史学家、经济学家、统计学家。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-10","list":3,"num":10,"word":"列宁称托尔斯泰小说为俄国革命镜子","phonetic":"第一节 艺术的社会功能 一、审美认知作用","meanings":[{"pos":"","def":"列宁把列夫·托尔斯泰的小说看成是“俄国革命的镜子”。\n原因：这些作品深刻地表现了“俄国千百万农民在俄国资产阶级革命快要到来的时候的思想和情绪”。\n考点：艺术的审美认知作用——认识社会、认识历史。\n记忆链：列宁—托尔斯泰—“俄国革命的镜子”—农民的思想和情绪。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-11","list":3,"num":11,"word":"《红楼梦》宝黛爱情与封建崩溃趋势","phonetic":"第一节 艺术的社会功能 一、审美认知作用","meanings":[{"pos":"","def":"我国古典小说的优秀代表作品《红楼梦》，以贾宝玉、林黛玉的爱情悲剧为主线，形象地展示出封建社会必然走向崩溃的历史趋势。\n特点：具有广阔的社会背景。\n考点：以文学作品为例说明艺术对社会、历史的审美认知作用。\n记忆：宝黛爱情是“主线”，封建崩溃是“趋势”。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-12","list":3,"num":12,"word":"审美教育作用的含义与感化路径","phonetic":"第一节 艺术的社会功能 二、审美教育作用","meanings":[{"pos":"","def":"艺术的审美教育作用，主要是指人们通过艺术欣赏活动受到真、善、美的熏陶和感染：思想上受到启迪，实践上找到榜样，认识上得到提高。\n在潜移默化中，其思想、感情、理想、追求发生深刻变化，从而正确地理解和认识生活，树立起正确的人生观和世界观。\n很大程度上是通过艺术作品，使读者、观众和听众感受与领悟到博大深厚的人文精神。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-13","list":3,"num":13,"word":"孔子礼乐相济与六艺中的乐","phonetic":"第一节 艺术的社会功能 二、审美教育作用","meanings":[{"pos":"","def":"孔子以“礼乐相济”的思想，创立了中国最早的教育体系。\n以“六艺”——礼、乐、射、御、书、数教授弟子，其中的“乐”就是诗、歌、舞、演、奏等的艺术综合体。\n考点：中国美育与艺术教育思想的源头。\n记忆：“礼乐相济，六艺之中乐最艺术”。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-14","list":3,"num":14,"word":"兴于诗立于礼成于乐的境界统一","phonetic":"第一节 艺术的社会功能 二、审美教育作用","meanings":[{"pos":"","def":"孔子明确提出“兴于《诗》，立于礼，成于乐”。\n含义：以诗感发志意（兴），以礼立身（立），以乐完成人格（成）。\n实质：通过艺术把道德的境界和审美的境界统一起来。\n记忆：诗—礼—乐三步，起点在诗，落点在乐。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-15","list":3,"num":15,"word":"柏拉图美育德育结合与理智的艺术","phonetic":"第一节 艺术的社会功能 二、审美教育作用","meanings":[{"pos":"","def":"早在古希腊时期，柏拉图就强调美育与德育的结合。\n他提倡“理智”的艺术，特别强调音乐的教育作用。\n对照：柏拉图把审美教育视为道德教育的一种特殊方式或补充手段，认为审美教育从属于道德教育。\n记忆：柏拉图—“理智”的艺术—重视音乐—美育从属德育。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-16","list":3,"num":16,"word":"亚里士多德艺术三功能教育净化快感","phonetic":"第一节 艺术的社会功能 二、审美教育作用","meanings":[{"pos":"","def":"亚里士多德认为艺术应当具有三种功能：一是“教育”，二是“净化”，三是“快感”。\n也就是说，艺术可以帮助人们获得知识、陶冶性情、得到快感。\n口诀：“教—净—快”，对应知识、性情、快感。\n考点：与柏拉图并列记忆，注意三项的顺序与含义。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-17","list":3,"num":17,"word":"艺术具有审美教育作用的两点原因","phonetic":"第一节 艺术的社会功能 二、审美教育作用","meanings":[{"pos":"","def":"①艺术作品不仅展示生活的外观，而且能够表现生活的本质特征和本质规律；作品中又总饱含着艺术家的思想感情、社会理想和审美理想，能使欣赏者从中受到启迪和教育。\n②艺术的教育功能不同于道德教育，更不同于其他类型的教育形式，因为它以审美价值为基础，具有美学的意义和艺术的魅力。\n记忆：“外观+本质”“情感+理想”“审美价值为基础”。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-18","list":3,"num":18,"word":"审美教育作用的以情感人等三特点","phonetic":"第一节 艺术的社会功能 二、审美教育作用","meanings":[{"pos":"","def":"审美教育作用中最主要的三个特点：\n①以情感人——艺术教育与其他教育之间最鲜明的区别；\n②潜移默化——毫无强制，自由自愿、不知不觉地受到感染；\n③寓教于乐——把思想教育融合到艺术审美娱乐之中。\n口诀：“情—潜—乐”（请前乐），三点可作简答题骨架。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-19","list":3,"num":19,"word":"以情感人是艺术教育最鲜明的区别","phonetic":"第一节 艺术的社会功能 二、审美教育作用","meanings":[{"pos":"","def":"以情感人是艺术教育与其他教育之间最鲜明的区别。\n艺术作品总是灌注着艺术家的思想情感，通过生动感人的艺术描绘，作用于欣赏者的感情，使人受到强烈的感染和熏陶。\n艺术的教育作用绝不是干巴巴的道德说教，而是以情感人、以情动人，通过强烈的感染性使欣赏者自觉自愿地受到教育。\n记忆：“不是道德说教，而是感染打动”。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-20","list":3,"num":20,"word":"潜移默化形成的稳固思想情操","phonetic":"第一节 艺术的社会功能 二、审美教育作用","meanings":[{"pos":"","def":"艺术作品对人的教育，常常是在毫无强制的情况下，使欣赏者自由自愿、不知不觉地受到感染，心灵得到净化。\n在艺术作品这种长期潜移默化的作用下而形成的思想情操，常常具有更强的稳固性和延续性，往往成为人生观、世界观中最核心的组成部分。\n记忆链：无强制→不知不觉→心灵净化→稳固持久。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-21","list":3,"num":21,"word":"寓教于乐：思想教育融入审美娱乐","phonetic":"第一节 艺术的社会功能 二、审美教育作用","meanings":[{"pos":"","def":"“寓教于乐”强调应当把思想教育融合到艺术审美娱乐之中。\n它既是审美教育作用的第三个特点，也是审美娱乐作用的重要命题，可与贺拉斯、《乐记》的观点合并记忆。\n效果：通过艺术欣赏，人们既满足精神上的审美需要、身心得到积极休息，又从中受到教育和启迪。\n口诀：“教在乐中，不露痕迹”。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-22","list":3,"num":22,"word":"审美教育作用的评价须适度","phonetic":"第一节 艺术的社会功能 二、审美教育作用","meanings":[{"pos":"","def":"对艺术的审美教育作用，同样有一个评价适度的问题：既不能忽视这种作用，也不能过分夸大。\n原因：由于艺术的体裁门类不同，作品的题材、内容不同，作家、艺术家的创作方法、风格不同，使艺术作品的审美教育作用也各不相同。\n记忆：不忽视、不夸大——因体裁、题材、风格而异。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-23","list":3,"num":23,"word":"鲁迅《呐喊》《彷徨》的二十五篇小说","phonetic":"第一节 艺术的社会功能 二、审美教育作用","meanings":[{"pos":"","def":"鲁迅先生的《呐喊》《彷徨》这两部小说集，收入了《狂人日记》《孔乙己》《药》《故乡》《阿Q正传》《祝福》等25篇小说。\n成功地塑造了孔乙己、闰土、阿Q、祥林嫂等一系列脍炙人口的典型人物。\n考点：以作品说明艺术的审美教育作用——以情感人、唤醒民众。\n记忆：两集—25篇—四个人物。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-24","list":3,"num":24,"word":"柴可夫斯基《如歌的行板》感动托尔斯泰","phonetic":"第一节 艺术的社会功能 二、审美教育作用","meanings":[{"pos":"","def":"1876年，俄国大作家列夫·托尔斯泰在莫斯科音乐学院为他举办的专场音乐会上，听了柴可夫斯基《D大调弦乐四重奏》的第二乐章，即《如歌的行板》，感动得流下了眼泪。\n托尔斯泰说，在这首乐曲中，“我已经接触到忍受苦难的人民的灵魂深处”。\n原因：《如歌的行板》产生于俄国社会经历大变革和动荡的时代，在沙皇政府专制统治下政治文化统治最黑暗的时期，柴可夫斯基在作品中灌注了自己对俄罗斯民族遭受苦难的深沉感情。\n考点：音乐以情感人。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-25","list":3,"num":25,"word":"屈原《离骚》求索与《木兰诗》赴戎机","phonetic":"第一节 艺术的社会功能 二、审美教育作用","meanings":[{"pos":"","def":"屈原《离骚》：“路漫漫其修远兮，吾将上下而求索。”——表现执着追求理想的精神。\n北朝民歌《木兰诗》：“万里赴戎机，关山度若飞。”——表现奔赴战场的豪迈。\n考点：以诗句为例，说明艺术以情感人、激励人心的审美教育作用。\n记忆：“求索”属屈原，“赴戎机”属木兰。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-26","list":3,"num":26,"word":"高适《燕歌行》与杜甫《春望》的忧国","phonetic":"第一节 艺术的社会功能 二、审美教育作用","meanings":[{"pos":"","def":"唐代诗人高适《燕歌行》：“汉家烟尘在东北，汉将辞家破残贼。”\n杜甫《春望》：“国破山河在，城春草木深。”\n考点：以唐诗为例说明艺术的审美教育作用——家国之痛、忧国之情以情感人。\n记忆：高适写边塞出征，杜甫写乱后长安。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-27","list":3,"num":27,"word":"陆游《示儿》与文天祥《正气歌》气节","phonetic":"第一节 艺术的社会功能 二、审美教育作用","meanings":[{"pos":"","def":"南宋诗人陆游《示儿》：“王师北定中原日，家祭无忘告乃翁。”\n文天祥《正气歌》：“当其贯日月，生死安足论。”\n考点：以诗句为例说明艺术作品的审美教育作用——爱国情怀与人格力量感染人。\n记忆：陆游“告乃翁”盼北定，文天祥“贯日月”轻生死。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-28","list":3,"num":28,"word":"审美娱乐作用的含义与四步效应","phonetic":"第一节 艺术的社会功能 三、审美娱乐作用","meanings":[{"pos":"","def":"艺术的审美娱乐作用，主要是指通过艺术欣赏活动，使人们的审美需要得到满足，获得精神享受和审美愉悦，使身心得到愉悦和休息。\n关键词链条：审美需要—精神享受—审美愉悦—身心休息。\n口诀：“满足—享受—愉悦—休息”四步走。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-29","list":3,"num":29,"word":"物质产品养身与精神产品养心","phonetic":"第一节 艺术的社会功能 三、审美娱乐作用","meanings":[{"pos":"","def":"物质产品是为了满足人们生存的需要，精神产品则是为了满足人们心灵的需要。\n艺术作为一种特殊的精神产品，能够给人们带来审美的愉悦和心理的快感。\n事实：日常生活中绝大多数人进电影院、剧院、音乐厅或美术馆，都是为了休息和娱乐，而主要不是为了获取知识或接受教育。\n记忆：物质养身，艺术养心。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-30","list":3,"num":30,"word":"艺术使人娱乐的精神享受","phonetic":"第一节 艺术的社会功能 三、审美娱乐作用","meanings":[{"pos":"","def":"艺术作品之所以受人欢迎，在于它能给人以精神上的享受。\n人们通过欣赏艺术作品，能使其审美需要得到满足，精神上产生一种愉悦、美感。\n这种精神需要有时甚至比人的物质需要更加强烈。\n记忆：受欢迎的原因=精神享受；精神需要可强于物质需要。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-31","list":3,"num":31,"word":"艺术使人休憩的积极休息与医疗","phonetic":"第一节 艺术的社会功能 三、审美娱乐作用","meanings":[{"pos":"","def":"艺术的审美娱乐功能，使人们通过艺术欣赏得到积极的休息，从而更好地投入新的工作。\n无论是从事体力劳动或脑力劳动，无论是生理上还是心理上，都需要在紧张的劳动之余通过休息和娱乐来消除疲劳。\n艺术的这种功能甚至逐渐被运用到医疗方面。\n记忆：两个层次——“积极休息”与“医疗应用”。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-32","list":3,"num":32,"word":"贺拉斯与《乐记》儒家的寓教于乐","phonetic":"第一节 艺术的社会功能 三、审美娱乐作用","meanings":[{"pos":"","def":"古罗马美学家贺拉斯明确提出艺术应当“寓教于乐”。\n中国先秦时期的艺术理论著作《乐记》中也有类似的思想。\n儒家观念：“乐者乐也。君子乐得其道，小人乐得其欲。以道制欲，则乐而不乱；以欲忘道，则惑而不乐。”可见儒家也认为艺术应给人快乐，但须以道制欲。\n记忆：西方贺拉斯，中国《乐记》，一线相通。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-33","list":3,"num":33,"word":"马斯洛的高峰体验与审美最高境界","phonetic":"第一节 艺术的社会功能 三、审美娱乐作用","meanings":[{"pos":"","def":"美国著名人本主义心理学家马斯洛认为，人生的最高境界是一种“高峰体验”。\n审美活动中的“高峰体验”，实际上是通过自我证实而达到审美的最高境界。\n考点：从心理学角度说明艺术审美娱乐、精神享受给人带来的巨大愉悦，有时甚至会超过物质享受。\n记忆链：马斯洛—人本主义—“高峰体验”—自我证实。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-34","list":3,"num":34,"word":"三大社会功能是有机统一的整体","phonetic":"第一节 艺术的社会功能 四、总结","meanings":[{"pos":"","def":"艺术的审美教育作用、审美认知作用和审美娱乐作用三者是一个有机的整体，具有不可分割的联系。\n原因：艺术的各种社会功能都是建立在艺术审美价值的统一基础之上。\n答题要点（简述艺术的社会功能）：先总说以审美价值为基础，再分述认知、教育、娱乐，最后收于三者统一。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-35","list":3,"num":35,"word":"艺术教育是美育的核心与主要手段","phonetic":"第二节 艺术教育","meanings":[{"pos":"","def":"艺术教育是美育的核心，它的根本目标是培养全面发展的人。\n艺术教育是实施美育的主要手段。\n艺术教育承担着开启人的感知力、理解力、想象力、创造力，使人的内心情感和谐发展的任务。\n记忆：一个核心、一个目标、一个手段、四种能力。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-36","list":3,"num":36,"word":"美育起源：孔子的礼乐与柏拉图","phonetic":"第二节 艺术教育 一、美育与艺术教育","meanings":[{"pos":"","def":"①早在先秦时期，孔子就提出“兴于《诗》，立于礼，成于乐”，奠定了中国古代教育“礼乐相济”的理论基础，把符合儒家之礼的艺术视为道德教育的特殊方式。\n②古希腊的柏拉图也同样把审美教育视为道德教育的一种特殊方式或补充手段，认为审美教育从属于道德教育。\n比较：孔子重“礼乐相济”，柏拉图重“美育从属德育”。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-37","list":3,"num":37,"word":"席勒《美育书简》首提美育概念","phonetic":"第二节 艺术教育 一、美育与艺术教育","meanings":[{"pos":"","def":"美育理论体系的建立是在世界近代史上才开始的；“美育”（即“审美教育”）的概念直到近代，才由18世纪的德国美学家席勒正式提出。\n席勒在《美育书简》中，不但首次提出了“美育”这一概念，而且系统阐述了他的美育思想。\n席勒认为，要通过审美教育，才能克服人性分裂。\n记忆链：席勒—《美育书简》—首提“美育”—克服人性分裂。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-38","list":3,"num":38,"word":"席勒的感性理性与游戏三种冲动","phonetic":"第二节 艺术教育 一、美育与艺术教育","meanings":[{"pos":"","def":"①“感性冲动”——产生于人的自然存在或感性本质，受感性需要的支配；\n②“理性冲动”——产生于人的绝对存在或理性本质，受必然规律的限制；\n③“游戏冲动”——作为桥梁，把二者有机统一起来。\n两种冲动都是人的天性，只是在近代文明社会中被分裂开来，故需“游戏冲动”使人成为具有完美人性的真正的人。\n注：席勒所说的“游戏”指与强迫对立的一种自由自觉的活动，是一种审美的游戏或艺术的游戏。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-39","list":3,"num":39,"word":"席勒美育思想的四点结论与局限","phonetic":"第二节 艺术教育 一、美育与艺术教育","meanings":[{"pos":"","def":"①席勒已意识到大工业社会造成的人性分裂，极力主张通过美育来培养理想的人、完美的人、全面和谐发展的人。\n②他把美育提到培养全面发展的人的高度来认识，对后来世界各国的美育理论产生很大影响。\n③他明确地把体、智、德、美四项教育并提，使美育具有独立的地位和任务，在培养全面发展的人方面具有不可替代的重要作用。\n④局限：主张以美育实现人性的改造乃至社会的改革，完全脱离经济基础和上层建筑，无疑只是一种唯心主义的空想。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-40","list":3,"num":40,"word":"王国维最早将美育与德智并提","phonetic":"第二节 艺术教育 一、美育与艺术教育","meanings":[{"pos":"","def":"王国维是近代最早公开将美育与德育、智育相提并论来提倡的清末学者。\n考点：中国近代美育体系的先声，常与蔡元培合并考查。\n记忆：王国维“最早公开并提”，蔡元培“大力倡导、以美育代宗教”。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-41","list":3,"num":41,"word":"蔡元培以美育代宗教的主张","phonetic":"第二节 艺术教育 一、美育与艺术教育","meanings":[{"pos":"","def":"中国近代教育家蔡元培大力倡导美育，把美育确定为其新式教育方针的内容之一。\n他提出了一系列美育实施设想，对美育的本质、内容、作用和实施美育的途径做了较系统的研究和阐述。\n他还提出“以美育代宗教”的主张，强调美育是陶冶人的感情、改造人的世界观、使人达到一种新的精神境界的最好途径。\n记忆：方针之一+实施设想+以美育代宗教。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-42","list":3,"num":42,"word":"艺术教育的狭义与广义两种含义","phonetic":"第二节 艺术教育 二、艺术教育在当代社会生活中的重要意义","meanings":[{"pos":"","def":"现代社会中，“艺术教育”这一概念有着两种不同的含义和内容。\n狭义：艺术教育被理解为为培养艺术家或专业艺术人才所进行的各种理论和实践教育。\n广义：艺术教育作为美育的核心，根本目标是培养全面发展的人；强调普及艺术的基本知识和基本原理，通过对优秀艺术作品的评价和欣赏，提高人们的审美修养和艺术鉴赏力，培养人们健全的审美心理结构。\n记忆：狭义培养“专才”，广义培养“全人”。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-43","list":3,"num":43,"word":"广义艺术教育在当代的必要性","phonetic":"第二节 艺术教育 二、艺术教育在当代社会生活中的重要意义","meanings":[{"pos":"","def":"在当代社会中，这种广义的艺术教育显得更加必要和紧迫。\n①特别是20世纪下半叶以来，人们在精神生活方面反而变得更加焦虑和不安。\n②席勒早在18世纪时发现的资本主义社会中人性的分裂、“感性冲动”与“理性冲动”的冲突，在当代社会中变得更加尖锐突出；人们渴望超出有限的物质生存需要，追求更高的精神生活。\n③人们需要在艺术中恢复自身的全面发展，防止感性与理性的分裂，在艺术天地里恢复心理平衡与精神和谐，提高人的价值，达到个性的发展，实现人格的完善。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-44","list":3,"num":44,"word":"日本三大科学与俄罗斯工业艺术设计","phonetic":"第二节 艺术教育 二、艺术教育在当代社会生活中的重要意义","meanings":[{"pos":"","def":"日本：将自然科学、社会科学和艺术科学并称为三大科学。\n俄罗斯：艺术的范围从人类的精神生活领域扩大到物质生产领域，兴起和发展了工业艺术设计等新兴艺术学科，将技术与艺术、科学与美学、物质文明与精神文明融合到一起。\n记忆：日本“三大科学并列”，俄罗斯“艺术走向物质生产”。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-45","list":3,"num":45,"word":"美国零点计划的四科规定课程","phonetic":"第二节 艺术教育 二、艺术教育在当代社会生活中的重要意义","meanings":[{"pos":"","def":"美国“零点计划”明确地把音乐、美术、戏剧、舞蹈作为全美国中小学的规定课程。\n考点：艺术教育在世界各国发展的代表性举措之一。\n记忆：零点计划—音乐、美术、戏剧、舞蹈“四科入课”。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-46","list":3,"num":46,"word":"中国2022新课标加入的新三科","phonetic":"第二节 艺术教育 二、艺术教育在当代社会生活中的重要意义","meanings":[{"pos":"","def":"随着全面推行素质教育，以及认真贯彻德智体美全面发展的教育方针，我国逐步形成了从幼儿园、小学、中学到大学的一整套艺术教育体系。\n2022年教育部义务教育课程标准明确规定：中小学将统一开设“艺术”课程，除原有的音乐、美术外，还加入了“新三科”——舞蹈、戏剧（含戏曲）、影视（含数字媒体艺术），进一步加强中小学美育和艺术教育。\n记忆：新三科=舞蹈、戏剧、影视。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-47","list":3,"num":47,"word":"立德树人与培养全面发展的人才","phonetic":"第二节 艺术教育 三、艺术教育的任务和目标","meanings":[{"pos":"","def":"艺术教育的根本任务和目标：在“立德树人”的目标下，培养全面发展的人才。\n具体可从三方面理解：①普及艺术的基本知识，提高人的艺术修养；②健全审美心理结构，充分发挥人的想象力和创造力；③陶冶人的情感，培养完美的人格。\n记忆：“立德树人”是总纲，三方面是分述，可直接作大题框架。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-48","list":3,"num":48,"word":"普及艺术知识提高艺术修养","phonetic":"第二节 艺术教育 三、艺术教育的任务和目标","meanings":[{"pos":"","def":"艺术修养是人的文化修养的重要组成部分，也是人文精神的集中体现。\n现当代社会中的人，必须具有较高的文化修养与艺术修养，才能适应社会的发展与时代的需要。\n要真正具备较高的艺术修养，还需要掌握艺术的基本知识和基本原理，在艺术欣赏中不断提高鉴赏能力和审美能力，把欣赏中的感性经验上升为理性认识。\n记忆链：修养—知识原理—鉴赏能力—感性上升为理性。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-49","list":3,"num":49,"word":"健全审美心理结构发展想象创造力","phonetic":"第二节 艺术教育 三、艺术教育的任务和目标","meanings":[{"pos":"","def":"艺术教育可以培育和健全人的审美心理结构，培养人们敏锐的感知力、丰富的想象力和无限的创造力。\n艺术活动作为人的一种高级精神活动，能够极大地促进和提高人的思维能力。\n记忆：审美心理结构=感知力+想象力+创造力，最终落到思维能力。"}],"related":[],"section":"第3章","marked":false},{"id":"C03-50","list":3,"num":50,"word":"陶冶情感培养完美人格","phonetic":"第二节 艺术教育 三、艺术教育的任务和目标","meanings":[{"pos":"","def":"艺术是审美情感的集中体现，因而艺术对于人的情感的培养与提高，有着特别重要的作用。\n艺术教育作为美育的核心内容和主要手段，正是通过以情感人、以情动人的方法，陶冶人的情操，美化人的心灵，使人进入更高的精神境界，成为一个具有高尚情操的人。\n记忆链：陶冶情感—美化心灵—提升境界—完美人格。"}],"related":[],"section":"第3章","marked":false},{"id":"C04-01","list":4,"num":1,"word":"文化人类学确立于1922年","phonetic":"第一节 作为文化现象的艺术","meanings":[{"pos":"","def":"现代意义上的文化人类学确立于1922年。\n标志是英国人类学家马林诺夫斯基和拉·布朗正式出版了他们的著作。\n第一节开篇的客观题考点，记年份与两位英国人类学家。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-02","list":4,"num":2,"word":"泰勒《原始文化》首次整体界定文化","phonetic":"一、文化与艺术","meanings":[{"pos":"","def":"19世纪最有影响的文化定义，出自英国人类学家泰勒1871年出版的《原始文化》。\n泰勒认为：文化或文明是包括知识、信仰、艺术、道德、法律、习俗以及社会成员个人获得的其他能力、习惯在内的综合体。\n这一定义第一次从整体性上界定文化。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-03","list":4,"num":3,"word":"克鲁伯与克拉克洪的20世纪文化定义","phonetic":"一、文化与艺术","meanings":[{"pos":"","def":"20世纪最有影响的文化定义，由美国文化学家克鲁伯和克拉克洪提出。\n出处是《文化：概念和定义的批判性回顾》一书。\n与泰勒的19世纪定义对举记忆：一个出自英国人类学家，一个出自美国文化学家。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-04","list":4,"num":4,"word":"文化大系统的三大子系统","phonetic":"一、文化与艺术","meanings":[{"pos":"","def":"文化作为一个大系统，包含着诸多子系统，总体上分为物质文化、制度文化和精神文化三大子系统。\n每个子系统又包含许多更低层次的子系统。\n各子系统彼此渗透、互相影响，具有内在的联系性和彼此的互动性，并由此形成相对独立性和各自的发展规律。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-05","list":4,"num":5,"word":"艺术在人类文化中的双重身份","phonetic":"二、艺术在人类文化中的地位","meanings":[{"pos":"","def":"一方面，艺术作为文化的独特组成部分，始终参与和推动人类文化的历史发展进程，并体现和反映人类文化的各个历史发展阶段。\n另一方面，艺术必然受到文化大系统的制约和影响。\n社会文化大系统作为一种总的文化氛围或文化条件，直接制约作家、艺术家和读者、观众文化心理结构的形成，从而间接影响艺术的创作与欣赏。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-06","list":4,"num":6,"word":"物质文化是基础、制度文化是中介","phonetic":"二、艺术在人类文化中的地位","meanings":[{"pos":"","def":"文化大系统包括物质文化、制度文化、精神文化三大子系统。\n从文化结构来看：物质文化是基础，制度文化是中介，精神文化是核心。\n文化子系统中的物质文化和制度文化，决定和制约着精神文化。\n记忆链：基础—中介—核心。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-07","list":4,"num":7,"word":"艺术与哲学宗教道德科学的互动","phonetic":"二、艺术在人类文化中的地位","meanings":[{"pos":"","def":"从精神文化内部来看，艺术同哲学、宗教、道德、科学之间也是相互关联、彼此作用的。\n一方面，艺术要受到哲学、宗教、道德、科学等其他精神文化的影响。\n另一方面，艺术也反过来影响着它们。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-08","list":4,"num":8,"word":"第一节客观题：九部作品例证","phonetic":"二、艺术在人类文化中的地位","meanings":[{"pos":"","def":"屈原《离骚》《九歌》、琵琶古曲《十面埋伏》、关汉卿《窦娥冤》、小提琴协奏曲《梁山伯与祝英台》、王实甫《西厢记》。\n东晋画家顾恺之《洛神赋图》、罗贯中《三国演义》、清代画家石涛《黄山图》、曹雪芹《红楼梦》。\n这九部作品是第一节客观题列举的例证，用来说明艺术与文化各子系统的关联。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-09","list":4,"num":9,"word":"哲学与艺术：理性、感性与美学中介","phonetic":"一、艺术与哲学的关系","meanings":[{"pos":"","def":"哲学代表人类理性的最高形式，艺术代表人类感性的最高形式，美学是二者之间的桥梁，黑格尔干脆把美学称为“艺术哲学”。\n哲学主要通过美学这一中介对艺术产生巨大影响。\n艺术也通过自身的特殊方式传播和体现一定哲学思想，从而对哲学产生影响。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-10","list":4,"num":10,"word":"孔子以礼乐为中心的美学思想","phonetic":"一、艺术与哲学的关系","meanings":[{"pos":"","def":"孔子提出以“礼”“乐”为中心的美学思想。\n他用“兴、观、群、怨”等范畴对诗的特点和功能作了概括。\n他要求做到美与善的统一、文与质的统一，对后来整个封建时代的艺术发展产生了极大影响。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-11","list":4,"num":11,"word":"庄子美学以自然无为为至上之美","phonetic":"一、艺术与哲学的关系","meanings":[{"pos":"","def":"庄子的美学与哲学浑然一体，难以区分。\n庄子哲学追求个体的自由和无限的境界。\n这种追求形成庄子美学的理论基础：以自然无为为至上之美。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-12","list":4,"num":12,"word":"李白推崇“清水出芙蓉”的天然之美","phonetic":"一、艺术与哲学的关系","meanings":[{"pos":"","def":"李白的审美理想深受庄子美学推崇天然之美的思想影响。\n他大力倡导“自然”“清真”的风格，赞赏“清水出芙蓉，天然去雕饰”的天然之美。\n这是“哲学影响艺术家”的典型例证。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-13","list":4,"num":13,"word":"杜甫受儒家美学影响写“三吏”“三别”","phonetic":"一、艺术与哲学的关系","meanings":[{"pos":"","def":"杜甫的美学理想受到孔子儒家美学的极大影响。\n他把“致君尧舜上，再使风俗淳”的抱负融入诗中，代表作有“三吏”“三别”。\n答题时与李白对举：一受庄子影响，一受儒家影响。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-14","list":4,"num":14,"word":"卡夫卡《变形记》等哲理性小说","phonetic":"一、艺术与哲学的关系","meanings":[{"pos":"","def":"哲学对艺术的影响，表现在出现了一批哲理性的艺术作品。\n奥地利作家卡夫卡的小说《变形记》，写推销员早晨醒来后发现自己变成一只甲壳虫，最后悲惨地死去。\n卡夫卡的其他作品还有《审判》《城堡》《地洞》。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-15","list":4,"num":15,"word":"超现实主义流派代表人物与作品","phonetic":"一、艺术与哲学的关系","meanings":[{"pos":"","def":"超现实主义是哲学促进艺术潮流形成的例证。\n文学：布勒东的散文《动物与人》、阿拉贡的散文集《巴黎的农民》。\n美术：西班牙画家达利的油画《记忆的永恒》。\n电影：西班牙导演布努艾尔拍摄的《一条安达鲁狗》。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-16","list":4,"num":16,"word":"艺术影响哲学的两个方面","phonetic":"一、艺术与哲学的关系","meanings":[{"pos":"","def":"艺术可以启迪哲学家的思维。\n艺术作品可以传播特定的哲学思想。\n尤其是哲学家对艺术的思考，往往成为其哲学体系的重要组成部分。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-17","list":4,"num":17,"word":"哲学影响艺术的四个层面","phonetic":"一、艺术与哲学的关系","meanings":[{"pos":"","def":"哲学对艺术的影响渗透，不仅体现在艺术家、艺术作品、艺术流派和思潮，而且包括艺术的表现形式和创作手法。\n反过来，艺术也扩大和深化着特定哲学流派和思潮的影响。\n注意：哲学对艺术的影响是相对的，并非每个艺术家都在作品中表露哲学观点，也并非每个作品都非得具有哲理性。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-18","list":4,"num":18,"word":"西方现代哲学的三个“色彩”","phonetic":"二、西方现代哲学与西方现代主义艺术","meanings":[{"pos":"","def":"西方现代哲学指19世纪中叶以来为数众多的欧美哲学思潮和流派的总称。\n它在本体论上大多具有唯心主义色彩，在认识论上大多具有非理性主义色彩，在人生哲学上大多具有悲观主义色彩。\n三个“色彩”是客观题记忆点。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-19","list":4,"num":19,"word":"西方现代主义艺术的内容与形式特征","phonetic":"二、西方现代哲学与西方现代主义艺术","meanings":[{"pos":"","def":"西方现代主义艺术不是单一的艺术流派，而是为数繁多的西方文艺流派的总称。\n内容上大多表现西方现代社会的深刻社会危机和精神危机。\n形式上大多标新立异，追求艺术形式和表现手法的创新，甚至否定和排斥传统，使作品怪诞离奇、隐晦费解、抽象混乱。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-20","list":4,"num":20,"word":"有现代哲学流派就有相应艺术流派","phonetic":"二、西方现代哲学与西方现代主义艺术","meanings":[{"pos":"","def":"西方现代哲学成为现代主义艺术的思想根源，现代主义艺术又用艺术的方式宣传西方现代哲学各流派的思想。\n二者关系可用一句话概括：有一定的西方现代哲学流派，就会有相应的西方现代艺术流派。\n这种影响渗透到主题、题材、情节、场面，也直接改变艺术形式和表现手段。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-21","list":4,"num":21,"word":"象征主义代表人物与作品","phonetic":"二、西方现代哲学与西方现代主义艺术","meanings":[{"pos":"","def":"象征主义是西方现代主义艺术中出现最早、影响最大的一个流派。\n文学：波德莱尔的诗集《恶之花》、艾略特的长诗《荒原》。\n戏剧：比利时剧作家梅特林克的《青鸟》、德国剧作家霍普特曼的《沉钟》。\n美术以法国画家摩罗、德国画家勃克林为代表；建筑有法国朗香教堂、澳大利亚悉尼歌剧院、德国柏林爱乐音乐厅。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-22","list":4,"num":22,"word":"萨特的存在主义小说与戏剧","phonetic":"二、西方现代哲学与西方现代主义艺术","meanings":[{"pos":"","def":"存在主义小说的代表作家，就是存在主义哲学的代表人物萨特。\n小说有《恶心》《墙》。\n戏剧有《可尊敬的妓女》《肮脏的手》。\n哲学家本人从事创作，是“哲学影响艺术”的典型例证。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-23","list":4,"num":23,"word":"威廉·詹姆斯提出“意识流”概念","phonetic":"二、西方现代哲学与西方现代主义艺术","meanings":[{"pos":"","def":"“意识流”这个概念最早由美国心理学家、实用主义哲学创始人威廉·詹姆斯提出。\n小说：法国作家普鲁斯特的《追忆逝水年华》、爱尔兰作家乔伊斯的《尤利西斯》。\n电影：法国导演雷乃的《广岛之恋》、意大利导演费里尼的《八部半》。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-24","list":4,"num":24,"word":"黑格尔：认识绝对真理的三种方式","phonetic":"一、宗教与艺术的相互关系","meanings":[{"pos":"","def":"黑格尔认为，最接近艺术的领域就是宗教。\n人类认识绝对真理有三种方式：最初级的是艺术，以感性形象显现真理；较高一级的是宗教，强调主体的情感和观念；最高级的是哲学，以自由思考将主体与客体、感性与理性统一起来。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-25","list":4,"num":25,"word":"贝尔与马克思论艺术和宗教的归属","phonetic":"一、宗教与艺术的相互关系","meanings":[{"pos":"","def":"克莱夫·贝尔在《艺术》中认为，艺术与宗教同属于幻想的领域、情感的领域，是人们摆脱现实环境达到迷狂境界的两个途径。\n马克思认为，艺术的、宗教的方式都同属于一个领域，它们在掌握世界的方式上与科学有着本质的不同。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-26"
