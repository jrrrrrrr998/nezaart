lse},{"id":"C09-07","list":9,"num":7,"word":"古希腊三大悲剧家与记忆口诀","phonetic":"一、戏剧艺术","meanings":[{"pos":"","def":"最早出现的古希腊悲剧属于西方悲剧，题材大多来自神话传说与英雄史诗。\n代表古希腊悲剧艺术最高成就的是埃斯库罗斯、索福克勒斯和欧里庇得斯，他们并称为古希腊三大悲剧家。\n记忆口诀：“爱思考的酷螺丝”“说服可勒死”，用来记住三大悲剧家的名字。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-08","list":9,"num":8,"word":"《俄狄浦斯王》与弗洛伊德情结","phonetic":"一、戏剧艺术","meanings":[{"pos":"","def":"《俄狄浦斯王》这出悲剧深刻反映出早期人类迈入文明门槛的艰难历程。\n精神分析学派的创始人、奥地利著名心理学家弗洛伊德将其概括为“恋母情结”和“恋父情结”。\n这一解读使《俄狄浦斯王》成为后世反复引用的悲剧范本。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-09","list":9,"num":9,"word":"第二阶段：性格悲剧与哈姆雷特","phonetic":"一、戏剧艺术","meanings":[{"pos":"","def":"性格悲剧出现在欧洲中世纪末，反映长期封建社会中封建伦理制度、宗教统治与反封建社会力量的矛盾斗争，体现人文主义理想与黑暗现实的尖锐冲突。\n莎士比亚的著名悲剧《哈姆雷特》等，表现了欧洲中世纪封建宗教迷信长期压制下扭曲的人格。\n主人公虽几经挣扎，最终仍因性格上的缺陷造成悲剧，反映出人物灵魂深处的斗争和激烈的内心冲突。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-10","list":9,"num":10,"word":"第三阶段：社会悲剧与批判精神","phonetic":"一、戏剧艺术","meanings":[{"pos":"","def":"社会悲剧出现在19世纪的近代社会，揭露各种不合理的社会现象和罪恶，具有鲜明强烈的批判精神。\n例：法国作家小仲马根据本人同名小说改编的悲剧《茶花女》；19世纪挪威著名戏剧家易卜生的《玩偶之家》（又名《娜拉出走》）。\n二者均对社会偏见与世俗势力作了一定程度的揭露，触及资本主义时代的尖锐社会矛盾，反映了个人与社会势力的抗争。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-11","list":9,"num":11,"word":"第四阶段：悲喜剧与《老妇还乡》","phonetic":"一、戏剧艺术","meanings":[{"pos":"","def":"西方戏剧史上的命运悲剧、性格悲剧、社会悲剧，都是人在与命运、性格、环境冲突中的挣扎，可称为“挣扎的悲剧”。\n现当代西方悲剧进入第四阶段“悲喜剧”，创作风格更加多样，尤其出现将悲剧性与喜剧性融会到一起的作品。\n瑞士剧作家迪伦马特的《老妇还乡》（1956）是具有荒诞风格的悲喜剧，构成寓意深刻的境界；这种风格20世纪50年代以来对世界许多国家的戏剧、电影、电视剧产生重大影响。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-12","list":9,"num":12,"word":"戏剧性：戏剧艺术的首要特征","phonetic":"一、戏剧艺术","meanings":[{"pos":"","def":"戏剧性就是戏剧艺术通过演员扮演的角色之间的冲突来展开剧情、刻画人物，借以吸引观众，实现其艺术效果和审美作用的特性。\n构成戏剧性的中心环节是戏剧动作和戏剧冲突。\n《哈姆雷特》以哈姆雷特同篡夺王位的叔父之间的外部冲突，以及他本人灵魂深处的内心冲突，构成丰富而深刻的戏剧矛盾。\n曹禺《雷雨》以周朴园一家错综复杂的人物关系和人物之间的矛盾展开冲突，情节曲折、冲突纷繁，具有很强的戏剧性。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-13","list":9,"num":13,"word":"《雷雨》的三一律与八个主要人物","phonetic":"一、戏剧艺术","meanings":[{"pos":"","def":"《雷雨》是曹禺23岁大学刚刚毕业时的作品。\n全剧只有8个主要人物：周朴园、侍萍、蘩漪、周萍、周冲、四凤、鲁贵，以及后来加上的鲁大海；场景主要在周家和鲁家，时间是一个昼夜，通过24小时里发生的故事反映两代人的爱恨情仇。\n全剧严格遵循古典主义戏剧的“三一律”原则（时间一律、地点一律、情节一律），堪称中国现代戏剧史上具有里程碑意义的话剧佳作。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-14","list":9,"num":14,"word":"剧场性与戏剧艺术三要素","phonetic":"一、戏剧艺术","meanings":[{"pos":"","def":"在综合艺术中，戏剧和戏曲需要演员在舞台上为观众进行现场表演，并且可以多次进行，这种剧场性对演员表演艺术提出了很高要求。\n人们常把剧本、演员和观众称作戏剧艺术的三要素，其中最本质的要素自然是演员。\n演出时演员与观众的感情可以直接交流：观众既欣赏表演，又以自己的情绪情感反应直接影响演员的表演，这种现场反馈现象构成戏剧艺术的重要特点。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-15","list":9,"num":15,"word":"斯坦尼斯拉夫斯基与布莱希特体系","phonetic":"一、戏剧艺术","meanings":[{"pos":"","def":"戏剧表演艺术的研究中，影响最大的是斯坦尼斯拉夫斯基体系和布莱希特戏剧体系。\n斯坦尼斯拉夫斯基体系被称之为“体验派表演艺术”，主张“我就是角色”，并根据戏剧情境做出一连串的行动，称之为“贯串行为”。\n布莱希特戏剧体系被称之为“表现派表演艺术”，始终清醒地意识到“我是在演戏”。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-16","list":9,"num":16,"word":"戏曲定义与三大古老戏剧","phonetic":"二、戏曲艺术","meanings":[{"pos":"","def":"戏曲是中国传统戏剧形式的总称，其中包括全国性的剧种也包括地方戏。\n它既具有戏剧的共同特征，又因独特的表现手段和独有的审美特征而区别于其他戏剧形式；深深植根于中华民族传统文化，将表现审美意境作为最高的艺术追求，属于表现性的综合艺术。\n世界上古希腊戏剧、印度梵剧和中国戏曲，被称为三种古老的戏剧艺术（2023年真题考点）。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-17","list":9,"num":17,"word":"戏曲“以一求多”的形式美","phonetic":"二、戏曲艺术","meanings":[{"pos":"","def":"中国戏曲在形式美上“以一求多”，西方戏剧在形式美上“以多见一”。\n角色行当“一行多用”（生、旦、净、丑）；表演动作“一式多用”（唱、念、做、打）；声腔音乐“一曲多用”（基本曲牌）；舞台布景“一景多用”（如一桌两椅）；服饰脸谱“一服多用”。\n此外还有“一人千面”（一套程式、万千性格）、“一曲百情”“一步千态”“一笑百媚”。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-18","list":9,"num":18,"word":"戏曲源流：秦汉至宋金元明清","phonetic":"二、戏曲艺术","meanings":[{"pos":"","def":"中国戏曲的渊源可以追溯到秦汉时期的乐舞、俳优、百戏。\n唐代有较大发展，出现歌舞戏和参军戏，“戏”和“曲”进一步融会，表演形式更为多样。\n宋金时期戏曲艺术才真正趋于成熟：宋杂剧和金院本都能演出完整故事，剧中角色较前增多，初步形成我国戏曲表演分行当的体系。\n元代戏曲创作和演出空前繁荣，元杂剧在中国戏曲史上占有重要地位。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-19","list":9,"num":19,"word":"元杂剧双璧：《窦娥冤》《西厢记》","phonetic":"二、戏曲艺术","meanings":[{"pos":"","def":"元代戏曲创作和演出空前繁荣，元杂剧在中国戏曲史上占有重要的地位。\n尤以关汉卿的《窦娥冤》和王实甫的《西厢记》最为著名，堪称世界戏剧艺术的不朽作品。\n明清时期是中国戏曲史上又一个繁荣时期，出现浪漫主义杰作汤显祖的《牡丹亭》。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-20","list":9,"num":20,"word":"昆曲：最古老的剧种之一","phonetic":"二、戏曲艺术","meanings":[{"pos":"","def":"昆曲也称昆剧，是我国最古老的剧种之一，迄今已有六七百年的历史。\n昆曲发源于江苏昆山，明末清初呈现蓬勃兴盛的局面，并形成众多流派，对许多地方剧种产生过影响。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-21","list":9,"num":21,"word":"京剧的形成与京白韵白","phonetic":"二、戏曲艺术","meanings":[{"pos":"","def":"京剧是流行全国的大剧种，自200年前“四大徽班”进京演出后逐渐形成。\n它广泛吸收其他剧种的长处，剧目丰富多彩，曲调非常丰富，唱词通俗易懂；念白分京白、韵白两种（2024年真题）；表演各行当均有一套规范的程式化动作。\n因此很快成为中国戏曲艺术的代表，影响遍及全国，蜚声中外。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-22","list":9,"num":22,"word":"京剧名家：谭派麒派与四大名旦","phonetic":"二、戏曲艺术","meanings":[{"pos":"","def":"京剧最著名的流派有“谭派”（谭鑫培）、“麒派”（周信芳）、“盖派”（盖叫天）。\n“四大名旦”：梅兰芳、程砚秋、荀慧生、尚小云。\n“后四大须生”：马连良、谭富英、杨宝森、奚啸伯。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-23","list":9,"num":23,"word":"豫剧、越剧、评剧的代表作","phonetic":"二、戏曲艺术","meanings":[{"pos":"","def":"豫剧又称河南梆子，流行于河南及邻近地区，唱腔清晰流畅，表演真切细腻，是梆子声腔系统中影响最大的剧种，出现常香玉等名演员，剧目有《花木兰》《穆桂英挂帅》《秦香莲》《朝阳沟》。\n越剧兴起于浙江、上海，三四十年代在“女子文戏”基础上改革，以女演员扮演各行当，涌现袁雪芬、徐玉兰、王文娟和《红楼梦》《梁山伯与祝英台》《祥林嫂》。\n评剧流行于华北、东北，新凤霞主演《刘巧儿》、小白玉霜主演《秦香莲》。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-24","list":9,"num":24,"word":"地方剧种与“唐三千宋八百”","phonetic":"二、戏曲艺术","meanings":[{"pos":"","def":"地方大剧种：广东的粤剧，中南地区的汉剧，西南地区的川剧，华北地区的河北梆子。\n中国古典戏曲文化史上一个值得注意的现象：从剧目题材看历史演义占有极大比重，有“唐三千，宋八百，数不清的是三国”之说；西方古典戏剧大多取材于神话。\n这同儒家文化在传统文化中的主导地位分不开：儒家以伦理道德为本位，把道德政治化、又把政治道德化，形成“隆礼贵义”的伦理精神，强调以史为鉴，故中国戏曲往往具有重要的历史教化意义。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-25","list":9,"num":25,"word":"美与善的统一：中西美学对比","phonetic":"二、戏曲艺术","meanings":[{"pos":"","def":"中国传统美学更加强调美与善的统一，和西方传统美学强调美与真的统一形成了十分鲜明的对比。\n再加上“天人合一”的宇宙意识和崇尚圆满的世俗心理，中国古典戏曲多数以大团圆结局，以达善有善报、恶有恶报。\n西方传统戏剧从古希腊开始悲剧和喜剧便相互独立，认为悲剧就该“一悲到底”，从《俄狄浦斯王》到《哈姆雷特》，舞台上的男女主人公几乎全部死亡。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-26","list":9,"num":26,"word":"大团圆之一：寄希望于清官","phonetic":"二、戏曲艺术","meanings":[{"pos":"","def":"为了达到善有善报、恶有恶报的结局，中国戏曲采用许多独特方法，其一寄希望于清官。\n传统剧目中有许多“包公戏”，最著名的是《秦香莲》：陈世美考中状元后贪图富贵、喜新厌旧，当上驸马后派杀手去刺杀妻子秦香莲和两个孩子，连杀手都不忍下手、自尽身亡；由于国太和公主庇护，他仍然逍遥法外。\n包公受理此案，不畏强权、为民申冤，抬出先王御赐的“龙头铡”处死陈世美，最终惩罚邪恶、伸张正义。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-27","list":9,"num":27,"word":"大团圆之二：寄希望于老天","phonetic":"二、戏曲艺术","meanings":[{"pos":"","def":"其二寄希望于老天。元杂剧《窦娥冤》中窦娥被人诬告后遇到了一个昏官，临刑时满腔悲愤、呼天抢地，她许下的三桩“无头愿”一一实现，尤其神奇的是六月飞雪，表明冤情感天动地、震撼人心。\n虽然窦娥受尽人间一切苦难，但最终誓愿实现，老天爷为她洗净冤屈、伸张正义，加之后来恶棍张驴儿被杀，仍然是“善有善报，恶有恶报”的结局。\n原文另举日本历史最长的戏剧“能乐”为例。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-28","list":9,"num":28,"word":"大团圆之三、之四：想象与神话","phonetic":"二、戏曲艺术","meanings":[{"pos":"","def":"其三寄希望于想象。越剧《梁山伯与祝英台》中梁祝爱情被活活拆散，梁山伯抱恨而死；祝英台被迫嫁到马家，完婚途中经过梁墓，下轿哭祭，风雨大作、雷电交加，坟墓裂开，英台纵身跳入，墓中飞出一双彩蝶。\n其四寄希望于神话。2008年底根据聊斋故事拍摄的《画皮》结尾三对人物全部团圆：男人与女人、男鬼与女鬼、男妖与女妖。\n昆曲《牡丹亭》中杜丽娘病死，因书生柳梦梅执着的爱情召唤而复活，两人终成眷属。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-29","list":9,"num":29,"word":"戏曲特征一：高度的综合性","phonetic":"二、戏曲艺术","meanings":[{"pos":"","def":"中国戏曲的审美特征表现在综合性、程式化、虚拟性三个方面，这也是东方戏剧与西方戏剧明显的区别。\n综合性是最基本的审美特征：戏曲是一门歌、舞、剧高度综合的艺术，表演手段是唱、念、做、打，其中唱功占有重要地位。\n这种高度的综合性是中国戏曲与西方话剧的重大区别，也使戏曲舞台营造出富有诗情画意的戏剧氛围。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-30","list":9,"num":30,"word":"程式化：行当与表演的固定规则","phonetic":"二、戏曲艺术","meanings":[{"pos":"","def":"程式化指戏曲演员的角色行当、表演动作和音乐唱腔等，都有一些特殊的固定规则。\n角色行当程式化：一般划分为生、旦、净、丑四种基本类型。生（男性）分老生、小生、武生；旦（女性）分青衣、花旦、刀马旦、老旦；净分铜锤花脸、架子花脸；丑分文丑、武丑。\n表演动作程式化：一举一动、一招一式都有相对固定的格式，常用的程式性动作甚至还有固定的名称。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-31","list":9,"num":31,"word":"程式动作：起霸、走边、趟马","phonetic":"二、戏曲艺术","meanings":[{"pos":"","def":"“起霸”通过一整套连贯的戏曲舞蹈动作，表现古代将士出征前整盔束甲的情景，又分男霸、女霸、双霸等形式。\n“走边”表现人物悄然潜行，有一套专门的出场形式和舞台行动线路，配合音乐锣鼓进行。\n“趟马”也叫“跑马”，用连贯的戏曲舞蹈动作表现人物策马疾行，可分单人、双人、多人趟马。\n基本功还有“甩发功”“水袖功”“扇子功”“手绢功”等，不同行当各有整套程式动作。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-32","list":9,"num":32,"word":"曲牌板式各有固定用途","phonetic":"二、戏曲艺术","meanings":[{"pos":"","def":"戏曲的音乐、唱腔和器乐伴奏都有一些基本固定的曲牌和板式；人物出场的伴奏音乐有一定固定规则，各种器乐曲牌都有自己特定的用途，分别用于不同场合，彼此不能混淆或替换。\n皇帝出场大多用[朝天子]等曲牌伴奏；主帅出场大多用唢呐曲牌[水龙吟]伴奏；[万年欢]用于摆宴、迎亲等场合；[哭皇天]用于祭奠、扫墓等场合。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-33","list":9,"num":33,"word":"虚拟性：表演、布景与时空","phonetic":"二、戏曲艺术","meanings":[{"pos":"","def":"虚拟性指戏曲充分吸收我国古典美学注重写意的特点，通过“虚实相生”“以形写神”，使演员更加充分地利用戏曲舞台有限的时空，更加广阔地反映现实生活与表现思想感情。\n一是演员表演的虚拟性：多用虚拟动作，不用实物或只用部分实物。\n二是道具布景的虚拟性：舞台大多不用布景，常常只用很少几件道具。\n三是舞台时空的虚拟性：表现的不是真实世界中的客观时空，而通过唱腔、念白和动作以虚拟手法表现，具有高度灵活自由的主观性。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-34","list":9,"num":34,"word":"虚拟性例证：追韩信与三岔口","phonetic":"二、戏曲艺术","meanings":[{"pos":"","def":"话剧要求情节、时间、地点三方面保持完整一致，即古典主义戏剧的“三一律”法则，戏曲则不受此限。\n京剧《萧何月下追韩信》中，演员在舞台上跑几个圆场就表示赶了几十里路程。\n昆曲《夜奔》中林冲深夜潜逃、疲乏之极在庙内酣睡一夜，表现这一切只花几十秒钟，时间处理只用打击乐的更鼓。\n京剧《三岔口》同一舞台既是郊外又是客店，空间转换全凭虚拟动作；格斗整整打了一个晚上，舞台时间却只有几十分钟；灯火通明的舞台上演出黑夜搏斗，观众却仿佛身临其境。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-35","list":9,"num":35,"word":"电影的定义与“第七艺术”","phonetic":"三、电影艺术","meanings":[{"pos":"","def":"电影是现代科学技术与艺术相结合的产物，通过画面、声音和蒙太奇等电影语言，在银幕上创造出感性直观的形象，再现和表现生活。\n由于电影诞生在音乐、舞蹈、戏剧、绘画、雕塑、建筑之后，所以常被人们称作“第七艺术”。\n在迄今为止的所有艺术种类中，只有电影和电视是人们知道其诞生日的两门艺术。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-36","list":9,"num":36,"word":"电影的诞生：卢米埃尔兄弟","phonetic":"三、电影艺术","meanings":[{"pos":"","def":"1895年12月28日晚上，法国人卢米埃尔兄弟在巴黎一家大咖啡馆的地下室里，放映了他们自己拍摄的《火车进站》《水浇园丁》等短片。\n这一天被电影史学家们定为电影正式诞生的日子，标志着无声电影时代的开始（2024年真题：19世纪末）。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-37","list":9,"num":37,"word":"中国电影：从《定军山》到《难夫难妻》","phonetic":"三、电影艺术","meanings":[{"pos":"","def":"中国电影诞生于1905年，当时的北京丰泰照相馆拍摄了第一部国产片《定军山》，由著名京剧演员谭鑫培主演，严格意义上讲是一部戏曲舞台纪录片。\n中国第一部故事片是《难夫难妻》（1913）。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-38","list":9,"num":38,"word":"电影四大片种与多样样式","phonetic":"三、电影艺术","meanings":[{"pos":"","def":"从总体上讲，电影的样式分为故事片、纪录片、科教片、美术片四大部类（2024年真题考点）；体裁上还包括诗电影、散文电影、小说电影和戏剧式电影等。\n以苏联蒙太奇电影学派为代表，涌现出爱森斯坦的《战舰波将金号》（1925）、普多夫金的《母亲》（1926）。\n以美国好莱坞电影最为著名，出现《魂断蓝桥》（1940）、《卡萨布兰卡》（1943）等；50至60年代纪实性电影达到高峰，如意大利的《罗马11时》（1952）。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-39","list":9,"num":39,"word":"电影前两次变革：有声与彩色","phonetic":"三、电影艺术","meanings":[{"pos":"","def":"第一次大变革是从无声到有声：最初的电影都是无声电影，被称为“默片”；一般认为有声电影诞生的标志是1927年美国的《爵士歌王》；中国第一部有声片是1931年的《歌女红牡丹》。\n第二次大变革是从黑白到彩色：1935年使用彩色胶片拍摄的美国影片《浮华世界》诞生，是世界上第一部彩色电影；中国第一部彩色故事片《生死恨》（1948）又是一部戏曲艺术片，由梅兰芳主演、费穆导演。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-40","list":9,"num":40,"word":"第三次变革：进入高科技时代","phonetic":"三、电影艺术","meanings":[{"pos":"","def":"第三次大变革发生在20世纪90年代以来至今，电影正大踏步地进入高科技时代，高科技手段以极富想象力的艺术手法和极其逼真的艺术效果，大大增强了电影艺术的魅力。\n例：《真实的谎言》中的战斗机、《侏罗纪公园》里的恐龙、《泰坦尼克号》的沉船、《玩具总动员》由1500个镜头组成的三维动画、《哈利·波特》的魔法、《指环王》七万魔兵大战、3D电影《阿凡达》、《少年派的奇幻漂流》。\n国产影片《流浪地球》（2019）、《长津湖》（2022）、《长安三万里》（2023）也体现出数字技术的巨大魅力。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-41","list":9,"num":41,"word":"电影综合性的三个层次","phonetic":"三、电影艺术","meanings":[{"pos":"","def":"电影也是一门综合艺术，它的综合性可以分为三个层次。\n其一，各门艺术的综合：与戏剧关系密切，戏剧为电影提供了许多可贵的经验；受文学的极大影响；从绘画、雕塑中吸取造型艺术的规律，使造型性成为重要美学特性；与音乐结下不解之缘；与摄影艺术有着与生俱来的天然联系。\n其二，科学与艺术的综合。\n其三，美学层次上的综合。\n各门艺术的多种元素进入影视之后已发生质的变化，被影视艺术同化吸收，使影视成为与众不同的独立艺术。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-42","list":9,"num":42,"word":"影视艺术语言：画面、声音、蒙太奇","phonetic":"三、电影艺术","meanings":[{"pos":"","def":"影视艺术语言主要就是画面、声音和蒙太奇这三种。\n画面通过摄像机镜头拍摄记录：景别（远景、全景、中景、近景、特写）、焦距（标准、长焦、短焦、变焦镜头）、镜头运动（推、拉、摇、移、跟、降、升）、角度（平视、俯视、仰视）以及光线、色彩和画面构图，共同组成画面造型。\n声音分人声（对话、独白、旁白）、音乐、音响三大类型，共同组成声音造型，并与画面相互配合，增强表现力和感染力。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-43","list":9,"num":43,"word":"蒙太奇：源于建筑学的三层含义","phonetic":"三、电影艺术","meanings":[{"pos":"","def":"蒙太奇原为建筑学用语，意为装配、组合、构成等，在影视艺术中用来指画面、镜头和声音的结构方式。\n技术层面：蒙太奇就是剪辑。\n艺术层面：蒙太奇是电影的基本结构手段和叙事方式。\n美学层面：蒙太奇是影视艺术独特的思维方式，也是一种创作方法；蒙太奇思维是影视艺术独特的思维方法。\n不但镜头与镜头、段落与段落，甚至画面与声音均可构成蒙太奇组合关系。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-44","list":9,"num":44,"word":"好莱坞类型片十二种与魔幻片","phonetic":"三、电影艺术","meanings":[{"pos":"","def":"好莱坞类型片大致可划分为12种：西部片、喜剧片、犯罪片（惊险片）、科幻片、歌舞片、战争片、爱情片、动作片、伦理片、灾难片、儿童片、恐怖片（惊悚片）。\n近年来随着数字技术的发展和观众审美趣味的变化，又出现受到广大观众欢迎的第13种类型“魔幻片”，包括《哈利·波特》《指环王》《纳尼亚传奇》《阿凡达》《少年派的奇幻漂流》。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-45","list":9,"num":45,"word":"电影艺术的四个主要特点","phonetic":"三、电影艺术","meanings":[{"pos":"","def":"群众性和影响力：遍及世界各个国家、地区和民族，曾被称为“盛在铁盒子里的大使”；既是耗资巨大的物质生产，又是影响巨大的精神生产。\n商品性：既是一门艺术，又是一种特殊形态的商品，将艺术、文化、传媒、商品集于一身。\n社会性和时代性：作为时代的多棱镜与社会的万花筒，展现不同时代社会生活的斑斓图景。\n民族性和国际性：既是国际文化交流的重要载体，又有浓郁的民族风格和民族特色。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-46","list":9,"num":46,"word":"电视的定义与四大功能","phonetic":"四、电视艺术","meanings":[{"pos":"","def":"电视是现代科学技术高度发展的产物，也是20世纪人类最伟大的发明之一。\n与电影、广播相比，电视是更为年轻的传播工具，然而它的发展之快、影响之大，却是此前其他传播媒介所无法比拟的。\n电视具有新闻信息功能、文艺娱乐功能、社教功能和服务功能，前两种功能是主要的。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-47","list":9,"num":47,"word":"电视事业的四个里程碑","phonetic":"四、电视艺术","meanings":[{"pos":"","def":"1936年11月2日，英国广播公司（BBC）在伦敦郊外的亚历山大宫播出一场规模盛大的歌舞，标志着世界上第一座电视台正式开播，人们普遍把这一天作为电视事业的开端。\n1954年，美国正式开办彩色电视节目，成为世界上第一个播出彩色电视节目的国家。\n1958年5月1日，我国第一座电视台——中央电视台的前身北京电视台开始实验播出，标志中国电视事业的开端；1958年6月15日又播放我国第一部电视剧《一口菜饼子》，中国电视艺术从此诞生。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-48","list":9,"num":48,"word":"电视艺术的种类与电视剧地位","phonetic":"四、电视艺术","meanings":[{"pos":"","def":"电视艺术作为电视节目的重要组成部分，主要指电视屏幕上播出的各式各类文艺节目：电视剧、电视综艺节目、电视艺术片、电视专题文艺节目、音乐电视（MTV）、电视文艺谈话类节目、电视娱乐节目（游戏类、益智类、竞赛类及“真人秀”）等。\n还包括直播或播映的电视文学、电视音乐、电视舞蹈、电视曲艺杂技、电视戏曲、电视戏剧、电视电影，乃至艺术体操、冰上舞蹈、时装表演等亚艺术节目。\n电视剧是电视艺术的主要类型。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-49","list":9,"num":49,"word":"电视剧的四种主要品种","phonetic":"四、电视艺术","meanings":[{"pos":"","def":"单本剧：有独立的故事或情节，基本一次播完（或分上中下三集），情节紧凑、人物不多，时间约半小时至两小时。\n连续剧：情节曲折复杂，人物较多，主要人物和情节连贯，每集结尾留悬念，如《四世同堂》（28集）、《红楼梦》（36集）。\n系列剧：几个主要人物贯穿全剧，但故事情节不连贯，每集完整独立，可任意选看，如《编辑部的故事》（2024年真题）。\n电视小品：电视剧中的“轻骑兵”，播映时间短，人物情节单纯，相当于近年出现的“微电影”。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-50","list":9,"num":50,"word":"电视艺术的三大审美特征","phonetic":"四、电视艺术","meanings":[{"pos":"","def":"技术性：电视画面面积较小、清晰度较差，难以表现众多人物和较大场面，镜头多用中、近景和特写，少用远景和全景，场景转换不宜太快。\n参与性：观众一般在家里观看，可随意选择收看并当场评论，需调动各种艺术手段吸引观众，使其对剧中人物产生移情和共鸣。\n生活化：传播迅速，许多节目可现场直播；电视剧制作周期短、成本较低、设备轻便、室内戏多，剧情、表演、服装道具都要求更加亲切自然。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-51","list":9,"num":51,"word":"真人秀《老大哥》与三大特征","phonetic":"四、电视艺术","meanings":[{"pos":"","def":"20世纪90年代荷兰的《老大哥》开创了世界电视“真人秀”节目的先河（2024年真题：核心是游戏）。\n三大特征：第一，“真”与“秀”的结合，即纪实性与表演性的结合；第二，平民性与参与性相结合，平民性、大众性、草根性、参与性是明显特点；第三，核心是游戏，游戏性与竞争性突出。\n例：东方卫视的《舞林大会》、湖南电视台的《爸爸去哪儿》。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-52","list":9,"num":52,"word":"综合性：艺术学与美学两层次","phonetic":"综合艺术的审美特征","meanings":[{"pos":"","def":"综合艺术首要的审美特征就是综合性，体现在两个层次上。\n从艺术学层次讲，戏剧、戏曲、电影和电视艺术吸收了各门艺术中的多种元素，将它们有机融汇在自己的表现手段之中，大大丰富了艺术表现力。\n从美学层次讲，综合艺术实现了美学层次上的高度综合，将视与听、时与空、动与静、再现与表现集于一身，极大扩展和丰富了观众的审美感受，成为最具有群众性的艺术门类。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-53","list":9,"num":53,"word":"独特性：话剧与戏曲的三点区别","phonetic":"综合艺术的审美特征","meanings":[{"pos":"","def":"虽都是综合艺术，但戏剧和戏曲是古老的传统艺术，电影和电视是现代科学技术的产物；渊源于西方的话剧与植根中国的戏曲、银幕艺术与荧屏艺术也各有鲜明区别。\n表现侧重点不同：话剧注重再现生活，舞台美术大多写实具象，布景、化妆、服装、灯光、效果、道具都力求真实；戏曲注重表现生活，舞台美术基本是写意抽象的。\n表演艺术不同：话剧建立在体验基础上，演员须从客观现实中找到创造角色的依据；戏曲是表现性艺术，把生活动作变形夸张为唱念做打与手眼身步，并划分生旦净丑行当。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-54","list":9,"num":54,"word":"情节性与戏剧性情节的区别","phonetic":"综合艺术的审美特征","meanings":[{"pos":"","def":"戏剧、戏曲、电影、电视剧基本都属于叙事性艺术，需要由人物行动、人物之间的关系形成有完整过程的生活事件，因而一般都具有故事情节，并以矛盾冲突为情节发展的主要线索。\n戏剧性情节按戏剧冲突律法则结构，往往有强烈冲突和曲折故事，大量运用巧合、悬念，结构上有开端、发展、高潮、结局；戏剧和戏曲主要采用。\n例：曹禺《原野》、莎士比亚《罗密欧与朱丽叶》、《秦香莲》，电影《一江春水向东流》《十面埋伏》《天下无贼》。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-55","list":9,"num":55,"word":"非戏剧性情节与纪实美学","phonetic":"综合艺术的审美特征","meanings":[{"pos":"","def":"非戏剧性情节建立在纪实性美学基础之上，主要不是依靠人工编造故事，而是致力于从生活中发掘情节，更多采用心理结构、情绪结构等方式，注重发掘人物内心的情感冲突，使情节更接近于生活事件本身。\n例：获奥斯卡奖的美国影片《克莱默夫妇》《金色池塘》，在国际上获奖的中国影片《城南旧事》《黄土地》《秋菊打官司》《一个都不能少》。\n电影和电视既采用戏剧性情节，也越来越注意运用非戏剧性情节。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-56","list":9,"num":56,"word":"主人公：作品内容的中心","phonetic":"综合艺术的审美特征","meanings":[{"pos":"","def":"主人公是戏剧、戏曲、电影、电视剧作品中的主要人物或中心人物，是作品集中刻画的人物形象、作品内容的中心、矛盾冲突的主体、情节展开的依据。\n塑造鲜明、生动、富有个性的主人公形象，是戏剧影视艺术最根本的任务。\n例：《哈姆雷特》以哈姆雷特同克劳狄斯的外部冲突及内心冲突构成戏剧矛盾；《巴顿将军》围绕巴顿的性格、爱好与内心世界展开冲突；《渴望》塑造了刘慧芳这一妇女形象。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-57","list":9,"num":57,"word":"文学性：综合艺术的基础","phonetic":"综合艺术的审美特征","meanings":[{"pos":"","def":"综合艺术一度创作的核心是文学剧本，二度创作的核心是表演艺术；文学性是综合艺术的基础。\n在所有的艺术门类中，唯有综合艺术与文学的关系最为密切：创作首先从剧作者编写文学剧本开始，导演、演员才能在此基础上进行二度创作。\n文学剧本不仅是创作的第一道工序，更重要的是导演和演员进行再创作的依据。\n例：老舍《茶馆》展现从戊戌变法到抗战胜利近50年的社会变迁；郭沫若《屈原》概括屈原30多年生涯。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-58","list":9,"num":58,"word":"表演性：综合艺术的中心环节","phonetic":"综合艺术的审美特征","meanings":[{"pos":"","def":"表演性是综合艺术的中心环节，综合艺术之所以能把各门艺术的众多元素综合在一起，就是由于表演将各种艺术元素有机地融会在一起。\n表演指演员依据剧作家提供的剧本，按照剧本规定情境和角色的思想感情，在导演指导下进行二度创作，运用语言、动作创造人物形象。\n表演艺术的核心是解决演员与角色间的矛盾；关键是掌握好“体验角色”和“表现角色”这一对矛盾。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-59","list":9,"num":59,"word":"《哈姆雷特》的剧情与人文主义典型","phonetic":"一、《哈姆雷特》（戏剧艺术）","meanings":[{"pos":"","def":"《哈姆雷特》是英国诗人、戏剧家莎士比亚的剧作，莎翁“四大悲剧”之一，约在1603年首演，取材于《丹麦史》和一个失传的丹麦王子复仇记旧剧。\n丹麦王子哈姆雷特因父亲暴卒回国奔丧，见叔父克劳狄斯已登上王位并娶了母后；父亲亡灵揭露克劳狄斯毒死自己并篡位的真相。他在复仇过程中历经挣扎，失去爱人和亲人，在濒死之际奋力一剑刺死克劳狄斯。\n哈姆雷特身上集中体现着文艺复兴运动中人文主义者的优点和缺点及他们的迷惘、矛盾和痛苦，成为世界文学中不朽的典型形象。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-60","list":9,"num":60,"word":"莎士比亚四大悲剧与四大喜剧","phonetic":"一、《哈姆雷特》（戏剧艺术）","meanings":[{"pos":"","def":"莎士比亚被称为“英国戏剧之父”，马克思赞誉他是“人类最伟大的戏剧天才”。\n“四大悲剧”：《哈姆雷特》《奥赛罗》《李尔王》《麦克白》，记忆口诀“哈罗李白”。\n“四大喜剧”：《威尼斯商人》《仲夏夜之梦》《第十二夜》《皆大欢喜》，记忆口诀“中国威武，十分欢喜”（仲、威、十、欢喜）。\n另有历史剧《理查三世》《亨利四世》，喜剧《无事生非》，悲剧《罗密欧与朱丽叶》。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-61","list":9,"num":61,"word":"《哈姆雷特》的地位与弗洛伊德解读","phonetic":"一、《哈姆雷特》（戏剧艺术）","meanings":[{"pos":"","def":"在莎士比亚的“四大悲剧”中，《哈姆雷特》是最早创作并且影响最大的一部作品，是莎翁悲剧创作最高成就的标志。\n该剧以写意的抒情风格与诗化的语言著称于世，尤其是哈姆雷特的几段独白（如著名的“生存还是毁灭”）。\n弗洛伊德在《梦的解析》中用“恋母情结”加以解释，认为《哈姆雷特》与《俄狄浦斯王》来自同一根源。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-62","list":9,"num":62,"word":"《老妇还乡》与西方悲剧三阶段","phonetic":"二、《老妇还乡》（戏剧艺术）","meanings":[{"pos":"","def":"瑞士当代作家迪伦马特的悲喜剧《老妇还乡》（又名《贵妇还乡》）作于1956年，它使剧作家获得了国际声誉。\n欧洲戏剧史常将悲剧分为：命运悲剧（古希腊悲剧）——古典主义悲剧、性格悲剧（莎士比亚悲剧）——浪漫主义悲剧、社会悲剧（易卜生悲剧）——现实主义悲剧。\n悲喜剧电影例证：苏联导演梁赞诺夫“爱情三部曲”《命运的捉弄》《办公室的故事》《两个人的车站》；日本山田洋次《幸福的黄手帕》（1977）与《蒲田进行曲》（1982）。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-63","list":9,"num":63,"word":"《窦娥冤》的剧情与三桩誓愿","phonetic":"四、《窦娥冤》（戏曲艺术）","meanings":[{"pos":"","def":"《窦娥冤》全名《感天动地窦娥冤》，又名《六月雪》，中国十大古典悲剧之一，是元代杂剧家关汉卿晚年的作品、其悲剧代表作。\n窦娥幼年因家贫被卖蔡家做童养媳，婚后丈夫夭亡；蔡婆向赛卢医索债险些被害，恰被张驴儿父子救下，恶棍张驴儿父子想霸占婆媳，窦娥执意不从；张驴儿在汤里放毒想害死蔡婆，不料被其父喝下身亡，转而诬告窦娥，官府严刑逼供，窦娥为救婆婆屈打成招。\n临刑前发三桩誓愿：“血溅三尺，六月降雪，三年大旱”，一一应验；三年后其父金榜题名为官，窦娥冤魂托梦，冤情得以昭雪。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-64","list":9,"num":64,"word":"关汉卿：元杂剧代表作家","phonetic":"四、《窦娥冤》（戏曲艺术）","meanings":[{"pos":"","def":"关汉卿号已斋叟，元大都（今北京）人，在元代剧坛上有着十分重要的地位。\n他一生作杂剧60余部，现存18部；1958年，关汉卿被列为世界纪念文化名人之一。\n中西悲剧结局对比：西方悲剧遵循“一悲到底”的悲剧结局原则；中国戏曲悲剧结局往往是“善有善报，恶有恶报”，即清代著名戏曲理论家李渔所讲“有团圆之趣”（《闲情偶寄》）。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-65","list":9,"num":65,"word":"《一江春水向东流》与现实主义高峰","phonetic":"五、《一江春水向东流》（电影艺术）","meanings":[{"pos":"","def":"《一江春水向东流》是中国电影故事片，1947年联合摄制，蔡楚生、郑君里编剧兼导演，陶金、白杨、舒绣文、上官云珠、吴茵等主演，被视为中国20世纪三四十年代现实主义电影艺术的最高峰。\n影片分上下两集：上集《八年离乱》，下集《天亮前后》；以抗战前后张忠良和素芬一个普通家庭的悲欢离合为主线，揭露上层社会的腐朽荒淫以及官场的黑暗。\n片名取自南唐后主李煜的《虞美人》：“问君能有几多愁？恰似一江春水向东流。”"}],"related":[],"section":"第9章","marked":false},{"id":"C09-66","list":9,"num":66,"word":"中国电影三次辉煌时期","phonetic":"五、《一江春水向东流》（电影艺术）","meanings":[{"pos":"","def":"第一个辉煌时期是20世纪三四十年代，《一江春水向东流》正是其代表作品。\n第二个辉煌时期是20世纪五六十年代，即1949年新中国成立到1966年“文化大革命”爆发的中国电影，又称“十七年”中国电影。\n第三个辉煌时期是20世纪80年代“新时期”中国电影：以徐克、许鞍华为代表的香港“新浪潮”，以侯孝贤、杨德昌为代表的台湾“新电影运动”，以陈凯歌、张艺谋为代表的内地“第五代”导演群体。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-67","list":9,"num":67,"word":"《卧虎藏龙》：李安与奥斯卡","phonetic":"六、《卧虎藏龙》（电影艺术）","meanings":[{"pos":"","def":"《卧虎藏龙》由李安担任导演，周润发、杨紫琼、章子怡、张震等主演，获第七十三届奥斯卡最佳外语片奖等四个奖项（2024年真题：导演李安）。\n李安曾拍摄根据英国奥斯汀小说改编的《理智与情感》并获柏林影展金熊奖，美国《时代》杂志因此把《卧虎藏龙》比喻成“一部中国功夫版的《理智与情感》”。\n李安另有“家庭伦理三部曲”（《推手》《喜宴》《饮食男女》）、《断背山》《少年派的奇幻漂流》。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-68","list":9,"num":68,"word":"《罗生门》：黑泽明与多视角叙事","phonetic":"七、《罗生门》（电影艺术）","meanings":[{"pos":"","def":"《罗生门》是日本黑白故事片，日本大映株式会社1950年出品，导演黑泽明；1950年获威尼斯国际电影节大奖，次年又获美国奥斯卡最佳外语片奖，日本电影由此日益受到国际影坛关注。\n该片使黑泽明一举成名，标志着日本电影进入一个新的纪元，他被人们尊称为“黑泽天皇”，后又拍摄《七武士》《蜘蛛巢城》《影子武士》《乱》。\n最独特之处：同一个事件，四个人却有四种不同的说法。\n同期名片：戈达尔《筋疲力尽》、费里尼《八部半》、伯格曼《处女泉》。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-69","list":9,"num":69,"word":"《现代启示录》：科波拉的越战史诗","phonetic":"八、《现代启示录》（电影艺术）","meanings":[{"pos":"","def":"《现代启示录》是美国宽银幕彩色故事片，1979年出品，导演科波拉，主演马龙·白兰度和马丁·希恩，影片根据康拉德小说《黑暗的心》改编。\n获1979年法国戛纳国际电影节金棕榈奖，以及奥斯卡最佳摄影、最佳音响两项金像奖。\n片名取自《圣经·新约全书》中的最后一篇《启示录》；主要人物中没有女性，是一部典型的男性题材战争片；被评论界认为是最深刻、最有代表性的一部越战影片，“一部登峰造极的战争史诗片”。\n同题材影片还有《猎鹿人》《野战排》《全金属外壳》《早安，越南》《生于七月四日》。"}],"related":[],"section":"第9章","marked":false},{"id":"C10-01","list":10,"num":1,"word":"语言艺术的定义与四种体裁","phonetic":"第10章 语言艺术","meanings":[{"pos":"","def":"语言艺术即人们常说的文学，包括诗歌、散文、小说、剧本等各种体裁。\n文学以语言为手段塑造艺术形象、反映社会生活、表达作者思想情感。\n语言作为艺术媒介和基本材料始终发挥重要作用，因此人们一般将文学称为语言艺术。\n答题三步：说明“即文学”→列出四种体裁→点明语言是媒介。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-02","list":10,"num":2,"word":"诗歌的定义与最早出现的体裁","phonetic":"一、诗歌","meanings":[{"pos":"","def":"诗歌是文学的基本体裁之一，用语言塑造形象以反映社会生活和表达思想感情。\n诗歌在文学发展历史上出现最早，是历史最久、流行最广的文学体裁。\n艺术起源时期诗歌与音乐、舞蹈三者常融为一体，后来才逐渐发展成独立的艺术形式。\n古代把不和乐者称“诗”、和乐者称“歌”，现在一般统称为诗歌。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-03","list":10,"num":3,"word":"《诗经》是我国现实主义诗歌源头","phonetic":"一、诗歌","meanings":[{"pos":"","def":"我国最早一部诗歌总集是《诗经》。\n产生时代上自西周初期（公元前11世纪），下至春秋中期（公元前6世纪），最后于春秋时期汇编而成。\n它是我国现实主义诗歌的源头。\n2024年真题“开创我国现实主义源头的作品”，答案是《诗经》，不是《楚辞》。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-04","list":10,"num":4,"word":"屈原《离骚》开创浪漫主义先河","phonetic":"一、诗歌","meanings":[{"pos":"","def":"我国文学史上第一位杰出诗人是屈原。\n他创作了古代最早的一篇抒情长诗《离骚》。\n《离骚》开创了我国浪漫主义诗歌的先河。\n记忆：诗现实、骚浪漫；《诗经》在前，《离骚》在后。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-05","list":10,"num":5,"word":"《荷马史诗》是西方流传至今最早作品","phonetic":"一、诗歌","meanings":[{"pos":"","def":"西方流传至今最早的文学作品，是诞生于公元前8世纪左右的古希腊《荷马史诗》。\n《荷马史诗》即《伊利亚特》和《奥德赛》两部史诗。\n它对后来诗歌的发展产生了很大影响。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-06","list":10,"num":6,"word":"诗歌分类的两组标准与四种诗体","phonetic":"2、诗歌的分类","meanings":[{"pos":"","def":"按作品的性质和塑造形象的方式不同，分为抒情诗和叙事诗。\n按诗歌的历史发展和语言有无格律，又分为格律诗和自由诗。\n两组标准交叉使用，同一首诗可以同时属于两类。\n口诀：性质分情、事，格律分旧、新（旧诗、新诗）。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-07","list":10,"num":7,"word":"抒情诗：直接抒发情思而不重情节","phonetic":"2、诗歌的分类","meanings":[{"pos":"","def":"主要通过直接抒发作者的思想情感、袒露诗人的内心世界，来间接地反映社会生活。\n不追求人物的刻画和情节的描述，而注重个人情思的抒发。\n诗中的生活现象和自然景物描写，也是托物言志或借景抒情，用以体现自己的感受与情绪。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-08","list":10,"num":8,"word":"《枫桥夜泊》：羁旅之情融入夜泊之景","phonetic":"2、诗歌的分类","meanings":[{"pos":"","def":"唐代诗人张继的《枫桥夜泊》：“月落乌啼霜满天，江枫渔火对愁眠。姑苏城外寒山寺，夜半钟声到客船。”\n以高度精练的语言描绘水乡秋夜所见、所闻、所感的各种景物。\n浓郁的羁旅之情融入夜泊之景，情绪仿佛随静夜钟声回荡，成为脍炙人口的名篇。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-09","list":10,"num":9,"word":"叙事诗：叙事与抒情水乳交融","phonetic":"2、诗歌的分类","meanings":[{"pos":"","def":"常常通过描述故事或塑造人物，来间接反映诗人对生活的认识、评价、愿望和理想。\n通常不像抒情诗那样直接抒发诗人自己的情感。\n而是将叙事与抒情水乳交融地结合，把诗人的主观感情融化在写人叙事之中。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-10","list":10,"num":10,"word":"《木兰诗》：替父从军的长篇叙事诗","phonetic":"2、诗歌的分类","meanings":[{"pos":"","def":"北朝民歌《木兰诗》全诗叙述木兰替父从军的故事。\n从女扮男装参军到建立战功返乡，在写人叙事中融入作者对木兰的敬佩赞誉之情。\n使这首长篇叙事诗具有浓厚的抒情意味，也使木兰形象千百年来深受群众喜爱。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-11","list":10,"num":11,"word":"格律诗：字句格式与音韵的严格规定","phonetic":"2、诗歌的分类","meanings":[{"pos":"","def":"又称旧诗，指按照一定的字句格式和音韵规律写出的诗歌作品。\n无论中国还是外国，格律诗都是古代形成的诗体。\n中国古典诗歌中的五绝、七绝、五律、七律都是格律诗，对仗、平仄、押韵都有严格规定，每句字数也有限制。\n欧洲的十四行诗也是格律诗，莎士比亚曾写过154首十四行诗。\n数字记忆：五绝、七绝各四句，五律、七律各八句，分别是五字、七字。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-12","list":10,"num":12,"word":"自由诗：惠特曼《草叶集》与五四新诗","phonetic":"2、诗歌的分类","meanings":[{"pos":"","def":"又称新诗，与格律诗相对，只求节奏和谐、押韵合辙，在句式、行数、字数、音韵上没有严格固定的限制和要求。\n一般认为美国19世纪诗人惠特曼是自由诗的创始者，代表作是诗集《草叶集》。\n五四前后，自由诗开始在我国流行，郭沫若、胡适、刘半农等在此期间均有新诗问世。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-13","list":10,"num":13,"word":"诗歌的两大特征：情感想象与语言意境","phonetic":"3.诗歌的特征","meanings":[{"pos":"","def":"特征一：强烈的情感和丰富的想象。诗歌通过诗人强烈的情感和丰富的想象，集中而概括地反映客观现实生活；任何艺术都是客观因素与主观因素的结合，而诗歌中主观因素明显占优势。\n特征二：语言美和意境美。诗歌特别注意运用优美的语言创造情景交融的意境。\n诗歌的语言，可以说是一切文学作品中最凝练、最优美、最富有音乐感的语言。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-14","list":10,"num":14,"word":"郭沫若《凤凰涅槃》的象征意蕴","phonetic":"3.诗歌的特征","meanings":[{"pos":"","def":"郭沫若作于五四时期的抒情长诗《凤凰涅槃》。\n熔中外神话于一炉，以有关凤凰的传说为素材。\n借凤凰“集香木焚，复从死灰中更生”的故事，抒发强烈的爱国主义热情。\n以凤凰的形象象征古老中华民族的觉醒。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-15","list":10,"num":15,"word":"王维、杜甫、杜牧诗中的意境例证","phonetic":"3.诗歌的特征","meanings":[{"pos":"","def":"王维：“月出惊山鸟，时鸣春涧中”（《鸟鸣涧》）、“山路元无雨，空翠湿人衣”（《山中》）、“明月松间照，清泉石上流”（《山居秋暝》）。\n杜甫：“窗含西岭千秋雪，门泊东吴万里船”（《绝句》）、“无边落木萧萧下，不尽长江滚滚来”（《登高》）。\n杜牧七绝《山行》：“远上寒山石径斜，白云生处有人家。停车坐爱枫林晚，霜叶红于二月花。”"}],"related":[],"section":"第10章","marked":false},{"id":"C10-16","list":10,"num":16,"word":"散文的定义：古代广义与五四后狭义","phonetic":"二、散文","meanings":[{"pos":"","def":"散文是文学的基本体裁之一。\n我国古代的散文范围很广泛，主要是指一种与韵文、骈文相对立的文体。\n近现代散文从狭义上理解，专指与诗歌、小说、剧本相并列的文学体裁，这是五四以后盛行的现代散文含义。\n散文自由灵活、不受拘束，选材广泛、手法多样、结构自由，以形散而神不散集中凝练地体现主题思想。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-17","list":10,"num":17,"word":"散文三大类：抒情、叙事、议论","phonetic":"2、散文的类别","meanings":[{"pos":"","def":"散文的种类丰富多样，一般将其分为抒情散文、叙事散文和议论散文三大类。\n这是【客观题】【名词解释】【简答题】★★考点，须记住三类名称并能各举作品。\n三类划分只具有相对意义，叙述、抒情和议论都是散文常用的手法。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-18","list":10,"num":18,"word":"抒情散文：托物言志、借景抒情","phonetic":"2、散文的类别","meanings":[{"pos":"","def":"注重在叙事写人时表现作者主观的感受与情绪，通过托物言志或借景抒情，抒发作者微妙复杂的独特情感，将浓郁的思想感情融会在动人的生活画面之中。\n例证一：冰心于1923年赴美留学期间创作的散文《往事》，通过作者在三个晚上观赏月光的不同感受，抒发身处异邦的思乡之情。\n例证二：朱自清的散文《荷塘月色》，也是通过对月夜的描写来抒发感情。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-19","list":10,"num":19,"word":"叙事散文：写真人真事的报告、传记、游记","phonetic":"2、散文的类别","meanings":[{"pos":"","def":"叙事散文包括报告文学、特写、速写、传记文学、游记等。\n侧重于叙述人物、景物或事件，尤其是现实生活中的真人真事，并将作者的主观情感蕴藏在对于人物和事件的叙述之中。\n例证：唐代柳宗元的游记《小石潭记》，以绘形绘神、绘声绘色的笔法将潭水、游鱼、岩石、树木逼真再现，又寓情于景，含蓄反映作者被贬谪后的寂寞失意之情。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-20","list":10,"num":20,"word":"议论散文：政论性与文学性结合的杂文","phonetic":"2、散文的类别","meanings":[{"pos":"","def":"议论散文主要是指杂文，它将政论性和文学性结合在一起，运用形象生动的语言以及比喻、反语等手法，乃至以幽默、讽刺为锐利武器，进行精辟深刻的说理和妙趣横生的议论。\n具有以理服人的理论说服力和以情感人的艺术感染力。\n例证：战国时代诸子百家的著作已具备杂文的特征；鲁迅《记念刘和珍君》、《六国论》都是议论散文。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-21","list":10,"num":21,"word":"散文特点一：自由灵活的四个方面","phonetic":"2、散文的特点","meanings":[{"pos":"","def":"自由灵活表现为题材的广泛性、手法的多样性和风格的多样化，还包括结构的多样化。\n题材上几乎无所不包，不受时间和空间的限制，上至天文、下至地理、古今均可入文。\n手法上叙述、抒情和议论常交叉运用，三类划分只具有相对意义。\n结构上文字可长可短、不拘一格，无需像诗歌那样遵守韵律节奏，也不必像小说那样需要典型人物和完整情节。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-22","list":10,"num":22,"word":"柳宗元散文题材广泛与诸家风格","phonetic":"2、散文的特点","meanings":[{"pos":"","def":"柳宗元既写山水游记《小石潭记》《钴鉧潭西小丘记》。\n也写揭露社会黑暗现实的叙事散文《捕蛇者说》《童区寄传》。\n又写富有哲理、发人深省的寓言《黔之驴》《罴说》，还写见解深刻的议论文《封建论》。\n风格上：韩愈雄奇豪放，柳宗元清峻奇崛，朱自清清新优美，鲁迅杂文犹如匕首和投枪，富于战斗性。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-23","list":10,"num":23,"word":"散文特点二：形散而神不散","phonetic":"2、散文的特点","meanings":[{"pos":"","def":"散文由于自由灵活，在结构形式上显得比较“散”。\n事实上优秀的散文总是形散而神不散，具有深刻的意蕴和凝练的主题。\n不论记人、叙事、说理、抒情，散文都要借生活中的事件与人物，抒发作者自己的思想和感情。\n这种蕴藏在作品之中的深刻思想意蕴，就是散文的“神”。\n例证：陶渊明《桃花源记》虚构美丽宁静的理想世界；朱自清《背影》记叙父亲在浦口车站送他北上念书的情景。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-24","list":10,"num":24,"word":"小说的定义与人物情节环境三要素","phonetic":"三、小说","meanings":[{"pos":"","def":"小说是一种以叙述故事、塑造人物形象为主的文学体裁。\n它的特点是在生活素材的基础上用虚构的方式来再现生活。\n人物、情节和环境是小说不可缺少的三个基本要素。\n根据容量大小和篇幅长短，分为长篇小说、中篇小说和短篇小说三大类。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-25","list":10,"num":25,"word":"小说按篇幅分长篇、中篇、短篇","phonetic":"2、小说的分类","meanings":[{"pos":"","def":"最常见的分类方法，是根据容量大小和篇幅长短，分为长篇小说、中篇小说和短篇小说三大类。\n长篇小说容量大、篇幅长，包含复杂曲折的情节和数量众多的人物形象，可以反映广阔复杂的生活画面。\n短篇小说容量小、人物少，情节和环境相对集中，往往通过人物的一段经历或生活的一个片断，从某个特定角度再现生活的局部。\n中篇小说顾名思义介于两者之间。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-26","list":10,"num":26,"word":"小说三要素之人物：圆形人物与典型","phonetic":"3、小说三要素","meanings":[{"pos":"","def":"人物是小说的三要素之一，是最基本的构成要素。\n通过多个侧面和多种手法塑造人物形象，是小说的最重要特征，创造鲜明生动的人物形象历来是首要任务。\n小说用语言作媒介，可以全方位地刻画人物，细腻深刻的心理描绘是小说独具的艺术特色。\n小说还可把人物放在错综复杂的社会生活中描写，塑造具有较高审美价值的、复杂丰满的圆形人物或典型人物。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-27","list":10,"num":27,"word":"《三国演义》曹操的多面性与复杂性","phonetic":"3、小说三要素","meanings":[{"pos":"","def":"《三国演义》中的曹操是一个具有多面性与复杂性的人物。\n他精于谋略、工于心计，惯于欺世盗名、假仁假义。\n平时常用小恩小惠来收买人心，逃亡时却凶狠残暴地杀害了吕伯奢全家人。\n在他身上集中了历代封建统治者的伪善本质，很有典型性。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-28","list":10,"num":28,"word":"《红与黑》于连：个人奋斗的悲剧","phonetic":"3、小说三要素","meanings":[{"pos":"","def":"《红与黑》中的于连也是一个性格复杂的人物。\n他出身低微、聪明能干，从小深受启蒙思想教育。\n立志依靠个人奋斗来改变自己的社会地位，但王政复辟的现实粉碎了他的幻想。\n他变成了一个不择手段的个人野心家，以悲剧的结局而告终。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-29","list":10,"num":29,"word":"《红楼梦》四百多个人物与“文学是人学”","phonetic":"3、小说三要素","meanings":[{"pos":"","def":"《红楼梦》写了400多个人物，其中性格鲜明的人物形象就多达几十人。\n诸如贾宝玉、林黛玉、王熙凤、薛宝钗、贾母等。\n“文学是人学”，人物塑造的成功印证了创造鲜明生动的人物形象是小说的首要任务。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-30","list":10,"num":30,"word":"小说三要素之情节：曲折真实含蓄","phonetic":"3、小说三要素","meanings":[{"pos":"","def":"长篇小说的情节具有完整性、复杂性和多样性。\n小说的情节要求曲折生动，也要求真实感人，真实是小说情节赖以成立的根基。\n小说的情节还要求含蓄深沉，以有限的情节表现广博深厚的内容。\n使读者品味出蕴藏在作品中的深邃隽永的思想和含蓄深刻的意蕴。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-31","list":10,"num":31,"word":"《三国演义》长坂坡情节的层层递进","phonetic":"3、小说三要素","meanings":[{"pos":"","def":"《三国演义》扣人心弦，就在于作者善于设置情节，使故事情节环环相扣、层层递进。\n长坂坡大战先从刘备兵败被曹军追剿入笔。\n引出赵子龙单骑救主的精彩情节，再到曹军团团围困的危难处境。\n直到张飞勒马站立桥头大声喝退80万曹军，最后还设计张飞断桥、曹操追赶、诸葛亮派兵接应的结尾，波澜迭起。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-32","list":10,"num":32,"word":"《人到中年》与《老人与海》的情节","phonetic":"3、小说三要素","meanings":[{"pos":"","def":"中篇小说《人到中年》是新时期文学中真实表现知识分子艰辛生活与美好心灵的佳作，女大夫陆文婷技术精湛、医德高尚，生活对她却并不公平。\n美国作家海明威的中篇小说《老人与海》，是他获得诺贝尔文学奖的代表作品。\n其情节简单到不能再简单，无非讲述老渔夫桑提亚哥与鲨鱼搏斗的故事。\n2023年真题：《老人与海》作者是海明威。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-33","list":10,"num":33,"word":"小说三要素之环境：社会与自然环境","phonetic":"3、小说三要素","meanings":[{"pos":"","def":"环境一般是指文艺作品中人物活动于其中的社会环境和自然环境。\n任何一部小说所描述的情节和刻画的人物，都只能在一定的社会环境和自然环境条件下存在。\n因此环境对于塑造人物和展现情节都具有极其重要的意义和作用。\n比起其他的文艺作品，小说的环境要求更加细致详尽、广阔丰富。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-34","list":10,"num":34,"word":"小说中“环境”与“背景”的区别","phonetic":"3、小说三要素","meanings":[{"pos":"","def":"小说中的背景和环境既有密切联系，但又有区别。\n小说中的环境只能是一定背景下的具体社会环境或自然环境。\n而小说的背景则是指这一具体环境得以产生的那个特定的时代和历史条件。\n小说的背景往往能够更加真实深刻地反映广阔的社会生活画面，揭示人物之间各种错综复杂的关系。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-35","list":10,"num":35,"word":"《红楼梦》大观园与《简·爱》庄园","phonetic":"3、小说三要素","meanings":[{"pos":"","def":"《红楼梦》通过对大观园环境的细致描写，展现出人物的身份、地位和性格，又通过环境变迁显示贾府家庭与人物命运的发展变化，生动体现这个封建大家庭由盛而衰的历史变迁。\n英国长篇小说《简·爱》详细描述罗切斯特庄园的环境，使简·爱性格中的矛盾性、复杂性和丰富性，以及她和罗切斯特的曲折爱情经历都在庄园中展现和发展。\n小说结尾处庄园的烧毁也就是他们爱情的新生，简·爱在庄园生活的描写是全书的精华。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-36","list":10,"num":36,"word":"《战争与和平》与《布登勃洛克一家》的环境","phonetic":"3、小说三要素","meanings":[{"pos":"","def":"《战争与和平》以1812年俄法战争为中心。\n通过别索霍夫、库拉根、包尔康斯基和罗斯托娃四个贵族家庭在重大历史事件中的命运和遭遇，展现该历史时期的社会生活和人们的精神面貌。\n德国作家托马斯·曼的长篇小说《布登勃洛克一家》，在19世纪德国从自由竞争走向垄断资本主义的历史背景下，通过布登勃洛克家族祖孙四代由盛而衰的变化展开。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-37","list":10,"num":37,"word":"剧本的范围：戏剧文学与影视文学","phonetic":"四、剧本","meanings":[{"pos":"","def":"剧本指戏剧文学和影视文学。\n在语言艺术的定义中，文学包括诗歌、散文、小说、剧本等各种体裁，剧本是其中一类。\n本章对剧本只作范围界定，未展开分类与特征，掌握“戏剧文学＋影视文学”这一层即可。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-38","list":10,"num":38,"word":"语言艺术审美特征的三个方面","phonetic":"语言艺术的审美特征","meanings":[{"pos":"","def":"文学的审美特征主要取决于语言的特性。\n集中体现为间接性与广阔性、情感性与思想性、结构性与语言美三个方面。\n这是本章★★★★★级【大题】考点，三个大标题须能默写并各自展开。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-39","list":10,"num":39,"word":"间接性：文学是“想象的艺术”","phonetic":"一、间接性与广阔性","meanings":[{"pos":"","def":"文学运用语言来塑造艺术形象、传达审美情感，读者必须通过想象才能感受到艺术形象，因此文学形象具有间接性。\n这种间接性既是语言艺术的局限，也是其特长和优势，因为它使文学形象具有其他艺术无法相比的广阔性。\n文学形象是视觉、听觉和触觉不能直接感受的，需读者凭生活经验和文学修养，通过联想和想象在头脑中呈现形象画面。\n因此人们把文学又称作“想象的艺术”。\n2024年真题“文学具有间接性，因而又被称作”，答案是想象艺术。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-40","list":10,"num":40,"word":"间接性对文学语言的两点要求","phonetic":"一、间接性与广阔性","meanings":[{"pos":"","def":"由于形象具有间接性，也对文学作品的语言提出了更高的要求。\n一是必须通过逼真、生动、细腻、传神的语言描绘，将人物和事物具体呈示在读者面前，使读者如见其人或如历其事。\n二是文学作品常通过暗示性的语言来激发读者想象，有意识地给读者留下更多的艺术空白，催促读者发挥想象力来加以填充。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-41","list":10,"num":41,"word":"《水浒传》一百零八将的间接性例证","phonetic":"一、间接性与广阔性","meanings":[{"pos":"","def":"《水浒传》塑造了梁山一百零八个英雄形象，人人性格不同、个个有血有肉。\n尤其是火烧草料场、雪夜上梁山的林冲，拳打镇关西、大闹野猪林的鲁智深，景阳冈打虎、怒杀西门庆的武松，以及手持板斧、鲁莽憨直的李逵。\n读者不仅了解他们的体形相貌、言行举止，而且可以感受到鲜明的性格特征和丰富的内心世界。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-42","list":10,"num":42,"word":"广阔性：语言可写物质与精神世界","phonetic":"一、间接性与广阔性","meanings":[{"pos":"","def":"语言这种媒介艺术既可以描绘物质世界，又可以描绘精神世界。\n语言几乎很少受到时间和空间的限制，有着最大的自由和极大的容量，能够全方位、多角度地展示广阔而复杂的社会生活。\n文学的时空广阔性带来作品巨大的容量和深刻的内涵，凡是人类思维能够达到的时间或空间，都是作家描绘的广阔天地。\n文学的广阔性更表现在它不仅能描绘外部世界，而且能够深入到人的内心世界。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-43","list":10,"num":43,"word":"广阔性例证：马尔克斯与茨威格","phonetic":"一、间接性与广阔性","meanings":[{"pos":"","def":"哥伦比亚作家马尔克斯的长篇小说《百年孤独》采用魔幻现实主义手法，展现了加勒比海岸小镇马孔多在100多年间的兴衰历史。\n奥地利现代作家茨威格的小说《一个女人一生中的二十四小时》，通过一位老妇人的自述讲述她中年时偶然的一夜风流。\n这位声誉清白的妇人内心充满激情与愤怒、渴望与沉沦、希望与失望，如此刻画心灵只有语言艺术才能实现。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-44","list":10,"num":44,"word":"情感性：《毛诗序》与文学的抒情优势","phonetic":"二、情感性与思想性","meanings":[{"pos":"","def":"任何文学作品都包含着作家的主观情感。\n文学的情感性越浓烈，越能感染读者，就越富有艺术魅力。\n语言艺术比其他艺术更能表现人的丰富、复杂、细腻的情感，在表现人物内心世界上具有得天独厚的优势。\n《毛诗序》云：“诗者，志之所之也，在心为志，发言为诗。情动于中而形于言。”"}],"related":[],"section":"第10章","marked":false},{"id":"C10-45","list":10,"num":45,"word":"柳永《雨霖铃》的离别之苦","phonetic":"二、情感性与思想性","meanings":[{"pos":"","def":"北宋词人柳永的代表作《雨霖铃》（寒蝉凄切）。\n以日暮雨歇的冷落秋景，抒发了恋人依依惜别的真挚而痛苦的感情。\n将凄凉惆怅之情融于景色之中，使天光水色仿佛也染上一层离愁别绪。\n浓郁深沉的情感使这首词成为千古传诵的抒情名篇。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-46","list":10,"num":46,"word":"《红楼梦》“黛玉葬花”的悲悼自怜","phonetic":"二、情感性与思想性","meanings":[{"pos":"","def":"《红楼梦》第二十七回“黛玉葬花”，以细腻的笔触描写了黛玉悲悼自怜的复杂情感。\n这位多愁善感、天资聪慧的弱女子，在父母双亡后寄人篱下。\n只能将自己的悲戚郁愤寄托在身世相类的落花上：“侬今葬花人笑痴，他年葬侬知是谁？”"}],"related":[],"section":"第10章","marked":false},{"id":"C10-47","list":10,"num":47,"word":"叙事类文学把情感藏在形象之中","phonetic":"二、情感性与思想性","meanings":[{"pos":"","def":"作为叙事类文学的小说和报告文学等，同样蕴藏着作家炽热的感情。\n只不过这类作品一般不常由作者出面来直接抒情。\n而往往将作者的主观情感深深蕴藏在文学形象之中，通过形象描绘来传达情感。\n例证：伏契克《绞刑架下的报告》、夏衍《包身工》。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-48","list":10,"num":48,"word":"思想性：语言最能直接表达思想","phonetic":"二、情感性与思想性","meanings":[{"pos":"","def":"语言艺术的形象最富有深刻的思想性。\n因为只有语言才能直接表达人的思想，在直接披露人的思想认识、评价判断方面具有最强的艺术表现力。\n古今中外一切优秀作品之所以成为不朽的艺术精品，都在于将高度的思想性和高度的艺术性有机结合。\n作家总通过鲜明生动的艺术形象表述自己的认识、判断和评价，揭示生活的哲理或社会发展的历史规律。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-49","list":10,"num":49,"word":"思想性与情感性的相互渗透","phonetic":"二、情感性与思想性","meanings":[{"pos":"","def":"文学作品的思想性总是被情感所包裹，并通过艺术形象表现出来的。\n只有将情感渗透在思想里的作品，才具有震撼心灵的艺术魅力。\n文学作品的情感性也离不开思想性，这种情感往往要在理性指导下才具有特定爱憎的倾向性。\n二者相互渗透、相互融会，成为一切文学作品所不可缺少的要素。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-50","list":10,"num":50,"word":"思想性例证：《红楼梦》《家》《人间喜剧》","phonetic":"二、情感性与思想性","meanings":[{"pos":"","def":"文学作品的思想性绝不是空洞、抽象的说教。\n它应当蕴藏在作品的艺术形象之中，成为作品具有强烈艺术感染力的灵魂。\n例证：曹雪芹《红楼梦》、巴金《家》《春》《秋》、托尔斯泰《战争与和平》、巴尔扎克《人间喜剧》。\n2023年真题：《家》《春》《秋》的作者是巴金。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-51","list":10,"num":51,"word":"范仲淹《岳阳楼记》与但丁《神曲》","phonetic":"二、情感性与思想性","meanings":[{"pos":"","def":"范仲淹的散文《岳阳楼记》，在生动描写洞庭湖风光的同时，表达了作者“先天下之忧而忧，后天下之乐而乐”的高洁情怀。\n2024年真题：《岳阳楼记》属于散文。\n意大利诗人但丁的《神曲》，以新奇而丰富的想象描写诗人在地狱、炼狱、天堂三界的游历见闻，反映出处于新旧世纪之交的诗人的人文主义思想。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-52","list":10,"num":52,"word":"杜甫《望岳》与苏轼《题西林壁》的哲理","phonetic":"二、情感性与思想性","meanings":[{"pos":"","def":"杜甫的五言律诗《望岳》，生动描写诗人对五岳之首泰山的敬仰热爱之情。\n结尾两句“会当凌绝顶，一览众山小”富于哲理性和象征性，蕴藏着耐人咀嚼的思想意蕴。\n苏轼的七言绝句《题西林壁》也是一首内涵丰富的哲理诗。\n诗人从游庐山所得的独特感受中，悟出“不识庐山真面目，只缘身在此山中”的道理。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-53","list":10,"num":53,"word":"结构性：结构是作品的内部联系方式","phonetic":"三、结构性与语言美","meanings":[{"pos":"","def":"所谓结构，是对文学作品中各个组成部分的整体安排，它是文学作品的内部联系和构成的方式。\n文学作品作为有机的整体，就必须利用结构这个重要手段来完成，任何文学作品都离不开结构。\n结构本身也具有审美价值，结构美成为文学作品艺术美的重要组成部分。\n例证：传统话剧一般要求具有开端、发展、高潮、结尾四个阶段，有的还要求剧作在时间、地点、情节三个方面保持完整一致。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-54","list":10,"num":54,"word":"小说结构三型：复线、蛛网、辐射","phonetic":"三、结构性与语言美","meanings":[{"pos":"","def":"复线型：一般由两条线索构成，相互对比和映衬，如《安娜·卡列尼娜》。\n蛛网型：几条线索相互穿插交错，形成蛛网状结构，表现多层次、多角度的复杂内容，如柳青《创业史》以四条线索形成富于立体感的蛛网结构。\n辐射型：作品中有一个中心，由中心向外辐射出几条情节线索，把貌似零碎的幻觉、回忆、遐思组成有机整体，意识流小说常采用，如冯内古特《五号屠场》。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-55","list":10,"num":55,"word":"语言美：准确、鲜明、生动、形象","phonetic":"三、结构性与语言美","meanings":[{"pos":"","def":"文学是语言的艺术，语言自然成为这个艺术种类的第一要素。\n文学语言具有准确性、鲜明性、生动性、形象性，本身也具有审美价值，这种语言美甚至构成文学的特质美。\n准确性：最恰当、最确切、最精练地表现对象。\n鲜明性：清晰明确、新鲜活泼，富有特色。\n生动性：运用比喻、排比、夸张、拟人等多种修辞，灵活多变、错落有致。\n形象性：三性结合，达到情韵浓郁、形象传神，使读者如闻其声、如见其人。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-56","list":10,"num":56,"word":"贾岛“推敲”与《泰山极顶》的“悬”字","phonetic":"三、结构性与语言美","meanings":[{"pos":"","def":"唐代诗人贾岛对于“僧推月下门”还是“僧敲月下门”的斟酌，是大家所熟悉的例证。\n杨朔的散文《泰山极顶》中写道：“现时悬在我头顶上的正是南天门。”\n这一个“悬”字，准确精练地概括了南天门之险陡，真可谓一字之精、意境全出。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-57","list":10,"num":57,"word":"李白诗句与《儒林外史》的语言生动性","phonetic":"三、结构性与语言美","meanings":[{"pos":"","def":"李白的“噫吁嚱，危乎高哉！蜀道之难，难于上青天！”（《蜀道难》）、“飞流直下三千尺，疑是银河落九天”（《望庐山瀑布》）。\n采用比喻、夸张等手法，语言鲜明生动、含蓄有味，富有巨大的艺术感染力。\n吴敬梓《儒林外史》中，范进中举后兴奋得神经错乱，他丈人胡屠户狠狠给了他一耳光，才使他从迷狂中清醒过来。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-58","list":10,"num":58,"word":"《离骚》：屈原代表作与最早最长抒情诗","phonetic":"一、《离骚》","meanings":[{"pos":"","def":"《离骚》是屈原的代表作，也是楚辞的代表作。\n屈原是我国最早的伟大诗人，战国楚人。\n《离骚》是我国古代最早且最长的一首抒情诗。\n它是一首蕴藏满腔爱国热情和饱含满腔悲愤之情的长诗。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-59","list":10,"num":59,"word":"《离骚》全诗三大部分的具体内容","phonetic":"一、《离骚》","meanings":[{"pos":"","def":"第一部分，诗人先叙述自己的身世。\n第二部分，诗人开始驰骋想象，进一步借历史上的兴亡事例阐明自己的政治抱负。\n第三部分，从想象又回到现实，恋恋不舍故国家园；在去与留的矛盾痛苦之中，诗人最终决定以身殉国。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-60","list":10,"num":60,"word":"《离骚》的浪漫主义与鲁迅的评价","phonetic":"一、《离骚》","meanings":[{"pos":"","def":"《离骚》全诗洋溢着浪漫主义精神，想象之丰富、辞藻之华美、情感之强烈、意蕴之深远，均堪称千古绝唱。\n这种强烈的浪漫精神，尤其表现为丰富奇特的想象和激越强烈的情感两个特点。\n屈原在《离骚》中通篇采用比兴手法，形成绚丽多彩的幽远意境，名句“路漫漫其修远兮，吾将上下而求索”。\n鲁迅在《汉文学史纲要》中赞扬它“较之于《诗》，则其言甚长，其思甚幻，其文甚丽，其旨甚明”。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-61","list":10,"num":61,"word":"楚辞的两种含义与楚文化分布","phonetic":"一、《离骚》","meanings":[{"pos":"","def":"楚辞原为诗体名，是伟大诗人屈原在楚国民间歌谣基础上创造的一种新体诗。\n形式比较自由，句式长短参差，多用“兮”字结尾，极富抒情成分和浪漫色彩，尤其具有楚文化的地方特色。\n西汉刘向将屈原、宋玉等人的作品汇编成集，题名为《楚辞》。\n因此楚辞既指屈原首创的诗体名称，也指屈原、宋玉等人的诗歌总集；楚文化大致分布在长江中游地区。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-62","list":10,"num":62,"word":"《荷马史诗》的构成与两部史诗内容","phonetic":"二、《荷马史诗》","meanings":[{"pos":"","def":"《荷马史诗》是古希腊两部著名史诗《伊利亚特》和《奥德赛》的总称，传为荷马编订，故得此名，公元前6世纪正式用文字记录下来。\n《伊利亚特》主要讲述公元前12世纪末特洛伊战争最后一年的故事，即“阿喀琉斯的愤怒”。\n《奥德赛》与之衔接，讲述特洛伊战争结束后，希腊联军中最有智谋的首领奥德修斯回国途中在海上漂流十年，历经艰难与奇遇，最后回到祖国与家人团聚。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-63","list":10,"num":63,"word":"《荷马史诗》的地位与“荷马时代”","phonetic":"二、《荷马史诗》","meanings":[{"pos":"","def":"《荷马史诗》是欧洲文学的开端，也是世界文学史上最伟大的史诗，具有巨大的认识价值和美学价值，在世界文学史上占有极其重要的地位。\n它对于了解公元前11世纪至公元前9世纪古希腊人的社会生活情况具有十分重要的认识价值，至今人们还把这一时期称为希腊历史上的“荷马时代”。\n它是神话与历史相结合的作品，神话是对历史的补充；荷马相传是到处行吟的盲歌者，常挟着七弦琴流浪在热闹的市镇。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-64","list":10,"num":64,"word":"《红楼梦》一百二十回与高鹗续书","phonetic":"三、《红楼梦》","meanings":[{"pos":"","def":"《红楼梦》是清代曹雪芹所著长篇小说，共一百二十回。\n前八十回为曹雪芹所作，后四十回多认为由高鹗续写。\n原名《石头记》；第六十三回中有“怡红夜宴酒席图”的描写。\n它是中国文学史上最杰出的一部长篇小说。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-65","list":10,"num":65,"word":"《红楼梦》的爱情主线与红学流派","phonetic":"三、《红楼梦》","meanings":[{"pos":"","def":"小说以贾宝玉、林黛玉的爱情悲剧为主线，联系着广阔的社会背景，描绘贾家荣、宁二府大家庭内部错综复杂的人际关系。\n后世研究《红楼梦》被视作一种专门学问，称为“红学”；其中人物年龄问题被称作“一块永远拼不起来的七巧板”。\n因意蕴博大精深，历代红学家众说纷纭，形成“索隐派”“点评派”“自传说派”等多个流派。\n影视改编：20世纪谢铁骊导演6部8集电影，王扶林导演36集电视连续剧，2010年李少红拍摄50集电视连续剧。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-66","list":10,"num":66,"word":"叶朗论《红楼梦》意蕴的三个层面","phonetic":"三、《红楼梦》","meanings":[{"pos":"","def":"叶朗先生认为《红楼梦》的意蕴大致可分为三个层面。\n第一个层面，以前所未有的广度和深度真实地反映了清代前期的社会面貌和人情世态。\n第二个层面，是《红楼梦》的悲剧性。\n第三个层面，处处渗透着作家曹雪芹对整个人生的很深的感悟，一种哲理性的感悟、感兴、感叹，这就是《红楼梦》的意境。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-67","list":10,"num":67,"word":"《安娜·卡列尼娜》的两条平行线索","phonetic":"四、《安娜·卡列尼娜》","meanings":[{"pos":"","def":"《安娜·卡列尼娜》是俄国文学大师列夫·托尔斯泰最重要的代表作。\n小说取材于俄国19世纪六七十年代的现实生活，由两条平行的线索构成。\n一条是安娜的爱情悲剧，另一条是列文的婚姻和事业。\n作品整体结构采用对比手法，将两条线索平行展开，形成结构上的鲜明特色。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-68","list":10,"num":68,"word":"托尔斯泰三部曲与《复活》的忏悔主题","phonetic":"四、《安娜·卡列尼娜》","meanings":[{"pos":"","def":"“列夫·托尔斯泰三部曲”包括《战争与和平》《安娜·卡列尼娜》《复活》。\n《战争与和平》是托尔斯泰篇幅最长的一部小说，结构宏大、人物繁多，以1812年俄法战争为中心，展现俄国四个贵族家庭的命运变迁。\n《复活》是托尔斯泰晚年的代表作品，通过女主人公玛丝诺娃一生的悲惨遭遇，以及贵族聂赫留朵夫忏悔赎罪的行动，表现他们在精神和道德上的复活。"}],"related":[],"section":"第10章","marked":false},{"id":"C10-69","list":10,"num":69,"word":"俄国“强力集团”“巡回展览画派”与“别车杜”","phonetic":"四、《安娜·卡列尼娜》","meanings":[{"pos":"","def":"以穆索尔斯基为首的“强力集团”。\n以列宾、苏里科夫为首的“巡回展览画派”。\n文艺理论界著名的“别、车、杜”，即别林斯基、车尔尼雪夫斯基、杜勃罗留波夫这三位杰出的文艺理论家。"}],"related":[],"section":"第10章","marked":false},{"id":"C11-01","list":11,"num":1,"word":"艺术生产全过程的三个环节","phonetic":"第11章 艺术创作","meanings":[{"pos":"","def":"马克思的艺术生产理论启示我们：应当把艺术创作—艺术作品—艺术鉴赏作为艺术生产的全过程来研究。\n艺术创作是审美价值的“生产阶段”，是创作主体（艺术家）和客观现实生活相互作用的产物。\n艺术作品是艺术生产的成果或产品，其价值在于满足人们特殊的精神需要——审美需要。\n艺术鉴赏是审美价值的“消费阶段”，是鉴赏主体（读者、观众、听众）和鉴赏客体（艺术品）相互作用的结果；只有经过“生产”与“消费”两个阶段，审美价值才能最终产生和实现。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-02","list":11,"num":2,"word":"艺术创作活动的完整定义","phonetic":"第11章 艺术创作","meanings":[{"pos":"","def":"艺术创作活动是人类特有的一种高级的、复杂的精神活动与实践活动。\n它是指艺术家在创作欲望的推动下，运用一定的艺术语言和艺术手法技巧，通过艺术的加工和创造，将自己的生活体验与思想情感转化为具体、生动、可感的艺术形象。\n也就是把自己的审美意识物态化为艺术作品。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-03","list":11,"num":3,"word":"郑板桥画竹的三个阶段","phonetic":"第11章 艺术创作","meanings":[{"pos":"","def":"艺术创作过程千差万别、丰富多样，很难找出一个共同的固定模式；从总体上讲，又大致可分为艺术体验、艺术构思、艺术传达三个方面或三个阶段。\n清代著名画家郑板桥把画竹的过程分为“眼中之竹”“胸中之竹”“手中之竹”。\n“眼中之竹”指艺术体验活动，“胸中之竹”指艺术构思活动，“手中之竹”指艺术传达活动，三者恰与创作三阶段一一对应。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-04","list":11,"num":4,"word":"艺术家的定义与四项必备素养","phonetic":"一、艺术家是艺术生产的创造者","meanings":[{"pos":"","def":"艺术家是专门从事艺术生产的创造者的总称。\n应具备：艺术的天赋和艺术的才能；专门的艺术技能和技巧；丰富的情感和艺术的修养；通过自己的创造性劳动满足人们特殊的精神需要即审美需要。\n在艺术生产中，艺术家是艺术品的生产者和创造者；没有艺术家，就没有艺术创作，也就没有艺术作品和艺术鉴赏。\n专业的艺术家是一定社会历史条件的产物，是生产力发展到一定阶段和社会分工的结果。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-05","list":11,"num":5,"word":"艺术家的职业分工与生产方式","phonetic":"一、艺术家是艺术生产的创造者","meanings":[{"pos":"","def":"第一，艺术家内部有多种多样的职业和分工。\n艺术生产存在个体性与集体性之分：文学作家、雕塑家、画家以个体劳动方式创作；戏剧艺术和影视艺术的编剧、导演、演员、美工等以集体劳动方式创作。\n艺术生产方式也不同：绘画、雕塑、文学属一次性艺术生产；音乐、舞蹈、曲艺、杂技等表演艺术属多次性艺术生产。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-06","list":11,"num":6,"word":"一次性与多次性艺术生产","phonetic":"一、艺术家是艺术生产的创造者","meanings":[{"pos":"","def":"一次性艺术生产：艺术家通过创造性劳动能够一次完成创作，拿出自己的艺术作品，如绘画、雕塑、文学。\n多次性艺术生产：通过演员在舞台上的表演可以多次完成的艺术形式，如音乐、舞蹈、曲艺、杂技。\n多次性表演艺术除一度创作（作曲、作词、编舞、编剧）外，还需要二度创作（再度创作）的艺术家，如歌唱演员、器乐演员、指挥家、舞蹈演员。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-07","list":11,"num":7,"word":"四大名旦与梅尚两派《霸王别姬》","phonetic":"一、艺术家是艺术生产的创造者","meanings":[{"pos":"","def":"对于同一个艺术作品，不同的表演艺术家往往有各自不同的理解和感受，从而有不同的表演方式和演出效果。\n“四大名旦”梅、程、荀、尚形成了各有特色的表演流派。\n同样一出京剧《霸王别姬》，梅兰芳和尚小云的演出就各不相同：梅派表演艺术讲究精湛优美，尚派表演艺术则以刚劲婀娜著称。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-08","list":11,"num":8,"word":"真正的艺术家为艺术献身","phonetic":"一、艺术家是艺术生产的创造者","meanings":[{"pos":"","def":"真正的艺术家往往具有为艺术而献身的精神。\n艺术生产是自由自觉的精神生产，真正的艺术家绝不把艺术作为谋生或获取名利的手段，而是看作自己毕生的事业和追求，并为之奉献全部心血和生命。\n真正的艺术家从事艺术创作，总是出于强烈的社会责任感和对艺术本身执着的爱，这种感情转化为创作的内在动力。\n从这种意义上完全可以讲，一切伟大的艺术作品都是艺术家的呕心沥血之作。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-09","list":11,"num":9,"word":"后印象派三大师的创作与贡献","phonetic":"一、艺术家是艺术生产的创造者","meanings":[{"pos":"","def":"“后印象主义”三位大师是塞尚、凡·高和高更。\n法国画家塞尚被尊为“西方现代美术之父”，他最大的贡献在于以色彩团块和几何因素来结构画面。\n荷兰画家凡·高的《向日葵》系列、《星空》等表达了画家内心强烈的情感，充满对生命的爱。\n高更画出了《塔希提岛的妇女》《我们从哪里来？我们是谁？我们往哪里去？》等著名作品。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-10","list":11,"num":10,"word":"以身殉艺的四位中国文学家","phonetic":"一、艺术家是艺术生产的创造者","meanings":[{"pos":"","def":"屈原在流放中写出了千古传诵的诗篇《离骚》，表达了对祖国的炽热感情和为理想而献身的强烈愿望。\n司马迁遭受酷刑后发愤著书，写出了巨著《史记》，被鲁迅誉为“史家之绝唱，无韵之《离骚》”。\n杜甫在安史之乱中写出了不朽的作品“三吏”“三别”。\n曹雪芹晚年在“举家食粥酒常赊”的贫困中“披阅十载，增删五次”，才完成《石头记》（即《红楼梦》），自谓“字字看来皆是血，十年辛苦不寻常”。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-11","list":11,"num":11,"word":"汤显祖、霍桑与福楼拜的创作体验","phonetic":"一、艺术家是艺术生产的创造者","meanings":[{"pos":"","def":"艺术家必须具有超出常人的敏锐感受力、异于常人的丰富情感、强于常人的艺术想象力。\n汤显祖写《牡丹亭》，写到杜丽娘因情感梦、因梦而病、相思病危之际，禁不住泪如泉涌，独自躲进一间堆柴的屋子里哭泣。\n霍桑写《红字》时，对女主人公海丝特的悲惨遭遇怀有深深的同情，写作中内心痛苦，总希望能使女主人公逃出悲惨境地而又不能实现，心灵受到极大折磨。\n福楼拜写到包法利夫人自杀的时候，作家自己仿佛也尝到了砒霜的滋味。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-12","list":11,"num":12,"word":"艺术家的创新意识与独特构思","phonetic":"一、艺术家是艺术生产的创造者","meanings":[{"pos":"","def":"艺术家必须具有卓越的创造能力和鲜明的创作个性，具有强烈的创新意识。\n艺术的生命就在于创造和创新，没有创造、没有创新，就没有艺术；艺术家必须不断超越前人、超越同时代人，以及不断超越自己。\n戏曲评论家认为梅兰芳这双手是“会说话的手”；罗曼·罗兰写《约翰·克利斯朵夫》，从选材、情节、细节到人物刻画都力求独特构思，自称这部小说“每一卷都使我的头发变白了”。\n嘉宝在《瑞典女王》中以带有创新的表演方式，为“无表演的表演艺术”开了先河；《人到中年》里潘虹饰演陆文婷弥留之际的一场戏，正是这种“无表演的表演”。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-13","list":11,"num":13,"word":"雕刻六法：刻、镂、凿、琢、塑、铸","phonetic":"一、艺术家是艺术生产的创造者","meanings":[{"pos":"","def":"刻：在坚硬的材料上刻制而成，如河南南阳博物馆藏汉画像石就有1200多块。\n镂：刻得很深并且中间空心的雕刻方式。\n凿：对体积庞大、质地坚硬的材料用锤击凿去余料，如四川乐山大佛是古代匠人凿山而成。\n琢：玛瑙、玉石、水晶等易碎珍贵材料用砂轮打磨、钎子钻切，如北京北海团城玉瓮亭内元代初年琢制的大型玉瓮。\n塑：用黏土等软材料制成，如敦煌石窟中的佛、菩萨基本上都是泥塑，秦兵马俑、唐三彩也是泥塑经烧制而成。\n铸：铸铜像时常常先塑后铸，如甘肃武威东汉墓出土的《马踏飞燕》，奔马仅以一只足踏在燕子背上，造型别致。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-14","list":11,"num":14,"word":"社会生活是艺术创作的源泉","phonetic":"二、艺术家与社会生活","meanings":[{"pos":"","def":"作为艺术创作的主体，艺术家与社会生活有着十分密切的关系；任何艺术作品都是艺术家对社会生活的能动反映和艺术创造的产物。\n从创作客体来讲，社会生活是创作的源泉和基础，艺术创作不能离开客观现实社会生活。\n从创作主体来讲，艺术家总是属于一定的时代、民族和阶级，艺术创作归根结底受着一定社会生活方式的制约，也与艺术家本人的生活实践与生活经历密不可分。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-15","list":11,"num":15,"word":"直接体验与间接体验的关系","phonetic":"二、艺术家与社会生活","meanings":[{"pos":"","def":"艺术家对社会生活的观察与感受分为直接体验与间接体验两种情况。\n直接体验：艺术家在生活中亲历的所见、所闻、所感、所遇，往往成为创作的原料，激发创作欲望，激发生动的想象和丰富的情感。\n间接体验：艺术家从他人的言谈和著作中所吸取的生活经验，常常可以扩大视野、拓展生活积累、诱发创作灵感。\n一般来讲，直接体验是基本的，是艺术创作的基础；间接体验是必要的，是艺术创作的补充。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-16","list":11,"num":16,"word":"外师造化与搜尽奇峰打草稿","phonetic":"二、艺术家与社会生活","meanings":[{"pos":"","def":"唐代画家张璪有一句名言“外师造化，中得心源”，就是强调画家要向大自然学习。\n清代绘画大师石涛也有一句名言，叫作“搜尽奇峰打草稿”。\n对于中外文学家来说，丰富的生活积累更是进行创作活动的基础和源泉；这种对社会生活的观察和体验，对于进行二度创作的表演艺术家们同样具有重要意义。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-17","list":11,"num":17,"word":"巴尔扎克笔下的三个典型形象","phonetic":"二、艺术家与社会生活","meanings":[{"pos":"","def":"巴尔扎克塑造出极端贪婪吝啬的资产阶级暴发户葛朗台（《欧也妮·葛朗台》）。\n还塑造了最终落得悲惨下场的守财奴高老头（《高老头》）。\n以及极端冷酷无情的魔鬼伏脱冷（《幻灭》）等一大批活生生的典型形象。\n这些形象来自作家对社会生活的观察、体验与典型化创造，说明社会生活是艺术创作的源泉。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-18","list":11,"num":18,"word":"焦菊隐带演员深入龙须沟与茶馆","phonetic":"二、艺术家与社会生活","meanings":[{"pos":"","def":"排演老舍先生的剧本《龙须沟》时，导演焦菊隐带着演员们到北京城这条臭水沟的居民区里深入生活，甚至在滂沱大雨的夜晚赶到龙须沟，帮助抢救倒塌房屋中的居民。\n排演老舍另一出话剧《茶馆》时，演员也多次到茶馆中去体验三教九流、形形色色的人物的生活和内心。\n由此在《茶馆》中塑造出许多有血有肉、性格鲜明的艺术形象。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-19","list":11,"num":19,"word":"高尔基三部曲与托尔斯泰《复活》","phonetic":"二、艺术家与社会生活","meanings":[{"pos":"","def":"高尔基的自传体小说三部曲《童年》《在人间》《我的大学》，以作者本人青少年时期的亲身经历为素材；那段饱经痛苦磨难的亲身生活经历，激发出作者不可遏制的创作冲动和欲望。\n托尔斯泰在家乡听到检察官讲述了一个贵族青年对一个青年女仆始乱终弃的故事，激发了他的创作冲动和灵感。\n经过近十年的艰苦创作，他终于完成了长篇小说《复活》。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-20","list":11,"num":20,"word":"范宽《溪山行旅图》与徐悲鸿之叹","phonetic":"二、艺术家与社会生活","meanings":[{"pos":"","def":"宋代著名的北派山水画大师范宽，作品有《临流独坐图》《雪山萧寺图》和《雪景寒林图》。\n最能代表其风格特色的是著名的《溪山行旅图》。\n现代著名画家徐悲鸿在看到《溪山行旅图》后惊叹不已，认为故宫所有藏画中，他最为倾倒的就是这一幅。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-21","list":11,"num":21,"word":"艺术才能是天赋与训练的结合","phonetic":"三、艺术家的艺术才能与文化修养","meanings":[{"pos":"","def":"艺术才能，是指艺术家创造艺术形象的能力，它是先天禀赋和后天训练培养相融合而形成的艺术创造力。\n许多杰出的艺术家具有超出普通人的艺术天才，如奥地利大作曲家莫扎特（幼年就显露出非凡的音乐才能）、波兰钢琴家与作曲家肖邦、意大利小提琴家与作曲家帕格尼尼（从小学习小提琴）、匈牙利钢琴家与作曲家李斯特。\n但艺术才能更有赖于长期的、艰苦的、勤奋的艺术实践；“天才出于勤奋”这句格言同样适用于艺术家。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-22","list":11,"num":22,"word":"画圣吴道子与“天才出于勤奋”","phonetic":"三、艺术家的艺术才能与文化修养","meanings":[{"pos":"","def":"被称为“画圣”的唐代大画家吴道子，《画史汇传》中说他虽然“年未弱冠”，却已经“穷丹青之妙”。\n正因如此，吴道子才能在继承传统优秀技法的基础上，创造出“吴家样”。\n这说明艺术才能虽与天赋分不开，更来自刻苦训练与勤奋实践。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-23","list":11,"num":23,"word":"曹衣出水与吴带当风的区别","phonetic":"三、艺术家的艺术才能与文化修养","meanings":[{"pos":"","def":"绘画史上流传的“曹衣出水，吴带当风”，是讲两位画家人物画的不同风格。\n曹仲达的人物画挺劲有力，画中人物衣衫紧窄贴肉，仿佛刚从水中出来。\n吴道子的人物画神采飞扬，画中人物衣服宽松、裙带飘举，富有运动感，真可以说是栩栩如生。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-24","list":11,"num":24,"word":"戏曲表演的四功与五法","phonetic":"三、艺术家的艺术才能与文化修养","meanings":[{"pos":"","def":"戏曲界要求每个演员都必须掌握“四功五法”，也就是戏曲表演艺术的四个基本要素和五种主要技术方法。\n“四功”是指唱（唱腔）、念（念白）、做（动作）、打（武打）。\n“五法”是指口（发声）、眼（眼神）、手（手势）、身（腰身）、步（台步）。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-25","list":11,"num":25,"word":"艺术家的文化修养与广博知识","phonetic":"三、艺术家的艺术才能与文化修养","meanings":[{"pos":"","def":"艺术家的文化修养包括深刻的思想修养、深厚的艺术修养，以及自然科学和社会科学等多方面的广博知识。\n艺术家的文化修养同艺术才能的培养一样，同样需要长期勤奋的学习和实践。\n这种学习包括学习和借鉴前人的经验，包括学习和借鉴同时代本国和外国艺术家的经验，还包括学习和借鉴其他姊妹艺术的经验。\n更包括学习哲学、历史、文学、美学、伦理学、心理学、社会学和自然科学等多方面的广博知识。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-26","list":11,"num":26,"word":"托尔斯泰是俄国革命的一面镜子","phonetic":"三、艺术家的艺术才能与文化修养","meanings":[{"pos":"","def":"列夫·托尔斯泰不是社会学家，但他的作品深刻表现了俄国千百万农民在资产阶级革命快要到来时的思想和情绪。\n因此被列宁称作“俄国革命的一面镜子”。\n这说明广博的知识与深刻的思想修养，使艺术家能够把握时代脉搏、反映社会本质。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-27","list":11,"num":27,"word":"《清明上河图》的社会信息价值","phonetic":"三、艺术家的艺术才能与文化修养","meanings":[{"pos":"","def":"《清明上河图》中包含着众多的社会信息和风俗人情。\n一些历史学家在研究北宋历史时，也把它作为形象的参考资料。\n这说明优秀的艺术作品具有认识价值，也说明艺术家的文化修养与广博知识会转化为作品的厚度。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-28","list":11,"num":28,"word":"艺术体验：创作的准备阶段","phonetic":"一、艺术体验活动","meanings":[{"pos":"","def":"艺术体验活动可以说是艺术创作的准备阶段。\n它是指一种活跃的、丰富的、深刻的内心活动，伴随着强烈的情感情绪，把艺术家长期对于生活的感受、观察和思考，形成艺术创作的基础和前提，乃至萌发创作欲望。\n艺术体验是艺术创作的基础：深切的生活体验和丰富的感性积累，为艺术创作奠定了雄厚坚实的基础。\n艺术体验又是一种重要的创作动机：它是艺术家从事艺术创造的内在心理动力或诱因。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-29","list":11,"num":29,"word":"冼星海寒夜借风述怀写《风》","phonetic":"一、艺术体验活动","meanings":[{"pos":"","def":"冼星海青年时期在巴黎学习音乐期间，曾创作了一个颇受赞誉的作品《风》。\n他在创作这一作品期间生活贫困，寒夜奇冷难以入眠，只得点灯写作。\n他自述：“我伤心极了，我打着颤听寒风打着墙壁，穿过门窗，猛烈嘶吼，我的心也跟着猛烈撼动，我不能自已，借风述怀，写成了这个作品。”\n这是生活体验转化为创作动机的生动实例。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-30","list":11,"num":30,"word":"雨果与巴金的生活积累","phonetic":"一、艺术体验活动","meanings":[{"pos":"","def":"雨果16岁时，曾在巴黎法院门前的广场上亲眼看见一个年轻女仆因所谓盗窃罪遭到酷刑的惨状，使他深为震惊、久久不能忘却。\n这种深切的感受和体验，在他10多年后创作的长篇小说《巴黎圣母院》和40年后创作的《悲惨世界》中，都有所反映和体现。\n巴金在童年和少年时代亲身感受到正在崩溃中的封建大家庭的种种腐朽没落，这种铭刻于心的体验时时搅扰他的心灵，促使他创作了“激流三部曲”《家》《春》《秋》。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-31","list":11,"num":31,"word":"刘勰、杜甫与赵子昂的切身体验","phonetic":"一、艺术体验活动","meanings":[{"pos":"","def":"艺术体验需要艺术家仔细观察生活、深切感受生活、认真思考生活，更需要以自己的全部身心去拥抱生活，饱含情感地切身体验。\n刘勰所讲的“登山则情满于山，观海则意溢于海”，杜甫所讲的“感时花溅泪，恨别鸟惊心”，正是这种体验的写照。\n元代大画家赵子昂善于画马，观察时不仅运用视觉和听觉，而且运用触觉、运动觉，常常解开衣服趴在地上，学着马的跑跳腾跃，使自己的感受更加真切。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-32","list":11,"num":32,"word":"表演艺术中体验是第一位的","phonetic":"一、艺术体验活动","meanings":[{"pos":"","def":"对于表演艺术家来讲，体验是第一位的，是根本的，是起主导作用的。\n有了真正深切的内心体验，才会使创造的艺术形象放射出生命的光彩，在舞台或银幕上塑造出有血有肉、活生生的人物形象。\n艺术体验是创作的基础和前提，不仅进行一度创作的艺术家离不开它，进行二度创作的演员同样离不开它。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-33","list":11,"num":33,"word":"艺术构思与审美意象的形成","phonetic":"二、艺术构思活动","meanings":[{"pos":"","def":"有了艺术体验，并且萌发了创作欲望，正式的艺术创作就开始了，这就是艺术构思活动。\n艺术构思是一种十分复杂的精神活动，也是一项艰苦的脑力劳动，是在艺术家头脑中形成主客体统一的审美意象；其主要任务就是形成或产生审美意象。\n审美意象，是指在对客观世界审美感知与体验的基础上，融会主观的思想、感情、愿望、理想，在艺术家头脑中经过艺术创造形成的意象。\n这种主客体统一的审美意象，一旦经过艺术媒介或艺术语言等物质手段传达出来，就成为艺术作品的艺术形象。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-34","list":11,"num":34,"word":"黑格尔：最杰出的本领是想象","phonetic":"二、艺术构思活动","meanings":[{"pos":"","def":"黑格尔强调指出：“最杰出的艺术本领就是想象。”\n想象具有在原来生活的基础上创造新形象的能力，使它在艺术创作构思活动中占有核心的地位。\n艺术家可以凭借想象创造出源于生活并高于生活的艺术世界，创造未曾亲身经历过的事件和未曾接触过的人物，能够“精骛八极，心游万仞”地进行艺术构思。\n卓别林在回忆影片《摩登时代》的创作构想时，强调是突如其来的想象帮了他的大忙。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-35","list":11,"num":35,"word":"吴道子依梦境画《钟馗捉鬼图》","phonetic":"二、艺术构思活动","meanings":[{"pos":"","def":"沈括《梦溪笔谈》记载：唐玄宗一次久病不愈，有天晚上在睡梦中梦见一位名叫钟馗的落第举子手执宝剑追杀小鬼，玄宗惊吓而醒，就命大画家吴道子画出图来。\n吴道子依据玄宗所描述的梦境，依靠非凡的艺术想象力，很快画成了一幅《钟馗捉鬼图》。\n据说后来每年除夕很多人家都在大门张贴这幅画。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-36","list":11,"num":36,"word":"再造想象与创造想象的区别","phonetic":"二、艺术构思活动","meanings":[{"pos":"","def":"想象并不是凭空产生的，客观现实是想象活动的源泉和内容。\n再造想象是把自己记忆中或别人描述过的形象在头脑中产生出来。\n创造想象则不局限于原有的感性形象，而是在大量经验的基础上创造出崭新的形象。\n吴承恩就是通过卓越的创造性想象，在《西游记》中创造了孙悟空、猪八戒等许多生动的艺术形象和精彩有趣的故事情节。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-37","list":11,"num":37,"word":"情感是艺术构思的动力","phonetic":"二、艺术构思活动","meanings":[{"pos":"","def":"想象是艺术构思的核心，情感是艺术构思的动力，并贯穿艺术创作始终。\n艺术构思中虽有感知、理解、联想、想象等多种心理因素，但它们都在情感的渗透和影响下发挥作用，只有在艺术家炽烈情感的浇灌下，才能形成审美意象、完成艺术构思。\n影片《城南旧事》结尾，在“长亭外，古道边”的音乐声中，秋日香山水红的枫叶接连六次化入又化出，令人想起“晓来谁染霜林醉，总是离人泪”，准确表达小英子离别故土的伤感。\n影片《林则徐》中，林则徐送别友人后登上山头亭子，只见大江中一叶扁舟顺流而下，情景交融，寄寓“孤帆远影碧空尽，唯见长江天际流”的意境。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-38","list":11,"num":38,"word":"艺术传达：审美意象的物态化","phonetic":"三、艺术传达活动","meanings":[{"pos":"","def":"艺术传达活动是创作过程的最后一个阶段，指艺术家借助一定的物质材料和艺术媒介，运用艺术技巧和艺术手法，将自己在艺术构思活动中形成的审美意象物态化，成为可供其他人欣赏的艺术作品和艺术形象。\n艺术创作的最终成果是艺术作品；离开了艺术传达，再好的体验与构思也得不到表现，无法让其他人欣赏，只能停留在艺术家的头脑之中。\n艺术传达离不开一定的物质材料，更离不开一定的艺术媒介或艺术语言，各门艺术的传达方式各有特点，形成特殊的制作方法和表现手法。\n体验、构思和传达三者始终有机地融合在一起，在创作中完全是统一的。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-39","list":11,"num":39,"word":"王羲之与张芝的“临池学书”","phonetic":"三、艺术传达活动","meanings":[{"pos":"","def":"曾巩《墨池记》中记载，晋代大书法家王羲之曾在江西临川城东临池学书，长年累月坚持不懈，以致池水变黑，留下墨池故迹。\n还有一种说法，是讲东汉的草圣张芝学书十分勤奋，“临池学书，池水尽黑”；书法界至今仍把“临池学书”作为学习书法的代称。\n艺术家之所以为艺术家，除特殊的观察力和想象力之外，还因为具有熟练、高超的艺术技巧，能得心应手地运用物质材料和艺术媒介完成创作。\n但艺术传达又不仅仅是一个技巧问题，更需要调动联想、想象、情感等多种心理功能，融入创作主体的生命和心灵，寻找独特的艺术传达方式。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-40","list":11,"num":40,"word":"形象思维：用形象把握世界","phonetic":"一、形象思维与抽象思维、灵感思维","meanings":[{"pos":"","def":"形象思维是人类能动地认识和反映世界的基本形式之一，也是艺术创作的主要思维方式。\n它运用一定的形象来感知、把握和认识事物，也就是通过具体、感性的形象来达到对事物本质规律认识的一种思维形式。\n特点一：过程始终不能离开感性形象，如同抽象思维始终离不开概念，总是运用形象来进行思维。\n特点二：不依靠逻辑推理，而是始终依靠想象、情感等多种心理功能。\n特点三：具有整体性——抽象思维侧重于分析，形象思维更侧重于综合，强调从整体上去把握事物。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-41","list":11,"num":41,"word":"抽象思维的定义与辅助作用","phonetic":"一、形象思维与抽象思维、灵感思维","meanings":[{"pos":"","def":"抽象思维，是指运用概念来进行判断、推理和论证的一种思维形式，主要应用于社会科学、自然科学等领域，侧重于理论研究与逻辑推理。\n在艺术构思与创造的过程中，诸如作品体裁的选择、主题的提炼、结构的安排、人物性格的设计、表现手法的选择，或多或少都离不开抽象思维活动。\n抽象思维在艺术活动中必须服从于形象思维的规律，有机融合在形象思维之中。\n艺术思维中形象思维是主体，但抽象思维和灵感思维也在积极发挥作用。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-42","list":11,"num":42,"word":"“春风又绿”与“僧敲月下门”","phonetic":"一、形象思维与抽象思维、灵感思维","meanings":[{"pos":"","def":"在艺术创作与欣赏中，形象思维也常有抽象思维的伴随。\n王安石把“春风又到江南岸”改为“春风又绿江南岸”；贾岛把“僧推月下门”改为“僧敲月下门”。\n苏轼的“不识庐山真面目，只缘身在此山中”也含有理性的思辨。\n这些炼字与诗句说明，抽象思维可以帮助艺术家推敲语言、提炼意蕴。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-43","list":11,"num":43,"word":"抽象思维渗透现代艺术流派","phonetic":"一、形象思维与抽象思维、灵感思维","meanings":[{"pos":"","def":"近现代科学技术的极大发展，使抽象思维日益渗透进艺术领域，扩大了艺术表现的手法和天地。\n20世纪上半叶出现的抽象主义画派，大大发展了西方绘画中的抽象化倾向。\n以萨特、加缪等人为代表的存在主义小说，更是直接以文艺的形式来宣传存在主义的哲学思想。\n梅特林克《青鸟》为代表的象征主义戏剧，以富有象征意义的剧情揭示和宣传哲理；苏联还形成了“思想电影”思潮，出现罗姆的《一年中的九天》、尤特凯维奇的《列宁在波兰》等作品。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-44","list":11,"num":44,"word":"灵感思维：顿悟式的思维","phonetic":"一、形象思维与抽象思维、灵感思维","meanings":[{"pos":"","def":"灵感思维，是指在创造活动中，人的大脑皮层高度兴奋时的一种特殊的心理状态和思维形式。\n它是在一定的抽象思维或形象思维的基础上，突如其来地产生出新概念或新意象的顿悟式思维形式。\n灵感具有突发性、偶然性和稍纵即逝等特点；其出现与潜意识或无意识活动有密切关系，但也与自觉的显意识活动的长期积累紧密相关。\n任何灵感的产生，都离不开艺术家的冥思苦想、长期寻觅、艰辛探索。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-45","list":11,"num":45,"word":"肖邦《c小调练习曲》的灵感","phonetic":"一、形象思维与抽象思维、灵感思维","meanings":[{"pos":"","def":"波兰著名钢琴家肖邦一生中创作了20多首钢琴练习曲，其中最著名的一首是《c小调练习曲》（《革命练习曲》）。\n他在赴西欧途中听到华沙革命失败的消息，巨大的悲痛激发了他的创作灵感。\n这说明灵感并非神秘莫测，而是艺术家长期精心构思、艰苦寻觅的精神能量在一瞬间的突然爆发。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-46","list":11,"num":46,"word":"无意识与弗洛伊德的冰山比喻","phonetic":"二、意识与无意识","meanings":[{"pos":"","def":"无意识，或称潜意识和下意识，是相对于意识而言的。\n普通心理学中，无意识指人的不知不觉、没有意识的心理活动；弗洛伊德的精神分析心理学中，无意识主要指人的原始冲动和各种本能、欲望，特别是性的欲望。\n弗洛伊德把人的心理分为意识、前意识和无意识三个部分，并把全部精神活动比作大海中的一座冰山：意识如同浮在水面上的一小部分，无意识犹如藏在水下的大部分，占有主要地位。\n科学、宗教、艺术等活动都受到无意识的支配和影响。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-47","list":11,"num":47,"word":"本我、自我、超我的三重人格","phonetic":"二、意识与无意识","meanings":[{"pos":"","def":"弗洛伊德后来改用三重人格理论取代无意识理论，把人的心理结构分成“本我”“自我”和“超我”。\n最下面一层是“本我”，它是人的各种原始本能、冲动和欲望在无意识领域的总和，其核心是生的本能和死的本能，在生的本能中主要是性本能。\n第二层“自我”与“本我”相对立，犹如一个看门人，专门控制和压抑各种不合现实标准的本能冲动。\n最高一层“超我”是道德的、宗教的、审美的理想形态，既监督“自我”，又与“自我”一道从道德理想的高度管制“本我”的非理性冲动。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-48","list":11,"num":48,"word":"荣格提出“集体无意识”理论","phonetic":"二、意识与无意识","meanings":[{"pos":"","def":"弗洛伊德的无意识理论、本能理论和三重人格理论影响深远。\n荣格提出“集体无意识”；艺术的民族风格离不开民族的文化心理结构，它以“集体无意识”的方式积淀下来，并且世代承传、延续下去。\n这一概念后来被用来说明艺术风格的民族特色。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-49","list":11,"num":49,"word":"酒后灵感：李白、张旭与里尔","phonetic":"二、意识与无意识","meanings":[{"pos":"","def":"无意识是艺术创造灵感和直觉的源泉：艺术家在“梦”或“醉”的状态下获得灵感，在无意识或下意识的状态下突破常规思维的局限与束缚，获得创造性的飞跃。\n杜甫《饮中八仙歌》写“李白斗酒诗百篇”“张旭三杯草圣传，脱帽露顶王公前，挥毫落笔如云烟”，记述了诗人李白和书法家张旭酒后思如泉涌、不能自已的创作冲动。\n法国音乐家里尔也是在酒后产生灵感，创作出闻名世界的《马赛曲》。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-50","list":11,"num":50,"word":"梅兰芳《宇宙锋》的最佳瞬间","phonetic":"二、意识与无意识","meanings":[{"pos":"","def":"从总体上看，艺术创作无疑是艺术家有目的、有意识的创作活动，意识在艺术创作中起着主要和支配的作用。\n在表演时，演员一瞬间完全入戏，而无意识地做出一些很自然、很恰当的动作，这在表演艺术中就叫作下意识表演或无意识表演；这一瞬间往往是表演中最激情、最动人、最美的时刻。\n梅兰芳在京剧《宇宙锋》中演到“金殿装疯”这场戏时，脸上的表情又哭又笑，逼真生动，达到了表演的最佳瞬间。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-51","list":11,"num":51,"word":"陆文婷“啃烧饼”的多义性表演","phonetic":"二、意识与无意识","meanings":[{"pos":"","def":"影片《人到中年》女主角陆文婷“啃烧饼”一场戏中，她拖着疲乏的身躯从手术台回到自己家里，喝着开水、啃着烧饼，看着身边站着的小儿子，表情非常复杂。\n这一镜头成为电影表演艺术中有代表性的“多义性表演”。\n它与“无表演的表演”一样，说明无意识表演在二度创作中的价值。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-52","list":11,"num":52,"word":"艺术风格：独特的创作个性","phonetic":"一、艺术风格","meanings":[{"pos":"","def":"艺术风格，是指艺术家的创作在总体上表现出来的独特的创作个性与鲜明的艺术特色。\n它既与艺术家主观方面的特点有关，也与题材的客观方面的特点分不开，涉及艺术作品内容与形式的各个层面，从艺术作品的整体上呈现出来。\n在艺术家个人的艺术风格中，已经不可避免地打上了民族、时代、地域、群体的烙印。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-53","list":11,"num":53,"word":"艺术风格多样性的三个来源","phonetic":"一、艺术风格","meanings":[{"pos":"","def":"艺术风格最鲜明的一个特点，就是它的多样性。\n其一，来自艺术家独特的创作个性：其性格、气质、禀赋、才能、心理等特点会投射和熔铸到作品之中；布封讲“风格即人”，曹丕认为“文以气为主”。\n现代心理学把人的气质分为胆汁质、多血质、黏液质、抑郁质四种基本类型。\n其二，来自艺术家独特的人生道路、生活环境、阅历修养和艺术追求；其三，来自审美需求的多样化——欣赏主体的层次、民族、地区不同，审美需要千差万别，反过来刺激不同风格的形成。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-54","list":11,"num":54,"word":"从格林童话到凡·高的风格差异","phonetic":"一、艺术风格","meanings":[{"pos":"","def":"德国格林兄弟创作了《灰姑娘》《白雪公主》，丹麦作家安徒生创作了《皇帝的新装》《卖火柴的小女孩》。\n贝多芬有气势磅礴的《英雄交响曲》，勃拉姆斯有安谧恬静的田园风俗画式作品《D大调第二交响曲》。\n野兽派画家马蒂斯色彩狂野、笔触飞扬、形态奇特，后印象派画家凡·高色彩明快、富于运动感。\n这些作品风格各异，说明艺术风格具有多样性。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-55","list":11,"num":55,"word":"丹纳《艺术哲学》的三原则","phonetic":"一、艺术风格","meanings":[{"pos":"","def":"19世纪法国著名艺术史学家丹纳在《艺术哲学》一书中认为，种族、环境、时代这三个原则决定着艺术的发展。\n这一观点用来说明艺术风格的民族特色与时代特色：风格并非纯粹的个人现象，还受民族、环境与时代条件的制约。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-56","list":11,"num":56,"word":"文艺复兴画派的名作举例","phonetic":"一、艺术风格","meanings":[{"pos":"","def":"文艺复兴时期佛罗伦萨画派波提切利的代表作品有《春》《维纳斯的诞生》。\n威尼斯画派乔尔乔涅的代表作品有《熟睡的维纳斯》《田园的合奏》。\n威尼斯画派提香有《圣爱与俗爱》《花神》。\n丢勒有《四使徒》《画家的母亲》，荷尔拜因有《画家的妻儿》《学者依拉斯莫像》。\n这些作品共同体现出文艺复兴艺术的民族与时代特色。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-57","list":11,"num":57,"word":"艺术风格的民族特色与根源","phonetic":"一、艺术风格","meanings":[{"pos":"","def":"艺术风格的民族特色，是由本民族的地理环境、社会状况、文化传统、风俗习惯等多种因素决定的，体现出本民族的审美理想和审美需要，但归根结底还是根源于本民族的社会生活与经济基础。\n艺术的民族风格又离不开民族的文化心理结构，它以一种“集体无意识”（荣格）的方式积淀下来，并且世代承传、延续下去。\n从总体上讲，艺术的民族风格就是要体现出民族的精神、性格和气质，民族的文化、风俗和习惯，民族的审美理想和美学传统。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-58","list":11,"num":58,"word":"时代风格：从青铜器到建筑","phonetic":"一、艺术风格","meanings":[{"pos":"","def":"艺术风格的时代特色，是指同一时代的艺术作品常常具有某些共同的特征，体现出这个时代占主导地位的审美理想和审美追求。\n商周时代青铜艺术极盛，商代晚期和西周早期的青铜器一般体积庞大厚重，流行“饕餮”兽面纹；春秋战国时期青铜器转为日常生活器皿，器壁变薄、器物变轻，出现狩猎、采桑、宴乐、攻占等纹饰。\n故宫处处体现封建中央集权制度，整个建筑群的中心是太和殿，充分体现“天子至尊”“皇权至上”的封建宗法礼制。\n人民大会堂作为社会主义时代的建筑，崇高、壮丽而又亲切、开朗，大会堂前的巨大石柱犹如一根根擎天柱，给人雄伟坚实、挺拔有力的感受。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-59","list":11,"num":59,"word":"艺术流派：风格相近的群体","phonetic":"二、艺术流派","meanings":[{"pos":"","def":"艺术风格体现出艺术家的创作个性，艺术流派则体现出风格相似或相近的艺术家们的共性。\n艺术流派，是指在中外艺术发展的一定历史时期里，由一批思想倾向、美学主张、创作方法和表现风格方面相似或相近的艺术家所形成的艺术派别。\n这些派别的形成有时是自觉的，有一定的组织形式或共同宣言；有时是不自觉的，仅仅因为创作风格类型的相近而组合在一起。\n这些艺术派别有的局限于一种艺术门类或体裁，有的则包括不同艺术门类或体裁的艺术家。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-60","list":11,"num":60,"word":"艺术流派形成的三种类型","phonetic":"二、艺术流派","meanings":[{"pos":"","def":"其一，由一批具有相同艺术主张的艺术家自觉结合而成，或有组织名称，或有共同艺术宣言，甚至与其他流派展开论争以宣传主张。\n其二，由一批艺术风格相近或相似的艺术家不自觉形成，一般没有固定的组织或纲领，也没有共同的艺术宣言；或因某一地区集中了一批风格相近的艺术家，或因题材相同、风格相似。\n其三，被后人归纳为特定的流派：艺术家本身并没有形成流派的计划或意愿，甚至自己并没意识到属于某一流派，只因风格相似，被后世在鉴赏或批评中归纳成派。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-61","list":11,"num":61,"word":"自觉与不自觉成派的例证","phonetic":"二、艺术流派","meanings":[{"pos":"","def":"达达主义是20世纪西方现代主义文艺流派之一，由法籍罗马尼亚诗人查拉和其他几个年轻诗人与艺术家于1916年在瑞士苏黎世形成，属于自觉结合而成的流派。\n美术上的威尼斯画派，因16世纪意大利威尼斯岛上集中了贝里尼父子、提香、乔尔乔涅等一批画家，崇尚人文主义美学思想，推崇色彩鲜明、形象丰满的风格而得名。\n电影中的“左岸派”是1960年前后法国新浪潮电影运动中的一个流派，以导演阿仑·雷乃为首，因成员都居住在巴黎塞纳河左岸得名，重要作品有《广岛之恋》《去年在马里昂巴德》。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-62","list":11,"num":62,"word":"被后人归纳与特殊成因的流派","phonetic":"二、艺术流派","meanings":[{"pos":"","def":"“建安文学”以曹氏父子和建安七子为代表，以慷慨悲壮的情感和刚健明快的语言，写出了一大批以“风骨”著称的文学作品，属被后人归纳的流派。\n荒诞派戏剧是20世纪50年代初产生于法国的一种现代主义戏剧，尤内斯库自称“反戏剧”，英国评论家马丁·埃斯林把这些风格相近的剧作家定名为“荒诞派戏剧”，代表作有《等待戈多》《秃头歌女》。\n19世纪60年代俄国“巡回展览画派”在民主运动高潮冲击下形成，列宾、苏里柯夫、列维坦等揭露农奴制度、反映人民苦难，说明流派的出现常与一定社会历史条件相联系。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-63","list":11,"num":63,"word":"艺术思潮与风格、流派的区别","phonetic":"三、艺术思潮","meanings":[{"pos":"","def":"艺术思潮，是指在一定社会历史条件下，特别是在一定的社会思潮和哲学思潮的影响下，艺术领域所发生的具有广泛影响的思想潮流和创作倾向。\n区别：艺术风格是创作主体独特个性的表现，艺术流派是风格相近或相似的创作主体的群体化，艺术思潮则是倡导某种文艺思想的几个或多个艺术流派所形成的艺术潮流。\n简言之，三者分别针对个体、群体，以及在一定历史时期内具有相当规模的较大群体。\n联系：某种艺术流派可能发展成为一种艺术思潮，而每个艺术思潮却可能包容许多艺术流派和不同的创作方法。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-64","list":11,"num":64,"word":"西方现代主义思潮与代表作品","phonetic":"三、艺术思潮","meanings":[{"pos":"","def":"西方现代主义艺术思潮是19世纪末、20世纪初从欧美各国兴起的一股文艺思潮，是许许多多西方艺术流派的总称，形式多种多样、方法五花八门。\n其萌芽始于19世纪中叶象征主义的出现，标志是法国象征主义诗人波德莱尔的诗集《恶之花》的问世；现代主义艺术思潮的正式形成是在20世纪。\n正式形成期以德国为中心的表现主义、以法国为中心的超现实主义、以意大利为中心的未来主义、以英国为中心的意识流文学。\n代表作品有德国表现主义电影《卡里加里博士》、布勒东的《可溶解的鱼》、乔伊斯的《尤利西斯》、马里内蒂编选的《未来主义诗集》等。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-65","list":11,"num":65,"word":"后现代主义：批判与超越","phonetic":"三、艺术思潮","meanings":[{"pos":"","def":"20世纪后半叶，“后现代主义”在西方兴起；它是同后工业社会相适应的一种文化思潮，随着现代主义的衰落而逐渐崛起，是对现代主义的一种批判与超越。\n从一定意义上讲，后工业社会是后现代主义产生的时代土壤，后现代主义是后工业社会的文化表征。\n其怀疑论、否定论和颓废论具有极大的消极影响与负面作用，但它摧毁了在西方文艺界雄霸近百年之久的现代主义，对现行制度和秩序发起猛烈攻击。\n著名的“后现代”问题专家弗雷德里克·杰姆逊，被认为是二次大战以后美国最重要的西方马克思主义批评家。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-66","list":11,"num":66,"word":"现代与后现代的五点区别","phonetic":"三、艺术思潮","meanings":[{"pos":"","def":"哲学基础：现代主义源于康德的批判理论、叔本华的唯意志论、弗洛伊德的精神分析学，倾向尼采的“日神精神”；后现代主义来自存在主义、非理性主义、德里达的解构主义，倾向“酒神精神”。\n人的主体性：现代主义自我中心、弘扬个性；后现代主义自我怀疑、强调主体丧失、反对一切中心。\n思想观念：现代主义致力于建构、崇尚结构主义；后现代主义致力于解构，以零散化、边缘化、多元化、不确定性取代整体性，推崇大众文化。\n风格与艺术特征：现代主义晦涩难懂、富有哲理，追求独特性；后现代主义追求平面感与无深度，追求感官刺激，突出“复制”的作用。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-67","list":11,"num":67,"word":"艺术创作方法的定义与分野","phonetic":"一、艺术创作方法","meanings":[{"pos":"","def":"艺术创作方法，是艺术家在创作过程中，对主体思想感情和客观生活的关系所持的基本态度和所遵循的基本原则。\n它是在艺术思维中要遵循的最一般的原则，也是艺术表现中所遵循的最一般的方法。\n冷静、客观地观察和体验生活的艺术家，偏重对从实际生活中得来的诸多表象进行写实的提炼、概括和描绘，这是现实主义的创作态度和原则。\n有的艺术家偏重主观的思想感情和理想的抒发，热情奔放、想象新奇，这就构成了浪漫主义的创作态度和原则。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-68","list":11,"num":68,"word":"现实主义创作方法与四特征","phonetic":"二、两大创作方法","meanings":[{"pos":"","def":"现实主义创作方法，是指艺术家按照生活的本来面貌，通过艺术形象的典型化，真实地再现生活的一种创作方法，是艺术发展史上最有影响的创作方法之一。\n特征一，艺术描绘的客观性：忠实于生活本来面貌的写实性，把描绘目光集中在普通人身上，依照现实本身的逻辑真实描绘，并重视细节真实。\n特征二，艺术形象的典型性：透过生活的表面和现象揭示社会生活的内在本质和规律，即生活外貌、细节真实与本质真实的统一。\n特征三，思想倾向和情感的隐蔽性；特征四，表现手法上运用朴素的艺术语言，客观、写实地叙述和描绘，冷静、细腻地刻画人物和事件。"}],"related":[],"section":"第11章","marked":false},{"id":"C11-69","list":11,"num":69,"word":"浪漫主义创作方法与四特征","phonetic":"二、两大创作方法","meanings":[{"pos":"","def":"浪漫主义创作方法，是指艺术家以奔放的主观激情，按照理想的面貌表现生活的创作方法，创作重心是追求理想和强烈的主观抒情色彩。\n特征一，追求理想：通过描绘人们“应有的”生活景象表现理想与愿望，以超越现实。\n特征二，创造奇幻型的艺术形象，多选神话传说或奇闻轶事，但仍以对现实生活的感受为基础；特征三，强烈的主观抒情色彩。\n特征四，表现手法上运用夸张的艺术语言，奇妙的幻想、强烈的对比、绚丽的色彩、离奇的情节，甚至超越时空。\n例证：斯芬克斯、殷商青铜器上的饕餮，李白、郭沫若、惠特曼、拜伦的诗，德拉克洛瓦的绘画，但丁、雨果、吴承恩的小说。"}],"related":[],"section":"第11章","marked":false},{"id":"C12-01","list":12,"num":1,"word":"艺术作品是艺术生产的成果与产品","phonetic":"第12章 艺术作品","meanings":[{"pos":"","def":"艺术作品是艺术生产的成果或产品：艺术家运用一定的物质媒介和艺术语言，通过艺术构思和艺术创作，把头脑中主客体统一的审美意象物态化，成为审美鉴赏的对象。\n它在整个艺术生产活动中处于中心的地位与中心的环节：是艺术家创造性劳动的产物，又是欣赏者完成艺术鉴赏的基础和起点。\n抓三个关键词：物态化、中心环节、鉴赏对象。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-02","list":12,"num":2,"word":"艺术作品的构成：三对统一与三层次","phonetic":"第12章 艺术作品","meanings":[{"pos":"","def":"从构成看，艺术作品是内容与形式的统一、感性与理性的统一、再现与表现的统一。\n从结构看，任何作品都由三个层次组合：第一层艺术语言，是外在的形式结构，由文字、声音、线条、色彩、画面构成；第二层艺术形象，是内在结构，为审美意象的物态化；第三层艺术意蕴，深藏其中，需仔细品味才能领会。\n口诀：语言在外、形象在内、意蕴在深。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-03","list":12,"num":3,"word":"艺术语言的定义与各门类语言","phonetic":"一、艺术语言","meanings":[{"pos":"","def":"艺术语言指艺术的表现方式、手段与物质媒介。任何一门艺术都有自己独特的表现方式与物质媒介，从而形成独具的美学特性和艺术特征。\n绘画语言包括线条、色彩、构图；音乐语言包括旋律、和声、节奏；电影语言包括画面、声音、蒙太奇。\n与日常语言相区别：语言是交际工具，艺术语言是艺术表现的媒介。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-04","list":12,"num":4,"word":"艺术语言的两大作用及其例证","phonetic":"一、艺术语言","meanings":[{"pos":"","def":"作用一，艺术语言本身具有独立的审美意义：作品首先诉诸欣赏者感官的就是线条、色彩、构图、声音、画面、文字，它们是感受艺术美的直接对象。例：法国19世纪印象派画家莫奈的代表作《青蛙塘》。\n作用二，艺术语言创造艺术形象：艺术家通过语言把审美意象物态化为形象，传达对生活的独特体验。例：特写镜头突出或强调人物事物的细部，远景镜头把人物与环境融为一体、借景抒情。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-05","list":12,"num":5,"word":"墨分五彩与齐白石的《墨虾图》","phonetic":"一、艺术语言","meanings":[{"pos":"","def":"“墨分五彩”指焦、浓、重、淡、清五种不同的色度，是中国画以墨代色的语言系统。\n齐白石的《墨虾图》主要运用淡墨，层次多变、富有透明感，生动地表现出虾在水中浮游的动势，以及虾外硬内柔、透明如玉的身躯。\n例证作用：说明笔墨语言本身即可塑造形象、传达质感与生命感。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-06","list":12,"num":6,"word":"科波拉《现代启示录》的电影语言","phonetic":"一、艺术语言","meanings":[{"pos":"","def":"获戛纳电影节金棕榈大奖的《现代启示录》，是美国著名导演科波拉执导的一部反思越南战争的巨片。\n影片中美军飞机进攻的场面，大量运用了综合运动镜头、变焦距镜头等多种电影语言，营造出混乱、压迫的战争氛围。\n结论：艺术的创新也必然包括艺术语言的创新。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-07","list":12,"num":7,"word":"《这里的黎明静悄悄》的三种色彩","phonetic":"一、艺术语言","meanings":[{"pos":"","def":"获莫斯科电影节大奖的苏联影片《这里的黎明静悄悄》，充分运用色彩语言造成强烈鲜明的对比。\n全片采用了彩色画面、黑白画面、高调摄影画面三种不同的电影画面语言，创造出三种不同的时空，分别表现战后的幸福、战争的残酷、战前的宁静。\n以特有的色彩魅力展现女战士丰富的内心世界，启示人们珍惜和平幸福的生活。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-08","list":12,"num":8,"word":"科技发展与电子音乐的出现","phonetic":"一、艺术语言","meanings":[{"pos":"","def":"19世纪末叶以来，科学技术的迅猛发展对艺术产生广泛而巨大的影响，不但直接促成了电影、电视等新兴艺术门类的诞生，而且不断丰富、完善和发展了艺术语言。\n电子音乐：广义包括电声乐器、电子合成器音乐等；狭义主要指电子合成器音乐。它运用现代电子技术在传统乐器和人声之外探索新的音响，在音质和音色上扩大了传统音乐的表现领域，实现了音乐语言的创新。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-09","list":12,"num":9,"word":"索绪尔与麦茨：语言学到电影符号学","phonetic":"一、艺术语言","meanings":[{"pos":"","def":"结构主义语言学之父、瑞士语言学家索绪尔著《普通语言学教程》：区分“语言”与“言语”，语言是社会性的符号系统，言语是个人的表达方式；又区分“能指”与“所指”，能指是符号的表示成分，所指是被表示成分，二者是约定俗成的关系。\n20世纪60年代电影符号学诞生于法国，标志是麦茨的《电影：语言还是言语》，此前称经典电影理论，此后称现代电影理论，具有分水岭意义。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-10","list":12,"num":10,"word":"艺术形象是反映生活的特殊方式","phonetic":"二、艺术形象","meanings":[{"pos":"","def":"艺术形象是文艺反映生活的特殊方式，总是具体可感的，它是客观因素与主观因素的统一、内容与形式的统一，也是个性与共性的统一，构成艺术作品的第二个层次。\n艺术语言和表现手法的主要作用，就是把艺术家头脑中主客观统一的审美意象物态化为艺术形象。\n注意：欣赏先接触色彩、线条、声音、文字等外部特征，但它们只是表现手段。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-11","list":12,"num":11,"word":"视觉形象与摄影的纪实性","phonetic":"二、艺术形象","meanings":[{"pos":"","def":"视觉形象指由人的眼睛直接感受到的艺术形象，构成材料都是空间性的，因而特别富有直观性、生动性、再现性。\n摄影艺术最重要的美学特征之一便是纪实性或再现性：它表现的总是客观存在的事物，摄取的影像与被摄对象的外貌形态几乎完全一致，给人以真的感觉。\n对比记忆：视觉形象重空间，听觉形象重时间。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-12","list":12,"num":12,"word":"顾闳中《韩熙载夜宴图》的五段","phonetic":"二、艺术形象","meanings":[{"pos":"","def":"我国五代时期南唐著名画家顾闳中，根据南唐后主李煜的旨意，用“心识默记”的方式画成著名长卷《韩熙载夜宴图》。\n全画共分“听乐”“赏舞”“休息”“清吹”“散宴”五段；韩熙载本人在画中共出现五次，但神色始终郁郁不乐。\n例证作用：充分体现画家传神的高超技巧，也说明视觉形象长于再现与细节刻画。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-13","list":12,"num":13,"word":"听觉形象与肖邦《一分钟圆舞曲》","phonetic":"二、艺术形象","meanings":[{"pos":"","def":"听觉形象指由人的耳朵直接感受到的艺术形象，构成材料是时间性的，主要指音乐作品的形象。\n它具有空灵性、抽象性、不确定性、多义性和朦胧性，这既是音乐的局限，也是音乐的长处，能为欣赏者的联想、想象与情感体验留下更多自由的空间。\n例：肖邦著名的钢琴曲《一分钟圆舞曲》，据说是描写一只爱咬着自己尾巴急速打转玩耍的小狗。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-14","list":12,"num":14,"word":"文学形象的间接性：想象的艺术","phonetic":"二、艺术形象","meanings":[{"pos":"","def":"文学形象指诗歌、散文、小说、报告文学等依靠语言作为媒介来塑造的形象，最鲜明的特征是间接性。\n语言艺术是“想象的艺术”：形象需读者凭借自身生活经验，在阅读中通过联想和想象，才在脑海中呈现活生生的画面。\n文学可写视觉、听觉以至嗅味触觉，可写静态与动态，可写外部肖像动作语言，也可写内心世界，因而最少受时空限制。\n例：《红楼梦》中的林黛玉，“一千个读者就有一千个哈姆雷特”。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-15","list":12,"num":15,"word":"综合形象与表演艺术的地位","phonetic":"二、艺术形象","meanings":[{"pos":"","def":"综合形象指话剧、戏曲、电影、电视等综合艺术中的艺术形象，既有视觉形象、听觉形象，还有文学形象。\n两个特点：一是通过演员在舞台、银幕或荧屏上同观众见面来完成，因此表演艺术在综合形象的塑造中具有十分重要的地位；二是集体创作的结晶，需要多个部门配合。\n记忆：综合形象＝多种形象＋表演＋集体。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-16","list":12,"num":16,"word":"艺术形象共性的四个方面","phonetic":"二、艺术形象","meanings":[{"pos":"","def":"（1）形象性：具体可感，是艺术反映生活的基本形式，艺术形象是艺术作品的核心；（2）概括性：把广泛的生活内容概括在形象之中；（3）情感性和思想性：融进艺术家爱憎悲欢的情感，渗透其对生活的思考与评价；（4）审美意义：凝聚审美理想与情趣，给人以美的享受。\n补一句：语言为塑造形象，意蕴蕴于形象，没有艺术形象就没有艺术作品。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-17","list":12,"num":17,"word":"艺术意蕴：深藏的内在含义","phonetic":"三、艺术意蕴","meanings":[{"pos":"","def":"艺术意蕴指深藏在艺术作品中的内在含义或意味，常具多义性、模糊性和朦胧性，体现为一种哲理、诗情或神韵，只可意会不可言传，需欣赏者反复领会、细心感悟，它是作品具有不朽艺术魅力的根本原因。\n层次定位：第一层艺术语言构成形式美，第二层艺术形象构成内容美，一切作品都有；第三层意蕴则只有优秀作品才具备。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-18","list":12,"num":18,"word":"黑格尔：意蕴是作品的灵魂","phonetic":"三、艺术意蕴","meanings":[{"pos":"","def":"黑格尔认为意蕴就是艺术作品的灵魂，它必须通过整个艺术作品才能体现出来。\n原话：“显现出一种内在的生气，情感，灵魂，风骨和精神，这就是我们所说的艺术作品的意蕴。”\n记忆点：灵魂—整体显现—生气、情感、风骨、精神。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-19","list":12,"num":19,"word":"杜夫海纳三层与贝尔的形式说","phonetic":"三、艺术意蕴","meanings":[{"pos":"","def":"法国现象学美学的代表人物杜夫海纳认为，艺术作品分为感性、主题和表现三层；第三层“表现”使作品意义具有多重性、不可穷尽性，是作品结构的最高层，也是艺术作品最本质的东西。\n英国著名艺术理论家克莱夫·贝尔在《艺术》一书中提出“艺术乃是有意味的形式”。\n一法一说，可并记。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-20","list":12,"num":20,"word":"中国历代关于意蕴的论述","phonetic":"三、艺术意蕴","meanings":[{"pos":"","def":"中国美学史虽未明确提出“意蕴”概念，但历代论述精辟：\n东晋顾恺之绘画思想的核心是“以形写神”；南齐王僧虔提出“书之妙道，神采为上，形质次之”；唐代张怀瓘把书法分为神、妙、能三品，“风骨神气者居上”；司空图主张“象外之象”“景外之景”“韵外之致”“味外之旨”；宋代严羽“妙悟说”；清代王士禛“神韵说”。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-21","list":12,"num":21,"word":"意蕴一：文化含义与人文精神","phonetic":"三、艺术意蕴","meanings":[{"pos":"","def":"第一，艺术意蕴就是艺术作品蕴藏的文化含义和人文精神。优秀作品正因意蕴深刻，才体现较高的文化品格和艺术价值，具有经久不衰的魅力。\n图像学佐证：美国艺术史学家、著名图像学家潘洛夫斯基提出把握图像意义的三层——自然的意义（山水树石等常识可识之物）、习俗的意义（梅兰竹菊“四君子”，西方百合象征纯洁、无花果象征智慧）、内在的意义（综合内涵）。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-22","list":12,"num":22,"word":"徐悲鸿《风雨鸡鸣》的寓意","phonetic":"三、艺术意蕴","meanings":[{"pos":"","def":"徐悲鸿在抗日战争期间创作的重要作品之一《风雨鸡鸣》，画中的公鸡是画家着力刻画的艺术形象。\n当时正值日寇铁蹄践踏神州，一贯热爱祖国的徐悲鸿从《诗经·风雨篇》“风雨如晦，鸡鸣不已”的诗句受到启发，借这只挺胸昂首站在石头上引吭长鸣的大公鸡，激发人们奋起抗日的勇气和决心。\n例证作用：形象有限，寄托的时代情感无限。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-23","list":12,"num":23,"word":"意蕴二：在有限中体现无限","phonetic":"三、艺术意蕴","meanings":[{"pos":"","def":"第二，艺术意蕴指作品应当在有限中体现出无限，在偶然中蕴藏着必然，在个别中包含着普遍。优秀的艺术作品总是通过生动感人的艺术形象，传达深刻的人生哲理或思想内涵。\n例：唐代文学家陈子昂《登幽州台歌》“前不见古人，后不见来者。念天地之悠悠，独怆然而涕下”，以短暂个体面对无限时空，正是有限中的无限。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-24","list":12,"num":24,"word":"意蕴三：多义模糊难以穷尽","phonetic":"三、艺术意蕴","meanings":[{"pos":"","def":"第三，深层意蕴常因多义性和模糊性，欣赏者意见纷纷、各说不一，有时连艺术家自己也说不明白。\n例一：米开朗基罗在佛罗伦萨美第奇教堂的四件大理石雕塑《昼》《夜》《晨》《暮》，象征时间的流逝和世事的变迁。\n例二：艾略特1922年发表的长诗《荒原》，以寻找圣杯的传说和大量典故为纬、“荒原”“水”“火”等意象为经，写一战后西方的精神危机，被视为象征主义诗歌的里程碑。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-25","list":12,"num":25,"word":"意蕴四：比主题更形而上的境界","phonetic":"三、艺术意蕴","meanings":[{"pos":"","def":"第四，意蕴并不完全是由艺术形象体现出来的主题思想。比起主题思想，意蕴是更形而上的东西，是一种哲理或诗情，只可意会不可言传，需对整个作品领悟体味才能把握。\n佐证：歌德诗剧《浮士德》取材于德国中世纪民间传说，是德国文学最杰出的作品；陶渊明《饮酒》“此中有真意，欲辩已忘言”。\n故对意蕴的阐释只能接近它，而无法穷尽它。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-26","list":12,"num":26,"word":"三个层次结合才成优秀作品","phonetic":"三、艺术意蕴","meanings":[{"pos":"","def":"在艺术作品的层次构成中，任何作品都必须具有前两个层次——艺术语言和艺术形象；第三层次艺术意蕴并非每个作品都有，某些偏重娱乐性、功利性或纪实性的作品常常就没有这一层次。\n但从总体上讲，正是这三个层次的完美结合，才形成了流传后世的优秀艺术作品。\n记忆：两层必备，三层出精品。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-27","list":12,"num":27,"word":"典型的定义：塑造成功的人物形象","phonetic":"一、典型","meanings":[{"pos":"","def":"典型又称典型人物、典型性格或典型形象，指艺术作品中塑造得成功的人物形象。广义的解释认为典型应包括典型人物、典型事件、典型环境等。\n典型的核心是塑造鲜明生动的人物形象，这一点是为大多数人所公认的。\n定位：典型在西方文论中地位极重，与中国的意境论相对举。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-28","list":12,"num":28,"word":"黑格尔、别林斯基、恩格斯论典型","phonetic":"一、典型","meanings":[{"pos":"","def":"黑格尔认为艺术作品中的人物形象应当个性非常鲜明，又富于代表性。\n别林斯基指出典型人物应具有时代特征和个性特征，应体现出普遍性和特殊性；他认为奥赛罗是嫉妒褊狭的典型，哈姆雷特是优柔寡断的典型。\n马克思、恩格斯真正阐明了典型问题：恩格斯认为优秀作品中的典型人物形象应当是个别性与普遍性的高度有机的统一体。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-29","list":12,"num":29,"word":"中外名著的典型人物举例","phonetic":"一、典型","meanings":[{"pos":"","def":"《水浒传》：鲁智深勇猛鲁莽、见义勇为，武松秉性刚烈、性格倔强，李逵脾气暴躁、心地善良。\n《三国演义》：诸葛亮足智多谋、料事如神，曹操狡猾奸诈、欺世盗名，张飞粗豪威猛、急躁暴烈。\n外国：莫里哀《伪君子》达尔丢夫伪善卑劣，司汤达《红与黑》于连不择手段往上爬，巴尔扎克《欧也妮·葛朗台》葛朗台贪婪吝啬，冈察洛夫《奥勃洛摩夫》奥勃洛摩夫懒惰成性。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-30","list":12,"num":30,"word":"典型的普遍性与特殊性统一","phonetic":"一、典型","meanings":[{"pos":"","def":"艺术典型是普遍性与特殊性的有机统一，又是必然性与偶然性的有机统一：在鲜明生动的个性中体现出广泛普遍的共性，在独一无二的个别形象中体现出具有普遍性的某些规律。\n艺术典型的个性指人物非常独特：独特的外表、行为、生活习惯，更有独特的性格、感情、内心世界，即独一无二、不可重复。\n答题套语：个性鲜明＋共性广泛＋二者统一。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-31","list":12,"num":31,"word":"奥勃洛摩夫与“多余人”典型","phonetic":"一、典型","meanings":[{"pos":"","def":"奥勃洛摩夫的主要性格特征就是懒惰：他年轻、颇有教养，却整天穿着睡衣，把一生大好时光消磨在睡眠上，做梦也梦见睡觉；朋友和女友设法使他振作都无济于事，友谊和爱情在他看来只是麻烦，最后躺在床上默默死去。\n他是俄国19世纪批判现实主义作家所塑造的“多余人”形象的一个典型，“奥勃洛摩夫性格”象征着旧俄国腐朽寄生的生活方式必将灭亡。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-32","list":12,"num":32,"word":"祥林嫂与老葛朗台的必然性","phonetic":"一、典型","meanings":[{"pos":"","def":"典型在现象中体现出本质，在偶然中体现出必然：人物的遭遇、命运、性格带有偶然性与不可重复性，其中却体现特定社会生活与历史发展的必然性。\n例一：祥林嫂两次丧夫、孩子又被狼叼走，连遭折磨，成为旧中国农村被侮辱、被损害的劳动妇女的典型。\n例二：巴尔扎克笔下的老葛朗台是绝无仅有的吝啬鬼、守财奴典型，身上鲜明体现出19世纪初期资本主义从原始积累过渡到金融资本时期的历史必然。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-33","list":12,"num":33,"word":"扁形人物与圆形人物的区别","phonetic":"一、典型","meanings":[{"pos":"","def":"文艺作品中性格单一化的人物称之为“扁形人物”，具有复杂性格的人物称之为“圆形人物”。\n塑造典型要求人物是血肉丰满的圆形人物：必须深刻揭示人物性格内在的矛盾性，真正展现人物性格的丰富性和复杂性，表现人物深邃的灵魂与内心世界，才能塑造出具有较高审美价值的典型人物。\n记忆：扁形＝单一标签，圆形＝矛盾复杂。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-34","list":12,"num":34,"word":"塑造典型人物的三个要点","phonetic":"一、典型","meanings":[{"pos":"","def":"（1）从生活真实与艺术真实出发，对客观现实生活加以艺术概括，在大量生活素材中发掘典型人物的原型，再经过艺术加工和艺术虚构，创作出典型性较高的形象。\n（2）典型人物应当是血肉丰满的圆形人物，深刻揭示性格内在的矛盾性，展现丰富性与复杂性，表现深邃的灵魂与内心世界。\n（3）塑造普遍性与特殊性、必然性与偶然性有机统一的人物，在个性中体现出具有一定社会内容和社会意义的必然规律。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-35","list":12,"num":35,"word":"意境是情景交融的境界","phonetic":"二、意境","meanings":[{"pos":"","def":"意境是中国古典美学传统的一个重要范畴，指艺术中一种情景交融的境界，是艺术中主客观因素的有机统一。\n其中既有来自艺术家主观的“情”，又有来自客观现实升华的“境”，境中有情、情中有境，是主观情感与客观景物相熔铸的产物，即情与景、意与境的统一。\n定位：意境是中华民族在长期艺术实践中形成的一种审美理想境界。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-36","list":12,"num":36,"word":"意境范畴的孕育、诞生与流变","phonetic":"二、意境","meanings":[{"pos":"","def":"意境作为美学范畴，孕育于先秦至魏晋南北朝，诞生于唐代，思想源头可追溯到先秦老庄哲学与魏晋玄学，并直接受到佛教影响。\n唐代王昌龄《诗格》把诗分为物境、情境、意境；司空图提出“韵味说”；宋代严羽“妙悟说”；清代王士禛“神韵说”；近代王国维“境界说”，认为境界包括情感与景物两方面，其实质就是意境。\n先导：西晋陆机《文赋》强调情随景迁；南朝刘勰《文心雕龙》提出“情以物迁，辞以情发”；宗炳《画山水序》主张“应目会心”。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-37","list":12,"num":37,"word":"意境特点一：若有若无的朦胧美","phonetic":"二、意境","meanings":[{"pos":"","def":"中国传统艺术境界多分为虚与实两部分：实的部分存在于画面、文字、乐曲及想象的意象之中；虚的部分即意境之重要或本质的部分，存在于想象和感悟之中。中国传统艺术十分讲究虚实结合。\n明代戏曲理论家王骥德说：“剧戏之道，出之贵实，而用之贵虚。”中国戏曲的舞台表演正是虚实结合的。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-38","list":12,"num":38,"word":"马远“马一角”与《寒江独钓图》","phonetic":"二、意境","meanings":[{"pos":"","def":"中国绘画中的空白绝不是多余的部分。南宋画家马远的画中总留出一角空白，因此被人戏称为“马一角”；他的《寒江独钓图》更是用大片空白突出了“寒”与“独”的意境。\n同类：中国书法讲究布白，强调“计白当黑”，甚至把字的结构称为“布白”；中国园林利用借景、分景、隔景，把实景与虚景结合，扩大和丰富空间与意境。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-39","list":12,"num":39,"word":"意境特点二：由有限到无限的超越美","phonetic":"二、意境","meanings":[{"pos":"","def":"中国传统美学追求“韵外之致”“味外之旨”，以有限的艺术形象达到无限的艺术意境，即“言有尽而意无穷”。\n理论支撑：魏晋王弼提出“得象忘言，得意忘象”；唐代司空图《二十四诗品·雄浑》提出“超以象外，得其环中”。\n切入方式：从刹那见永恒，以咫尺见千里；陆机《文赋》所谓“观古今于须臾，抚四海于一瞬”“笼天地于形内，挫万物于笔端”。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-40","list":12,"num":40,"word":"宋徽宗画院的五道命题画","phonetic":"二、意境","meanings":[{"pos":"","def":"相传宋徽宗时，北宋画院多以命题画方式招考画师，佳例流传：\n“野水无人渡，孤舟尽日横”——只画一舟人卧于船头、手横竹笛，诗意全出；\n“深山藏古寺”——不画庙宇，只画山下小溪边舀水的小和尚；\n“竹锁桥边卖酒家”——不画酒店，只在桥头画一片竹林、竹里挑出卖酒小旗，紧扣“锁”字；\n“踏花归去马蹄香”——马蹄后一群蝴蝶尾随追逐；\n“蝴蝶梦中家万里”——画塞外大漠、苏武头枕节杖假寐，头顶双蝶飞舞。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-41","list":12,"num":41,"word":"意境特点三：不设不施的自然美","phonetic":"二、意境","meanings":[{"pos":"","def":"意境追求天然之美、纯真之美、素朴之美，归结为一种自然天真的审美趣味，对中国传统美学产生了巨大的影响。\n中国人的美感认为“初发芙蓉”比“错彩镂金”是一种更高的美的境界，这种自然纯真正是中国古典美学十分重视的风格。\n补充：意境中“境”是基础，无境则无艺术形象，情与意便无从产生、无所寄托。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-42","list":12,"num":42,"word":"两种美的理想：错彩镂金与初发芙蓉","phonetic":"二、意境","meanings":[{"pos":"","def":"中国美学史上有两种不同的美的理想：一是“错彩镂金，雕缋满眼”之美，二是“初发芙蓉，自然可爱”之美。\n错彩镂金之例：商周青铜器、楚辞、汉赋、明清瓷器（永乐釉里红、康熙五彩、雍正粉彩）、戏曲舞台绚丽服装、民间刺绣年画剪纸。\n初发芙蓉之例：王羲之书法、顾恺之画、陶渊明诗、宋代定窑白瓷与龙泉窑青瓷、“元四家”“明四家”“扬州八怪”绘画、朴实无华的明代家具。\n倡导者：李白“清水出芙蓉，天然去雕饰”，杜甫“直取性情真”，苏轼“绚烂之极归于平淡”。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-43","list":12,"num":43,"word":"朱耷《荷花水鸟图》与郑板桥《风竹图》","phonetic":"二、意境","meanings":[{"pos":"","def":"清初画家朱耷，别号“八大山人”，明皇室后裔，明亡后出家为僧、后又为道士，常借花木鱼鸟的特征乃至夸张变形寄托郁闷悲愤。《荷花水鸟图》中残荷斜挂、孤石倒立，缩脖瞪白眼的水鸟孤零零蹲在石上，很像画家本人的自我写照。\n清代郑板桥擅画竹，是“扬州八怪”中画竹最杰出的代表。《风竹图》题诗：“衙斋卧听萧萧竹，疑是民间疾苦声。些小吾曹州县吏，一枝一叶总关情。”"}],"related":[],"section":"第12章","marked":false},{"id":"C12-44","list":12,"num":44,"word":"典型与意境的三重区别","phonetic":"二、意境","meanings":[{"pos":"","def":"典型重再现，意境重表现；典型重写实，意境重抒情；典型重描绘鲜明的人物形象，意境重抒发艺术家的内心世界。\n小说、戏剧、电影、电视剧等再现为主的艺术侧重塑造典型；抒情诗、山水画、音乐、建筑、书法等表现为主的艺术侧重创造意境。西方文论重典型论，中国古代文论重意境论。\n简言之：典型在主客统一中侧重客体，意境侧重主体；二者都是在有限形象中体现无限意蕴。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-45","list":12,"num":45,"word":"中西美学体系的三点对比","phonetic":"一、中国美学与中国艺术","meanings":[{"pos":"","def":"（1）中国传统美学强调美与善的统一，注重艺术的伦理价值；西方传统美学强调美与真的统一，更重视艺术的认识价值。\n（2）中国传统美学强调艺术的表现、抒情、言志；西方传统美学强调艺术的再现、模仿、写实。\n（3）“模仿说”是古希腊美学的普遍原则，亚里士多德以模仿为基础建立《诗学》体系，在欧洲雄霸两千年；“表现说”是中国先秦美学的核心，“言志”“缘情”是重视表现的最早见解，在情与理统一中将“天人合一”作为最高境界。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-46","list":12,"num":46,"word":"儒道禅三家构成中国美学主干","phonetic":"一、中国美学与中国艺术","meanings":[{"pos":"","def":"学术界一般认为，对中国传统艺术影响最为巨大的是儒家美学、道家美学和禅宗美学，三者的不断碰撞和融会，影响和决定着中国传统艺术思想、审美趣味的不断变化与发展。\n以孔子、孟子为代表的儒家美学与以老子、庄子为代表的道家美学，先秦时期已初具规模，此后既互相对立又彼此补充，共同构成中国传统美学的主干；后来崛起的禅宗美学与之既有相通，又有截然不同的独特之处。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-47","list":12,"num":47,"word":"儒家美学：入世与杜甫的诗史","phonetic":"一、中国美学与中国艺术","meanings":[{"pos":"","def":"儒家美学的形成与孔子以“仁”为核心的思想体系密切相关：政治色彩与伦理色彩浓厚，强调美与善的统一，功利主义倾向明显；主张“入世”，提倡“修身齐家治国平天下”。\n例：范仲淹“先天下之忧而忧，后天下之乐而乐”属儒家思想；杜甫受儒家美学影响较大，其“三吏”“三别”被公认为现实主义杰作，被称为“诗史”，他本人被尊为“诗圣”；《茅屋为秋风所破歌》中祈求的不是个人幸福，而是天下寒士的温暖。"}],"related":[],"section":"第12章","marked":false},{"id":"C12-48","list":12,"num":48,"word":"道家美学：出世与李白的诗","phonetic":"一、中国美学与中国艺术","meanings":[{"pos":"","def":"道家美学的形成与老庄以“道”为核心的思想体系密切相关：
