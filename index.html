,"list":4,"num":26,"word":"宗教促进艺术发展的两个表现","phonetic":"一、宗教与艺术的相互关系","meanings":[{"pos":"","def":"其一，宗教利用各门艺术来宣传宗教。宗教用艺术形象地宣传教义，为许多艺术家提供了艺术实践的天地和舞台，客观上推动了艺术发展。\n其二，宗教为艺术提供宗教题材和内容。从世界各民族的文学史来看，最初的源头都可以追溯到由宗教文化背景所产生的神话故事。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-27","list":4,"num":27,"word":"宗教阻碍艺术与二者的本质区别","phonetic":"一、宗教与艺术的相互关系","meanings":[{"pos":"","def":"宗教对艺术的影响，还表现在它在一定程度上阻碍着艺术的发展，使艺术沦为服务宗教的神学婢女。\n从根本上讲，宗教是人的自我意识的丧失，艺术却是对人的自由创造本质的确证。\n虽然宗教利用艺术在一定程度上推动了艺术发展，但从本质上讲，宗教也阻碍、束缚和限制着文艺的发展。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-28","list":4,"num":28,"word":"艺术影响宗教的三个途径","phonetic":"一、宗教与艺术的相互关系","meanings":[{"pos":"","def":"艺术参与宗教活动。\n艺术宣扬宗教思想。\n艺术强化宗教氛围。\n三句话构成“参与—宣扬—强化”的递进记忆链。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-29","list":4,"num":29,"word":"宗教艺术：为宗教服务的艺术","phonetic":"一、宗教与艺术的相互关系","meanings":[{"pos":"","def":"宗教艺术是相对于世俗艺术而言的，指在宗教影响或控制下，为宗教活动或宗教宣传服务的艺术。\n多种多样的宗教艺术，对各个地区、各个民族、各个种类的艺术都产生了深远影响。\n随着人类社会的发展与进步，宗教对艺术的影响已大大减弱，宗教艺术在当代主要作为历史文化遗产而存在。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-30","list":4,"num":30,"word":"文艺复兴三杰与代表作品","phonetic":"一、宗教与艺术的相互关系","meanings":[{"pos":"","def":"文艺复兴绘画三杰是达·芬奇、米开朗基罗、拉斐尔。\n文学代表作：意大利但丁的诗歌《神曲》、薄伽丘的小说《十日谈》，法国拉伯雷的小说《巨人传》，西班牙塞万提斯的小说《堂·吉诃德》，英国莎士比亚的戏剧。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-31","list":4,"num":31,"word":"唐代“变文”与《目连戏》","phonetic":"一、宗教与艺术的相互关系","meanings":[{"pos":"","def":"佛教传入我国后，在唐代产生了“变文”这种宗教宣传的新方式。\n所谓“变文”，就是以说唱的形式讲述佛教故事、宣传佛教教义。\n中国古代最早的正式剧场就是佛教的寺庙；唐中叶以后佛寺中出现杂剧演出，以佛经故事“目连救母”为题材形成《目连戏》。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-32","list":4,"num":32,"word":"世界三大宗教与宗教建筑例证","phonetic":"一、宗教与艺术的相互关系","meanings":[{"pos":"","def":"世界三大宗教是基督教、佛教、伊斯兰教。\n距今3000多年的古埃及金字塔是世界七大奇观之一，表达出古埃及人对神至高无上权威的无限崇拜。\n古希腊帕提农神庙、古罗马万神庙、巴黎圣母院、圣彼得大教堂、法国朗香教堂都是著名宗教建筑。\n哥特式建筑除巴黎圣母院外，还有法国夏特尔教堂、意大利米兰教堂、德国科隆大教堂。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-33","list":4,"num":33,"word":"米开朗基罗西斯廷教堂天顶画","phonetic":"一、宗教与艺术的相互关系","meanings":[{"pos":"","def":"意大利文艺复兴时期画家米开朗基罗的杰作是西斯廷教堂天顶画《创世记》，其中最著名的是《创造亚当》。\n西斯廷教堂的大型壁画《最后的审判》被称为“人体的百科全书”。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-34","list":4,"num":34,"word":"拉斐尔《西斯廷圣母》与四幅壁画","phonetic":"一、宗教与艺术的相互关系","meanings":[{"pos":"","def":"拉斐尔在西斯廷教堂绘有《西斯廷圣母》。\n他在梵蒂冈为教皇签字大厅绘制四幅壁画《雅典学院》《巴那斯山》《圣典辩论》《三德图》，分别代表哲学、诗学、神学、法学。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-35","list":4,"num":35,"word":"“画圣”吴道子与乐山大佛","phonetic":"一、宗教与艺术的相互关系","meanings":[{"pos":"","def":"唐代画家吴道子被誉为“画圣”，他的创作成就首先表现在宗教绘画上。\n四川乐山大佛又名凌云大佛，是世界上最大的石刻佛像之一，民间流传“山是一尊佛，佛是一座山”。\n北京雍和宫内著名的檀香木弥勒佛像，是我国最大的木刻佛像之一。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-36","list":4,"num":36,"word":"敦煌莫高窟与龙门石窟造像","phonetic":"一、宗教与艺术的相互关系","meanings":[{"pos":"","def":"敦煌莫高窟俗称千佛洞，壁画中有《鹿王本生图》《张议潮夫妇出行图》《维摩诘像》。\n龙门石窟有卢舍那大佛像。\n中国宗教建筑还有洛阳白马寺、西安大雁塔、河北定州开元寺塔、山西大同善化寺、湖北丹江口市武当山金殿、拉萨大昭寺等。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-37","list":4,"num":37,"word":"中国佛教四大名山是哪四座","phonetic":"一、宗教与艺术的相互关系","meanings":[{"pos":"","def":"四川峨眉山、浙江普陀山、安徽九华山、山西五台山。\n可按“峨眉—普陀—九华—五台”的顺序背诵，注意省份与山名的对应。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-38","list":4,"num":38,"word":"《格里高利圣咏》与海顿《创世记》","phonetic":"一、宗教与艺术的相互关系","meanings":[{"pos":"","def":"欧洲音乐史上有名的无伴奏齐唱乐《格里高利圣咏》，是欧洲音乐史上现存的有详细记录的最早的音乐作品。\n奥地利音乐家海顿的清唱剧《创世记》，内容取材于《圣经》故事。\n巴赫的代表作有《马太受难曲》《约翰受难曲》等。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-39","list":4,"num":39,"word":"《圣经》与取材圣经的文学作品","phonetic":"一、宗教与艺术的相互关系","meanings":[{"pos":"","def":"西方基督教文学的代表性著作是《圣经》，分为《旧约》和《新约》两大部分。\n取材于《圣经》的作品：14世纪英国诗人乔叟的《坎特伯雷故事集》、16世纪莎士比亚的《威尼斯商人》、17世纪英国诗人弥尔顿的《失乐园》。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-40","list":4,"num":40,"word":"《古兰经》《圣训》与《玛斯纳维》","phonetic":"一、宗教与艺术的相互关系","meanings":[{"pos":"","def":"伊斯兰教的代表性著作是《古兰经》和《圣训》。\n阿拉伯早期诗歌也融进浓郁的伊斯兰教宗教意识。\n诗人贾拉鲁丁·鲁米的名著《玛斯纳维》是一部叙事诗集，包括童话、故事和轶事，深刻反映伊斯兰教教义，在伊斯兰教中的地位仅次于《古兰经》和《圣训》。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-41","list":4,"num":41,"word":"佛教文学与《西游记》《封神演义》","phonetic":"一、宗教与艺术的相互关系","meanings":[{"pos":"","def":"佛教文学的代表性著作是佛经。\n佛教影响的艺术作品有《西游记》《封神演义》。\n元末明初杂剧《西游记》问世后，数百年来一直在戏曲舞台上盛行，唐僧、孙悟空、猪八戒等艺术形象家喻户晓。\n“舍身饲虎”“割肉贸鸽”“五百强盗剜目”都属于佛经故事。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-42","list":4,"num":42,"word":"道德的定义与三个组成部分","phonetic":"一、概述","meanings":[{"pos":"","def":"道德指人们在社会生活中形成的关于善与恶、是与非、正义与非正义等伦理观念和行为规范的总和。\n它包括道德意识、道德关系、道德活动等内容。\n道德是社会意识形态，建立在特定的经济基础之上，随着人类社会的产生而产生、发展而变化。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-43","list":4,"num":43,"word":"孔子论“美”与“善”的关系","phonetic":"一、概述","meanings":[{"pos":"","def":"孔子把“美”和“善”区分开来，但在孔子看来“善”比“美”更加重要。\n他认为《武》乐虽“尽美矣，未尽善也”；只有《韶》乐才达到“尽美矣，又尽善也”的境界。\n《毛诗序》提出“教以化之”的理论。高度强调美与善的统一、强调艺术在伦理道德上的感染作用，是中国美学和中国艺术一个十分显著的特征。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-44","list":4,"num":44,"word":"道德影响艺术：反映道德面貌","phonetic":"一、概述","meanings":[{"pos":"","def":"一定时代和一定社会的伦理道德思想，总是通过艺术作品的主题、题材、情节、人物、思想性、倾向性、内在意蕴等体现出来。\n道德对艺术的影响，尤其表现在作家、艺术家的世界观和道德观对艺术创作的影响上：描写人们的道德面貌与道德生活时，必然要融入自己的道德评价和道德判断。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-45","list":4,"num":45,"word":"托尔斯泰三部曲与《复活》","phonetic":"一、概述","meanings":[{"pos":"","def":"托尔斯泰著名的“三部曲”是《战争与和平》《安娜·卡列尼娜》《复活》。\n《复活》通过玛丝洛娃的悲惨遭遇和聂赫留朵夫赎罪的行动，表现了他们精神和道德的“复活”过程。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-46","list":4,"num":46,"word":"小仲马《茶花女》的道德评价","phonetic":"一、概述","meanings":[{"pos":"","def":"法国作家小仲马的小说《茶花女》一反当时的世俗道德标准，把同情和赞美都给予出身贫苦、堕入风尘又无力自拔的妓女玛格丽特。\n他以白色的茶花象征她高尚的情操和美好的心灵，同时无情揭露上流社会道德的虚伪，融入了作家自己鲜明的道德评价。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-47","list":4,"num":47,"word":"艺术影响道德的两个方面","phonetic":"一、概述","meanings":[{"pos":"","def":"其一，对人民群众的道德教育。艺术具有生动、感人的形象和特殊的魅力，对道德观念的评价和道德行为的选择都有很大影响，一部优秀作品可以提高人们的道德水平和精神境界。\n其二，对社会观念的影响。艺术能够对社会道德意识和道德观念的改变产生一定程度的影响。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-48","list":4,"num":48,"word":"艺术与道德区别：范围方式标准","phonetic":"一、概述","meanings":[{"pos":"","def":"范围：艺术从更广泛的范围来反映人们的社会生活。\n方式：道德以概念、原则和规范反映人与人之间的关系，艺术以形象具体地描写、刻画或表现这种关系。\n评价标准：道德评价常以“善”为唯一标准，艺术评价以“真善美”的统一为标准。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-49","list":4,"num":49,"word":"寓教于乐：艺术与道德的结论","phonetic":"一、概述","meanings":[{"pos":"","def":"并非一切艺术作品都必须具有道德内容。\n对于那些具有道德内容的艺术作品来说，也需要寓教于乐，不能够干巴巴地道德说教。\n只有这样，才能真正对欣赏者产生潜移默化的影响。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-50","list":4,"num":50,"word":"《钢铁是怎样炼成的》与《离骚》","phonetic":"一、概述","meanings":[{"pos":"","def":"奥斯特洛夫斯基的名著《钢铁是怎样炼成的》塑造了保尔·柯察金，他经历战场搏斗、生活磨难、爱情挫折、疾病痛苦等考验，以惊人的毅力战胜了这一切困难。\n屈原的《离骚》充满为理想而献身的精神，洋溢与祖国同休戚、共存亡的深挚情感；鲁迅在《彷徨》中引用“路漫漫其修远兮，吾将上下而求索”。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-51","list":4,"num":51,"word":"易卜生“社会问题剧”与《玩偶之家》","phonetic":"一、概述","meanings":[{"pos":"","def":"19世纪挪威著名戏剧家易卜生的“社会问题剧”，包括《玩偶之家》《社会支柱》《群鬼》《人民公敌》等。\n《玩偶之家》通过女主人公娜拉与丈夫产生矛盾、最后毅然离家出走的故事，真实反映了资本主义社会中男女在家庭里的不平等关系。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-52","list":4,"num":52,"word":"中国戏曲劝善惩恶的四部例证","phonetic":"一、概述","meanings":[{"pos":"","def":"劝善惩恶、因果报应、强调伦理道德，历来是中国戏曲的传统。\n《秦香莲》：陈世美最后被包公铡死，秦香莲的冤屈得以昭雪。\n《救风尘》：赵盼儿巧施计谋，迫使官府惩治恶少，救出落难姐妹。\n《窦娥冤》：窦娥含冤屈死，六月降雪、大旱三年，恶人最终遭到惩处。\n越剧《梁山伯与祝英台》：梁祝殉难后化为彩蝶，在神话世界里实现大团圆。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-53","list":4,"num":53,"word":"道德题材影片的五种类型","phonetic":"一、概述","meanings":[{"pos":"","def":"纪实风格：美国《克莱默夫妇》《普通人》《金色池塘》《母女情深》。\n悲喜剧风格：苏联梁赞诺夫“爱情三部曲”《命运的捉弄》《办公室的故事》《两个人的车站》。\n抒情诗风格：日本《绝唱》《远山的呼唤》。\n心理探索：苏联《没有证人》。\n青少年题材：苏联《我不愿长大》《孩子》，我国《红衣少女》《长大成人》。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-54","list":4,"num":54,"word":"李安“家庭伦理三部曲”","phonetic":"一、概述","meanings":[{"pos":"","def":"李安被誉为最重要的华人导演之一，成名作“家庭伦理三部曲”包括《推手》（1991）、《喜宴》（1993）、《饮食男女》（1994）。\n这几部影片通过家庭与伦理问题，反映东西方文化之间的对立与冲突、渗透与和解。\n他拍摄的《断背山》（2005）同样反映了伦理与人性的冲突。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-55","list":4,"num":55,"word":"李贽《焚书》与汤显祖《牡丹亭》","phonetic":"一、概述","meanings":[{"pos":"","def":"明代进步思想家、文学家李贽的《焚书》《续焚书》等著作，猛烈抨击封建礼教和封建道德。\n明代戏曲大家汤显祖的代表作《牡丹亭》通过杜丽娘和柳梦梅的爱情故事，揭露封建礼教对青年男女爱情的压制和束缚，有意将“情”与“理”对立起来。\n明代戏曲还有徐渭的《四声猿》、高濂的《玉簪记》。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-56","list":4,"num":56,"word":"“三言”“二拍”与市民文艺","phonetic":"一、概述","meanings":[{"pos":"","def":"“市民文艺”的突出代表是话本或拟话本短篇小说集，以“三言”“二拍”为代表。\n“三言”即明代通俗文学家冯梦龙的《喻世名言》《警世通言》《醒世恒言》；“二拍”即凌濛初编著的《初刻拍案惊奇》《二刻拍案惊奇》。\n《蒋兴哥会珍珠衫》表现市民阶层的爱情观；《转运汉巧遇洞庭红》传达商人渴望一本万利的投机心理。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-57","list":4,"num":57,"word":"艺术与科学联姻的三个辉煌时期","phonetic":"一、艺术与科学的联系和区别","meanings":[{"pos":"","def":"古希腊时期：将自然科学的成果直接运用到艺术领域。\n文艺复兴时期：以科学的思维方法促进艺术家文化心理结构的改变，推动艺术创作观念和创作方法的革新，推动艺术形态的发展。\n当代社会：科学技术不但为艺术提供了从未有过的大众传播媒介，而且创造出了新的艺术种类和艺术形式。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-58","list":4,"num":58,"word":"艺术与科学相互区别的五个维度","phonetic":"一、艺术与科学的联系和区别","meanings":[{"pos":"","def":"本质：科学是人类认识客观世界的知识总和，艺术是人类进行审美创造的最高形式。\n目的：科学求真，揭示事物发展的客观规律；艺术求美，满足人们精神文化生活方面的审美需要。\n思维方式：科学主要运用抽象思维、强调理性；艺术主要运用形象思维、强调情感。\n具体操作：科学客观冷静，艺术主观色彩很浓，除反映生活外还评价生活与表现情感。\n成果：科学理论具有普遍性，艺术作品必须具有独创性。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-59","list":4,"num":59,"word":"现代科技对艺术的积极影响","phonetic":"一、艺术与科学的联系和区别","meanings":[{"pos":"","def":"科学为艺术提供了新的物质技术手段，促使新的艺术种类和艺术形式的产生。\n科学为艺术创造文化环境与传播手段，提供更广阔的天地；社会生产力发展使人们有更多时间、闲暇和资金用于艺术。\n艺术与技术、美学与科学的相互结合与渗透，促进了双方的发展。\n科学还影响艺术观念、美学观念和艺术研究。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-60","list":4,"num":60,"word":"现代科技对艺术的消极影响","phonetic":"一、艺术与科学的联系和区别","meanings":[{"pos":"","def":"现代科学技术的进步既促进了艺术的发展，也对艺术产生了某些消极影响。\n大众传播媒介带来艺术的商品化与消费化倾向，导致大众审美水平降低等不良后果。\n大众传媒与计算机游戏等给青少年带来的一些负面影响，也需要我们去认真对待。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-61","list":4,"num":61,"word":"毕达哥拉斯学派“美是和谐”","phonetic":"一、艺术与科学的联系和区别","meanings":[{"pos":"","def":"古希腊毕达哥拉斯学派提出“美是和谐”的思想。\n学派成员大半是数学家，把数与和谐的原则当作宇宙间万事万物的根源。\n他们提出“黄金分割”的理论以及音乐里的数比例关系，并把这些原则运用到建筑、雕塑、绘画、音乐等各门艺术中。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-62","list":4,"num":62,"word":"电影发展史上的三次大变革","phonetic":"一、艺术与科学的联系和区别","meanings":[{"pos":"","def":"第一次：电影从无声到有声，代表作品是1927年的美国影片《爵士歌王》。\n第二次：电影从黑白到彩色，代表作品是1935年的美国影片《浮华世界》。\n第三次：计算机多媒体技术与数字技术，使电影艺术大踏步进入数字技术时代。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-63","list":4,"num":63,"word":"电视开播、设计学科与概念车","phonetic":"一、艺术与科学的联系和区别","meanings":[{"pos":"","def":"1936年11月2日英国广播公司正式播出电视节目，人们普遍把这一天作为世界电视业的开端。\n一门旨在统一产品的实用功能与审美功能的新学科——设计——应运而生。\n别克YJob是汽车工业界公认的世界第一辆概念车，1938年问世。"}],"related":[],"section":"第4章","marked":false},{"id":"C04-64","list":4,"num":64,"word":"李政道：科学与艺术是一枚硬币的两面","phonetic":"一、艺术与科学的联系和区别","meanings":[{"pos":"","def":"真题以李政道“科学和艺术是一枚硬币的两面”为引，要求结合现实案例及先进科学案例分析现代科学对艺术的影响。\n答题可调用本节要点：科学提供新的物质技术手段、催生新的艺术种类与形式、改变传播方式与文化环境，并影响艺术观念和艺术研究。"}],"related":[],"section":"第4章","marked":false},{"id":"C05-01","list":5,"num":1,"word":"亚里士多德按模仿的媒介对象与方式分类","phonetic":"第5章 艺术门类的划分","meanings":[{"pos":"","def":"亚里士多德根据模仿的媒介、对象和方式的不同来区分艺术。\n他据此区分了绘画与音乐、悲剧与喜剧、史诗与戏剧等。\n这说明分类的依据不同，划分出的艺术门类也就不同。"}],"related":[],"section":"第5章","marked":false},{"id":"C05-02","list":5,"num":2,"word":"近现代六种主要的艺术分类方法","phonetic":"1.主要的分类方法","meanings":[{"pos":"","def":"近现代艺术理论因分类的原则和角度不同，出现了多种分类方法，其中最主要的有六种。\n六种依据依次是：艺术形象的存在方式、审美方式、内容特征、物化形式、欧美新兴分类法、艺术的美学原则。\n第六种“美学原则”是本书采用的方法。\n记忆抓手：存在—审美—内容—物化—新兴—美学。"}],"related":[],"section":"第5章","marked":false},{"id":"C05-03","list":5,"num":3,"word":"按存在方式分时间空间时空艺术","phonetic":"1.主要的分类方法","meanings":[{"pos":"","def":"依据艺术形象的存在方式，分为时间艺术、空间艺术、时空艺术三类。\n时间艺术：音乐、文学；\n空间艺术：雕塑、绘画；\n时空艺术：戏剧、影视。\n三类分别对应在时间中展开、在空间中存在、兼有时空两种存在方式。"}],"related":[],"section":"第5章","marked":false},{"id":"C05-04","list":5,"num":4,"word":"按审美方式分听觉视觉视听艺术","phonetic":"1.主要的分类方法","meanings":[{"pos":"","def":"依据艺术形象的审美方式，分为听觉艺术、视觉艺术、视听艺术三类。\n听觉艺术：音乐；\n视觉艺术：绘画；\n视听艺术：戏剧。\n这一分类看的是欣赏者用哪种感官去感受艺术形象。"}],"related":[],"section":"第5章","marked":false},{"id":"C05-05","list":5,"num":5,"word":"按内容特征分表现与再现艺术","phonetic":"1.主要的分类方法","meanings":[{"pos":"","def":"依据艺术形象的内容特征，分为表现艺术与再现艺术。\n表现艺术：音乐、舞蹈、建筑、抒情诗等；\n再现艺术：绘画、雕塑、戏剧、小说等。\n注意同一门类在不同分类依据下可能归入不同类别，要按依据记例子。"}],"related":[],"section":"第5章","marked":false},{"id":"C05-06","list":5,"num":6,"word":"按物化形式分动态与静态艺术","phonetic":"1.主要的分类方法","meanings":[{"pos":"","def":"依据艺术形象的物化形式，分为动态艺术与静态艺术。\n动态艺术：音乐、舞蹈、戏剧、影视等；\n静态艺术：绘画、雕塑、建筑、实用工艺等。\n区分要点是艺术形象呈现时是否处于流动变化之中。"}],"related":[],"section":"第5章","marked":false},{"id":"C05-07","list":5,"num":7,"word":"欧美新兴分类法分视觉与表演艺术","phonetic":"1.主要的分类方法","meanings":[{"pos":"","def":"依据欧美新兴分类法，分为视觉艺术与表演艺术两类。\n视觉艺术：绘画、雕塑、摄影、建筑、工艺、现代艺术设计、广告艺术、电影艺术、计算机三维动画、动漫、游戏软件等。\n表演艺术：音乐、舞蹈、戏剧、音乐剧等。\n注意电影、动漫、游戏软件被归入视觉艺术，是这一分类的特殊之处。"}],"related":[],"section":"第5章","marked":false},{"id":"C05-08","list":5,"num":8,"word":"欧美新兴分类法能及时容纳新兴门类","phonetic":"1.主要的分类方法","meanings":[{"pos":"","def":"优点：适应现代艺术的发展趋势，及时容纳了最新出现并广受欢迎的新兴艺术门类或样式。\n它把摄影、设计、广告、动漫、游戏软件等新样式纳入视野，避免了传统分类对新兴艺术的遗漏。\n答“优点”题时，关键词是“适应趋势、及时容纳新兴门类”。"}],"related":[],"section":"第5章","marked":false},{"id":"C05-09","list":5,"num":9,"word":"欧美新兴分类法尚未获普遍认可","phonetic":"1.主要的分类方法","meanings":[{"pos":"","def":"缺点：这种分类方法刚刚出现，尚未经过时间的检验。\n目前尚未得到世界各国艺术界、学术界、教育界的普遍认可；即使在发达国家，也并没有得到普遍的认同。\n答题关键词：“时间短、未检验、未普遍认可”。"}],"related":[],"section":"第5章","marked":false},{"id":"C05-10","list":5,"num":10,"word":"本书按美学原则划分五类艺术","phonetic":"1.主要的分类方法","meanings":[{"pos":"","def":"本书根据艺术的美学原则，将艺术分为实用艺术、造型艺术、表情艺术、综合艺术、语言艺术五类。\n这是本书采用、并贯穿全书章节划分的分类方法。\n五类顺序可记为“实—造—表—综—语”。\n答题时先写依据（美学原则），再写五类名称，最后各举门类。"}],"related":[],"section":"第5章","marked":false},{"id":"C05-11","list":5,"num":11,"word":"实用艺术与造型艺术的门类举例","phonetic":"1.主要的分类方法","meanings":[{"pos":"","def":"实用艺术：建筑、园林、工艺美术与现代设计。\n造型艺术：绘画、雕塑、摄影、书法。\n这两类共八种门类是客观题高频考点。\n注意：建筑、园林归实用艺术；书法、摄影归造型艺术，不要互串。"}],"related":[],"section":"第5章","marked":false},{"id":"C05-12","list":5,"num":12,"word":"表情综合语言艺术的门类举例","phonetic":"1.主要的分类方法","meanings":[{"pos":"","def":"表情艺术：音乐、舞蹈。\n综合艺术：戏剧、戏曲、电影、电视。\n语言艺术：诗歌、散文、小说。\n戏剧、戏曲、影视由几种艺术因素结合而成，故归综合艺术。\n诗歌、散文、小说属文学，故归语言艺术。"}],"related":[],"section":"第5章","marked":false},{"id":"C05-13","list":5,"num":13,"word":"艺术分类的意义在于揭示特性规律","phonetic":"1.主要的分类方法","meanings":[{"pos":"","def":"艺术分类的意义，在于揭示各门艺术自身的特性和发展规律，以及它们各自不同的物质媒介和艺术语言。\n由此更加深入地认识和掌握各门艺术的审美特征和美学实质，进一步推动各门艺术的提高和发展。\n答题分两层：认识层面（特性、规律、媒介、语言）与实践层面（推动提高和发展）。"}],"related":[],"section":"第5章","marked":false},{"id":"C05-14","list":5,"num":14,"word":"任何艺术分类方法都只有相对意义","phonetic":"1.主要的分类方法","meanings":[{"pos":"","def":"任何艺术分类的方法都只具有相对的意义，各门艺术之间存在某些彼此相通的共同规律。\n正确认识和理解这种多样性与统一性，掌握各类艺术的基本规律和美学特征，有助于提高艺术鉴赏能力和艺术修养。\n所以既要看到分类，也要看到门类之间的相通之处。"}],"related":[],"section":"第5章","marked":false},{"id":"C05-15","list":5,"num":15,"word":"各门艺术相互联系的三种方式","phonetic":"一、各种艺术的相互联系","meanings":[{"pos":"","def":"各门艺术之间的关系，首先表现为各种艺术的相互联系，主要有三种方式：吸收与借鉴、配合、结合。\n吸收与借鉴：从其他艺术中汲取营养，不改变自身独立性质；\n配合：两种以上艺术在同一作品中出现，构成整体但有主次；\n结合：融为一体、不可分离，可能产生新的艺术品种。\n三者的区别在于结合的紧密程度。"}],"related":[],"section":"第5章","marked":false},{"id":"C05-16","list":5,"num":16,"word":"吸收与借鉴不改变艺术自身性质","phonetic":"一、各种艺术的相互联系","meanings":[{"pos":"","def":"吸收与借鉴：艺术直接从其他艺术中汲取营养，或从他种艺术所创造的境界、形式等方面得到借鉴与启示，使自身的发展得以完善和创新。\n艺术从本身的需要出发，吸收或借鉴其他艺术的某些因素，并不改变它自身独立的性质。\n“诗中有画，画中有诗”就是典型的吸收与借鉴。"}],"related":[],"section":"第5章","marked":false},{"id":"C05-17","list":5,"num":17,"word":"“诗中有画，画中有诗”的借鉴例证","phonetic":"一、各种艺术的相互联系","meanings":[{"pos":"","def":"“诗中有画，画中有诗”是吸收与借鉴的典型例证。\n诗与画各自从对方所创造的境界与形式中得到启示，相互丰富，但诗仍是诗、画仍是画。\n这说明吸收借鉴是“取营养”，不是“变成对方”，不改变自身独立的艺术性质。\n常与“配合”对比出题，注意区分。"}],"related":[],"section":"第5章","marked":false},{"id":"C05-18","list":5,"num":18,"word":"诗画配合构成整体但有主次之别","phonetic":"一、各种艺术的相互联系","meanings":[{"pos":"","def":"配合：指两种或两种以上的艺术在一件作品中出现，从而构成统一和谐、不改变其本身性质的整体。\n例如中国画中诗与画一起出现，相辅相成，保持其本性，而不是形成第三种艺术。\n在这样的配合中，各种艺术的地位一般不是平列的，而会有主次之别。\n关键词：同一作品、和谐整体、各有本性、有主次。"}],"related":[],"section":"第5章","marked":false},{"id":"C05-19","list":5,"num":19,"word":"结合使各艺术融为一体并产生新品种","phonetic":"一、各种艺术的相互联系","meanings":[{"pos":"","def":"结合：两种以上的艺术结合成为一个整体，不可分离，也没有各自独立的价值。\n结合可能产生新的艺术品种，如“综合艺术”，就是由几种艺术因素相结合而形成的新的艺术种类。\n与配合的区别：配合中各艺术仍保持独立价值，结合后则失去独立价值。\n记忆：配合“合而有别”，结合“合而为一”。"}],"related":[],"section":"第5章","marked":false},{"id":"C05-20","list":5,"num":20,"word":"艺术在分化与综合中发展的客观规律","phonetic":"二、艺术在分化与综合中发展","meanings":[{"pos":"","def":"艺术在自身的发展中，不断经历着分化与综合的过程，这是艺术发展的一条客观规律。\n每个艺术门类都是一个个开放的体系，而不是各自闭关自守的领地。\n只要有一定条件，它们都会从其他艺术中吸取营养，甚至同其他艺术结合起来而创造出新的艺术品种，从而丰富和发展自己，并使整个艺术系统得到发展。"}],"related":[],"section":"第5章","marked":false},{"id":"C05-21","list":5,"num":21,"word":"现代艺术在学科交叉中推陈出新","phonetic":"二、艺术在分化与综合中发展","meanings":[{"pos":"","def":"在现代社会，随着经济和文化的加速发展，各种学科之间的联系与交叉呈现出日益频繁的态势。\n传统的艺术形式有着悠久的历史，但仍在吸取营养、推陈出新。\n这说明艺术的分化与综合在当代更加活跃，传统艺术并未停止发展。"}],"related":[],"section":"第5章","marked":false},{"id":"C06-01","list":6,"num":1,"word":"实用艺术的定义与基本特征","phonetic":"第一节 实用艺术的主要种类","meanings":[{"pos":"","def":"名词解释：实用艺术是实用与审美相结合的表现性空间艺术，主要包括建筑艺术、园林艺术、工艺美术与现代设计。\n它是所有艺术种类中最普及、最常见的一大类别，与人们衣、食、住、用等日常生活关系最为密切。\n实用艺术既有实用价值，又有审美价值，最基本的特征是实用性与审美性相结合。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-02","list":6,"num":2,"word":"实用艺术满足物质与精神双重需要","phonetic":"第一节 实用艺术的主要种类","meanings":[{"pos":"","def":"①与其他艺术的重要区别之一，是它不仅满足人们精神上的审美需要，还在一定程度上满足物质上的实用需要。\n②实用艺术既有实用价值，又有审美价值。\n③实用艺术通过具有实体性的物质材料，创造出具有实用性和审美性的静态艺术品。\n④实用艺术不重模仿客观事物，而重表现艺术家的审美理想或美学追求，不强调再现性而强调表现性。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-03","list":6,"num":3,"word":"维特鲁威提出的建筑三原则","phonetic":"一、建筑艺术","meanings":[{"pos":"","def":"早在两千年前，古罗马建筑师维特鲁威就提出了建筑的三条基本原则：“实用、坚固、美观”。\n现代建筑虽然仍然遵循这三个原则，但“美观”被提到越来越重要的地位。\n记忆：维特鲁威＋三原则＝实用、坚固、美观（口诀“用、固、美”）。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-04","list":6,"num":4,"word":"建筑艺术的定义与三大统一","phonetic":"一、建筑艺术","meanings":[{"pos":"","def":"建筑是建筑物和构筑物的通称，是人类用物质材料修建或构筑的居住和活动场所。\n建筑艺术指按照美的规律，运用建筑艺术特有的艺术语言，使建筑形象具有文化价值和审美价值，具有象征性和形式美，体现出民族性和时代感。\n建筑艺术应当是“建筑”与“艺术”二者的“和谐统一”，是物质功能与审美功能、实用性与审美性、技术性与艺术性的统一。\n建筑的审美特点主要表现为它的造型美。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-05","list":6,"num":5,"word":"建筑艺术的七种艺术语言","phonetic":"一、建筑艺术","meanings":[{"pos":"","def":"建筑的艺术语言和表现手段包括空间、形体、比例、均衡、节奏、色彩、装饰等许多因素，正是它们共同构成了建筑艺术的造型美。\n“空间”是建筑的基本形式要素，建筑主要通过创造各种内外空间来满足人们的实际需要，巧妙地处理空间可以大大增强建筑艺术的表现力。\n记忆口诀：“空、形、比、均、节、色、装”。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-06","list":6,"num":6,"word":"天坛圜丘附会“天圆地方”","phonetic":"一、建筑艺术","meanings":[{"pos":"","def":"“空间”是建筑的基本形式要素，建筑主要通过创造各种内外空间来满足人们的实际需要。\n北京的天坛，就是用有形的建筑实体来表现无形的天宇：整体平面是正方形，中央的圜丘为白石砌成的三层圆坛，附会了古代“天圆地方”之说。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-07","list":6,"num":7,"word":"中山陵依山而建的形体处理","phonetic":"一、建筑艺术","meanings":[{"pos":"","def":"“形体”主要是指建筑物的总体轮廓，通过线条和形体、空间和实体的不同组合方式，以及建筑与环境的和谐统一，突出建筑物特有的个性色彩和特有的艺术感染力。\n南京的中山陵依山而建，把连绵不断的自然山势当作建筑空间的有机组成部分。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-08","list":6,"num":8,"word":"人民大会堂“水天一色”的穹顶","phonetic":"一、建筑艺术","meanings":[{"pos":"","def":"“比例”主要是指巧妙处理建筑物各部分之间的比例关系，建筑物长宽高的比例、凹与凸的比例、虚与实的比例等，都直接影响到建筑美。\n人民大会堂万人会议厅的设计，根据周恩来总理关于大海的提示，建筑师们设计了“水天一色”的穹隆形顶篷。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-09","list":6,"num":9,"word":"故宫以中轴线实现的均衡对称","phonetic":"一、建筑艺术","meanings":[{"pos":"","def":"“均衡”主要是指建筑在构图上的对称，包括建筑物前后、左右、上下各部分之间的关系；均衡对称常常给人一种严肃庄重的感觉，增加崇高的美感。\n最常见的均衡方式是在中轴线的左右实现对称。\n北京故宫作为一个完整的建筑群非常均衡对称，其中每座建筑物都是在以高大的太和殿为中心的、由南到北的中轴线上展开。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-10","list":6,"num":10,"word":"建筑的节奏、色彩与装饰语言","phonetic":"一、建筑艺术","meanings":[{"pos":"","def":"“节奏”指通过建筑物的墙、柱、门、窗等构成部分有规律的变化和排列，产生一种韵律美或节奏美。\n“色彩”也常作为一种重要手段构成建筑特有的艺术形象，给人带来特殊的审美感受。\n“装饰”作为建筑物的有机组成部分，可以起到为建筑物增辉添彩的作用。\n例：故宫总体色彩金碧辉煌——朱红色围墙、白色台基、金黄色琉璃瓦顶、大红色柱子和门窗。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-11","list":6,"num":11,"word":"“凝固的音乐”与“石头的史书”","phonetic":"一、建筑艺术","meanings":[{"pos":"","def":"建筑是“凝固的音乐”，音乐是“流动的建筑”。\n建筑又被称作“石头的史书”：建筑艺术作为民族文化的体现和时代精神的镜子，总是以直观形象的方式反映出一定的社会意识形态和深刻的历史文化内涵。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-12","list":6,"num":12,"word":"哥特式、洛可可与新古典主义建筑","phonetic":"一、建筑艺术","meanings":[{"pos":"","def":"中世纪欧洲宗教统治根深蒂固，在建筑艺术中体现鲜明：最典型的哥特式建筑以巴黎圣母院为例，高度惊人，象征着中世纪教会的无上权威，高高凌驾于整个城市之上。\n18世纪初叶，反映贵族审美趣味的洛可可式建筑从法国兴起并盛行欧洲：外形富丽堂皇，装饰奇特精巧，复杂曲线故意造成不对称感，室内广泛采用昂贵壁画和巨大镜子。\n18世纪后半叶，启蒙运动思想广泛传播，“新古典主义建筑”兴起。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-13","list":6,"num":13,"word":"建筑审美随技术与材料而变","phonetic":"一、建筑艺术","meanings":[{"pos":"","def":"在所有艺术门类中，建筑艺术与物质条件和技术条件的关系最为密切。\n建筑作为技术与艺术的综合体，它的审美功能总是随着建筑技术与建筑材料的改变而发生变化。\n1931年在纽约落成的帝国大厦，是第一座超过100层的摩天大楼。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-14","list":6,"num":14,"word":"包豪斯学派与创始人格罗皮乌斯","phonetic":"一、建筑艺术","meanings":[{"pos":"","def":"20世纪20年代开始，以德国建筑家格罗皮乌斯为代表的“包豪斯学派”，主张把建筑、美术、工艺等按照现代美学原则结合起来，主张现代建筑艺术理论，很快对世界各国的建筑艺术和建筑风格产生深远影响。\n包豪斯是1919年德国创办的一所建筑及产品设计学校，它的创始人就是著名建筑家格罗皮乌斯（原文又作“格罗彼乌斯”）。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-15","list":6,"num":15,"word":"现代建筑艺术的七件代表作","phonetic":"一、建筑艺术","meanings":[{"pos":"","def":"美国纽约的古根汉姆艺术馆；\n美国匹茨堡市的流水别墅、华盛顿的国家美术馆东馆；\n巴黎的蓬皮杜文化艺术中心；\n澳大利亚的悉尼歌剧院、巴西的议会大厦、法国的朗香教堂。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-16","list":6,"num":16,"word":"赖特的“有机建筑”与流水别墅","phonetic":"一、建筑艺术","meanings":[{"pos":"","def":"美国著名建筑家赖特被称为西方现代建筑四位大师之一，他提倡“有机建筑”，认为建筑应当从属于周围的自然环境。\n赖特设计的流水别墅位于美国匹茨堡市，平台下面是天然的溪水，造型新颖别致，与周围环境浑然一体。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-17","list":6,"num":17,"word":"悉尼歌剧院的造型与“有机建筑”","phonetic":"一、建筑艺术","meanings":[{"pos":"","def":"悉尼歌剧院位于悉尼大桥附近三面环水的岛上，由丹麦设计师约翰·伍重设计，历时16年完成，耗资超过原估价的14倍。\n这座建筑可以从五个立面观看，有人说像帆船，有人说像白鹤，有人说像贝壳，有人说像白荷花，但都与水有关，体现出“有机建筑”的魅力，成为举世闻名的建筑和澳大利亚的象征。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-18","list":6,"num":18,"word":"园林的定义与实用审美特征","phonetic":"二、园林艺术","meanings":[{"pos":"","def":"名词解释：园林是指在一定的地域运用工程技术和艺术手段，通过改造地形（或进一步筑山、叠石、理水）、种植花草、营造建筑和布置园路等途径创作而成的美的自然环境和游憩境域。\n园林艺术的基本特征同样是实用性与审美性、技术性与艺术性相结合。\n园林的实用功能主要是供人们游憩玩赏，这种特殊的使用功能要求园林更加侧重于审美性和艺术性。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-19","list":6,"num":19,"word":"世界三大园林体系及各自特点","phonetic":"二、园林艺术","meanings":[{"pos":"","def":"东方园林以中国园林为代表，特别重视人与自然的亲和，可称为自然式。\n欧洲园林以法国园林为代表，强调几何形图案，崇尚人工美，可称为几何式。\n阿拉伯式园林发源于古代巴比伦和波斯，主要以十字形道路交叉处的水池为中心的格局。\n例证：法国凡尔赛园林、印度泰姬陵、《红楼梦》中的大观园。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-20","list":6,"num":20,"word":"中国古典园林的两大类型","phonetic":"二、园林艺术","meanings":[{"pos":"","def":"北方大型皇家园林气魄宏大、富丽堂皇，如北京的圆明园、颐和园，承德的避暑山庄等。\n江南小型私家园林精巧别致、饶有情趣，如苏州的拙政园、网师园、西园、留园，扬州的何园、个园，上海的豫园等。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-21","list":6,"num":21,"word":"中国古典园林追求诗情画意","phonetic":"二、园林艺术","meanings":[{"pos":"","def":"中国古典园林最突出的特点，是追求一种诗情画意的审美境界。\n不管是北方大型园林还是南方小型园林，都将自然美和建筑美有机融合，在有限的空间创造出深远的意境，形成鲜明而独特的艺术风格。\n欣赏中国园林，不但要欣赏自然美、建筑美，尤其要欣赏文化美——文化美是中国园林的精华与核心。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-22","list":6,"num":22,"word":"中国园林的自然美与建筑美","phonetic":"二、园林艺术","meanings":[{"pos":"","def":"一方面充分利用与创造自然美：几乎所有园中都有水池、假山、花草、树木，呈现出小桥流水、荷花飘香的自然风光。\n另一方面非常重视建筑美，注意运用中华民族的建筑艺术形式，讲究亭、台、楼、阁、厅、堂、廊、榭等建筑形式的美感。\n中国园林深深植根于民族文化沃土，具有浓郁的民族风格和民族色彩。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-23","list":6,"num":23,"word":"颐和园的借景、分景与隔景","phonetic":"二、园林艺术","meanings":[{"pos":"","def":"借景：站在颐和园长廊东头的鱼藻轩向西望去，可以望见远处的西山群峰，尤其是建有宝塔的玉泉山，从而扩大了欣赏的视野和范围。\n分景：贯通东西的长廊将颐和园分成北边的山区（万寿山）和南边的湖区（昆明湖），使游人在其中游山玩水，收到步移景换的效果。\n隔景：谐趣园是一个自成格局、江南园林风格的“园中之园”，使人在北方大型皇家园林中也能欣赏南方小型私家园林的风光。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-24","list":6,"num":24,"word":"拙政园的规模与叠山效果","phonetic":"二、园林艺术","meanings":[{"pos":"","def":"拙政园是苏州四大古名园之一，全园占地面积约60亩，其中水面约占3/5，池水以土山分隔，形似两座小岛，山上林木葱翠，沿池垂柳依依。\n进门后的一座假山叠山自然，犹如屏障，山上树木错落有致，山林布局皆为真山的缩影，达到了“虽由人工，宛自天成”的效果。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-25","list":6,"num":25,"word":"扬州何园的东西两部与蝴蝶厅","phonetic":"二、园林艺术","meanings":[{"pos":"","def":"何园又名寄啸山庄，园分东西两部分，有游廊相连接。\n东部有八角园门、楠木船厅、六柱亭、半月台等建筑物。\n西部有七间楼厅组成的一组建筑，像蝴蝶形态，通称蝴蝶厅。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-26","list":6,"num":26,"word":"留园法帖与狮子林书条石刻","phonetic":"二、园林艺术","meanings":[{"pos":"","def":"作为苏州四大古名园之一的留园，廊壁上嵌历代书法家石刻300余方，被称为“留园法帖”。\n另一座名园狮子林，嵌有《听雨楼帖》等书条石刻60余方，有宋代四大名家苏轼、黄庭坚、米芾、蔡襄的书法，以及文天祥的《梅花诗》等。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-27","list":6,"num":27,"word":"避暑山庄的分区与两处题额","phonetic":"二、园林艺术","meanings":[{"pos":"","def":"避暑山庄分宫殿区与苑景区两大部分，苑景区分为湖区、平原、山峦三个景区。\n水心榭北面的临湖建筑，康熙皇帝亲笔题额为“月色江声”，取意于苏轼的《赤壁赋》。\n正门有乾隆题额“丽正门”三字，取《易经》中“日月丽乎于天”之意，用汉、满、蒙、藏、维五种文字刻成。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-28","list":6,"num":28,"word":"工艺美术的定义与涵盖范围","phonetic":"三、工艺美术与现代设计（一）工艺美术","meanings":[{"pos":"","def":"名词解释：工艺美术又可称为实用工艺，一般指在造型和外观上具有审美价值、与人类日常生活相关的一类美术品的总称。\n工艺美术直接受到物质材料和生产技术的制约，具有鲜明的时代风格和民族特色。\n工艺美术品的范围极其广泛，几乎包括除建筑以外人类所有的日常生活用品。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-29","list":6,"num":29,"word":"工艺美术的三大类别与例证","phonetic":"三、工艺美术与现代设计（一）工艺美术","meanings":[{"pos":"","def":"一类是经过艺术处理的日常生活实用品，如绣花枕套、被面床单、玻璃器皿，以实用为主、装饰为辅，在实用基础上兼有观赏功能。\n二类是民间工艺美术品，如竹编、草编、蜡染、泥塑、木雕、剪纸，材料普通、工艺简单、价格便宜，既可实用又可观赏。\n三类是特种工艺美术品，如景泰蓝、象牙雕刻、瓷器、玉雕，材料珍贵、工艺精细、价格昂贵，主要供观赏珍藏，实际上已不具有实用价值。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-30","list":6,"num":30,"word":"实用工艺的五个时代划分","phonetic":"三、工艺美术与现代设计（一）工艺美术","meanings":[{"pos":"","def":"实用工艺在人类发展史上划分为：石器时代—陶器时代—青铜器时代—铁器时代—玉器时代。\n记忆：按“石、陶、青、铁、玉”的顺序串成一条线，五个时代一背到底。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-31","list":6,"num":31,"word":"彩陶王、兽形器与尖底瓶","phonetic":"三、工艺美术与现代设计（一）工艺美术","meanings":[{"pos":"","def":"彩陶王：20世纪80年代初期在辽宁西部出土、具有红山文化特征的陶器，是我国目前发现年代最早、体积最大的“彩陶王”。\n大汶口兽形器：整个造型犹如一只仰首、竖耳、狂吠的动物，动物口就是倒水的瓶口，背就是陶器的把手，设计精巧、实用美观。\n马家窑尖底瓶：瓶上画有四方连续的旋纹，给人一种流动的韵律感。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-32","list":6,"num":32,"word":"实用工艺美术“适用、经济、美观”","phonetic":"三、工艺美术与现代设计（二）实用工艺美术","meanings":[{"pos":"","def":"实用工艺美术品首先应当具有实用性，审美性应当寓于实用性之中，应做到适用、经济、美观。\n适用：坚固耐用、使用方便，甚至考虑到实用工艺美术品的使用环境。\n经济：它本身还是商品，需要通过市场销售，必须省工省料、降低成本，才能适应人们的消费水平。\n美观：做到造型美、装饰美、色彩美和材料美，在满足物质需要的同时满足精神需要。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-33","list":6,"num":33,"word":"《考工记》“材美工巧”与狩猎纹车饰","phonetic":"三、工艺美术与现代设计（二）实用工艺美术","meanings":[{"pos":"","def":"我国先秦古籍中的科技文献《考工记》，强调制作工艺品必须“材美工巧”。\n我国现存最精致的金银错工艺品，是河北定州出土的狩猎纹车饰，它是汉武帝时代的作品。\n金银错是一种金属工艺：用金银或其他金属丝、片嵌入铜器表面构成花纹，然后用错石（或磨石）错平磨光而成。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-34","list":6,"num":34,"word":"玛瑙《虾盘》与核雕《夜游赤壁》","phonetic":"三、工艺美术与现代设计（二）实用工艺美术","meanings":[{"pos":"","def":"玛瑙雕《虾盘》是文中列举的工艺美术精品之一。\n核雕工艺品《夜游赤壁》，在果核上雕出苏东坡等人乘舟夜游的情景。\n工艺美术品的审美特性与建筑艺术相仿，集中体现为造型美。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-35","list":6,"num":35,"word":"历代工艺美术精品的时间序列","phonetic":"三、工艺美术与现代设计（二）实用工艺美术","meanings":[{"pos":"","def":"仰韶文化时期的彩陶—奴隶制社会时期的青铜器—战国、秦、汉时期的漆器—唐代的丝绸制品和“唐三彩”—宋代精美的陶瓷工艺品—明代简洁古朴的木器—清代富丽华贵的景泰蓝。\n记忆：按时代先后串成一条“工艺史链”，每个时代记住一件代表器物。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-36","list":6,"num":36,"word":"实用工艺美术品的三个要素","phonetic":"三、工艺美术与现代设计（二）实用工艺美术","meanings":[{"pos":"","def":"一是实用性：首先应具有实用性，审美性寓于实用性之中，制作时要围绕实际使用要求，从材料选择、外部造型、色彩装饰等方面考虑艺术处理。\n二是造型美：注重造型设计，发掘材料和装饰的潜力，运用色彩、线条、形状等形式因素以及夸张、变形、均衡等手法创造外观形式美。\n三是民族风格和时代特色：工艺美术品是中华民族文化宝库的重要组成部分，具有鲜明的民族风格和时代特色。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-37","list":6,"num":37,"word":"现代设计的定义与交叉学科性质","phonetic":"三、工艺美术与现代设计（三）现代设计","meanings":[{"pos":"","def":"名词解释：现代设计是从传统的工艺美术事业中发展起来的，是工业革命后从包豪斯到现在国际上广泛兴起的一门交叉性应用学科。\n它是在现代大工业生产基础上产生的工业产品创新的社会实践形态。\n现代设计针对的是现代化的工业批量生产，体现出技术与艺术的完美统一。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-38","list":6,"num":38,"word":"现代设计之一：产品设计","phonetic":"三、工艺美术与现代设计（三）现代设计","meanings":[{"pos":"","def":"范围从家具、餐具、服装等日常生活用品，到汽车、飞机、电脑等高新技术产品。\n最突出的特点是将造型艺术与工业产品结合起来，使得工业产品艺术化。\n追求功效与审美、功能与形式、技术与艺术的完美统一。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-39","list":6,"num":39,"word":"现代设计之二：环境设计","phonetic":"三、工艺美术与现代设计（三）现代设计","meanings":[{"pos":"","def":"指人类对各种自然环境因素和人工环境因素加以改造和组织，对物质环境进行空间设计，使之符合人的行为需要和审美需要。\n主要涉及三方面：以自然风景和名胜古迹为主的景观环境；以城镇街区和建筑组群为主的空间序列环境；以陈设、小品和人工绿化为主的日常生活环境。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-40","list":6,"num":40,"word":"现代设计之三：视觉设计","phonetic":"三、工艺美术与现代设计（三）现代设计","meanings":[{"pos":"","def":"指人们为了传递信息或使用标记所进行的视觉形象设计，广义上也被称作平面设计。\n范围包括装帧设计、印刷设计、包装设计、展示陈列设计、视觉形象设计、广告设计等。\n随着现代科技的发展，视觉设计已不再局限于平面设计，而是充分调动光、色、文字、图形、运动等多种手段，扩展到电视、计算机等领域。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-41","list":6,"num":41,"word":"实用艺术的三大审美特征","phonetic":"第二节 实用艺术的审美特征","meanings":[{"pos":"","def":"【大题★★★★★】实用艺术的审美特征包括三个方面：\n一、实用性与审美性；\n二、表现性与形式美；\n三、民族性与时代性。\n记忆：按“实用—表现—民族”三条线索分别展开，每一条都能单独成一道大题。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-42","list":6,"num":42,"word":"实用性第一与审美的从属地位","phonetic":"一、实用性与审美性","meanings":[{"pos":"","def":"第一，任何实用艺术首先都应当具有实用性，应当对实用性作比较宽泛的理解；每一门类中的不同类型，都应当分别符合人类不同实际活动的需要。\n对于大多数实用艺术品来讲，实用是为主要的，审美应当从属于实用、服务于实用。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-43","list":6,"num":43,"word":"实用性与生产技术和经济成本","phonetic":"一、实用性与审美性","meanings":[{"pos":"","def":"实用艺术与生产技术具有紧密的联系，物质材料直接制约和影响着实用艺术的发展；甚至在一定的意义上可以讲，工艺美术生产的水平常常代表了那个时代生产力发展的水平。\n实用艺术往往需要耗费大量的物质材料和人工劳力，所以它的实用性也应当考虑产品的用料、费时、加工和成本等经济问题，尽量做到省工省料和降低成本。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-44","list":6,"num":44,"word":"西汉长信宫灯的精巧设计","phonetic":"一、实用性与审美性","meanings":[{"pos":"","def":"河北出土的西汉长信宫灯，既是一件造型新颖独特的青铜工艺品，又是一件方便适用的生活用品。\n整个灯具是持灯宫女的造型，全高48厘米，灯座上安有活动的环壁形灯罩，可调整照射方向、控制灯光强弱。\n各个部分都可以拆卸，以便揩拭和清理烟尘；宫女的右臂实际上就是烟尘通道，使烟尘容纳于身体之内，保持室内空气的清洁。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-45","list":6,"num":45,"word":"实用艺术的审美性与美育途径","phonetic":"一、实用性与审美性","meanings":[{"pos":"","def":"审美性即能够满足人的审美需要和精神需要，给人以美的感受，从而在实用的前提下兼有审美的功能，达到物质和精神的统一。\n实用艺术与人们的衣、食、住、用等日常生活密切相关，是最普及、最常见的大众艺术，在美育中具有特殊的地位和作用。\n美育实施途径：家庭美育、学校美育和社会美育。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-46","list":6,"num":46,"word":"实用性与审美性的相互关系","phonetic":"一、实用性与审美性","meanings":[{"pos":"","def":"实用艺术中，实用性与审美性二者是有机统一的：实用性是审美性的前提和基础，审美性反过来也可以增强实用性。\n二者相互促进，缺一不可，密不可分，共同构成了实用艺术最基本的原则和特征。\n随着社会生产力的发展和人民生活水平的不断提高，审美性在实用艺术中的比重越来越大。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-47","list":6,"num":47,"word":"克莱夫·贝尔“有意味的形式”","phonetic":"二、表现性与形式美","meanings":[{"pos":"","def":"实用艺术作为表现性空间艺术，不注重模仿客观事物的再现性，而是注重表现某种朦胧抽象的情调和意味。\n英国现代著名美学家克莱夫·贝尔称之为“有意味的形式”，即用色彩、线条、造型、图案等外部形式，传达和表现出一定的情绪、气氛、格调、意味。\n表现性是实用艺术重要的美学特征，也构成了它与戏剧、小说、电影等再现艺术的根本区别。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-48","list":6,"num":48,"word":"形式美及其与表现性的关系","phonetic":"二、表现性与形式美","meanings":[{"pos":"","def":"形式美主要是指各种形式因素的有规律的组合，从而形成了某些共同的特征和法则。\n形式美的法则并不是凝固不变的，随着时代的发展和科技的进步，它也在不断变化和发展。\n在实用艺术中，形式美是表现性的外部体现，表现性是形式美的内在灵魂，二者密不可分。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-49","list":6,"num":49,"word":"黄金分割、五种柱式与帕提农神庙","phonetic":"二、表现性与形式美","meanings":[{"pos":"","def":"自从古希腊毕达哥拉斯学派发现了“黄金分割”的比例后，历代建筑师一直把它奉为重要的形式美法则来遵循。\n两千多年前，古希腊罗马的建筑师精心设计出他们认为比例关系最美的五种柱式，形成建筑艺术史上有名的“五种柱式”。\n距今2400年的古希腊帕提农神庙采用雄浑刚健的多立克柱式，造型端庄、比例匀称，主体由46根洁白的大理石圆柱环绕成一个回廊，被视为古希腊神庙的典范。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-50","list":6,"num":50,"word":"蓬皮杜中心“化工厂”式的外观","phonetic":"二、表现性与形式美","meanings":[{"pos":"","def":"1977年建成的巴黎蓬皮杜文化艺术中心是法国著名的现代建筑，地上六层、地下四层，包括现代艺术博物馆、音乐与声乐研究所、工业设计中心等。\n从外表上看，它仿佛一座现代化的化工厂，因为整座建筑都被纵横交错的管道和钢架所包围，而这也正是它标新立异的地方。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-51","list":6,"num":51,"word":"民族性：瓷器之国与英文China","phonetic":"三、民族性与时代性","meanings":[{"pos":"","def":"中国在制瓷方面成就杰出，被誉为“瓷器之国”；英语中China既指“中国”，这个词的原意又是“瓷器”，可见中国瓷器在世界上具有巨大的影响。\n中国古典园林同样具有与西方园林、阿拉伯园林不同的民族风格。\n实用艺术的民族风格并不是一成不变的，同样会受到其他民族的影响。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-52","list":6,"num":52,"word":"北京四合院的宗法礼教格局","phonetic":"三、民族性与时代性","meanings":[{"pos":"","def":"四合院作为一种封闭性较强的建筑空间，体现出中国古代的宗法制度和礼教制度。\n北京四合院主要指明清时代形成的典型北方住宅：正房由长辈居住，东西厢房为晚辈，耳房为仆人，南房主要是客房，体现尊卑有序、长幼有别的伦理观念和宗法观念。\n入口一般在东南角，取东（青龙）、南（朱雀）大吉大利之意，入口处再设一堵影壁。\n曲线优美的屋顶、鲜艳夺目的色彩、翘角和飞檐装饰，加上大量雕刻彩绘，更具民族艺术表现力。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-53","list":6,"num":53,"word":"拜占庭艺术及其东方色彩","phonetic":"三、民族性与时代性","meanings":[{"pos":"","def":"拜占庭艺术是指4世纪到15世纪、以君士坦丁堡为中心的拜占庭帝国的艺术风格。\n拜占庭建筑艺术植根于古罗马教堂的风格，但又明显受到埃及、波斯、叙利亚等东方建筑风格的影响，具有浓郁的东方色彩，从而形成了一种具有独特风格的建筑艺术。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-54","list":6,"num":54,"word":"时代性与殷商青铜饕餮纹","phonetic":"三、民族性与时代性","meanings":[{"pos":"","def":"实用艺术的时代性，在于它总是表现出特定时代、特定社会的总体审美特征与时代风尚，并随社会生产力和科学技术的进步而发展，在材料和技术上呈现鲜明的时代风格。\n青铜器纹饰就体现出鲜明的时代特色：殷商时期的青铜器大多是兽面纹即“饕餮纹”，具有明显的奴隶社会印记，象征着奴隶主阶级统治的权威和秩序。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-55","list":6,"num":55,"word":"四个时代的四座建筑代表","phonetic":"三、民族性与时代性","meanings":[{"pos":"","def":"古埃及金字塔是古埃及奴隶社会时期建筑的代表；\n哥特式教堂是西欧中世纪建筑的代表；\n法国新古典主义建筑是欧美资产阶级革命时期建筑的代表；\n德国包豪斯校舍可以说是现代建筑艺术的开端。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-56","list":6,"num":56,"word":"故宫的沿革与最大皇宫建筑群","phonetic":"中外实用艺术精品赏析（一）故宫","meanings":[{"pos":"","def":"故宫即明清时期的紫禁城，1925年始称故宫；明永乐四年开始兴建，历时14年基本建成，有24位皇帝居住，迄今已有600年历史。\n它是全世界规模最大、保存最完好的古代皇宫建筑群。\n紫禁城内的皇宫建筑分为南部前朝和北部后寝：前朝有太和殿、中和殿、保和殿；以太和殿最为高大雄伟，位居故宫中心部位，俗称金銮殿。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-57","list":6,"num":57,"word":"故宫设计的三个高潮与皇权至上","phonetic":"中外实用艺术精品赏析（一）故宫","meanings":[{"pos":"","def":"故宫精心设计了三个高潮：一是从正阳门开始，穿过壮阔的天安门广场；二是长方形的午门广场；三是太和殿前气氛森然的正方形广场。\n故宫突出了“皇权至上”的理念，而欧洲中世纪的建筑如巴黎圣母院则突出“神权至上”的理念。\n皇帝被称作“九五之尊”，故宫宫门的门钉为九行九列。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-58","list":6,"num":58,"word":"故宫的金碧辉煌与屋脊走兽","phonetic":"中外实用艺术精品赏析（一）故宫","meanings":[{"pos":"","def":"故宫的总体色彩是金碧辉煌、富丽堂皇：朱红色的围墙、白色的台基、金黄色的琉璃瓦顶、大红色的柱子和门窗，使这座皇宫别具一格。\n天安门城楼翼角上的9个走兽依次为：龙、凤、狮子、麒麟、天马、海马、鱼、獬、犼（另有仙人骑鸡）。\n记忆：按“龙凤狮麟、天马海马、鱼獬犼”三组串记。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-59","list":6,"num":59,"word":"悉尼歌剧院与西方建筑史脉络","phonetic":"中外实用艺术精品赏析（二）悉尼歌剧院","meanings":[{"pos":"","def":"悉尼歌剧院由丹麦设计师约翰·伍重设计于1957年，建成于1973年。\n原文由此梳理西方建筑脉络：古希腊石砌神庙（公元前5世纪建造的雅典卫城）—中世纪哥特式（巴黎圣母院、德国科隆大教堂）—17世纪意大利巴洛克（罗马圣彼得大教堂，世界最大的教堂）—18世纪法国洛可可（路易十五时期巴黎苏俾士府邸）—包豪斯学派标志现代建筑开始。\n贝聿铭先生讲：“建筑是一种创造空间的艺术。”"}],"related":[],"section":"第6章","marked":false},{"id":"C06-60","list":6,"num":60,"word":"现代建筑“形式服从功能”","phonetic":"中外实用艺术精品赏析（二）悉尼歌剧院","meanings":[{"pos":"","def":"现代建筑的基本美学思想是形式服从功能。\n赖特等人大力提倡“有机建筑”理论，主张建筑与环境的协调，注重人和环境的融合，认为建筑物应当从属于周围的自然环境，就像植物从它所在环境中自然而然地生长出来一样。\n德国包豪斯校舍可以说是现代建筑艺术的开端；流水别墅是赖特设计的享誉世界的“有机建筑”典范。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-61","list":6,"num":61,"word":"颐和园的沿革、分区与佛香阁","phonetic":"中外实用艺术精品赏析（三）颐和园","meanings":[{"pos":"","def":"颐和园是中国古典园林之首、世界上最广阔的皇家园林之一，是清代留存的大型皇家园林；始建于1750年，1860年在战火中严重损毁，1888年在原址上重新修缮。\n全园由万寿山和昆明湖组成，分三个区域：以仁寿殿为中心的政治活动区；以玉澜堂、乐寿堂为主体的生活区；由万寿山和昆明湖组成的风景游览区。\n园内建筑以佛香阁为中心，堪称园林建筑博物馆。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-62","list":6,"num":62,"word":"颐和园借景实例与清晏舫","phonetic":"中外实用艺术精品赏析（三）颐和园","meanings":[{"pos":"","def":"借景的最佳例子：站在长廊东头的鱼藻轩向西眺望，可以望见园外的玉泉山和远处的香山；“燕京十景”之一的“西山晴雪”，颐和园也是最佳观赏地点。\n分景：贯通东西的长廊把颐和园分成以万寿山为主的北部山区和以昆明湖为主的南部湖区。\n隔景：“园中之园”谐趣园。\n清晏舫（石舫）是园中著名的水上建筑。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-63","list":6,"num":63,"word":"拙政园的建园、命名与布局","phonetic":"中外实用艺术精品赏析（四）苏州拙政园","meanings":[{"pos":"","def":"拙政园始建于15世纪初的明代，历时16年建成，由明代御史王献臣辞职还乡后建成此园。\n晋代潘岳《闲居赋》中“此亦拙者之为政也”为此园命名。\n全园分东部的归田园、中部的中园、西部的补园三部分，拙政园以水为主。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-64","list":6,"num":64,"word":"“咫尺之内再造乾坤”与《园冶》","phonetic":"中外实用艺术精品赏析（四）苏州拙政园","meanings":[{"pos":"","def":"中国古典园林设计的理想品质，是“于咫尺之内再造乾坤”。\n明代园林家计成在《园冶》中提出“虽由人工，宛自天成”。\n原文列苏州四大名园为拙政园、留园、怡园、网师园。\n西方美学史上曾将美分为两种类型：崇高（又称壮美，表现为数的巨大或力的巨大）与优美（又称秀美，表现为优雅之美或柔媚之美）。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-65","list":6,"num":65,"word":"拙政园名景与诗词典故","phonetic":"中外实用艺术精品赏析（四）苏州拙政园","meanings":[{"pos":"","def":"远香堂是拙政园的主要建筑，也是园内留存至今最大的明代建筑。\n园中一处临水建筑称“与谁同座轩”，取自宋代苏东坡词“与谁同座？明月清风我”。\n“香洲”是园中著名景点。\n原文还提到：浙江绍兴市的沈园，就是南宋著名诗人陆游写出《钗头凤》的地点。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-66","list":6,"num":66,"word":"故宫赏析涉及的文史常识","phonetic":"中外实用艺术精品赏析（一）故宫","meanings":[{"pos":"","def":"汉代大儒董仲舒讲过“天不变，道亦不变”。\n诗人杜甫的绝句十分严谨、对仗工整，他本人被后世称为“诗圣”。\n这两处文史常识出现在原文“故宫”赏析的条目中，可与“皇权至上”“九五之尊”等观念一并记忆。"}],"related":[],"section":"第6章","marked":false},{"id":"C06-67","list":6,"num":67,"word":"日本园林与魏晋士人园林","phonetic":"中外实用艺术精品赏析（三）颐和园","meanings":[{"pos":"","def":"日本园林作为东方园林的一种特殊样式，受佛教禅宗美学影响。\n魏晋南北朝时期士人园林迅猛发展，成为富有诗情画意、强调天人合一、寄托士人情感的一个艺术领域，并为后来历朝历代私家园林的发展开创了先河。"}],"related":[],"section":"第6章","marked":false},{"id":"C07-01","list":7,"num":1,"word":"造型艺术的定义与门类","phonetic":"第7章 造型艺术","meanings":[{"pos":"","def":"名词解释（p96）：造型艺术是运用一定的物质材料（如颜料、纸张、泥石、木料等），通过塑造静态的视觉形象来反映社会生活、表现艺术家思想情感的艺术。\n它既是再现性空间艺术，也是静态的视觉艺术，主要包括绘画、雕塑、摄影、书法等门类。\n记忆链：物质材料—静态视觉形象—再现性空间—四大门类。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-02","list":7,"num":2,"word":"造型艺术与实用艺术的异同","phonetic":"第7章 造型艺术","meanings":[{"pos":"","def":"联系：二者都属于空间艺术，都以平面或立体的方式、用物质材料创造出静态的艺术形象，使人们凭视觉感官直接感受。\n区别：造型艺术（绘画、雕塑、摄影、书法）的基本特征是造型性，表现性潜藏于再现性之中，属再现性空间艺术；实用艺术（建筑、园林、工艺美术与现代设计）的基本特征是表现性，属表现性空间艺术。\n功能：造型艺术主要具有审美功能；实用艺术兼有实用功能与审美功能。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-03","list":7,"num":3,"word":"造型艺术的古老源头实证","phonetic":"第7章 造型艺术","meanings":[{"pos":"","def":"造型艺术（摄影除外）也是人类文化史上最古老的艺术门类之一。\n西班牙阿尔塔米拉洞穴壁画属旧石器时代作品，距今已有2万多年历史。\n法国罗尔特洞发现的一块刻着正在过河的鹿群的兽骨，是1万多年前原始人留下的雕刻作品。\n我国现已发现最早的帛画，是湖南长沙出土的战国楚墓帛画《人物龙凤图》（原称《人物夔凤图》）。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-04","list":7,"num":4,"word":"绘画的定义与二维空间","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"名词解释（p96）：绘画是造型艺术中最主要的一种艺术形式。\n它是一门运用线条、色彩和形体等艺术语言，通过构图、造型和设色等艺术手段，在二维空间（平面）里塑造出静态的视觉形象的艺术。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-05","list":7,"num":5,"word":"绘画分类的四个划分维度","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"按体系划分：东方绘画与西方绘画两大体系。\n按材料、工具和技法划分：中国画、油画、版画、水彩画、水粉画、粉笔画等。\n按题材内容划分：肖像画、风景画、风俗画、静物画、历史画、宗教画、动物画等体裁。\n按作品形式划分：壁画、年画、连环画、宣传画、漫画等样式。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-06","list":7,"num":6,"word":"中国画的工具材料与笔墨","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"中国画简称国画，在世界美术领域中自成体系，是东方绘画体系的主流。\n工具材料：往往采用中国特制的毛笔、墨或颜料，在宣纸或绢帛上作画，故中国画又称“水墨画”或“彩墨画”。\n因采用特制毛笔，“笔墨”成为中国画技法和理论中的重要术语，有时甚至成为中国画技法的总称。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-07","list":7,"num":7,"word":"用笔五法与墨分五彩口诀","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"“笔”指勾、勒、皴、点等运用毛笔的不同技巧和方法，使中国画表现出变化无穷的线条情趣。\n“墨”指以墨代色，运用烘、染、泼、积等墨法，使墨色产生丰富细微的色度变化，即“墨分五彩”（焦、浓、重、淡、清），加上宣纸的白色为“六彩”。\n口诀：够了！春天！（勾勒皴点）；烘婆感染疾病（烘泼染积）；叫她的农民老公重点给她吃蛋清（焦浓重淡清）。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-08","list":7,"num":8,"word":"散点透视与全景式空间","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"中国画构图不受焦点透视的束缚，多采用散点透视法（可移动的远近法），视野宽广辽阔、构图灵活自由，冲破时间与空间的局限。\n中国画营造的空间最主要的有三种：“全景式空间”“分段式空间”“分层式空间”。\n“全景式空间”代表作：五代后梁画家荆浩的山水名作《匡庐图》。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-09","list":7,"num":9,"word":"分段式与分层式空间例证","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"“分段式空间”：五代南唐顾闳中《韩熙载夜宴图》；北宋张择端《清明上河图》以散点透视把汴河两岸数十里的繁华分成“城郊景色”“汴河虹桥”“市井街道”三段，展现汴京从城郊到街市的热闹情景。\n“分层式空间”：长沙马王堆汉墓出土的T形帛画，画分三层，分别展现天界、人间、地界的不同景况。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-10","list":7,"num":10,"word":"诗书画印结合与工笔写意","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"中国画与诗文、书法、篆刻有机结合、相互补充，形成诗、书、画、印交相辉映的特色。\n传统画法分工笔与写意：工笔用笔细致工整、结构严谨，人物景物刻画具体入微；写意笔墨简练、高度概括，洒脱地表现物象形神、抒发作者感情。\n二者处理形神关系都要求“神形兼备”，造型与意境都要求“气韵生动”。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-11","list":7,"num":11,"word":"立意传神与四家画论要点","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"中西差异：西方绘画更重视客观物象形貌的逼真再现，中国画更重视物象内在精神和作者主观情感的表现，故非常强调“立意”和“传神”。\n东晋顾恺之提出“以形写神”“迁想妙得”；南齐谢赫提出“绘画六法”，第一条便是“气韵生动”；唐代张彦远总结为“意存笔先，画尽意在”；清代笪重光《画筌》称“虚实相生，无画处皆成妙境”。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-12","list":7,"num":12,"word":"中国画分科与六大艺术精神","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"分科：从基本画科来看，包括人物、山水、花鸟、界画等。\n以儒家美学、道家美学、禅宗美学为代表的中国传统美学，塑造出独具特色的中国艺术精神。\n六字概括：“道”（精神性）、“气”（生命性）、“心”（主体性）、“舞”（乐舞精神）、“悟”（直觉思维）、“和”（辩证思维）。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-13","list":7,"num":13,"word":"六朝三杰与唐宋绘画名家","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"“六朝三杰”：东晋顾恺之、南朝宋陆探微、梁张僧繇。\n唐宋：被后世尊为“画圣”的吴道子，以及擅长历史画与肖像画的阎立本。\n唐代李思训擅青绿山水，王维擅水墨山水；曹霸、韩幹擅画马，戴嵩擅画牛，黄筌、徐熙擅画花鸟。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-14","list":7,"num":14,"word":"五代两宋山水画派与名家","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"五代：荆浩、关仝是描绘中原地带实景的北方山水画派；董源、巨然是描写江南景物特色的南方山水画派。\n北宋：李成、范宽多画雄奇壮阔的北方山水。\n南宋：马远（马一角）、夏珪（夏半边）追求以少胜多，画半边山或一角水。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-15","list":7,"num":15,"word":"元明清画派与画家群体","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"“元代四大家”：黄公望、吴镇、王蒙、倪瓒，王蒙《葛稚川移居图》、倪瓒《渔庄秋霁图》，口诀“你王荒芜”。\n“明代四大家”又称“吴门四家”：沈周、文徵明、唐寅、仇英，明代中期在苏州从事绘画活动，形成明代影响最大的画派，口诀“深闻糖球”。\n“四大名僧”：明末清初削发为僧的石涛、八大山人、石谿、弘仁，都擅长山水画。\n“扬州八怪”：清乾隆年间活跃在江苏扬州的一批革新派画家的总称，共同特征是强调个性表现。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-16","list":7,"num":16,"word":"近现代中国画坛代表人物","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"近、现代中国画坛人才辈出：赵之谦、任伯年、吴昌硕、高剑父，以及齐白石、黄宾虹、徐悲鸿、潘天寿、张大千、刘海粟、林风眠、傅抱石等。\n他们为继承和发展中国绘画艺术做出了卓越的贡献。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-17","list":7,"num":17,"word":"西方画种与油画版画特点","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"西方绘画源远流长、品种繁多：油画最有影响，是主要画种，版画也重要；另有具特殊透明效果的水彩画、兼有油画厚重感与水彩透明感的水粉画，以及用铅笔、木炭、钢笔作画的素描。\n油画：油质颜料在布、木板或厚纸板上画成，色彩丰富鲜艳，能充分表现质感，覆盖力强、易于修改。\n版画：用笔画、刀刻在材料上刻画后印制多份原作，分凸版（木刻、麻胶版画）、凹版（铜版画）、平版（石版画）三类。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-18","list":7,"num":18,"word":"西方绘画尚形与科学法则","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"西方绘画的审美趣味在于真和美，追求对象和环境的真实。\n为达到逼真效果，十分讲究比例、明暗、透视、解剖、色度、色性等科学法则，以光学、几何学、解剖学、色彩学为科学依据。\n中西对比：中国绘画尚意、重表现情感、以线条为主要造型手段、不受时空局限；西方绘画尚形、重再现理性、主要由光和色表现物象、严格遵守时空界限。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-19","list":7,"num":19,"word":"乔托与文艺复兴画坛三杰","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"西方绘画从古希腊罗马开始。意大利文艺复兴初期画家、雕塑家乔托，创作了许多具有现实生活气息的宗教画，被认为是欧洲绘画之父和现实主义画派鼻祖；口诀“像桥一样托举了西方绘画”。\n西方美术史常把16世纪到19世纪中叶的油画概称古典油画，共同特征是画面无论大小都有很完美的情境。\n“画坛三杰”：达·芬奇（《最后的晚餐》《蒙娜·丽莎》）、拉斐尔（《西斯廷圣母》）、米开朗基罗（《创造亚当》）。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-20","list":7,"num":20,"word":"十七世纪欧洲四位油画名家","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"荷兰的伦勃朗（《夜巡》《自画像》）；尼德兰的鲁本斯（《劫夺吕西普斯的女儿》，口诀“掳走别人是我的本事”）。\n西班牙的委拉斯贵支（《教皇英诺森十世肖像》，口诀“为买特拉斯开了很贵的支票，谁有这实力？教皇！”）；法国的夏尔丹（《饭前祈祷》，口诀“有人恐吓你，你很害怕，所以饭前祈祷”）。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-21","list":7,"num":21,"word":"十九世纪法国画坛三流派","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"新古典主义：雅克·路易·大卫（《马拉之死》）。\n浪漫主义：席里柯（《梅杜萨之筏》）、德拉克洛瓦（《自由领导人民》），口诀“吃大席，吃渴了”。\n批判现实主义：库尔贝（《石工》）、米勒（《拾穗者》），口诀“一个石工看起来酷酷的，因为他耳背”“家里没米了，所以才去拾穗”。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-22","list":7,"num":22,"word":"印象主义与新印象主义","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"印象主义：莫奈（《日出·印象》《草垛》《青蛙塘》）、雷诺阿（《浴女》《包厢》）、德加（《舞蹈课》）。\n新印象主义：修拉（《大碗岛上的星期天下午》），又称点彩派，口诀“大碗岛上的星期天下午摆摊修拉链”。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-23","list":7,"num":23,"word":"后印象主义三大师及作品","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"塞尚：《苹果和橘子》《水果盘、杯子和苹果》。\n高更：《我们从哪里来？我们是谁？我们往哪里去？》《塔希提的妇女》，口诀“她希望被提到”。\n凡·高（荷兰人）：《向日葵》《花瓶里的三朵向日葵》《鸢尾花》系列。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-24","list":7,"num":24,"word":"俄国巡回展览画派两大家","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"俄国巡回展览画派集中了一批杰出画家，最著名的是列宾和苏里柯夫。\n列宾：《伏尔加河上的纤夫》《伊凡·雷帝杀子》《不期而至》。\n苏里柯夫：《近卫军临刑的早晨》《女贵族莫洛佐娃》，口诀“女贵族太作了哇，把自己作没落了”。\n口诀：列出两行人说你克夫，然后带着你游街，巡回展览。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-25","list":7,"num":25,"word":"二十世纪现代主义流派","phonetic":"一、绘画艺术","meanings":[{"pos":"","def":"20世纪以来，西方画坛出现现代主义美术的各种思潮和流派：野兽主义、立体主义、未来主义、抽象主义、表现主义、构成主义、新造型主义、超现实主义、波普艺术。\n尤其是立体主义代表人物毕加索的《格尔尼卡》，产生了巨大的影响。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-26","list":7,"num":26,"word":"雕塑的定义与三维实体","phonetic":"二、雕塑艺术","meanings":[{"pos":"","def":"名词解释：雕塑是一种重要的造型艺术，是立体（三维空间）的空间艺术和视觉艺术。\n它用一定的物质材料制作出具有实体形象的艺术品，由于制作方法主要是雕刻和塑造两大类，故被称为雕塑。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-27","list":7,"num":27,"word":"雕塑按工艺与体裁分类","phonetic":"二、雕塑艺术","meanings":[{"pos":"","def":"从制作工艺分雕和塑两大类，细分为刻、镂、塑、凿、琢、铸等技艺手法（2024真题：从制作工艺看，雕塑可分为雕和塑）。\n从体裁分：纪念性雕塑（北京大学校园内李大钊、蔡元培胸像）、建筑装饰性雕塑（巴黎歌剧院周围30多座）、城市园林雕塑、宗教雕塑（敦煌、麦积山彩塑）、陵墓雕塑（霍去病墓《马踏匈奴》）、陈列性雕塑。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-28","list":7,"num":28,"word":"雕塑样式与圆雕浮雕透雕","phonetic":"二、雕塑艺术","meanings":[{"pos":"","def":"从样式分：头像、胸像、半身像、全身像、群像。\n从表现手法和形式分三类：圆雕又称“浑雕”，不附任何背景、可从四面观赏；浮雕又称“凸雕”，在平面上雕出凸起形象，按凸起程度分高浮雕与浅浮雕；透雕介于圆雕与浮雕之间，在浮雕基础上将背景部分镂空，又不脱离平面。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-29","list":7,"num":29,"word":"雕塑的立体性与形式美","phonetic":"二、雕塑艺术","meanings":[{"pos":"","def":"立体性：观赏者可从四面八方的不同角度乃至结合周围环境来欣赏，作品更富生动、逼真的魅力。\n形式美：因这一基本特征，雕塑特别强调服从形式美规律，应更加凝练、集中、概括。\n欣赏雕塑不仅靠视觉，还可用触觉感知；与绘画、摄影、书法最大的区别，是在三维空间用物质材料创造实体形象。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-30","list":7,"num":30,"word":"霍去病墓与秦汉雕塑名作","phonetic":"二、雕塑艺术","meanings":[{"pos":"","def":"西汉名将霍去病墓前大型石刻组雕包括《马踏匈奴》《跃马》《卧马》《卧虎》《石人》等10余件作品。\n《马踏匈奴》采用象征手法，以威武雄壮、昂首挺立的战马象征胜利者，与被马踏在脚下的匈奴首领形成强烈对比，集中体现这组纪念性组雕的主题。\n四川广汉三星堆祭祀坑出土的青铜人头像距今3000多年；秦汉时期我国古代雕塑达到高峰，秦始皇陵兵马俑被誉为世界第八奇观。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-31","list":7,"num":31,"word":"宗教雕塑与元明清民间雕塑","phonetic":"二、雕塑艺术","meanings":[{"pos":"","def":"魏晋南北朝和唐宋时期，宗教雕塑发展迅速：龙门石窟代表作奉先寺卢舍那大佛群像，是唐代作品。\n东晋戴逵父子被后世学者看作中国佛像雕塑的奠基人；唐代杨惠之被称为“塑圣”，与“画圣”吴道子齐名。\n元明清时期：广东石湾陶塑、福建德化窑瓷塑、无锡与天津泥塑、嘉定竹刻、潮州木雕等，具有独特的艺术风格。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-32","list":7,"num":32,"word":"西方雕塑四高峰与希腊大师","phonetic":"二、雕塑艺术","meanings":[{"pos":"","def":"西方雕塑史上有四个最辉煌的高峰期：古希腊罗马时期、欧洲文艺复兴时期、19世纪法国雕塑、20世纪以来。\n第一个高峰古希腊罗马时期：米隆的代表作《掷铁饼者》、菲狄亚斯的名作《命运三女神》。口诀：逃不过命运，让人死于压死，就得想法设法非得压死（菲狄亚斯）。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-33","list":7,"num":33,"word":"米洛斯的阿芙洛狄忒与胜利女神","phonetic":"二、雕塑艺术","meanings":[{"pos":"","def":"《米洛斯的阿芙洛狄忒》又称《断臂的维纳斯》，因1820年发现于爱琴海米洛斯岛而得名，罗丹称其为“古代的神品”。\n《萨莫色雷斯的胜利女神》1863年发现于萨莫色雷斯岛，刻画海战胜利后胜利女神从天而降、飞临船头引导舰队的情景；女神上身前倾，腿与双翼的波状线构成钝角三角形。\n两件作品与达·芬奇《蒙娜·丽莎》并称卢浮宫三宝。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-34","list":7,"num":34,"word":"米开朗基罗的雕塑成就","phonetic":"二、雕塑艺术","meanings":[{"pos":"","def":"欧洲文艺复兴是西方雕塑艺术的第二个高峰。\n米开朗基罗的成名作《哀悼基督》取材基督被害后圣母哀悼的宗教故事，雕塑上刻着他的名字；为故乡佛罗伦萨创作的大理石雕像《大卫》，成为文艺复兴时代英雄的象征；为美弟奇教堂设计的《昼》《夜》《晨》《暮》寓意深刻；另有《摩西》。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-35","list":7,"num":35,"word":"吕德《马赛曲》的浪漫主义","phonetic":"二、雕塑艺术","meanings":[{"pos":"","def":"19世纪法国雕塑是西方雕塑艺术的第三个高峰。\n法国浪漫主义流派代表人物吕德，为巴黎凯旋门创作了巨型浮雕《马赛曲》。核心的自由女神身披铜甲、张开双翼、右手挥剑、左臂高举，召唤着为自由而战的法国人民，具有强烈的浪漫主义色彩。\n口诀：女的不仅骑马比赛，还唱歌，说明女性非常自由。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-36","list":7,"num":36,"word":"罗丹的五件代表作品清单","phonetic":"二、雕塑艺术","meanings":[{"pos":"","def":"法国现实主义大师罗丹以《巴尔扎克像》《加莱义民》《思想者》《地狱之门》《青铜时代》等将西方雕塑艺术推向新的高峰。\n《巴尔扎克像》摒弃一切细枝末节，手脚掩盖于睡袍之中，使注意力集中到面部，尤其是炯炯有神的眼睛。\n《地狱之门》取材但丁《神曲》，共塑造186个人物；《思想者》后成为独立作品，罗丹逝世后放置其墓前。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-37","list":7,"num":37,"word":"马约尔《地中海》与亨利·摩尔","phonetic":"二、雕塑艺术","meanings":[{"pos":"","def":"20世纪以来堪称第四个高峰。\n法国雕塑家马约尔的大理石《地中海》，以丰乳宽臀、温柔安宁的女性形象，代表美丽富饶、平静温和的地中海母亲；口诀“马云约你出去玩，你发现他是地中海，是个秃头”。\n现代主义雕塑以法国阿尔普和英国亨利·摩尔为代表，摩尔有《国王与王后》（青铜，1953）、《家庭》（大理石，1955）。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-38","list":7,"num":38,"word":"摄影艺术的定义与暗房","phonetic":"三、摄影艺术","meanings":[{"pos":"","def":"名词解释：摄影艺术是一门现代的造型艺术。\n摄影师运用照相机作为基本工具，根据创作构思将人物或景物拍摄下来，再经过暗房工艺处理，塑造出可视的艺术形象，用以反映社会生活与自然现象、表达作者思想情感。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-39","list":7,"num":39,"word":"一八三九年达盖尔发明摄影","phonetic":"三、摄影艺术","meanings":[{"pos":"","def":"1839年法国人达盖尔发明摄影技术，达盖尔被公认为“摄影之父”。\n口诀：发明摄影的人用的相机很大，有一个大大的镜头盖（大盖儿）；18（一把）39（三舅／散酒）。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-40","list":7,"num":40,"word":"摄影纪实性与艺术性统一","phonetic":"三、摄影艺术","meanings":[{"pos":"","def":"摄影艺术独具的审美特征，主要表现在纪实性与艺术性的统一。\n纪实性：运用科技手段逼真精确地再现被摄对象，具客观性、真实性；必须直接面对被摄对象现场拍摄，不能表现过去与未来的事物，更不能表现客观生活中并不存在的事物。\n艺术性：需熟练运用画面构图、光线、影调（或色调）三种造型手段。构图即取景，画面含主体、陪体、背景，有水平式、垂直式、对角线、十字形等方式；用光含正面光、侧面光、逆光、顶光、脚光；影调指黑白照片的明暗层次，色调指彩色照片色彩的对比与和谐。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-41","list":7,"num":41,"word":"摄影艺术的三类划分标准","phonetic":"三、摄影艺术","meanings":[{"pos":"","def":"按感光材料和画面颜色：黑白摄影、彩色摄影。\n按摄影器材和技术：航空摄影、水下摄影、全息摄影、红外线摄影等。\n按题材：肖像摄影、风光摄影、舞台摄影、体育摄影、建筑摄影等。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-42","list":7,"num":42,"word":"肖像摄影以形传神与周恩来","phonetic":"三、摄影艺术","meanings":[{"pos":"","def":"肖像摄影又称人物摄影，包括特写镜头、头像、半身像、全身像和群像；通过姿态、动作、外貌和面部表情揭示人物的思想感情、性格特征与精神气质；“以形传神、气韵生动”是最高审美标准。\n意大利摄影家乔·洛蒂的《沉思中的周恩来》，抓取周总理坐沙发沉思的姿态和表情，表现其鞠躬尽瘁、死而后已的精神风范。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-43","list":7,"num":43,"word":"风光摄影与《千里共婵娟》","phonetic":"三、摄影艺术","meanings":[{"pos":"","def":"风光摄影表现大自然风景，分自然风景、都市风景、乡村风景等；不仅表现自然美，更要表现人对自然美的感受与摄影师的审美体验。\n我国摄影家陈复礼的《千里共婵娟》摄于太湖，取意苏东坡词句，用对称式构图（上下水天相接、左右芦苇平行），表达“但愿人长久，千里共婵娟”的意境，富有国画韵味。\n舞台摄影需较高造型技术并了解演出风格、演员特色；体育摄影多用抓拍与较高快门速度抓取动态；建筑摄影需懂建筑规律与历史，选择理想位置、角度和光线。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-44","list":7,"num":44,"word":"摄影四大流派的创作主张","phonetic":"三、摄影艺术","meanings":[{"pos":"","def":"绘画主义摄影：19世纪中叶起源于英国，形成最早、影响最广，创作追求绘画效果，构图用光影调有极严谨的法则。\n纪实主义摄影：至今仍是最重要的流派，强调纪实性，直接逼真地再现客观现实，崇尚质朴无华。\n印象主义摄影：表现摄影者的瞬间印象与独特感受，讲究形式美和装饰性，追求朦胧的画意效果。\n超现实主义摄影：用剪贴和暗房技术，叠印叠放、多重曝光、怪诞变形、任意夸张，表现超现实的神秘世界。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-45","list":7,"num":45,"word":"书法艺术的定义与线条美","phonetic":"四、书法艺术","meanings":[{"pos":"","def":"名词解释：书法艺术是中华民族特有的一种传统艺术形式。\n它主要通过汉字的用笔用墨、点画结构、行次章法等造型美，来表现人的气质、品格和情操，达到美学的境界。形式上追求线条美，内容上体现民族灵魂，造型性是书法艺术与生俱来最重要的特点。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-46","list":7,"num":46,"word":"书画同源与甲骨文金文","phonetic":"四、书法艺术","meanings":[{"pos":"","def":"中国书法与绘画有不可分割的历史渊源，“书画同源”是对这两门姊妹艺术的形象概括；书法建立在中国文字（汉字）基础之上。\n日本、新加坡、朝鲜、泰国等国把书法称为东方艺术的核心。\n3000多年前殷代刻在龟骨、兽骨上的甲骨文以象形为基础，奠定了书法艺术的一些基本要素；甲骨文发现仅有100多年，河南安阳殷墟农民挖出带符号的兽骨称“龙骨”；商周至战国金文脱胎于甲骨文，已渐趋齐整。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-47","list":7,"num":47,"word":"书法书体演变的历代脉络","phonetic":"四、书法艺术","meanings":[{"pos":"","def":"秦代统一文字，大篆变为小篆，有泰山、琅琊、碣石、会稽等刻石，风格端庄、形体匀润流畅；汉代出现雄浑豪放的隶书与自由飞动的草书；魏晋楷、行、草诸体更加齐备，涌现王羲之、钟繇；唐代各体承先启后，楷书成就达到高峰；宋代注重感情发挥、追求个性，有“宋人尚意”之说。\n总脉络：秦汉辉煌、魏晋风韵、隋唐鼎盛、宋元尚意、明清延续。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-48","list":7,"num":48,"word":"汉字书法的篆隶楷行草五体","phonetic":"四、书法艺术","meanings":[{"pos":"","def":"篆书：有大篆、小篆之分，广义的大篆指甲骨文、金文、籀文；小篆又叫“秦篆”，秦统一后在全国推行，字形整齐、转角圆滑。\n隶书：由篆书简化演变而成，横笔首尾方中带圆，转角多呈方折。\n楷书：也叫“正楷”“正书”，字形方正、笔画平直、古雅端庄。\n行书：流畅飞动、刚柔相济，偏楷为“行楷”，偏草为“行草”。\n草书：始于汉代，由隶书演变为“章草”，后为“今草”，唐张旭、怀素创“狂草”。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-49","list":7,"num":49,"word":"用笔用墨与结构章法韵律","phonetic":"四、书法艺术","meanings":[{"pos":"","def":"书法基本技法和表现形式：用笔、用墨、结构、章法、韵律、风格。\n宋代米芾自称“刷”字，称蔡襄“勒”字、黄庭坚“描”字、苏轼“画”字。\n用墨：颜真卿楷书多用浓墨，端庄厚重；董其昌常用淡墨，章法疏朗、风格玄淡；“墨分五彩”（焦、浓、重、淡、清）。\n结构须合乎比例、平衡对称；章法指整幅字的行次布局，错综变化、疏密相宜、有节奏气势；韵律指线条动静起伏枯润，如王羲之行书线条的中和、董其昌行草线条的清淡；风格是作品整体的艺术特征。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-50","list":7,"num":50,"word":"颜筋柳骨与天下三大行书","phonetic":"四、书法艺术","meanings":[{"pos":"","def":"“颜筋柳骨”评价颜真卿、柳公权：前者笔画刚直、浑厚丰筋，具整齐大度之美；后者结构紧凑、骨力劲健，具刚健有力之美。\n颜真卿《祭侄文稿》为追祭以身殉国的侄子所写，被称为“天下第二行书”。\n王羲之《兰亭集序》被称为“天下第一行书”，原作早已失传，现存为唐代书法家的临本；唐代大书法家张旭被称为“草圣”。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-51","list":7,"num":51,"word":"书法的四大作用与地位","phonetic":"四、书法艺术","meanings":[{"pos":"","def":"表达民族思想：形式美中蕴藏意蕴美，体现民族传统美学思想与书法家的精神气质。\n表达个人情感：将思想情感、精神气质外化到作品上，即“书如其人”。\n陶冶情趣：创作或欣赏能带来愉悦满足，使人潜移默化受到熏陶。\n创造社会美的环境：具艺术鉴赏与历史文化价值，常成为景区焦点，提升景区文化内涵。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-52","list":7,"num":52,"word":"造型性是最基本的特征","phonetic":"造型艺术的审美特征（一、造型性与直观性）","meanings":[{"pos":"","def":"造型艺术最基本的特征就是造型性，即艺术家运用一定的物质材料，塑造出欣赏者可以通过感官直接感受到的艺术形象。\n这决定它必然重视对象的外形、以表现外形为特长；但并非只求逼真再现，而是要求“以形写神”，体现人物内在精神气质与艺术家的思想情感。\n对声音、气味等没有外部形体的对象，只能用间接方式，以有形表现无形，调动观众的联想和想象。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-53","list":7,"num":53,"word":"直观性与造型艺术的视觉美感","phonetic":"造型艺术的审美特征（一、造型性与直观性）","meanings":[{"pos":"","def":"直观性（或称视觉性）是造型艺术的重要特征之一，由造型性派生：所塑造的艺术形象直接诉诸欣赏者的眼睛，凭借视觉感官来感受。\n造型艺术十分重视遵循形式美规律和法则，使欣赏者获得丰富的视觉美感，因此比其他任何艺术都更加讲究视觉美感。\n文学形象、音乐形象具有间接性和不确定性；造型艺术形象则以直接性、具象性、视觉性和永固性为根本特性。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-54","list":7,"num":54,"word":"各门类手段与以有形写无形","phonetic":"造型艺术的审美特征（一、造型性与直观性）","meanings":[{"pos":"","def":"绘画用线条、色彩在二维空间塑造形象；摄影用影调、色调在二维空间创造形象；雕塑用泥土、木石在三维空间创作具有实在物质性的形象；书法通过笔墨、布白、结构、用笔创造神采、呈现气韵。\n以有形写无形：任伯年10岁凭记忆画出来客肖像，父亲一眼认出；宋徽宗赵佶《听琴图》借听琴人的神态与松竹、青烟让人感受琴声；齐白石以急流旁摇尾的蝌蚪画“蛙声十里出山泉”。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-55","list":7,"num":55,"word":"瞬间性与莱辛的《拉奥孔》","phonetic":"造型艺术的审美特征（二、瞬间性与永固性）","meanings":[{"pos":"","def":"绘画、雕塑、摄影和书法本质上都是空间的静态艺术，不适于表现事物的运动和过程。\n造型艺术要反映现实，就必须在动和静的交叉点上，抓住事物发展变化某一瞬间的形象，用物质材料和艺术语言固定下来，这就是瞬间性；应选取具有典型意义的瞬间，运用暗示性手法调动想象。\n18世纪德国美学家莱辛在《拉奥孔》中比较同一题材在《荷马史诗》与古代雕塑中的表现，论证文学与造型艺术的区别；雕塑《拉奥孔》选取巨蛇缠身、濒死前最后挣扎的瞬间，说明造型艺术不能表现激情的顶点。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-56","list":7,"num":56,"word":"瞬间选取的三件中外名作","phonetic":"造型艺术的审美特征（二、瞬间性与永固性）","meanings":[{"pos":"","def":"米隆的《掷铁饼者》抓住运动员掷出铁饼前最紧张、最有力的刹那：弯腰扭身、重心落右脚、右手向后猛伸，全身肌肉蕴藏爆发力；引而不发的姿态更能调动想象，至今被视为体育运动的最好象征。\n《垂死的高卢人》同样抓住具有典型意义的瞬间，激发观众的联想和想象。\n列宾的《不期而至》选取革命者刚从流放地逃回家、踏入家门的一刹那，母亲惊呆站起、妻子不敢相信、女仆疑惑，把“不期而至”表达得淋漓尽致。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-57","list":7,"num":57,"word":"永固性与造型艺术的收藏","phonetic":"造型艺术的审美特征（二、瞬间性与永固性）","meanings":[{"pos":"","def":"瞬间形象一旦被创作出来，就同时被物质材料固定下来，可供人们多次欣赏，甚至千百年流传，这就是永固性。\n它使中外艺术史上许多优秀作品得以保存，既具很高艺术价值，又具很高经济价值，形成造型艺术特有的收藏价值，为其他大多数艺术门类所不具有。\n史前雕塑品《维伦多夫的维纳斯》《持兽角杯的女巫》；辽宁红山文化“女神庙”彩绘墙壁把中国壁画的源头上推到距今5000年左右。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-58","list":7,"num":58,"word":"再现性与摄影的文献价值","phonetic":"造型艺术的审美特征（三、再现性与表现性）","meanings":[{"pos":"","def":"造型艺术的基本特征是再现性空间艺术，再现性自然是它最重要的审美特征之一。\n在造型艺术中，摄影可以最逼真地再现现实生活中的人物、事物和景物，摄影作品有时被当作真实可靠的历史文献资料，具有认识和审美双重价值。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-59","list":7,"num":59,"word":"笔意为灵魂与扬州八怪","phonetic":"造型艺术的审美特征（三、再现性与表现性）","meanings":[{"pos":"","def":"优秀的书法作品总是体现在笔法与笔意的结合上。\n“笔意”是书法家精神气质的表现和外化，即通过笔画运转所表现的风格情趣，汉代扬雄说“书者，心画也”，笔意是书法艺术的灵魂；“笔法”指用笔的方法，包括执笔、运笔，尤其是表现笔意的具体手法。\n清代扬州八怪中郑板桥、金冬心、黄慎的书法形式与风格极端个性化，提倡写真人、真情、真事，反对温柔敦厚，崇尚个性、有意骇俗、标新立异。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-60","list":7,"num":60,"word":"梁楷减笔与应目会心之说","phonetic":"造型艺术的审美特征（三、再现性与表现性）","meanings":[{"pos":"","def":"造型艺术的表现性之一，是表现对象内在的精神气质。亚里士多德认为“画家所画的人物应比原来的人更美”。\n南宋梁楷擅长“减笔画”，《太白行吟图》寥寥数笔就画出李白傲岸不驯、才华横溢的风度；《泼墨仙人图》以泼洒水墨从总体上把握对象精神，刻画酩酊大醉而十分可亲的人物。\n表现性还在于传达艺术家的情感：南朝宗炳提出“应目会心”，唐张璪提出“外师造化，中得心源”；梅兰竹菊“四君子”成为文人画家性格和理想的化身。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-61","list":7,"num":61,"word":"形式美法则与凡高用色","phonetic":"造型艺术的审美特征（三、再现性与表现性）","meanings":[{"pos":"","def":"表现性的第三层：艺术家自觉运用形式美法则进行创造，再现艺术并非照搬生活。\n李思训父子的青绿山水金碧辉煌；米芾与其长子米友仁的“米点山水”以水墨挥洒点染表现江南风景。\n凡·高多用柠檬黄，显得明朗；《花瓶里的三朵向日葵》以淡蓝背景衬黄色向日葵，突出欢快调子，寄托历经人间苦难的画家对生命的热爱。\n高更多用土黄，《我们从哪里来？我们是谁？我们往哪里去？》充满神秘情调，反映其苦闷的内心世界。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-62","list":7,"num":62,"word":"《韩熙载夜宴图》的五段画面","phonetic":"中外造型艺术精品赏析（一、《韩熙载夜宴图》）","meanings":[{"pos":"","def":"五代南唐画家顾闳中，绢本设色，现藏故宫博物院；全幅长卷分为五段：“听乐”“赏舞”“休息”“清吹”“散宴”，以屏风、床榻起到分隔画面的作用；采用“心识默记”的方式。\n韩熙载在画中先后出现五次，始终处于沉思和压抑的精神状态，闷闷不乐、郁郁寡欢。\n顾闳中还画过《明皇击梧桐图》《游山阴图》；后主李煜写下《虞美人》；张大千曾以五百两黄金买下此画。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-63","list":7,"num":63,"word":"《清明上河图》的三段与虹桥","phonetic":"中外造型艺术精品赏析（二、《清明上河图》）","meanings":[{"pos":"","def":"北宋张择端，绢本淡设色，现藏北京故宫博物院，是国宝级传世名作，被历代鉴赏家称为“中华第一神品”，犹如宋代社会一部形象化的百科全书。\n以散点透视法把汴河两岸数十里繁华分成“城郊景色”“汴河虹桥”“市井街道”三段；焦点“虹桥”是横跨汴河之上的大型拱桥。\n传世900年曾五进皇宫，第一位重要收藏者是宋徽宗；2005年10月故宫博物院建院80周年时首次公开展示。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-64","list":7,"num":64,"word":"《最后的晚餐》三点与众不同","phonetic":"中外造型艺术精品赏析（三、《最后的晚餐》）","meanings":[{"pos":"","def":"作者达·芬奇，意大利文艺复兴时期的著名壁画，直接画在米兰圣玛利亚修道院餐厅的墙上，以耶稣和十二门徒最后的晚餐为题材。\n结构上：不让耶稣与门徒围坐，而让他们坐成一排、全部面向观众。\n人物上：抓住“即将到达顶点前的那一顷刻”。\n空间上：成功的立体透视使二维壁画呈现三维立体空间，观众似置身房间。\n“13”在西方国家一直被看作不吉利的数字。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-65","list":7,"num":65,"word":"《蒙娜·丽莎》与卢浮宫三宝","phonetic":"中外造型艺术精品赏析（四、《蒙娜·丽莎》）","meanings":[{"pos":"","def":"作者达·芬奇，据说这是西方美术史上较早出现的一幅偏重于心理描写的肖像画，以“神秘的微笑”著称。\n弗洛伊德用“性欲升华说”分析达·芬奇的创作与作品，认为其有“恋母情结”。\n作品最完美地表达了文艺复兴时期人文主义的理想，现珍藏于巴黎卢浮宫，与《米洛斯的阿芙洛狄忒》《萨莫色雷斯的胜利女神》并称“卢浮宫三宝”。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-66","list":7,"num":66,"word":"《日出·印象》与印象派开端","phonetic":"中外造型艺术精品赏析（五、《日出·印象》）","meanings":[{"pos":"","def":"法国印象派布面油画，1872年创作，现藏巴黎马蒙达博物馆；作者克劳德·莫奈，印象派创始人之一，该作品被视为印象派的开端。\n印象派代表：雷诺阿以人物画为主，擅画女性和儿童（《浴女》《包厢》）；德加善用光线与色彩的强烈对比塑造人物（《舞蹈课》）；马奈被公认为一代宗师，起承前启后作用（《奥林匹亚》《草地上的午餐》《吹短笛的男孩》）。\n新印象派修拉又称点彩派（《大碗岛上的星期天下午》）；后印象派以塞尚、凡·高、高更为代表。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-67","list":7,"num":67,"word":"《巴尔扎克像》的创作与争议","phonetic":"中外造型艺术精品赏析（六、《巴尔扎克像》）","meanings":[{"pos":"","def":"法国雕塑家罗丹，历时6年，作品高3米，现存于法国巴黎，全称为《巴尔扎克纪念肖像》，是为纪念法国大文豪巴尔扎克而作的肖像。\n作品摒弃一切细枝末节，人物的手脚都掩盖于睡袍之中，使观众的注意力集中到面部，尤其是炯炯有神的眼睛。\n19世纪末完成时因不符合当时人们的审美习惯，一度引起极大争议；它为20世纪现代雕塑揭开了序幕。罗丹的成名作是1877年的《青铜时代》。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-68","list":7,"num":68,"word":"卡希《二次大战时的丘吉尔》","phonetic":"中外造型艺术精品赏析（七、《二次大战时的丘吉尔》）","meanings":[{"pos":"","def":"加拿大摄影大师尤瑟夫·卡希最著名的作品，又名《愤怒的丘吉尔》，拍摄于1941年12月30日，抓拍了丘吉尔大怒的瞬间，印制上百万张流传于世界各国。\n1839年法国人达盖尔发明摄影技术，被公认为“摄影之父”。\n肖像摄影的最高艺术境界是“传神”，造型艺术共有的“瞬间性”对肖像摄影尤为重要。\n卡希被国际名人协会评选为20世纪全世界100位名人之一，是唯一获此殊荣的加拿大人。"}],"related":[],"section":"第7章","marked":false},{"id":"C07-69","list":7,"num":69,"word":"《兰亭集序》天下第一行书","phonetic":"中外造型艺术精品赏析（八、《兰亭集序》）","meanings":[{"pos":"","def":"东晋王羲之，行书法帖，亦称《兰亭序》《兰亭宴集序》，素有“天下第一行书”的盛誉。\n王羲之官至右军将军，人称“王右军”，被尊为“书圣”；其子王献之也是著名书法家，父子被称为“二王”；有“以字换鹅”的故事。\n唐太宗指出其“若断还连”“如斜反直”两大特点；真迹陪葬昭陵，至今只有摹本和刻本传世。\n文中二十个“之”字、七个“不”字、六个“一”字绝不雷同；宗白华认为它“从晋人的风韵中产生”。"}],"related":[],"section":"第7章","marked":false},{"id":"C08-01","list":8,"num":1,"word":"表情艺术的定义与音乐舞蹈两门类","phonetic":"第8章 表情艺术","meanings":[{"pos":"","def":"所谓表情艺术，是指通过一定的物质媒介（音响、人体）来直接表现人的情感、间接反映社会生活的这一类艺术的总称。\n它主要是指音乐、舞蹈这两门表现性和表演性艺术：音乐以音响为媒介，舞蹈以人体为媒介。\n表情艺术是人类历史上最古老的艺术门类，也是当代人们生活中最普及、最广泛的艺术门类。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-02","list":8,"num":2,"word":"抒情性、表现性与表演性三大特征","phonetic":"第8章 表情艺术","meanings":[{"pos":"","def":"表情艺术最基本的美学特征就是抒情性和表现性。\n表演性构成了表情艺术另一个重要的美学特征。\n音乐与舞蹈同其他艺术样式相比，能够最直接、最强烈、最细腻地表现内心情感、袒露人的心灵，因此人们常把这两门长于抒情的艺术称作表情艺术。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-03","list":8,"num":3,"word":"音乐与舞蹈的共同审美特征与差别","phonetic":"第8章 表情艺术","meanings":[{"pos":"","def":"音乐和舞蹈是除艺术家以外的普通人直接参与最多的艺术形式，又是两门具有高度科学性和技艺性的艺术种类。\n二者都需要通过表演这一二度创作过程，才能创造出可供人们欣赏的音乐形象或艺术形象。\n由于表现手段、物质媒介和艺术语言均不相同，两者之间又存在着一定的差别。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-04","list":8,"num":4,"word":"音乐是声音的艺术、时间的艺术","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"音乐是通过有组织的乐音在时间上的流动来创造艺术形象、传达思想感情、表现生活感受的一种表现性时间艺术。\n它是人类社会历史上产生最早的艺术种类之一，也是日常生活中人们最喜爱的艺术种类之一。\n从某种意义上讲，音乐是声音的艺术、时间的艺术，也是表现的艺术、再创造的艺术。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-05","list":8,"num":5,"word":"音乐分为声乐与器乐两大类别","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"人们常将音乐划分为声乐和器乐两大类。\n声乐是指用人声歌唱为主的音乐；器乐是指用乐器发声来演奏的音乐。\n两大类之下又各有多种再划分的方式：声乐按人声特点与演唱方式分，器乐按乐器种类、演奏方式与体裁形式分。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-06","list":8,"num":6,"word":"声乐按人声与演唱方式的分类","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"按歌唱特点，声乐可以分为男声（包括高音、中音、低音三种）、女声（包括高音、中音、低音三种）和童声三类。\n按演唱方式，可以分为独唱、齐唱、重唱、合唱、对唱、伴唱等多种形式。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-07","list":8,"num":7,"word":"民族、美声、通俗三大唱法","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"民族唱法在演唱方法上大多比较自然质朴，具有浓郁的民族风格和地方特色。\n美声唱法源于意大利，追求声音效果，讲究发声方法，注意运用华彩和装饰。\n通俗唱法是现代工业社会电子传播技术广泛运用后出现的歌曲演唱法，往往需要手持话筒，对演唱者本人的声乐训练没有太多严格要求。\n2006年第十二届青年歌手大奖赛新设原生态唱法；新趋势是通俗唱法时尚化、民族唱法多样化、美声唱法国际化。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-08","list":8,"num":8,"word":"器乐按乐器种类与演奏方法分类","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"根据器乐的不同种类和演奏方法，可以分为弦乐、管乐、弹拨乐和打击乐四大类。\n根据演奏方式的不同，可区分为独奏、重奏、齐奏、伴奏、合奏等多种形式。\n从体裁形式来划分，又可分为序曲、组曲、夜曲、进行曲、谐谑曲、叙事曲、幻想曲、狂想曲、随想曲、舞曲、协奏曲、交响音画、交响曲等。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-09","list":8,"num":9,"word":"序曲、组曲、夜曲、进行曲的代表作","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"序曲，如《威廉·退尔序曲》；组曲，如巴赫的《法国组曲》。\n夜曲，如肖邦的《升F大调夜曲》；进行曲，如柴可夫斯基的《斯拉夫进行曲》——记忆：作者和作品都有“夫”字。\n谐谑曲，如肖邦的四首钢琴谐谑曲。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-10","list":8,"num":10,"word":"叙事曲、幻想曲、狂想曲、随想曲代表作","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"叙事曲，如勃拉姆斯的《爱德华》——记忆：不拉母死，就是爱的品德。\n幻想曲，如康弗斯的《神秘的号手》——记忆：富士康（康弗斯）里作息很严格，每天早上神秘的号手喊大家起床。\n狂想曲，如李斯特的《匈牙利狂想曲》——记忆：一只狗又凶牙齿又锋利，发狂了把你撕得特别碎。\n随想曲，如柴可夫斯基的《意大利随想曲》。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-11","list":8,"num":11,"word":"舞曲、协奏曲、交响音画与交响曲","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"舞曲，如约翰·施特劳斯的《蓝色多瑙河圆舞曲》。\n协奏曲，如贝多芬的《D大调小提琴协奏曲》。\n交响音画，如穆索尔斯基的《荒山之夜》——记忆：闭眼（目锁）用耳朵开车的司机，晚上开到荒山。\n交响曲气势磅礴、结构宏大，如贝多芬的《英雄交响曲》。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-12","list":8,"num":12,"word":"交响乐队与民族管弦乐队的乐器分组","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"交响乐队主要运用西洋乐器：弦乐器（小提琴、中提琴、大提琴、低音提琴）、木管乐器（长笛、短笛、单簧管、双簧管、英国管、大管）。\n铜管乐器（圆号、小号、长号、大号）、打击乐器（定音鼓、大鼓、小军鼓、三角铁）、弹拨乐器（竖琴、吉他、曼陀林）、键盘乐器（钢琴、管风琴、手风琴）。\n中国民族管弦乐队：弦乐器（二胡、板胡、高胡、低胡）、吹管乐器（笛、箫、笙、管、唢呐）、弹拨乐器（琵琶、柳琴、月琴、三弦、扬琴、阮、筝）、打击乐器（鼓、锣、钹、板）。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-13","list":8,"num":13,"word":"音乐语言七大要素与旋律节奏和声","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"音乐的艺术语言和表现手段主要包括旋律、节奏、和声、复调、曲式、调式、调性等。\n其中最主要的是前三者——旋律、节奏、和声。\n旋律堪称音乐的灵魂，节奏体现出音乐的时间感，和声体现出音乐的空间感。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-14","list":8,"num":14,"word":"旋律：音乐最主要的表现手段","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"旋律把高低、长短不同的乐音按照一定的节奏、节拍乃至调式、调性关系组织起来，塑造音乐形象，表现特定的内容和情感。\n旋律具有很强的艺术表现力，可以表现出音乐的内容、风格、体裁，甚至体现出音乐的民族特色和地域特征。\n因此，人们常把旋律称为音乐的灵魂。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-15","list":8,"num":15,"word":"节奏是旋律的骨干与和声的立体感","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"节奏是音乐最基本的表现手段，指音响的长短、强弱、轻重等有规律的组合；它是旋律的骨干，也是乐曲结构的主要因素，使乐曲体现出情感的波动起伏。\n和声是多声部音乐按照一定关系构成重叠复合的音响现象，使音乐具有结构感、色彩感和立体感。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-16","list":8,"num":16,"word":"交响乐：音乐创作的最高形式","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"交响乐出自两个希腊词，原意为“一齐响”，也有音与音之间和谐结合的意思。\n现代关于交响乐的概念形成于18、19世纪之交，以海顿、莫扎特、贝多芬为首的维也纳古典乐派使交响乐真正进入黄金时代。\n交响乐是音乐艺术的精髓、音乐创作的最高形式、人类文明的积淀，由大型管弦乐队演奏，是包含四个独立乐章的器乐套曲。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-17","list":8,"num":17,"word":"交响乐四个乐章的曲式结构","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"第一乐章，快板，奏鸣曲式（引子、呈示部、展开部、再现部）。\n第二乐章，慢板，常用抒情的民间素材，三段曲式或回旋曲式。\n第三乐章，快板或稍快，常用舞曲形式。\n第四乐章，快板或急板的终曲，回旋曲式或变奏曲式，有时也用较为自由的奏鸣曲式。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-18","list":8,"num":18,"word":"德沃夏克《自新大陆交响曲》","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"捷克19世纪著名音乐家德沃夏克，1892年至1895年应邀到美国纽约的音乐学院讲学。\n他创作的《自新大陆交响曲》（《新世界交响曲》）取得了极大成功，许多美国人甚至将它称为“最能代表美国精神的交响曲”。\n记忆：等我下课（德沃夏克）骑自行车，去新大陆（自新大陆交响曲）接客（捷克）。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-19","list":8,"num":19,"word":"最古老乐器、贾湖骨笛与曾侯乙编钟","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"迄今为止已经发现的最古老的乐器，是在乌克兰境内原始人遗址中找到的六支用长毛象骨骼制成的乐器，每支都能发出不同的声音。\n我国迄今发现的最早乐器是贾湖骨笛。\n1978年在湖北随州曾侯乙墓出土编钟共64件，重达2500千克以上，堪称我国古代最庞大的乐器。\n经测定音色明亮、音域宽广，全部音域贯穿五个八度组，并已构成完整的半音阶，它的出土被认为是世界音乐史上的重大发现。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-20","list":8,"num":20,"word":"孔子评《韶》与西周的雅乐、郑卫之音","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"“子在齐闻《韶》，三月不知肉味。”\n“子谓《韶》：‘尽美矣，又尽善也。’谓《武》：‘尽美矣，未尽善也。’”\n先秦时期的重要音乐家有伯牙、师旷、晏婴等。\n西周还专门设立了掌管音乐和音乐教育的乐官，出现了由周王朝制定的“雅乐”和流行于民间的俗乐“郑、卫之音”。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-21","list":8,"num":21,"word":"汉魏乐府、隋唐教坊与宋元民间音乐","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"汉魏是我国古代音乐史上的重要发展时期：北方相和歌（记忆：北方人爱喝酒唱歌）与南方清商乐（记忆：南方人情商比较高）都达到了很高的艺术成就。\n汉武帝时正式建立乐府这种音乐机构，大量采集民歌民谣、制定乐谱、配乐演唱、培训乐工。\n隋唐在吸收西域音乐的基础上出现新俗乐（燕乐），唐代教坊成为天下音乐舞蹈精英的荟萃之地，长安乐工曾多达万人以上，音乐专著多达400多卷。\n宋元明清民间音乐发展较快，元杂剧、南北曲、昆曲中蕴藏着中国传统音乐文化的宝贵财富。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-22","list":8,"num":22,"word":"萧友梅与近现代音乐家群像","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"萧友梅是我国近现代音乐史奠基人之一，20世纪20年代在北京大学音乐传习所任教，后来在蔡元培的支持下筹建了我国第一所音乐学校——国立音乐院，后改为上海音专。\n现代音乐史上还涌现出刘天华、华彦钧（阿炳）、黄自、聂耳、冼星海等一批著名的音乐家，以及众多蜚声中外的优秀音乐作品。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-23","list":8,"num":23,"word":"《格里高利圣咏》：欧洲最早记录作品","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"《格里高利圣咏》是在中世纪由教皇格里高利一世从各地教堂的圣咏曲调中精选出来的。\n它是欧洲音乐史上有详细记录的最早的作品。\n记忆：隔离搞里（中世纪男人化妆，教皇更要化妆），开始唱圣咏。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-24","list":8,"num":24,"word":"16世纪末世俗音乐与歌剧的诞生","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"西方音乐史上比较重要的时期，是从16世纪末叶开始的。\n从这个时期起，世俗音乐逐渐占据主导地位，主调音乐取代了复调音乐，器乐得到了相当大的独立发展。\n特别是诞生了歌剧这一综合了音乐、戏剧、美术、舞蹈的新的艺术形式。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-25","list":8,"num":25,"word":"古典乐派：推崇理性与情感统一","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"古典乐派是从18世纪下半叶至19世纪初在维也纳形成的、以古典风格为创作标志的音乐流派，以海顿、莫扎特和贝多芬三人为主要代表。\n这个流派推崇理性和情感的统一，追求艺术形式的严谨和完美，创作手法上注重戏剧的对比、冲突和发展，成为当时的典范。\n记忆：嗨，特背；贝多芬被人们尊称为“乐圣”。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-26","list":8,"num":26,"word":"浪漫乐派：强调激情与主观情感","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"浪漫乐派是19世纪在欧洲兴起的音乐流派，最大特点就是强调激情、强调抒发主观情感、强调表现个性。\n前期代表人物：德国作曲家舒伯特和舒曼、匈牙利李斯特、波兰肖邦、法国柏辽兹。\n后期代表人物：德国瓦格纳和勃拉姆斯、俄国柴可夫斯基。\n记忆：前期“舒舒李肖柏”，后期“瓦可勃拉姆斯”。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-27","list":8,"num":27,"word":"民族乐派及其代表作曲家与作品","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"民族乐派主张音乐应当具有鲜明的民族风格和民族特色，注意采用本国的民间音乐作为创作素材。\n主要代表：挪威格里格（《培尔·金特》）、捷克德沃夏克（《自新大陆交响曲》）。\n俄国“强力集团”：穆索尔斯基（《荒山之夜》）、里姆斯基-柯萨科夫（《舍赫拉查德》）、鲍罗丁（《在中亚细亚草原上》）。\n19世纪民族乐派包括俄罗斯（以格林卡为首的“强力集团”）、捷克（斯美塔那、德沃夏克）、挪威（格里格）三支。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-28","list":8,"num":28,"word":"20世纪西方音乐的三个主要流派","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"以法国音乐家德彪西为代表的印象派音乐（记忆：必须得飙车到死，速度很快，景物才会出现残影）。\n以奥地利音乐家勋伯格为代表的表现派音乐（记忆：训博士哥哥，来表现自己很厉害）。\n以意大利音乐家布梭尼为代表的新古典主义音乐（记忆：打破了古典主义，但不说你）。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-29","list":8,"num":29,"word":"约翰·凯奇的《4′33″》与偶然音乐观念","phonetic":"一、音乐艺术","meanings":[{"pos":"","def":"“偶然音乐”与观念艺术在20世纪中期影响很大。\n1952年，美国作曲家约翰·凯奇在一次音乐会上呈现《4′33″》：钢琴家走上台来、在钢琴前坐下、抬起双手放在琴键上，之后没有任何动作。\n突如其来的沉默使台下听众不知所措、发出各种声响，这些声音就是这部作品的音响。\n凯奇的创作正是提供了这样一种观念，促进观众直接参与创作活动。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-30","list":8,"num":30,"word":"舞蹈：以人体动作为主要表现手段","phonetic":"二、舞蹈艺术","meanings":[{"pos":"","def":"舞蹈是以经过提炼加工的人体动作为主要表现手段，运用舞蹈语言、节奏、表情和构图等多种基本要素，塑造出具有直观性和动态性的舞蹈形象，表达人们思想感情的一种艺术样式。\n与音乐以音响为媒介不同，舞蹈的物质媒介是人体本身，因而更具有直观性。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-31","list":8,"num":31,"word":"原始舞蹈与中国古代舞蹈的演变","phonetic":"二、舞蹈艺术","meanings":[{"pos":"","def":"最早的舞蹈常常是歌、舞、乐三者合为一体，既是巫术仪式，又是歌舞活动；青海大通县出土的“舞蹈纹彩陶盆”生动记录了5000年前原始舞蹈的情景。\n文献记载“昔葛天氏之乐，三人操牛尾，投足以歌八阕”，说的就是舞蹈。\n商代巫舞；周代文舞与武舞（记忆：姬发文武双全）；春秋战国优舞；汉代百戏（记忆：汉代繁荣，舞蹈种类一百种）。\n唐代有大型宫廷乐舞“立部伎”、小型宫廷宴乐“坐部伎”，以及胡腾舞、胡旋舞、剑器舞等“健舞”和《霓裳羽衣舞》等歌舞大曲。\n宋代民间盛行综合性表演形式“舞队”。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-32","list":8,"num":32,"word":"芭蕾的诞生与19世纪黄金时代","phonetic":"二、舞蹈艺术","meanings":[{"pos":"","def":"1581年，意大利籍艺术家们在法国演出了第一部真正的芭蕾舞作品《王后喜剧芭蕾》，此后芭蕾舞迅速在欧洲各国传播开来。\n19世纪更堪称芭蕾舞艺术的黄金时代，脚尖舞与外开性技巧和一整套训练方法日臻完善。\n逐渐形成了芭蕾舞艺术的意大利学派、法国学派和俄罗斯学派，出现了《吉赛尔》《天鹅湖》《睡美人》等闻名于世的优秀作品。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-33","list":8,"num":33,"word":"邓肯：现代舞蹈之母与现代舞","phonetic":"二、舞蹈艺术","meanings":[{"pos":"","def":"20世纪初以美国著名舞蹈家邓肯为先驱的现代舞，邓肯被称为“现代舞蹈之母”。\n她以自然的舞蹈动作打破了古典芭蕾舞传统的程式束缚，更加自由地表现内心情感。\n主张“观摩自然，研究自然，理解自然，然后努力表现自然”，同时吸取前人的艺术营养，强调通过身、心、灵三者的结合来展示人的生命力。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-34","list":8,"num":34,"word":"世界各地区民族的特色舞蹈","phonetic":"二、舞蹈艺术","meanings":[{"pos":"","def":"印度的古典舞、印度尼西亚的巴厘舞、日本的盆舞、斯里兰卡的象舞。\n爱尔兰的踢踏舞、波兰的马祖卡舞，以及非洲大量力度很强的民间舞蹈。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-35","list":8,"num":35,"word":"舞蹈分为生活舞蹈与艺术舞蹈","phonetic":"二、舞蹈艺术","meanings":[{"pos":"","def":"从总体上讲，舞蹈可以分为生活舞蹈与艺术舞蹈两大类别。\n这是舞蹈最基本的分类，2024年真题以“舞蹈分为生活舞蹈和（ ）两种类型”的形式考查。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-36","list":8,"num":36,"word":"生活舞蹈：自娱、社交与普及","phonetic":"二、舞蹈艺术","meanings":[{"pos":"","def":"生活舞蹈与人们日常生活联系密切，动作简单，未受过专门训练的人也容易学会，目的主要在于自娱或社交，具有广泛的群众性和普及性。\n包括交际舞、习俗舞蹈（又称仪式舞蹈，用于各种喜庆节日和传统文化风俗仪式）、宗教舞蹈（祭祀祖先或求雨免灾）、体育舞蹈（艺术体操、冰上舞蹈）、教育舞蹈（幼儿园或学校中对青少年与儿童进行美育的舞蹈课程）。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-37","list":8,"num":37,"word":"交际舞：华尔兹、探戈与伦巴","phonetic":"二、舞蹈艺术","meanings":[{"pos":"","def":"生活舞蹈中最为流行的大概要算交际舞，又称交谊舞或舞厅舞，最早起源于欧洲。\n舞步优雅潇洒的有华尔兹（俗称“慢三步”）和布鲁斯（俗称“慢四步”）。\n后来是节奏鲜明、动作跳跃的探戈和伦巴。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-38","list":8,"num":38,"word":"艺术舞蹈：舞台表演的舞蹈作品","phonetic":"二、舞蹈艺术","meanings":[{"pos":"","def":"艺术舞蹈是指专业或业余舞蹈家通过艺术创作在舞台上表演的艺术作品。\n这类舞蹈常常需要较高的技艺水平、完整的艺术构思、鲜明的主题思想和栩栩如生的艺术形象。\n作为表演性舞蹈的总称，艺术舞蹈有多种分类方法，最引人注目的是我国各民族的民间舞和西方的芭蕾舞。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-39","list":8,"num":39,"word":"艺术舞蹈按表现形态分为六类","phonetic":"二、舞蹈艺术","meanings":[{"pos":"","def":"独舞：一位演员表演，如《天鹅湖》中的白天鹅独舞与黑天鹅独舞。\n双人舞：两位演员通常一男一女合作，如《丝路花雨》中英娘和神笔张的双人舞。\n三人舞：如《金山战鼓》、《天鹅湖》中的大天鹅舞。\n群舞（集体舞）：四人以上合作，如《红绸舞》。\n组舞：几个相对完整舞段表现特定主题，如由五个独立舞段组成的《俄罗斯组舞》。\n歌舞：载歌载舞，如《编钟乐舞》。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-40","list":8,"num":40,"word":"情绪舞、情节舞与舞剧的区分","phonetic":"二、舞蹈艺术","meanings":[{"pos":"","def":"情绪舞是直接抒发舞蹈者思想感情的抒情性舞蹈，如女子独舞《春江花月夜》。\n情节舞通过简单的情节或事件来塑造人物、表现主题，如《胖嫂回娘家》。\n舞剧以舞蹈为主要艺术手段，综合戏剧、音乐、舞美等多种艺术样式，如古典芭蕾舞剧《睡美人》、民族舞剧《宝莲灯》。\n从表现风格区分，艺术舞蹈还可以分为古典舞与现代舞、民间舞与宫廷舞。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-41","list":8,"num":41,"word":"民间舞：民族风格与地方色彩","phonetic":"二、舞蹈艺术","meanings":[{"pos":"","def":"民间舞是指在民间广泛流传的传统舞蹈形式。\n它生动地反映出各地区、各民族的性格爱好、风俗习惯和审美趣味，具有强烈的民族风格和鲜明的地方色彩。\n一般又可以分为汉族民间舞和少数民族民间舞两大类。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-42","list":8,"num":42,"word":"汉族民间舞：秧歌、花灯与舞龙舞狮","phonetic":"二、舞蹈艺术","meanings":[{"pos":"","def":"采用载歌载舞的形式，如秧歌、花灯、二人转。\n利用各种道具，如狮子舞、龙舞、高跷、跑旱船。\n汉族民间舞常常是自娱性和表演性相结合，参加者为数众多，如秧歌、腰鼓舞等。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-43","list":8,"num":43,"word":"少数民族民间舞的地域特色","phonetic":"二、舞蹈艺术","meanings":[{"pos":"","def":"蒙古族安代舞、筷子舞、盅子舞，动作有力、节奏强烈、豪迈奔放（记忆：代代平安，都有饭碗筷子吃饭；2023年真题“属于蒙古族舞蹈的是”即安代舞）。\n维吾尔族赛乃姆、多朗舞，活泼开朗、风趣乐观，急速旋转令人眼花缭乱。\n朝鲜族扇子舞、长鼓舞，舞姿优美、节奏轻快；藏族弦子舞、锅庄，雄健有力、节奏激昂。\n瑶族铜鼓舞（记忆：摇头晃脑）、傣族孔雀舞、苗族芦笙舞、彝族阿细跳月。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-44","list":8,"num":44,"word":"芭蕾舞与芭蕾舞剧的程式及构成","phonetic":"二、舞蹈艺术","meanings":[{"pos":"","def":"芭蕾舞起源于意大利，形成于法国；古典芭蕾舞有一整套严格的程式和规范，尤其是脚尖鞋的运用和脚尖舞的技巧，动作要求规范化，尤其注意稳定性和外开性，即“开绷直立”。\n正是独特的脚尖舞技巧以及稳定性与外开性的程式化动作，使芭蕾舞具有了鲜明的艺术表现形式和美学特征。\n芭蕾舞剧以舞蹈为主要表现手段，将舞蹈、音乐、戏剧、美术等融合在一起，刻画人物性格、表现故事情节、传达情感氛围。\n一部大型芭蕾舞剧常由表现人物性格和情绪的独舞、传达剧情发展和人物情绪交流的双人舞、反映时代背景和烘托情绪氛围的群舞共同构成。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-45","list":8,"num":45,"word":"《吉赛尔》《天鹅湖》与中国芭蕾","phonetic":"二、舞蹈艺术","meanings":[{"pos":"","def":"著名的大型古典芭蕾舞剧有《吉赛尔》《爱斯梅拉达》《天鹅湖》《睡美人》《罗密欧与朱丽叶》等。\n我国在1958年第一次演出了世界名剧《天鹅湖》，从那时以来芭蕾舞艺术在我国有了迅速的发展。\n涌现出《白毛女》《红色娘子军》等一批大型现代题材芭蕾舞剧。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-46","list":8,"num":46,"word":"表情艺术审美特征的三个方面","phonetic":"表情艺术的审美特征","meanings":[{"pos":"","def":"本章【大题】★★★★★考点，共三个方面：一、抒情性与表现性；二、表演性与形象性；三、节奏性与韵律美。\n三个方面分别对应情感、表演与形式三个层面，答题时必须结合音乐、舞蹈的具体作品例证展开，不能只写要点。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-47","list":8,"num":47,"word":"抒情性是音乐、舞蹈的基本属性","phonetic":"一、抒情性与表现性","meanings":[{"pos":"","def":"抒情性是音乐、舞蹈的基本属性，音乐和舞蹈可以直接表现人类各种细微复杂的情感情绪。\n“情动于中而形于言，言之不足故嗟叹之，嗟叹之不足故永歌之，永歌之不足，不知手之舞之，足之蹈之也。”\n“歌以叙志，舞以宣情。”\n黑格尔认为“音乐是心情的艺术，它直接针对着心情”；白居易《琵琶行》写听琵琶后“座中泣下谁最多，江州司马青衫湿”。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-48","list":8,"num":48,"word":"抒情性例证：从《二泉映月》到《天鹅之死》","phonetic":"一、抒情性与表现性","meanings":[{"pos":"","def":"阿炳《二泉映月》的哀怨、聂耳《金蛇狂舞》的热烈、《春江花月夜》的恬静、《江河水》的悲泣。\n贝多芬作品的激情奔放、莫扎特作品的优美细腻、德彪西作品的朦胧伤感、柴可夫斯基作品的忧郁深沉。\n《红绸舞》的热烈欢快、《荷花舞》的清新幽静、《天鹅之死》的奋力拼搏、《罗密欧与朱丽叶》的无限深情。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-49","list":8,"num":49,"word":"抒情性来源于本质属性与表现手段","phonetic":"一、抒情性与表现性","meanings":[{"pos":"","def":"音乐、舞蹈难以模拟或再现客观对象，长于表现或传达创作主体的情感情绪，具有强烈的感染力和表现力。\n抒情性来源于它们内在的本质属性和特殊的表现手段：音乐中有组织的乐音、舞蹈中人的形体动作，都可以通过力度的强弱、节奏的快慢、幅度和能量的大小等多种方式表现内心情感。\n舞蹈中有大量的抒情舞蹈（即情绪舞），音乐更是擅长于表现情感的艺术。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-50","list":8,"num":50,"word":"再现生活与表现情感两种基本功能","phonetic":"一、抒情性与表现性","meanings":[{"pos":"","def":"从一定意义上讲，再现生活与表现情感是艺术的两种基本功能。\n表情艺术难以模拟或再现客观对象，长于表现或传达创作主体的情感情绪，具有强烈的感染力和表现力。\n人们普遍认为贝多芬的音乐有两个主要特征，即哲理性和戏剧性，如《英雄交响曲》。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-51","list":8,"num":51,"word":"《百鸟朝凤》：唢呐模拟鸟鸣","phonetic":"一、抒情性与表现性","meanings":[{"pos":"","def":"我国著名的唢呐独奏曲《百鸟朝凤》，以唢呐模拟布谷鸟、斑鸠、猫头鹰等各种鸟类的鸣叫声，富于浓厚的生活气息。\n但全曲从总体上讲仍然是通过万物生机勃勃、欣欣向荣的景象，来表现欢快热烈的生活情趣和情感。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-52","list":8,"num":52,"word":"《田园交响曲》：借景抒情非绘画","phonetic":"一、抒情性与表现性","meanings":[{"pos":"","def":"贝多芬《田园交响曲》中有器乐模拟和描绘的雷声、雨声、风声和鸟鸣声，但它们仍然是为了表现音乐家在生活中的感受。\n这种借景抒情、寓情于景的手法，传达音乐家对于生活的情感体验。\n贝多芬本人说：“《田园交响曲》不是绘画，而是表达乡间的乐趣在人心里所引起的感受，因而是描写对农村生活的一些感觉。”"}],"related":[],"section":"第8章","marked":false},{"id":"C08-53","list":8,"num":53,"word":"音乐形象的多义性、模糊性与抽象性","phonetic":"一、抒情性与表现性","meanings":[{"pos":"","def":"音乐作品的情感内涵往往还具有多义性和模糊性。\n音乐形象具有多义性、模糊性和朦胧性的特点。\n音乐形象又具有抽象性、象征性和复杂性的特点。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-54","list":8,"num":54,"word":"尼采《悲剧的诞生》：日神与酒神","phonetic":"一、抒情性与表现性","meanings":[{"pos":"","def":"德国诗人、哲学家尼采在《悲剧的诞生》一书中强调“日神精神”和“酒神精神”，认为二者分别代表不同的门类。\n“日神精神”体现为梦境，梦境中的幻想具有美的外观，代表“日神精神”的是造型艺术。\n“酒神精神”体现为醉态，是酒醉狂喜的忘我之境，象征情绪的纵情宣泄，代表“酒神精神”的是音乐。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-55","list":8,"num":55,"word":"表演性：一度创作与二度创作","phonetic":"二、表演性与形象性","meanings":[{"pos":"","def":"音乐、舞蹈都属于表演艺术，即通过演员表演并借助舞台来完成的艺术形式（除音乐、舞蹈外还包括戏剧、戏曲、曲艺）。\n首先需要一度创作即作曲、作词、配器或编舞，同时也需要指挥家、演奏家、歌唱家和舞蹈家的二度创作。\n二度创作可以多次进行；同一作品因表演者理解不同、艺术风格不同和表现形式不同，会产生十分不同的艺术效果。\n没有表演，就没有音乐和舞蹈。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-56","list":8,"num":56,"word":"《金色的孔雀》与《雀之灵》的表演","phonetic":"二、表演性与形象性","meanings":[{"pos":"","def":"舞蹈以人体的姿态、表情、造型，尤其是动作来表现思想情感，表演在塑造舞蹈形象时具有更加重要的意义和作用。\n同样是演出以吉祥的孔雀为题材的女子独舞：傣族舞蹈家刀美兰演出《金色的孔雀》，白族舞蹈家杨丽萍演出《雀之灵》。\n《茶花女》中阿尔弗莱德的咏叹调《饮酒歌》，意大利男高音帕瓦罗蒂与西班牙男高音多明戈的演唱各具效果。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-57","list":8,"num":57,"word":"《红楼梦》林黛玉与《水》的舞蹈形象","phonetic":"二、表演性与形象性","meanings":[{"pos":"","def":"大型民族舞剧《红楼梦》中，陈爱莲成功地塑造了林黛玉：运用古典舞蹈特有的造型美和内在的韵律感，吸收戏曲舞蹈中的圆场、水袖、碎步、指法和身段等表演技巧，表现黛玉多愁善感的性格和痛苦悲愤的内心。\n女子独舞《水》从傣族妇女洗发、担水、戏水的生活细节中得到启发，结合傣族舞蹈“三道弯”这一形式美的特点。\n《水》描绘出澜沧江畔、夕阳余晖下傣族少女江边汲水的优美意境，犹如田园抒情诗一样耐人寻味。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-58","list":8,"num":58,"word":"音乐形象的时间性与《梁祝》化蝶","phonetic":"二、表演性与形象性","meanings":[{"pos":"","def":"音乐形象看不见、摸不着，它需要欣赏者充分调动审美感受力，用全部身心去体验、想象和联想，在内心唤起一定的情感意象，从而完成音乐形象的塑造。\n因此，音乐形象不具有空间性，而具有时间性，只是在时间的流动里存在。\n小提琴协奏曲《梁祝》的“化蝶”即是例证。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-59","list":8,"num":59,"word":"节奏是音乐最基本的表现手段","phonetic":"三、节奏性与韵律美","meanings":[{"pos":"","def":"在音乐中，节奏是最基本和最重要的表现手段，是旋律的骨干，也是乐曲结构的基本构成因素。\n节奏的本质根源归结为运动：舒缓的节奏使人沉静，激越的节奏使人振奋，沉重的节奏使人压抑，欢快的节奏使人陶醉。\n节奏的表现作用：使旋律具有鲜明的个性、增强乐曲的艺术表现力、直接影响音乐的抒情性。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-60","list":8,"num":60,"word":"进行曲、圆舞曲、玛祖卡与《悲怆》《黎明》","phonetic":"三、节奏性与韵律美","meanings":[{"pos":"","def":"进行曲一般为偶数拍子、节奏鲜明，适用于进行场面，如《大刀进行曲》。\n华尔兹（圆舞曲）是强弱弱的三拍结构，旋律流畅、节奏明确，如《蓝色多瑙河》。\n起源于波兰的玛祖卡舞曲旋律欢快热情、节奏强烈多变，如肖邦的《C大调玛祖卡舞曲》。\n柴可夫斯基《悲怆交响曲》打破交响曲的古典规范，把第四乐章写成缓慢的柔板，以缓慢沉重的节奏与不协和的和弦表现剧烈哀伤。\n贝多芬钢琴奏鸣曲《黎明》则洋溢着朝气蓬勃的活力、明朗的曲调和清澈的音色。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-61","list":8,"num":61,"word":"舞蹈节奏与吴晓邦的舞蹈三要素","phonetic":"三、节奏性与韵律美","meanings":[{"pos":"","def":"舞蹈节奏一般表现为人体的律动，即人体动作的力度强弱、速度快慢，以及动作幅度和能量的大小，因此舞蹈节奏常常体现为人体动作的韵律美。\n舞蹈既是视觉艺术，又是听觉艺术，动作的节奏常以音乐旋律的节奏为基础；音乐与舞蹈紧密结合，节奏正是它们结合的纽带。\n我国著名舞蹈理论家吴晓邦认为，构成舞蹈的三要素就是表情、节奏和构图。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-62","list":8,"num":62,"word":"《丝路花雨》与“反弹琵琶”造型","phonetic":"三、节奏性与韵律美","meanings":[{"pos":"","def":"大型民族舞剧《丝路花雨》以举世闻名的敦煌壁画与丝绸之路为背景，通过唐代画工神笔张和女儿英娘的经历，歌颂中外人民源远流长的传统友谊。\n这出舞剧最鲜明的艺术特色，就是从灿烂的敦煌壁画中吸取了大量艺术营养。\n尤其是剧中女主人公英娘的一段独舞，“反弹琵琶”的造型尤为突出。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-63","list":8,"num":63,"word":"《英雄交响曲》：贝多芬风格成熟的标志","phonetic":"一、《E大调第三交响曲》（音乐艺术）","meanings":[{"pos":"","def":"德国著名音乐家贝多芬于1803年创作《E大调第三交响曲》，它是贝多芬音乐风格成熟的标志。\n这部作品从内容到形式都大大超出了维也纳古典交响曲的局限，完全确立了贝多芬自己的创作风格，是西方音乐史上一部不朽的巨著。\n他一方面继承了海顿、莫扎特的古典主义音乐传统，另一方面又开了浪漫主义音乐的先河；人们公认贝多芬音乐是古典音乐与浪漫音乐之间的桥梁。\n贝多芬曾在此曲封面写下“献给拿破仑·波拿巴”，后改写为“为纪念一位伟人而作的英雄交响曲”。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-64","list":8,"num":64,"word":"贝多芬的代表作品与“乐圣”称号","phonetic":"一、《E大调第三交响曲》（音乐艺术）","meanings":[{"pos":"","def":"《E大调第三交响曲》——《英雄交响曲》；《c小调第五交响曲》——《命运交响曲》。\n《F大调第六交响曲》——《田园交响曲》；《f小调第九交响曲》——《合唱交响曲》。\n《f小调钢琴奏鸣曲》——《热情》，还有《黎明》《月光》《D大调小提琴协奏曲》。\n贝多芬被人们尊称为“乐圣”，他患有耳疾；维也纳古典乐派的杰出代表是海顿、莫扎特、贝多芬。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-65","list":8,"num":65,"word":"《英雄交响曲》四乐章与《普罗米修斯》","phonetic":"一、《E大调第三交响曲》（音乐艺术）","meanings":[{"pos":"","def":"全曲共分四个乐章，第四乐章是终曲、变奏曲式，这段变奏曲的主题取自贝多芬早年所写的舞剧《普罗米修斯》。\n“谐谑”的原意就是滑稽或幽默的意思。\n《E大调第三交响曲》标志着贝多芬音乐创作的成熟时期，既是贝多芬本人创作道路上的一个里程碑，也是西方交响乐发展史上的一个里程碑；它也是贝多芬最心爱的作品，是他创作生活中的一个里程碑。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-66","list":8,"num":66,"word":"德沃夏克《自新大陆》的创作与影响","phonetic":"二、《e小调第九交响曲》（音乐艺术）","meanings":[{"pos":"","def":"捷克作曲家德沃夏克的《e小调第九交响曲》又称为《自新大陆交响曲》或《新世界交响曲》，是19世纪民族乐派交响曲的代表作。\n作品采用美国印第安民谣及黑人民歌作材料，以独特的民族性手法加工整理而成，带有捷克音乐显著的风格。\n他的《自新大陆交响曲》和《阿美利加》都是在美国完成的；一些报纸称之为“最富有美国精神的交响曲”，这部作品也是他交响乐创作的顶峰。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-67","list":8,"num":67,"word":"《自新大陆》第二乐章与《思故乡》","phonetic":"二、《e小调第九交响曲》（音乐艺术）","meanings":[{"pos":"","def":"全曲共分为四个乐章，第一乐章的主部主题具有鲜明的美国特色，可称之为体现全曲精神的旋律。\n第二乐章是整部交响曲中最为有名和感人的乐章，经常被提出来单独演奏，被誉为所有交响曲中最为动人的慢板乐章。\n德沃夏克写作第二乐章时受到美国诗人朗费罗的印第安民族史诗《海华沙之歌》的影响，后来被单独填上《思故乡》的歌词而家喻户晓。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-68","list":8,"num":68,"word":"《费加罗的婚礼》：莫扎特的歌剧代表作","phonetic":"三、歌剧《费加罗的婚礼》（音乐艺术）","meanings":[{"pos":"","def":"歌剧《费加罗的婚礼》取材于法国著名戏剧家博马舍的同名喜剧，由剧作家达·彭特改编，音乐家莫扎特作曲。\n该剧于1786年由莫扎特亲自指挥首演于维也纳，获得极大成功，采用抒情喜剧的形式，是莫扎特创作生活中最重要和最有影响的一部歌剧。\n剧情：伯爵的仆人费加罗与伯爵夫人的女仆苏珊娜即将结婚，喜新厌旧的伯爵也在追求苏珊娜，费加罗与苏珊娜联合伯爵夫人设计圈套惩戒伯爵，使其当场出丑，有情人终成眷属。\n第一幕中费加罗的咏叹调《不要再去做情郎了》在进行曲风格中表达出诙谐的喜剧性情趣；莫扎特另有《魔笛》《唐·璜》。"}],"related":[],"section":"第8章","marked":false},{"id":"C08-69","list":8,"num":69,"word":"《天鹅湖》：柴可夫斯基的第一部舞剧","phonetic":"四、芭蕾舞剧《天鹅湖》","meanings":[{"pos":"","def":"《天鹅湖》是经典芭蕾舞剧，1877年在莫斯科首演，1895年在彼得堡重排上演并大获成功；最早的版本共有四幕。\n音乐作于1876年，是俄国著名作曲家柴可夫斯基所作的第一部舞剧；剧作取材于德国中世纪的民间童话，讲述公主奥杰塔和王子齐格弗里德的传奇爱情故事。\n群舞、独舞和双人舞都比较有特点，第二幕和第四幕的“天鹅群舞”代表了芭蕾舞艺术的基本特征，成为一个多世纪以来最为人们熟知的舞蹈动作。\n1958年《天鹅湖》首次在中国演出，此后成为我国各芭蕾舞团经常上演的保留剧目；芭蕾舞在西方被称为“舞蹈艺术皇冠之珠”，民间也称足尖舞。"}],"related":[],"section":"第8章","marked":false},{"id":"C09-01","list":9,"num":1,"word":"综合艺术的定义与基本特征","phonetic":"第9章 综合艺术","meanings":[{"pos":"","def":"综合艺术是戏剧、戏曲、电影、电视等一类艺术的总称，吸取文学、绘画、音乐、舞蹈等各门艺术的长处，形成自己独特的审美特征。\n它将时间与空间、视觉与听觉、再现与表现、造型与表演艺术的特点融会到一起，具有更加强烈的艺术感染力。\n最基本的审美特征便是综合性。\n戏剧与戏曲较古老，电影与电视是现代科技与艺术结合的产物；综合艺术都重视文学性，优秀剧本常是成功的前提；表演艺术是中心环节。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-02","list":9,"num":2,"word":"戏剧艺术定义与二度创作","phonetic":"一、戏剧艺术","meanings":[{"pos":"","def":"从广义上讲，戏剧包括话剧、戏曲、歌剧、舞剧，乃至目前欧美各国影响广泛的音乐剧等；从狭义上讲，戏剧主要是指话剧。\n戏剧是在舞台上由演员以对话和动作为主要表现手段，为观众当场表演的一门综合艺术。\n戏剧艺术作为二度创作的艺术，包括两个重要组成部分：作为舞台演出基础的戏剧文学，以及演员创造舞台形象的表演艺术。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-03","list":9,"num":3,"word":"戏剧分类的三种划分标准","phonetic":"一、戏剧艺术","meanings":[{"pos":"","def":"按作品容量大小，可分为多幕剧和独幕剧。\n按作品题材不同，可分为历史剧、现代剧、儿童剧等。\n按作品的样式类型，又可分为悲剧、喜剧和正剧三大类型。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-04","list":9,"num":4,"word":"正剧是出现较晚的戏剧类型","phonetic":"一、戏剧艺术","meanings":[{"pos":"","def":"正剧是出现较晚的戏剧类型。\n法国思想家狄德罗和剧作家博马舍称这种剧为“严肃剧”。\n正剧与悲剧、喜剧并列，构成戏剧按样式类型划分的三大类型。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-05","list":9,"num":5,"word":"悲剧定义与鲁迅黑格尔悲剧观","phonetic":"一、戏剧艺术","meanings":[{"pos":"","def":"悲剧历来被认为是戏剧之冠，具有崇高的地位：通过正义的毁灭、英雄的牺牲或主人公苦难的命运，显示出人的巨大精神力量和伟大人格。\n悲剧正是通过毁灭的形式造成观众心灵的巨大震撼，使人们从悲痛中得到美的熏陶和净化。\n鲁迅：“悲剧将人生的有价值的东西毁灭给人看”“喜剧将那无价值的撕破给人看”。\n黑格尔：悲剧的根源和基础是两种伦理力量的冲突，双方的伦理力量都合理，又各因坚持自己的片面性而损害对方的合理性，从而不可避免地造成悲剧性冲突。"}],"related":[],"section":"第9章","marked":false},{"id":"C09-06","list":9,"num":6,"word":"第一阶段：古希腊命运悲剧","phonetic":"一、戏剧艺术","meanings":[{"pos":"","def":"古希腊出现西方悲剧的第一阶段“命运悲剧”，反映出社会力量与自然规律作为一种不可理解、不可抗拒的命运与人相对立。\n它表现人对自然和命运的抗争，最终因无法挣脱而导致悲剧的结局。\n代表是索福克勒斯的《俄狄浦斯王》：俄狄浦斯竭力挣扎，仍无法逃脱命运的摆布，最后落得“杀父娶母”、自己刺瞎双眼四处流浪的结局。"}],"related":[],"section":"第9章","marked":fa
